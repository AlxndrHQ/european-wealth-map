negotiated with Barings to buy the Louisiana bonds from France for FF52m. Hope directed the French side of the operation and sold the bonds in Amsterdam.","roleDetail":[{"t":"Lending to crowns.","d":"Dutch savings were channelled through Hope into foreign government debt in the late 18th century.","basis":"interpretive"},{"t":"Louisiana, 1803.","d":"Labouchère called the operation one of the 'utmost magnitude and importance' in a letter to Alexander Baring (Baring Archive).","basis":"documented"},{"t":"Flight to London, 1794.","d":"The French invasion of the Netherlands sent the Hopes to London, which tied the house closely to Barings.","basis":"interpretive"}],"legacy":"Hope & Co merged in 1966 with R. Mees & Zoonen. The successor bank became part of Fortis's private bank MeesPierson in 1997, whose Dutch business later passed into ABN AMRO after Fortis's 2008 break-up. No Hope family capital is traceable in it today.","legacyDetail":[{"t":"Absorbed into bank groups.","d":"Insurance Journal (2004) reports the merger with Mees & Zoonen (1966) and the later MeesPierson link.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"Defunct as a family firm since 1966. No family figure exists."},"holdingsToday":[{"name":"Successor: MeesPierson private banking (now within ABN AMRO)","kind":"Bank / wealth manager","sector":"Private banking","where":"Netherlands","detail":"Institutional descendant only. No Hope family ownership.","basis":"interpretive","source":{"label":"Insurance Journal — Barings/Hope corporate history note (2004)","url":"https://www.insurancejournal.com/news/international/2004/06/04/42895.htm"}}],"lineage":[{"name":"Thomas and Adrian Hope","relation":"founder","years":"1762","note":"Formed Hope & Co in Amsterdam.","basis":"documented"},{"name":"Henry Hope","relation":"heir","years":"1735–1811","note":"Led the sovereign-loan business.","basis":"documented"},{"name":"Pierre César Labouchère","relation":"partner (son-in-law of Francis Baring)","years":"1772–1839","note":"Negotiated Louisiana for Hope.","basis":"documented"},{"name":"Mees & Hope → MeesPierson","relation":"successor firm","years":"1966–1997","note":"Absorbed into Dutch bank groups.","basis":"documented"}],"today":"No Hope family business survives. The name is remembered through the Louisiana bonds and the Hope Diamond, once owned by the family's London branch.","today_people":[],"sources":[{"label":"The Baring Archive — The Louisiana Purchase","url":"https://baringarchive.org.uk/exhibition/the-louisiana-purchase/"},{"label":"Erasmus University — Mark Hay on the Dutch-British role in the Louisiana Purchase","url":"https://www.eur.nl/eshcc/nieuws/mark-hay-publiceert-boek-over-nederlands-britse-rol-overname-louisiana-en-financiele"},{"label":"Insurance Journal — Hope & Co and Barings corporate history (2004)","url":"https://www.insurancejournal.com/news/international/2004/06/04/42895.htm"},{"label":"Wikipedia — Hope & Co.","url":"https://en.wikipedia.org/wiki/Hope_%26_Co."}],"connections":[{"id":"baring-family","type":"finance","label":"Louisiana bond partners; Labouchère married into the Barings"},{"id":"dutch-east-india-company","type":"trade","label":"Amsterdam capital market"},{"id":"netherlands-stichting","type":"legacy","label":"Dutch financial system context"},{"id":"house-of-orange","type":"political","label":"the Hopes left Amsterdam as the Orange regime fell to the French (1794–95)"}]},{"id":"g3-barings-bank","type":"entity","name":"Barings Bank collapse (1995) and sale to ING","kind":"Battle / event","description":"In February 1995 Barings, Britain's oldest merchant bank, collapsed after Nick Leeson's unauthorised trades in Singapore, booked to error account 88888, produced losses of £827m, about twice the bank's trading capital. The Dutch group ING bought it for £1. Leeson was sentenced in Singapore to six and a half years.","start":1995,"geo":[1.283,103.851],"sources":[{"label":"Britannica — Bankruptcy of Barings Bank","url":"https://www.britannica.com/event/bankruptcy-of-Barings-Bank"},{"label":"MoneyWeek — 26 February 1995: 'rogue trader' Nick Leeson breaks Barings Bank","url":"https://moneyweek.com/381786/26-february-1995-rogue-trader-nick-leeson-breaks-barings-bank"}],"connections":[{"id":"baring-family","type":"legacy","label":"end of the family bank"},{"id":"bank-of-england","type":"political","label":"the Bank declined a second rescue"}]},{"id":"hoare-family","name":"Hoare family (C. Hoare & Co.)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Goldsmith-banking and deposit-taking (1672)","Lending to landed aristocracy against land","South Sea era investments","Private banking","Country estates (Stourhead)"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"It is Britain's oldest surviving bank, still family-owned and run as a private unlimited company from 37 Fleet Street (Companies House 00240822).","start":1672,"end":null,"lifespan":"1672–present","base":"37 Fleet Street, London","geo":[51.514,-0.109],"aliases":["C. Hoare & Co.","Hoare's Bank","the Golden Bottle"],"origins":"Richard Hoare became a freeman of the Goldsmiths' Company on 5 July 1672, the date counted as the bank's founding, at the sign of the Golden Bottle in Cheapside. He moved to Fleet Street in 1690.","role_summary":"The Hoares made money as deposit-takers and lenders to aristocrats and gentry. They took land as security, kept a conservative balance sheet and partnership discipline, and stayed out of sovereign mega-loans. Profits bought estates, notably Stourhead in Wiltshire, built by Henry Hoare II. The bank has stayed family-owned for 350 years. It donates a share of profits, reported as 10%, to its charity, the Golden Bottle Trust.","roleDetail":[{"t":"Goldsmith to banker.","d":"Safe-keeping of gold, pawnbroking and deposit-taking became lending to aristocrats against land.","basis":"documented"},{"t":"Partnership, then unlimited company.","d":"Since 1929 the bank has been a private unlimited company, so its members' liability is not limited, a rare survival.","basis":"documented"},{"t":"Profits into land and art.","d":"Henry Hoare II's Stourhead landscape garden, now National Trust, shows the classic conversion of bank profits into status.","basis":"interpretive"}],"legacy":"C. Hoare & Co. remains owned by eight direct descendants of Sir Richard Hoare and is run by the eleventh generation. Its charitable arm, the Golden Bottle Trust, receives a share of annual profits.","legacyDetail":[{"t":"Still the family's bank.","d":"Owned by eight descendants. Offices at Fleet Street and Lowndes Street.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current Sunday Times Rich List figure for the Hoare family was found in our searches.","grossAssets":{"text":"C. Hoare & Co. files accounts at Companies House (latest made up to 31 March 2026). The bank reported pre-tax profit of £32.5m in the year to March 2019 (Private Banker International). Figures for later years were not retrieved.","source":{"label":"Companies House — C. HOARE & CO. (00240822)","url":"https://find-and-update.company-information.service.gov.uk/company/00240822"}},"controlled":{"text":"The bank holds client deposits and manages client assets, which are not family wealth. The Golden Bottle Trust distributes part of annual profits to charity.","source":{"label":"Private Banker International — C Hoare & Co profits","url":"https://www.privatebankerinternational.com/news/c-hoare-co-profits/"}},"opaque":{"verdict":"documented","text":"The family's equity in the bank is not separately valued because the bank is unlisted. ICIJ's Paradise Papers (Appleby data, current to 2014) list C. Hoare & Co., at its 37 Fleet Street address, as a shareholder in two Cayman Islands private-equity partnerships (Coller International Partners III and IV-D). This is an investment of the bank, not shown to be the family's personal wealth, and no press report of it was found. Being listed in ICIJ data does not imply wrongdoing.","searched":"Companies House record for 00240822; ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: C. Hoare & Co., Hoare, The Golden Bottle Trust): 'C. Hoare & Co.' (Appleby officer node, 37 Fleet Street) is the bank itself; other hits are name matches only; no press reporting found. Companies House record cited separately.","source":{"label":"ICIJ Offshore Leaks — C. Hoare & Co. (Paradise Papers)","url":"https://offshoreleaks.icij.org/nodes/80048938"}},"gapNote":"Hoare's is a small balance sheet with very long continuity. The family's wealth is its ownership of an unlisted bank whose value is not published."},"holdingsToday":[{"name":"C. Hoare & Co.","kind":"Bank / wealth manager","sector":"Private banking","where":"37 Fleet Street, London","detail":"Private unlimited company owned by eight Hoare descendants.","basis":"documented","source":{"label":"Wikipedia — C. Hoare & Co","url":"https://en.wikipedia.org/wiki/C._Hoare_%26_Co"}},{"name":"The Golden Bottle Trust","kind":"Foundation","sector":"Philanthropy","where":"London","detail":"Receives a share of the bank's annual profits, reported as 10%.","basis":"documented","source":{"label":"Private Banker International — C Hoare & Co profits","url":"https://www.privatebankerinternational.com/news/c-hoare-co-profits/"}}],"lineage":[{"name":"Sir Richard Hoare","relation":"founder","years":"1648–1719","note":"Goldsmith-banker. He moved to Fleet Street in 1690.","basis":"documented"},{"name":"Henry Hoare II","relation":"grandson","years":"1705–1785","note":"Built Stourhead from bank profits.","basis":"documented"},{"name":"C. Hoare & Co. (unlimited company)","relation":"successor firm","years":"1929–present","note":"Incorporated as a private unlimited company, with ownership kept in the family.","basis":"documented"}],"today":"The bank is run by the eleventh generation of the family and owned by eight descendants of the founder.","today_people":[],"sources":[{"label":"C. Hoare & Co. — Our history","url":"https://hoaresbank.co.uk/our-history"},{"label":"Wikipedia — C. Hoare & Co","url":"https://en.wikipedia.org/wiki/C._Hoare_%26_Co"},{"label":"Companies House — C. HOARE & CO. (00240822)","url":"https://find-and-update.company-information.service.gov.uk/company/00240822"},{"label":"Spear's — C. Hoare & Co. anniversary","url":"https://spearswms.com/wealth/c-hoare-and-co-anniversary/"}],"connections":[{"id":"south-sea-company","type":"finance","label":"early-18th-century City finance"},{"id":"city-of-london-corporation","type":"political","label":"Sir Richard Hoare was Lord Mayor (1712)"},{"id":"coutts-family","type":"trade","label":"fellow West End/Strand private bank"},{"id":"bank-of-england","type":"finance","label":"London goldsmith-banking era"}]},{"id":"coutts-family","name":"Coutts family (Coutts & Co.)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Goldsmith-banking (1692)","Banking for aristocracy and the Crown","Inheritance by Angela Burdett-Coutts (1837)"],"nation":"United Kingdom","scale":"Significant","scaleBasis":"documented","scaleNote":"Coutts is now the wealth arm of NatWest Group. The family ceased to own it when National Westminster Bank acquired it in 1969.","start":1692,"end":1969,"lifespan":"1692 (John Campbell) – 1969 (NatWest); brand continues","base":"440 Strand, London","geo":[51.509,-0.124],"aliases":["Coutts & Co.","Campbell & Coutts"],"origins":"The Scottish goldsmith-banker John Campbell founded the business in 1692. Thomas Coutts joined in 1761, and the firm became James and Thomas Coutts.","role_summary":"Coutts banked for the aristocracy and the royal household. It earned from deposits, discounting and loans. Thomas Coutts's fortune passed in 1837 to his granddaughter Angela Burdett-Coutts, who became one of Victorian Britain's richest women and spent much of it on philanthropy.","roleDetail":[{"t":"Banker to the Court.","d":"Coutts built its business on aristocratic and royal accounts.","basis":"documented"},{"t":"The 1837 inheritance.","d":"Angela Burdett (23) inherited Thomas Coutts's interest, held in trust, including a half-share in the bank, on condition she took the Coutts name.","basis":"documented"},{"t":"Sold to a clearing bank.","d":"NatWest bought Coutts in 1969. RBS acquired NatWest in 2000, and RBS renamed itself NatWest Group in 2020.","basis":"documented"}],"legacy":"The Coutts family no longer owns the bank. Coutts is part of NatWest Group's wealth division. In February 2017 FINMA required its former Swiss arm to surrender CHF 6.5m of profits over 1MDB failings.","legacyDetail":[{"t":"Brand without family.","d":"Coutts & Co is wholly owned by NatWest Group.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"The founding family has had no ownership since 1969, and no family figure exists."},"holdingsToday":[{"name":"Coutts & Co. (NatWest Group)","kind":"Bank / wealth manager","sector":"Private banking","where":"London","detail":"Not family-owned since 1969.","basis":"documented","source":{"label":"NatWest Group — Coutts","url":"https://natwestgroup.com/who-we-are/our-brands/coutts.html"}}],"lineage":[{"name":"John Campbell","relation":"founder","years":"fl. 1692","note":"Goldsmith-banker who founded the firm.","basis":"documented"},{"name":"Thomas Coutts","relation":"successor","years":"1735–1822","note":"Joined in 1761 and built the court banking business.","basis":"documented"},{"name":"Angela Burdett-Coutts","relation":"granddaughter / heiress","years":"1814–1906","note":"Inherited the Coutts interest in 1837.","basis":"documented"},{"name":"NatWest Group","relation":"successor firm","years":"1969–present","note":"Owner of Coutts.","basis":"documented"}],"today":"No member of the Coutts family has an ownership role. The bank is a NatWest Group brand.","today_people":[],"sources":[{"label":"Coutts — Our history","url":"https://coutts.com/about/history.html"},{"label":"NatWest Group — Coutts","url":"https://natwestgroup.com/who-we-are/our-brands/coutts.html"},{"label":"NatWest Group Heritage Hub — Coutts & Co","url":"https://www.natwestgroup.com/heritage/companies/coutts-and-co.html"},{"label":"swissinfo — Swiss court orders Falcon bank to hand over 1MDB profits (mentions Coutts CHF 6.5m)","url":"https://swissinfo.ch/eng/business/confiscated-earnings_swiss-court-orders-falcon-bank-to-hand-over-illegal-1mdb-profits/44893636"}],"connections":[{"id":"hoare-family","type":"trade","label":"peer London private bank"},{"id":"british-crown-estate-duchies","type":"finance","label":"banker to the royal household"},{"id":"switzerland-banking-secrecy","type":"offshore","label":"former Swiss subsidiary (1MDB finding)"},{"id":"bank-of-england","type":"finance","label":"London banking system"}]},{"id":"schroder-family","name":"Schroder family (J. Henry Schroder & Co.; Schroders plc)","category":"Banking & Merchant Dynasties","role":"Modern Finance & Holding","moneySources":["Hamburg merchant trade","London acceptance house and merchant banking (1818)","Sovereign and corporate loans","Asset and wealth management","Sale of Schroders to Nuveen (2026)"],"nation":"United Kingdom","scale":"Major","scaleBasis":"documented","scaleNote":"Schroders managed £823.7bn (including joint ventures) at end-2025. The family's trust vehicles and members held roughly 41% of the shares before Nuveen bought the company for about £9.9bn in October 2026.","start":1804,"end":null,"lifespan":"1804 (London partnership) – present; Schroders listed 1959–2026","base":"London (1 London Wall Place)","geo":[51.517,-0.093],"aliases":["J. Henry Schröder & Co.","Schroders plc","Vincitas Limited","Veritas Limited"],"origins":"The Schröders were a Hamburg merchant family. In 1804 Johann Heinrich Schröder joined his elder brother in a London partnership, and in 1818 he founded J. Henry Schröder & Co.","role_summary":"Schroders grew as a London acceptance house. It guaranteed trade bills and issued loans for foreign governments and companies, earning commissions on the credit of its name. It listed in 1959 and later shifted into asset and wealth management. The family kept control through trusts holding about 40% of the shares. In 2026 it backed the US manager Nuveen's all-cash offer of 590p a share plus up to 22p of dividends (about £9.9bn), and the deal completed on 1 October 2026.","roleDetail":[{"t":"Acceptance-house model.","d":"Profits came from lending the firm's name to trade bills and underwriting foreign issues in London.","basis":"interpretive"},{"t":"Listed in 1959, family-controlled.","d":"The firm was converted to a public company in the late 1950s and listed in 1959. Family trusts kept a controlling block.","basis":"documented"},{"t":"Voting power above economic stake.","d":"Before the 2024 share simplification the family held 47.9% of voting power. The reform cut this to about 43.1% (Estates Gazette / Portfolio Adviser).","basis":"documented"},{"t":"Sold to Nuveen, 2026.","d":"The offer was announced 12 February 2026 and sanctioned by the court on 29 September. It became effective 1 October 2026 and the listing was cancelled.","basis":"documented"}],"legacy":"Until October 2026 the money sat in Schroders plc shares held mainly through Vincitas Limited (24.27%) and Veritas Limited (15.32%), trustees of settlements made by Schroder family members, plus about 1.32% held directly by 44 family members. Earlier filings name Bermuda nominee companies for these trusts. On completion the trusts' shares were exchanged for Nuveen's cash. Where the proceeds have been reinvested is not public.","legacyDetail":[{"t":"From control to cash.","d":"The family moved from controlling a top-ten European asset manager to holding cash proceeds in private trusts.","basis":"interpretive"},{"t":"Charities.","d":"The Schroder Charity Trust and the Schroder 1905 Trust are registered UK charities with family trustees.","basis":"documented"}],"wealth":{"published":[{"figure":"£3.9bn","usd":"c. $5.2bn","who":"Schroder family","publisher":"Sunday Times Rich List (as reported by Spear's)","year":2025,"rank":"","url":"https://spears500.com/adviser/22227/leonie-schroder"},{"figure":"£5.611bn","usd":"c. $7.5bn","who":"Leonie Schroder and family (as listed)","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"33rd (43rd in 2025)","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"publishedNote":"The 2025 Rich List valued the family's Schroders stake before the 2026 takeover premium; the 2026 list (published May 2026) rose by £1.678bn.","grossAssets":{"text":"Schroders plc 2025: revenue £3.25bn, statutory pre-tax profit £673.8m. The offer valued the company at up to £9.9bn, against a £7.36bn market value before the bid. The family block was about 41% of the shares (Form 8 disclosures).","source":{"label":"AJ Bell — Schroders shares jump as it accepts £10bn takeover bid (Feb 2026)","url":"https://www.ajbell.co.uk/news/articles/schroders-shares-jump-accepts-ps10-billion-takeover-bid-profit"}},"controlled":{"text":"Schroders managed £823.7bn of client assets at end-2025, about 85 times the deal value and more than 200 times the family's Rich List figure. This was client money, not family wealth, and since October 2026 the family no longer controls it.","source":{"label":"AJ Bell — Schroders results and Nuveen offer (Feb 2026)","url":"https://www.ajbell.co.uk/news/articles/schroders-shares-jump-accepts-ps10-billion-takeover-bid-profit"}},"opaque":{"verdict":"documented","text":"The family interest was structured through Vincitas Limited and Veritas Limited as trustees of family settlements. Schroders RNS filings list Bermuda nominee companies (Fervida (Bermuda) Ltd, Flavida (Bermuda) Ltd) holding for these trusts. Beneficiaries, distributions and the reinvestment of the 2026 sale proceeds are not public. Holding shares via Bermuda nominees is lawful and was publicly disclosed.","searched":"Schroders plc RNS 'Holding(s) in Company' and Form 8 (OPD) disclosures; Charity Commission (Schroder charities); ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Leonie Schroder, Schroder, Schroder Charity Trust, Schroders  — no longer family-owned, The Schroder 1905 Trust, Vincitas Limited and Veritas Limited): name matches only, none shown to be this family or its vehicles; no press reporting found.","source":{"label":"Schroders plc — Holding(s) in Company (RNS, Investegate)","url":"https://investegate.co.uk/announcement/rns/schroders--sdr/holding-s-in-company-/555002"}},"gapNote":"The Rich List figure (£3.9bn, 2025) tracked the family's share stake fairly well. The gap was in control: about 40% of the economic interest carried over 43% of votes and steered £824bn of client money. After the 2026 cash sale the family's measurable wealth probably rose with the bid premium while its reach shrank, and the trusts' new holdings are no longer visible in any public filing."},"holdingsToday":[{"name":"Vincitas Limited and Veritas Limited (family settlements)","kind":"Trust","sector":"Family trusts","where":"Trustee companies with Bermuda nominees (per RNS)","detail":"Held 24.27% and 15.32% of Schroders before completion. They now hold cash or reinvested proceeds, which are not disclosed.","basis":"documented","source":{"label":"Form 8 (OPD) Schroders plc (Feb 2026)","url":"https://www.investegate.co.uk/announcement/rns/schroders--sdr/form-8-opd-schroders-plc/9446898"}},{"name":"Schroders (within Nuveen/TIAA) — no longer family-owned","kind":"Bank / wealth manager","sector":"Asset and wealth management","where":"London","detail":"Acquired by Nuveen's Pantheon LLC, effective 1 Oct 2026.","basis":"documented","source":{"label":"Scottish Financial News — Nuveen completes £9.9bn Schroders takeover on October 1","url":"https://www.scottishfinancialnews.com/articles/nuveen-completes-p rolling block until 2026"},{"id":"city-of-london-corporation","type":"legacy","label":"City of London asset manager"}]},{"id":"hambro-family","name":"Hambro family (Hambros Bank)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Copenhagen merchant trade","London merchant banking (1839)","Scandinavian and Italian state loans","Wealth management (James Hambro & Partners)"],"nation":"United Kingdom","scale":"Minor","scaleBasis":"documented","scaleNote":"Hambros Bank was sold to Société Générale in 1998. The family's visible business today is wealth management, such as James Hambro & Partners with more than £7bn under management (Spear's, 2025).","start":1839,"end":null,"lifespan":"1839–1998 (family bank); family firms continue","base":"London","geo":[51.513,-0.084],"aliases":["C. J. Hambro & Son","Hambros Bank","SG Hambros","Kleinwort Hambros"],"origins":"Carl Joachim Hambro, a Danish merchant and banker whose family firm traded from Copenhagen, founded C. J. Hambro & Son in London in 1839.","role_summary":"Hambros earned commissions arranging loans for Scandinavian states and, in the 19th century, for the new Kingdom of Italy. It later became a broad merchant bank. In 1998 the board sold the private bank to Société Générale, which renamed it SG Hambros and in 2016 merged it into Kleinwort Hambros. The investment side went to Investec. Family members went on to found new wealth and investment firms.","roleDetail":[{"t":"Scandinavian state lending.","d":"The Danish origins gave Hambros a niche in Nordic government finance.","basis":"interpretive"},{"t":"Exit in 1998.","d":"The Hambros PLC board recommended the sale of Hambros Bank to Société Générale. Investec bought the remaining Hambros PLC businesses.","basis":"documented"},{"t":"New family firms.","d":"James (Jamie) Hambro founded James Hambro & Partners in 2010. It passed £7bn of client assets by 2025.","basis":"documented"}],"legacy":"The Hambros name lives on in Société Générale's Kleinwort Hambros, which the family does not own. Family capital is in private holdings and in partnerships such as James Hambro & Partners, where senior partners led a management buy-out.","legacyDetail":[{"t":"Bank name without family.","d":"SG Hambros merged with Kleinwort Benson in 2016 to form Kleinwort Hambros.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current Rich List figure for the Hambro family was found.","controlled":{"text":"James Hambro & Partners managed over £7bn for clients (Spear's, early 2025). This is client money, not family wealth.","source":{"label":"Spear's 500 — James Hambro & Partners","url":"https://spears500.com/company/21756/james-hambro-partners"}},"opaque":{"verdict":"none found","text":"Private family holdings are not public.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Hambro, James Hambro & Partners): name matches only, none shown to be this family or its vehicles; no press reporting found; press on the 1998 sale.","source":{"label":"Wikipedia — Hambros Bank","url":"https://en.wikipedia.org/wiki/Hambros_Bank"}}},"holdingsToday":[{"name":"James Hambro & Partners","kind":"Bank / wealth manager","sector":"Wealth management","where":"London","detail":"Founded in 2010 by Jamie Hambro. Over £7bn AUM (2025). Partner-owned after a management buy-out.","basis":"documented","source":{"label":"Private Banker International — Senior partners lead James Hambro & Partners MBO","url":"https://privatebankerinternational.com/news/senior-partners-lead-james-hambro-partners-mbo"}}],"lineage":[{"name":"Carl Joachim Hambro","relation":"founder","years":"1807–1877","note":"Founded the London house in 1839.","basis":"documented"},{"name":"Jocelyn Hambro","relation":"descendant","years":"1919–1994","note":"Chairman of Hambros Bank 1965–72.","basis":"documented"},{"name":"Charles Hambro, Baron Hambro","relation":"descendant","years":"1930–2002","note":"Chairman from 1972, during
