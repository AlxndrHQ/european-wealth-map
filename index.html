Wikipedia, citing historians), and the Royal Trust he endowed holds about 7,500 ha valued at at least €231.4m (2022 balance sheet).","start":1885,"end":1909,"lifespan":"1835–1909 (Congo 1885–1908)","base":"Laeken, Brussels","geo":[50.885,4.358],"aliases":["Léopold II","Sovereign of the Congo Free State"],"origins":"Second king of the Belgians (r. 1865–1909) of the house of Saxe-Coburg-Gotha. Convinced that Belgium needed a colony, he set up the International African Association (1876) and hired Henry Morton Stanley, presenting the venture as humanitarian and anti-slavery.","role_summary":"At the Berlin Conference era (1884–85) Leopold obtained recognition of the Congo Free State as his personal possession, not Belgium's. From the 1890s he reserved vast areas as state and crown domain (the Domaine de la Couronne, c. 250,000 km²) and extracted rubber and ivory through forced labour enforced by the Force Publique, with killings, hostage-taking and mutilation; domain revenue rose from about 150,000 francs in 1890 to over 18 million by 1901. He spent the profits on buildings and parks in Belgium and gave many of them to the nation in 1900 as the Royal Trust, before ceding the Congo to Belgium in 1908 under international pressure.","roleDetail":[{"t":"A colony owned by one man (1885).","d":"The Congo Free State was Leopold's personal property from 1885 until Belgium annexed it on 15 November 1908.","basis":"documented"},{"t":"Forced labour for rubber.","d":"Quotas were enforced by the Force Publique; estimates of population decline range from about 1 to 10+ million and are debated, with disease a major cause.","basis":"documented"},{"t":"Personal profits.","d":"Historians cited in Wikipedia estimate Leopold's personal profit from rubber at about 70 million francs in 1896–1905; Adam Hochschild's estimate is at least c. US$1.1bn in today's money (both approximate).","basis":"interpretive"},{"t":"Converted into Belgian property (1900–08).","d":"His 1900 letters gave castles, parks and land to the nation as the Royal Trust, accepted by law in 1903, with more added by a law of 18 October 1908 after the Congo handover.","basis":"documented"}],"legacy":"Leopold's Congo money is still visible in Belgium: the Royal Trust (Donation royale) owns about 7,500 ha, 77 buildings including Laeken park, the Royal Greenhouses and castles used by the royal family, valued at at least €231.4m in its first balance sheet (2022). Much of the rest went into Brussels and Ostend monuments and the Tervuren museum.","legacyDetail":[{"t":"Royal Trust properties used by the family.","d":"They include the Belvédère (Albert II), Ciergnon and Fenffe castles, Villa Clémentine (Prince Laurent) and Villa Schonenberg (Princess Astrid).","basis":"documented"},{"t":"Regret, not apology (2020).","d":"King Philippe expressed his 'deepest regrets' for colonial violence on 30 June 2020.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No published figure for Leopold's estate at death was found in a reputable source. Historians' profit estimates are given in roleDetail.","grossAssets":{"text":"Royal Trust: properties valued at about €231m in its first published valuation (2022 balance sheet, reported January 2024). About 7,500 ha (c. 5,000 ha forest, 1,650 ha farmland) and 77 buildings. The royal palaces are state property, outside the Trust.","source":{"label":"BRF — Erste Schätzung von Wert der königlichen Schenkung von Leopold II. (7 Jan 2024, citing La Libre Belgique)","url":"https://brf.be/national/1790585/"}},"controlled":{"text":"The Royal Trust is an autonomous public institution (since 1930) whose properties must remain available to the successors to the throne; part of them is made available to the king and family free of charge. In 2018 nearly half its spending (€2.91m) went to the Laeken royal domain (VRT).","source":{"label":"VRT NWS — Immo Royal: de Koninklijke Schenking doorgelicht (2019)","url":"https://www.vrt.be/vrtnws/nl/2019/11/25/_immo-royal_-de-koninklijke-schenking-doorgelicht/"}},"opaque":{"verdict":"reported","text":"Until 2022 the Royal Trust kept cash-based books that did not state asset values, so VRT reported in 2019 that 'nobody knows' the value of its holdings. Leopold's private fortune, spread among his heirs and trusts after 1909, was never published.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: King Philippe of Belgium, Leopold II, King Belgians, Royal Trust): name matches only, none shown to be this family or its vehicles; Belgian Chamber documents and VRT investigation on the Koninklijke Schenking; Wikipedia on the Royal Trust.","source":{"label":"VRT NWS — Immo Royal: niemand die weet hoeveel patrimonium (2019)","url":"https://www.vrt.be/vrtnws/nl/2019/11/25/immo-royal-niemand-die-weet-hoeveel-patrimonium-koninklijke-sch/"}},"gapNote":"The €231.4m is a book value for land and buildings that cannot be sold, so it neither measures Congo profits nor the family's wealth; it does show that a colonial fortune was turned into a permanent property endowment the royal family still uses."},"holdingsToday":[{"name":"Royal Trust (Donation royale / Koninklijke Schenking)","kind":"Trust","sector":"Land, castles, parks","where":"Brussels, Ostend, Ardennes","detail":"c. 7,500 ha and 77 buildings; c. €231m (2022 valuation)","basis":"documented","source":{"label":"BRF — Erste Schätzung von Wert der königlichen Schenkung von Leopold II. (7 Jan 2024, citing La Libre Belgique)","url":"https://brf.be/national/1790585/"}},{"name":"Laeken park and Royal Greenhouses","kind":"Urban property","sector":"Parkland","where":"Brussels","detail":"Owned by the Trust; the palace itself is state property","basis":"documented","source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}},{"name":"Ciergnon, Fenffe and Villers-sur-Lesse castles","kind":"Rural land","sector":"Residences and hunting land","where":"Ardennes","detail":"Used by the royal family","basis":"documented","source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}}],"lineage":[{"name":"Leopold I","relation":"father","years":"1790–1865","note":"First king of the Belgians; left a large private fortune.","id":"house-of-saxe-coburg-gotha","basis":"documented"},{"name":"Leopold II","relation":"son","years":"1835–1909","note":"Owned the Congo Free State 1885–1908; endowed the Royal Trust.","basis":"documented"},{"name":"Royal Trust","relation":"endowment","years":"1900/1903–present","note":"Properties given to the nation for the throne's successors.","id":"g2-belgian-royal-trust","basis":"documented"},{"name":"Albert I","relation":"nephew and heir","years":"1875–1934","note":"Succeeded in 1909; Leopold's daughters sued over the estate.","basis":"documented"},{"name":"Philippe","relation":"descendant","years":"b. 1960","note":"King since 2013; expressed 'deepest regrets' in 2020.","basis":"documented"}],"today":"Leopold's direct line ended with daughters; the throne passed to his nephew Albert I and today to King Philippe. The Royal Trust he founded is run as a public institution whose properties the royal family uses.","today_people":[{"name":"King Philippe of Belgium","relation":"great-great-grandnephew","role":"King of the Belgians","sector":"Royalty & titles","year":2020,"basis":"documented","source":{"label":"Africanews — Belgian king 'deeply regrets' colonial injustices (2020)","url":"https://www.africanews.com/2020/06/30/belgian-king-deeply-regrets-colonial-injustices-in-dr-congo"}}],"sources":[{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"},{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"},{"label":"BRF — Erste Schätzung von Wert der königlichen Schenkung von Leopold II. (7 Jan 2024, citing La Libre Belgique)","url":"https://brf.be/national/1790585/"},{"label":"VRT NWS — Immo Royal: de Koninklijke Schenking doorgelicht (2019)","url":"https://www.vrt.be/vrtnws/nl/2019/11/25/_immo-royal_-de-koninklijke-schenking-doorgelicht/"},{"label":"Encyclopedia.com — Leopold II","url":"https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/leopold-ii-0"}],"connections":[{"id":"congo-free-state","type":"ownership","label":"personal sovereign 1885–1908"},{"id":"g2-belgian-royal-trust","type":"legacy","label":"endowed the Royal Trust 1900"},{"id":"house-of-saxe-coburg-gotha","type":"family","label":"Belgian line of Saxe-Coburg"},{"id":"house-of-habsburg","type":"marriage-settlement","label":"married Archduchess Marie Henriette 1853"},{"id":"british-south-africa-company","type":"political","label":"rival model of private colonial rule in Africa"}]},{"id":"house-of-habsburg","name":"House of Habsburg (Habsburg-Lorraine)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Swabian-Swiss county lands","Conquest of Austria (1278)","Dynastic marriages (Burgundy 1477, Spain 1496, Bohemia-Hungary 1526)","Imperial and royal crown revenues","Habsburg family fund (Familienfonds)"],"nation":"Austria","scale":"Minor","scaleBasis":"estimated","scaleNote":"Austria's 1919 Habsburg Law transferred the court and family-fund assets to the Republic; no reliable published valuation of the family's remaining private wealth exists.","start":1278,"end":null,"lifespan":"1278–1918 rulers of Austria; Holy Roman Emperors 1438–1806 (almost continuously); present","base":"Vienna (historic); family seats in Austria and Bavaria","geo":[48.207,16.365],"aliases":["Habsburg-Lothringen","Habsburg-Lorraine","Casa de Austria"],"origins":"Counts from the Aargau (Habsburg castle, Switzerland). Rudolf I was elected King of the Romans in 1273 and won Austria and Styria from Ottokar II of Bohemia in 1278. Through marriages the dynasty gathered Burgundy and the Netherlands, Spain and its Indies, and Bohemia and Hungary.","role_summary":"Habsburg wealth was the wealth of states: crown domains, mines (Tyrolean silver, Bohemian and Hungarian ores), tolls, and the revenues of an empire built by marriage more than war. The dynasty was also the great distributor of land: after 1620 it confiscated Protestant Bohemian estates and granted or sold them to loyal nobles such as the Liechtensteins. In 1919 the Austrian Republic took the court property and the entailed Habsburg family fund, leaving only demonstrably private assets.","roleDetail":[{"t":"Austria by conquest (1278).","d":"Rudolf I's victory over Ottokar II at the Marchfeld gave the family Austria, its core for 640 years.","basis":"documented"},{"t":"Empire by marriage (1477–1526).","d":"Marriages brought Burgundy (1477), Castile and Aragon with the Indies (1496–1516) and Bohemia and Hungary (1526).","basis":"documented"},{"t":"Redistributor of land (1620s).","d":"After the White Mountain the crown confiscated rebel estates and transferred them to Catholic loyalists, enriching houses such as Liechtenstein.","basis":"documented"},{"t":"Expropriated by law (1919).","d":"The Habsburg Law of 3 April 1919 transferred court and family-fund property to the Republic; it remains in constitutional force and is confirmed by the 1955 State Treaty. Repeated restitution claims have failed.","basis":"documented"}],"legacy":"The former imperial palaces, collections and family-fund estates belong to the Republic of Austria (run by bodies such as the Schönbrunn company and the federal forests) and the City of Vienna. The family keeps undisclosed private assets; branches hold estates in Austria, Bavaria, Spain and elsewhere.","legacyDetail":[{"t":"Public ownership of the dynastic core.","d":"habsburger.net describes how the family fund's estates and the court property passed to the state after 1918, while 'considerable private' assets remained.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No reliable published valuation of the Habsburg family's present wealth was found.","grossAssets":{"text":"No filed accounts for the family. The pre-1919 family fund and court property are now state assets; their value is not reported as family wealth.","source":{"label":"habsburger.net — A fortune loses its owners: Habsburg assets after 1918","url":"https://www.habsburger.net/en/chapter/fortune-loses-its-owners-habsburg-assets-after-1918"}},"controlled":{"text":"None documented beyond private estates. Karl von Habsburg heads the house and has been a public figure (former MEP).","source":{"label":"Wikipedia — Karl von Habsburg","url":"https://en.wikipedia.org/wiki/Karl_von_Habsburg"}},"opaque":{"verdict":"none found","text":"Private assets of the many Habsburg branches are not disclosed; no foundation structure was documented in the sources checked.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Habsburg, Karl von Habsburg): name matches only, none shown to be this family or its vehicles; habsburger.net; Habsburg Law.","source":{"label":"Wikipedia — Habsburg Law","url":"https://en.wikipedia.org/wiki/Habsburg_Law"}},"gapNote":"The Habsburgs are the clearest case of a fortune that was once among the world's largest and is now mostly public: popular references to 'Habsburg wealth' mostly describe assets the Republic of Austria has owned since 1919."},"holdingsToday":[{"name":"Former Habsburg family fund and court property (state-owned)","kind":"Other","sector":"Palaces, forests, collections","where":"Austria","detail":"Transferred to the Republic by the 1919 Habsburg Law","basis":"documented","source":{"label":"habsburger.net — A fortune loses its owners","url":"https://www.habsburger.net/en/chapter/fortune-loses-its-owners-habsburg-assets-after-1918"}},{"name":"Private family assets","kind":"Other","sector":"Undisclosed","where":"Austria and abroad","detail":"Described as 'considerable private' assets; not valued","basis":"interpretive","sourc burg","url":"https://en.wikipedia.org/wiki/Karl_von_Habsburg"}],"connections":[{"id":"holy-roman-empire","type":"political","label":"Holy Roman Emperors 1438–1806"},{"id":"g2-habsburg-law-1919","type":"political","label":"court and family-fund property expropriated 1919"},{"id":"g2-battle-of-white-mountain","type":"political","label":"crown victory 1620 and estate confiscations"},{"id":"house-of-liechtenstein","type":"charter","label":"raised Liechtensteins to princes (1608, 1719)"},{"id":"thurn-und-taxis-family","type":"charter","label":"granted the hereditary postal fief 1615"},{"id":"esterhazy-family","type":"charter","label":"made Esterházys imperial princes 1687"},{"id":"fugger-family","type":"finance","label":"Fugger loans financed Charles V's 1519 election"},{"id":"house-of-bourbon","type":"political","label":"lost Spain to the Bourbons in 1700"}]},{"id":"house-of-hohenzollern","name":"House of Hohenzollern (Prussian and Sigmaringen lines)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Burgraviate of Nuremberg","Electorate of Brandenburg (1415)","Brandenburg African Company (1682)","Prussian crown domains","1926 settlement; Sigmaringen forests and industry"],"nation":"Germany","scale":"Significant","scaleBasis":"documented","scaleNote":"The Sigmaringen line owns about 15,000 ha of forest (Euronews, 2026) and half of the Zollern engineering group; the Prussian line's 2025 settlement placed 1,685 disputed works in a public foundation and returned 2,999 objects (mostly coins) to the house.","start":1415,"end":null,"lifespan":"1415 Electors of Brandenburg; 1701–1918 Kings of Prussia; 1871–1918 German Emperors; present","base":"Burg Hohenzollern (Hechingen) and Sigmaringen Castle","geo":[48.323,8.968],"aliases":["Prinz von Preußen","Fürst von Hohenzollern","Unternehmensgruppe Fürst von Hohenzollern"],"origins":"Swabian counts who became burgraves of Nuremberg and, in 1415, Electors of Brandenburg. The Franconian-Brandenburg line became Kings in Prussia (1701) and German Emperors (1871–1918); the Catholic Swabian line kept Sigmaringen and Hechingen.","role_summary":"The Prussian line's wealth was the crown domain of a growing state, plus the Great Elector's 1682 Brandenburg African Company, which historians estimate shipped up to c. 20,000 Africans. After 1918 Prussia and the dynasty settled in 1926, leaving ownership of many objects open; the Soviet zone's 1945 land reform took most remaining eastern property. The Sigmaringen line, never a sovereign of Prussia, kept its Swabian forests and built an industrial group around the Zollern foundry (founded 1708).","roleDetail":[{"t":"Brandenburg (1415).","d":"Burgrave Frederick VI of Nuremberg was enfeoffed with Brandenburg by Emperor Sigismund.","basis":"documented"},{"t":"A slave-trading company (1682–1717).","d":"The Great Elector chartered the Brandenburg African Company; Frederick William I sold Groß Friedrichsburg to the Dutch WIC in 1717 for c. 7,000 ducats and 12 enslaved Africans.","basis":"documented"},{"t":"1926 settlement.","d":"After the national referendum on expropriating the princes failed on turnout in June 1926, Prussia concluded a treaty with the house that left ownership of many art objects open.","basis":"documented"},{"t":"Industry in Swabia.","d":"The Sigmaringen head holds 50% of the engineering group founded in 1708, alongside forests, DIY stores, real estate and a ski area (Schwäbische Zeitung).","basis":"documented"}],"legacy":"Prussian line: Burg Hohenzollern (shared), residual art and a seat on the 2025 public Hohenzollern Art Collection Foundation (6:3 public-to-family board). Sigmaringen line: c. 15,000 ha of forest, Sigmaringen Castle, real estate, and a 50% stake in the Zollern engineering group.","legacyDetail":[{"t":"2025 settlement.","d":"The SPK put 1,685 disputed works into a new public Hohenzollern Art Collection Foundation (the house gave up its claims to them and holds three of nine trustee seats) and returned 2,999 objects, including 2,122 coins, to the house, ending a near-century dispute.","basis":"documented"},{"t":"Fourth-largest private forest.","d":"The Hohenzollern forestry business describes c. 14,800 ha as Germany's fourth-largest private forest.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No published valuation of either line's private wealth was found.","grossAssets":{"text":"Sigmaringen forestry: c. 140,000 m³ cut a year, about €10m revenue at c. 3% return on sales (Schwäbische Zeitung, c. 2022). Group-level accounts were not found.","source":{"label":"Schwäbische Zeitung — Der Business-Fürst","url":"https://www.schwaebische.de/wirtschaft/der-business-fuerst-292065"}},"controlled":{"text":"Prussian line: co-governs the Stiftung Hohenzollernscher Kunstbesitz (2025) with a minority of board seats. Sigmaringen line: 50% of an industrial group and the regional timber-marketing company Prinz von Hohenzollern GmbH.","source":{"label":"Stiftung Preußischer Kulturbesitz — Hohenzollern agreement approved (2025)","url":"https://www.preussischer-kulturbesitz.de/en/news-detail/article/2025/05/26/spk-board-of-trustees-approves-agreement-between-the-public-sector-and-the-house-of-hohenzollern-on-disputed-ownership-issues.html"}},"opaque":{"verdict":"none found","text":"Both lines' holdings are private German companies whose detailed accounts were not found; no foundation or offshore structure was documented.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Georg Friedrich, Prince of Prussia, Hohenzollern, Karl Friedrich, Prince of Hohenzollern, Prinz von Hohenzollern GmbH, Stiftung Hohenzollernscher Kunstbesitz, Zollern engineering group): no matches; SPK settlement; Euronews land ranking.","source":{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},"gapNote":"The Prussian line's public profile (palace claims, art disputes) is out of proportion to its documented wealth; the quieter Sigmaringen line appears to hold more productive assets, though neither publishes a total."},"holdingsToday":[{"name":"Fürst von Hohenzollern forestry","kind":"Agriculture & forestry","sector":"Forestry","where":"Baden-Württemberg and Bavaria","detail":"c. 15,000 ha","basis":"documented","source":{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},{"name":"Zollern engineering group (50%)","kind":"Private company","sector":"Mechanical engineering","where":"Sigmaringen-Laucherthal","detail":"Founded 1708; the prince holds 50%","basis":"documented","source":{"label":"Schwäbische Zeitung — Der Business-Fürst","url":"https://www.schwaebische.de/wirtschaft/der-business-fuerst-292065"}},{"name":"Prinz von Hohenzollern GmbH","kind":"Private company","sector":"Timber marketing","where":"Sigmaringen","detail":"Coordinates timber sales and transport","basis":"documented","source":{"label":"Hohenzollern — Prinz von Hohenzollern GmbH","url":"https://beteiligungen.hohenzollern.com/prinz-von-hohenzollern-gmbh/"}},{"name":"Stiftung Hohenzollernscher Kunstbesitz","kind":"Foundation","sector":"Art","where":"Berlin-Brandenburg","detail":"1,685 works contributed by the SPK; 6 of 9 trustee seats public, 3 family","basis":"documented","source":{"label":"SPK — Hohenzollern agreement (2025)","url":"https://www.preussischer-kulturbesitz.de/en/news-detail/article/2025/05/26/spk-board-of-trustees-approves-agreement-between-the-public-sector-and-the-house-of-hohenzollern-on-disputed-ownership-issues.html"}}],"slaveSiteId":"house-of-hohenzollern","lineage":[{"name":"Frederick I of Brandenburg","relation":"founder","years":"1371–1440","note":"Received Brandenburg in 1415.","basis":"documented"},{"name":"Frederick William, the Great Elector","relation":"descendant","years":"1620–1688","note":"Chartered the B er figure gives SEK 274m), the last year wealth was declared.","basis":"documented"}],"legacy":"The private fortune sits in Bensor AB (asset management; owns Solliden and Stenhammar operating companies), Gluonen AB (securities for the royal children, holdings worth SEK 75.8m in 2023) and Prince Daniel's Fornwij AB. Stenhammar castle is state-owned and leased to the King for life.","legacyDetail":[{"t":"Small but visible companies.","d":"Dagens PS reported 2023 results: Bensor AB net profit SEK 131,277; Gluonen AB profit SEK 1.4m.","basis":"documented"}],"wealth":{"published":[{"figure":"c. SEK 296m (taxable wealth)","usd":"c. US$40m","who":"Carl XVI Gustaf","publisher":"Sveriges Radio","year":2006,"rank":"","url":"https://www.sverigesradio.se/artikel/3787475"},{"figure":"c. US$20m","usd":"US$20m","who":"Carl XVI Gustaf","publisher":"Swedish Royal Court (as reported by TIME)","year":2002,"rank":"","url":"https://time.com/archive/6953932/secrets-of-the-counting-house-regal-riches/"}],"publishedNote":"No reliable estimate after 2006; online rich-list figures are unsourced.","grossAssets":{"text":"Family companies file Swedish accounts: Gluonen AB holdings had a market value of SEK 75.8m (2023); Bensor AB, Sollidens slott AB and Stenhammars Godsförvaltning AB report modest turnover and profits.","source":{"label":"Dagens PS — Kungafamiljens aktiebolag gör miljonvinster (2024)","url":"https://www.dagensps.se/foretag/kungafamiljens-aktiebolag-gor-miljonvinster/"}},"controlled":{"text":"The royal palaces are state property administered by the state; the King's lease of Stenhammar runs for life.","source":{"label":"Dagens PS (2024)","url":"https://www.dagensps.se/foretag/kungafamiljens-aktiebolag-gor-miljonvinster/"}},"opaque":{"verdict":"none found","text":"Swedish company filings make the family's corporate holdings comparatively visible, but Bensor AB's investment portfolio value is not itemised in press reports.","searched":"ICIJ Offshore Leaks database (reconciliation 2007), a figure a Bulgari chief disputed.","start":1003,"end":null,"lifespan":"c. 1003 counts of Savoy; 1861–1946 Kings of Italy; present","base":"Turin (historic); Geneva (exile)","geo":[45.072,7.686],"aliases":["Casa Savoia","Savoia-Carignano","Savoy-Aosta"],"origins":"Alpine counts from the early 11th century who controlled the passes between France and Italy, became dukes (1416), kings of Sardinia (1720) and kings of Italy (1861).","role_summary":"Savoy wealth was dynastic and territorial: toll-rich Alpine passes, then Piedmont, then the crown of a unified Italy, with a state endowment for the sovereign under the 1848 Albertine Statute. The monarchy was abolished by referendum on 2 June 1946; the Constitution's XIII transitional provision claimed for the state the Italian property of the former kings, their consorts and male descendants and voided transfers after 2 June 1946. The family's remaining wealth is private and largely outside Italy.","roleDetail":[{"t":"From Alpine passes to Italian crown.","d":"Counts (11th c.), dukes (1416), kings of Sardinia (1720), kings of Italy (1861).","basis":"documented"},{"t":"Jewels deposited (1946).","d":"On 5 June 1946 the crown jewels were handed to the Bank of Italy on Umberto II's instructions; the chest has been opened only once, in 1976.","basis":"documented"},{"t":"Confiscation by constitution (1948).","d":"The XIII transitional provision claimed the property of the former kings for the state.","basis":"documented"},{"t":"Claim rejected (2025).","d":"A Rome civil court held the jewels are state property under the Albertine Statute; the family said it would appeal and go to the European Court of Human Rights.","basis":"documented"}],"legacy":"The family's former palaces and Italian estates are state property, and the crown jewels remain in the Bank of Italy. The heirs' private wealth outside Italy is undisclosed.","legacyDetail":[{"t":"Disputed jewels.","d":"Valuations range from c. €260m (Sotheby's, 2007, on the family's description) to 'a few million euros' (Gianni Bulgari).","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No rich-list figure for the Savoy family was found. The only valuations concern the disputed jewels, which the court says the family does not own.","grossAssets":{"text":"None filed. The crown jewels in the Bank of Italy are valued at between 'a few million euros' and c. €260m–300m depending on the source.","source":{"label":"Finestre sull'Arte — Whose are the crown jewels of the House of Savoy? (2025)","url":"https://www.finestresullarte.info/en/news-focus/whose-are-the-crown-jewels-of-the-house-of-savoy-the-whole-story-of-the-disputed-casket"}},"controlled":{"text":"None documented.","source":{"label":"Wanted in Rome — Italy's former royal family loses bid to claim crown jewels","url":"https://www.wantedinrome.com/news/italys-former-royal-family-loses-bid-to-claim-crown-jewels.html"}},"opaque":{"verdict":"none found","text":"The family's private assets outside Italy are not disclosed.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Emanuele Filiberto of Savoy, Savoy): no matches; Wanted in Rome, Finestre sull'Arte, CNN on the jewels case.","source":{"label":"CNN — Italy's former royal family wants the crown jewels back (2022)","url":"https://edition.cnn.com/style/article/italy-crown-jewels-scli-intl/index.html"}},"gapNote":"Headline figures of hundreds of millions refer to jewels the Italian courts treat as state property; on the evidence found, the family's own wealth is unknown and probably far smaller."},"holdingsToday":[{"name":"Crown jewels (disputed, Bank of Italy vault)","kind":"Art & collections","sector":"Jewellery","where":"Rome","detail":"Held by the Bank of Italy since 1946; ruled state property (2025)","basis":"documented","source":{"label":"Wanted in Rome","url":"https://www.wantedinrome.com/news/italys-former-royal-family-loses-bid-to-claim-crown-jewels.html"}}],"lineage":[{"name":"Humbert I e foundation with Liria and Monterrey.","basis":"documented"}],"today":"Carlos Fitz-James Stuart, 19th Duke of Alba, chairs the foundation and the main farming company. The Liria Palace opened to the public as a museum in 2019.","today_people":[{"name":"Carlos Fitz-James Stuart, 19th Duke of Alba","relation":"head of the house","role":"Chair of Fundación Casa de Alba and Euroexplotaciones Agrarias","sector":"Land & estates","year":2019,"basis":"documented","source":{"label":"Moncloa.com (2019)","url":"https://www.moncloa.com/2019/05/13/liria-alba-ayudas-museo-21315/"}}],"sources":[{"label":"Moncloa.com — El Palacio de Liria, donde empresas de los Alba cobran ayudas y desgravaciones (2019)","url":"https://www.moncloa.com/2019/05/13/liria-alba-ayudas-museo-21315/"},{"label":"Yorkshire Post — Colourful Duchess, who was worth £2.2bn, dies at 88 (2014)","url":"https://www.yorkshirepost.co.uk/news/world/colourful-duchess-who-was-worth-ps22bn-dies-88-1830042"},{"label":"Bangor Daily News (AP) — Duchess of Alba, world's most titled aristocrat, dies (2014)","url":"https://www.bangordailynews.com/2014/11/20/news/duchess-of-alba-worlds-most-titled-aristocrat-dies/"},{"label":"Wikipedia — Cayetana Fitz-James Stuart, 18th Duchess of Alba","url":"https://www.Wikipedia.org/wiki/Cayetana_Fitz-James_Stuart"}],"connections":[{"id":"house-of-habsburg","type":"political","label":"3rd Duke served Charles V and Philip II"},{"id":"house-of-bourbon","type":"political","label":"grandees of the Spanish Bourbon court"},{"id":"house-of-orange","type":"political","label":"3rd Duke fought William of Orange's revolt"},{"id":"g2-house-of-hanover","type":"family","label":"Berwick line descends from James II (Stuart), Hanover's predecessors"}]},{"id":"esterhazy-family","name":"Esterházy family (Princes Esterházy of Galántha)","category":"Princely & Noble Houses","role":"Agricultural Land & Enclosure","moneySources":["Hungarian magnate estates (from 1527)","Habsburg loyalty: comital (1626) and princely (1687) titles","Serf-worked latifundia","Burgenland forestry, farming and wine","Private foundations (1990s)"],"nation":"Austria","scale":"Major","scaleBasis":"documented","scaleNote":"The Esterházy foundations' remaining Burgenland estates cover about 50,000 ha (Austria-Forum), Austria's largest noble landholding, with group turnover expected to reach €100m in 2024 (trend).","start":1527,"end":null,"lifespan":"1527–present (princes from 1687)","base":"Schloss Esterházy, Eisenstadt","geo":[47.846,16.523],"aliases":["Esterhazy Privatstiftung","Esterhazy Betriebe","Pannatura"],"origins":"A Hungarian noble family that acquired Galántha in 1527. Nikolaus Esterházy sided with the Habsburgs in the 17th-century conflicts and gained Forchtenstein and Eisenstadt; he was made a hereditary count in 1626, and Paul I became an imperial prince in 1687.","role_summary":"Loyalty to the Habsburgs during Hungary's revolts was rewarded with land and titles, building one of the largest estates in the Habsburg lands: about 128,000 ha in Hungary plus the western Hungarian (later Burgenland) domains. When Burgenland passed to Austria in 1921 those estates escaped the Hungarian communist confiscation of 1946–47. In 1995–96 Melinda Esterházy, widow of the last prince Paul V, placed them in three irrevocable foundations that now run forestry, organic farming, wine, real estate, tourism and culture.","roleDetail":[{"t":"Habsburg partisans (17th c.).","d":"Nikolaus and his successors supported the Habsburgs; titles of count (1626) and prince (1687) followed.","basis":"documented"},{"t":"Two estates, two fates.","d":"The Hungarian estates (c. 128,000 ha) were taken by the state in 1946–47; the Burgenland estates, in Austria since 1921, survived.","basis":"documented"},{"t":"Foundations (1995–96).","d":"Three foundations took over administration: Forchtenstein (charitable) and Eisenstadt and Lockenhaus (family trusts).","basis":"documented"},{"t":"Professional management.","d":"Stefan Ottrubay, Melinda's nephew, has run the foundations for about two decades; turnover roughly quintupled in 30 years (trend, 2024).","basis":"documented"}],"legacy":"The Esterházy foundations own about 50,000 ha in Burgenland, Schloss Esterházy, Forchtenstein Castle, lakeside land at Neusiedl, hotels, restaurants, the largest wine shop in Burgenland and the Pannatura forestry and organic-farming business. A foundation is still pursuing the Esterházy treasury held by the Hungarian state since 1949.","legacyDetail":[{"t":"Hungarian treasure case.","d":"Hungarian courts rejected the foundation's claim to 260 objects in 2021; the Kúria overturned those rulings in 2022 and sent the case back.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No rich-list figure was found for the Esterházy foundations or family.","grossAssets":{"text":"Turnover expected to reach about €100m in 2024 (+30%), with more than 660 jobs; profit figures are not published (trend). About 50,000 ha in Burgenland (Austria-Forum).","source":{"label":"trend — Stefan Ottrubay: Der Patron des Burgenlands (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}},"controlled":{"text":"The foundations, not family members, own the estates; their boards, led by Stefan Ottrubay, control land use around Lake Neusiedl, cultural venues (Oper im Steinbruch) and tourism.","source":{"label":"trend — Stefan Ottrubay (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}},"opaque":{"verdict":"reported","text":"Austrian private foundations (Privatstiftungen) do not publish beneficiaries or full accounts. Members of the princely family have publicly disputed the foundations' governance.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Esterhazy Privatstiftung, Esterházy, Stefan Ottrubay): no matches; trend; Austria-Forum; Hungary Today on the treasure case.","source":{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"}},"gapNote":"Because the estates sit in irrevocable foundations, there is no family net worth to publish; the economic reach (Austria's largest noble landholding and a €100m-turnover business) is substantial but belongs to the foundations, not to any Esterházy personally."},"holdingsToday":[{"name":"Esterhazy Privatstiftung (and Eisenstadt, Lockenhaus, Forchtenstein foundations)","kind":"Foundation","sector":"Holding","where":"Eisenstadt","detail":"Three foundations created 1995–96","basis":"documented","source":{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"}},{"name":"Pannatura","kind":"Agriculture & forestry","sector":"Forestry and organic farming","where":"Burgenland","detail":"Described as highly profitable; 'Austria's largest organic farm' (Ottrubay)","basis":"documented","source":{"label":"trend — Stefan Ottrubay (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}},{"name":"Lake Neusiedl land and resorts","kind":"Urban property","sector":"Real estate and tourism","where":"Neusiedler See, Breitenbrunn","detail":"Leased plots and lakeside resort","basis":"documented","source":{"label":"trend — Stefan Ottrubay (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}},{"name":"Schloss Esterházy and Burg Forchtenstein","kind":"Art & collections","sector":"Museums and culture","where":"Eisenstadt; Forchtenstein","detail":"Owned by the foundations","basis":"documented","source":{"label":"1000things — Schloss Esterházy","url":"https://1000things.at/info/schloss-esterhazy"}}],"lineage":[{"name":"Nikolaus Esterházy","relation":"founder","years":"1583–1645","note":"Palatine of Hungary; acquired Forchtenstein and Eisenstadt; count 1626.","basis":"documented"},{"name":"Paul I Esterházy","relation":"son","years":"1635–1713","note":"Imperial prince 1687.","basis":"documented"},{"name":"Paul V Esterházy","relation":"descendant","years":"1901–1989","note":"Last prince to hold the estates; Hungarian lands lost 1946–47.","basis":"documented"},{"name":"Melinda Esterházy","relation":"spouse","years":"1920–2014","note":"Placed the estates in foundations in 1995–96.","basis":"documented"},{"name":"Esterhazy foundations","relation":"successor","years":"1995–present","note":"Own and run the Burgenland estates.","id":"g2-esterhazy-foundations","basis":"documented"}],"today":"The Esterházy estates are run by the foundations under Stefan Ottrubay. The family name is attached to Eisenstadt's palace and Haydn heritage; members of the princely family have contested the foundation model.","today_people":[{"name":"Stefan Ottrubay","relation":"nephew of Melinda Esterházy","role":"Head of the Esterházy foundations","sector":"Land & estates","year":2024,"basis":"documented","source":{"label":"trend — Stefan Ottrubay (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}}],"sources":[{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"},{"label":"trend — Stefan Ottrubay: Der Patron des Burgenlands (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"},{"label":"Hungary Today — Supreme Court ruling on Esterházy treasure claim","url":"https://hungarytoday.hu/supreme-court-ruling-esterhazy-treasure-claim-austria/"},{"label":"Telex — Elbukott a per, a magyar államnál maradnak az Esterházy-kincsek (2021)","url":"https://telex.hu/kult/2021/05/11/per-esterhazy-kincsek-magyar-allam-tulajdonjog"}],"connections":[{"id":"house-of-habsburg","type":"charter","label":"imperial prince 1687 for Habsburg loyalty"},{"id":"communist-expropriations-1945","type":"political","label":"Hungarian estates (c. 128,000 ha) taken 1946–47"},{"id":"g2-esterhazy-foundations","type":"trust","label":"Burgenland estates held in foundations since 1995–96"},{"id":"holy-roman-empire","type":"charter","label":"imperial princely title"},{"id":"liechtenstein-foundations","type":"trust","label":"comparable foundation model (Austrian Privatstiftung)"}]},{"id":"schwarzenberg-family","name":"Schwarzenberg family (Princes of Schwarzenberg)","category":"Princely & Noble Houses","role":"Agricultural Land & Enclosure","moneySources":["Franconian lordship","Marriage to Anna Neumann (Murau, 1617/1623)","Habsburg service and Bohemian estates (Krumau, Hluboká)","Forestry and fish farming","Restitution after 1989"],"nation":"Czech Republic","scale":"Significant","scaleBasis":"estimated","scaleNote":"The family regained the Orlík branch's castles and land after 1989 and keeps forests in Styria and Salzburg; Czech reports give conflicting forest figures (c. 4,000 ha to more than 10,000 ha), and no reliable total was found.","start":1599,"end":null,"lifespan":"1599 counts; 1670 princes; present","base":"Orlík Castle (Czech Republic) and Murau (Austria)","geo":[49.513,14.17],"aliases":["Fürstlich Schwarzenberg'sche Familienstiftung","Orlík branch","Hluboká-Krumlov branch"],"origins":"Franconian lords who rose in Habsburg service. Georg Ludwig of Schwarzenberg married the wealthy Styrian entrepreneur Anna Neumann von Wasserleonburg, and Murau came to the family in 1623. Princely rank followed in 1670, and inheritances brought Krumlov (Krumau) and other south Bohemian estates.","role_summary":"The Schwarzenbergs became among the largest landowners in Bohemia through Habsburg favour and inheritance (Krumlov came to them in 1719), running forests, fishponds and breweries. The senior Hluboká-Krumlov branch lost everything under the 1947 'Lex Schwarzenberg', a special law transferring its property to the Czech state; the Orlík branch lost its estates after the 1948 communist coup and so could claim restitution after 1989. Karel Schwarzenberg (1937–2023), Czech foreign minister, inherited both lines' remaining assets.","roleDetail":[{"t":"Marriage to an heiress (1617/1623).","d":"Anna Neumann's Styrian estates, including Murau, passed to the Schwarzenbergs.","basis":"documented"},{"t":"Bohemian magnates.","d":"Before 1918 the family held some of the largest estates in Bohemia; Czech coverage cites nearly 19,000 ha for one branch's land.","basis":"documented"},{"t":"Lex Schwarzenberg (1947).","d":"Act 143/1947 transferred the Hluboká branch's property to the state; Karel Havlíček MP has called it 'a deliberate theft'. Elisabeth Pezold has sought about 55,000 ha of her grandfather Adolf's estates.","basis":"documented"},{"t":"Restitution (1990s).","d":"Karel Schwarzenberg recovered the Orlík branch's Orlík, Čimelice, Zvíkov and Sedlec properties.","basis":"documented"}],"legacy":"Czech property (Orlík, Čimelice, Dřevíč, forests and farmland) is run by a company led by Jan Nepomuk Schwarzenberg (b. 1967), who also heads the family foundation board; Orlík is registered to the Fürstlich Schwarzenberg'sche Familienstiftung. Austrian forests in Styria and Salzburg, Murau Castle and the Vienna palace are held via the Schwarzenberg foundation. Hluboká remains Czech state property.","legacyDetail":[{"t":"Inheritance dispute won.","d":"Czech media report Karel Schwarzenberg won a long dispute with his half-sister over the Vienna palace, Murau and forests in Styria and Salzburg.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No reliable published valuation was found. A figure attributed to Trend magazine (2017) appears in Czech coverage, but its original source could not be confirmed, so it is not used.","grossAssets":{"text":"No consolidated accounts found. Czech and Austrian properties are held through the family foundation and an estate-management company.","source":{"label":"CNN Prima News — Schwarzenberg po sobě zanechal 3 děti… (2023)","url":"https://cnn.iprima.cz/schwarzenberg-po-sobe-zanechal-3-deti-a-5-vnoucat-stat-rodinu-pripravil-o-velky-majetek-417405"}},"controlled":{"text":"Jan Nepomuk Schwarzenberg heads the foundation board and the company running the Czech estates, including forests and farmland.","source":{"label":"CNN Prima News (2023)","url":"https://cnn.iprima.cz/schwarzenberg-po-sobe-zanechal-3-deti-a-5-vnoucat-stat-rodinu-pripravil-o-velky-majetek-417405"}},"opaque":{"verdict":"reported","text":"Most family property is held through the Schwarzenberg family foundation, whose accounts and beneficiaries are not public; Czech reporting places Orlík in the Fürstlich Schwarzenberg'sche Familienstiftung.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Fürstlich Schwarzenberg'sche Familienstiftung, Jan Nepomuk Schwarzenberg, Schwarzenberg): name matches only, none shown to be this family or its vehicles; Czech press (iPrima, Seznam Zprávy, Radio Prague).","source":{"label":"Seznam Zprávy — Komu patří nevrácený schwarzenberský majetek (2023)","url":"https://www.seznamzpravy.cz/clanek/domaci-kauzy-prehledne-komu-patri-nevraceny-schwarzenbersky-majetek-239765"}},"gapNote":"Public attention focuses on what the family lost (Hluboká, Krumlov); what it regained and kept in Austria sits in a foundation, so its present scale is genuinely unknown rather than understated."},"holdingsToday":[{"name":"Orlík, Čimelice and Dřevíč estates","kind":"Rural land","sector":"Castles, forestry, farming","where":"South and Central Bohemia","detail":"Restituted after 1989","basis":"documented","source":{"label":"Seznam Zprávy (2023)","url":"https://www.seznamzpravy.cz/clanek/domaci-kauzy-prehledne-komu-patri-nevraceny-schwarzenbersky-majetek-239765"}},{"name":"Schwarzenberg forestry (Murau)","kind":"Agriculture & forestry","sector":"Forestry","where":"Styria and Salzburg","detail":"Forestry administration based at Murau Castle","basis":"documented","sourc Komu patří nevrácený schwarzenberský majetek (2023)","url":"https://www.seznamzpravy.cz/clanek/domaci-kauzy-prehledne-komu-patri-nevraceny-schwarzenbersky-majetek-239765"},{"label":"Radio Prague International — Pezoldová wins appeal over restitution rulings","url":"https://english.radio.cz/node/8378077"},{"label":"Der Standard — 400 Jahre Schwarzenberg in Murau","url":"https://www.derstandard.at/story/2000062646476/400-jahre-schwarzenberg-in-murau"},{"label":"The Art Newspaper — The marathon legal battle over property confiscated by the Czech government (2015)","url":"https://www.theartnewspaper.com/news/the-marathon-legal-battle-over-property-confiscated-by-the-czech-government"}],"connections":[{"id":"communist-expropriations-1945","type":"political","label":"Lex Schwarzenberg 1947 and 1948 confiscations"},{"id":"house-of-habsburg","type":"political","label":"Habsburg ministers and generals (e.g. Karl Philipp at Leipzig 1813)"},{"id":"house-of-liechtenstein","type":"family","label":"fellow Bohemian magnates"},{"id":"lobkowicz-family","type":"political","label":"both reclaimed Bohemian castles after 1989"},{"id":"german-family-foundations","type":"trust","label":"assets in a family foundation"}]},{"id":"furstenberg-family","name":"Fürstenberg family (Princes of Fürstenberg, Donaueschingen)","category":"Princely & Noble Houses","role":"Agricultural Land & Enclosure","moneySources":["Swabian counties (13th c.)","Brewing privilege (1283)","Imperial princely rank","Mediatisation (1806); kept private estates","Forestry and real estate"],"nation":"Germany","scale":"Significant","scaleBasis":"documented","scaleNote":"Fürstenberg holds about 18,000 ha of forest (Euronews, 2026), among Germany's largest private forest holdings.","start":1283,"end":null,"lifespan":"13th c.–present; sovereign principality until 1806","base":"Schloss Donaueschingen","geo":[47.953,8.503],"aliases":["Fürstlich Fürstenbergische Brauerei","Haus Fürstenberg"],"origins":"Swabian counts descended from the counts of Urach, who took the name of Fürstenberg castle in the 13th century and ruled the Baar and Black Forest lands around Donaueschingen.","role_summary":"The family ruled a principality in the Black Forest and Baar until Napoleon mediatised it in 1806, when most of it passed to Baden; it kept its private estates, forests and brewery. The brewery, based on a 1283 privilege, was sold in 2004 to Brau Holding International (Heineken and Schörghuber). The family sold its Nibelungenlied manuscript C (2001) and old-master paintings (2003) and now lives mainly from forestry, property and burial forests.","roleDetail":[{"t":"A 700-year brewing privilege.","d":"The brewing right dates to 1283; the family sold the brewery in 2004 to Brau Holding International, owned 49.9% by Heineken and 50.1% by Schörghuber.","basis":"documented"},{"t":"Mediatised (1806).","d":"Napoleon dissolved the principality; most land went to Baden, but the family retained private property.","basis":"documented"},{"t":"Selling heritage (2001–03).","d":"Landesbank Baden-Württemberg bought Nibelungenlied manuscript C for almost DM 20m in 2001; Reinhold Würth bought the painting collection in 2003.","basis":"documented"}],"legacy":"The family's wealth is now forest (about 18,000 ha), burial forests, Schloss Donaueschingen and Schloss Heiligenberg on Lake Constance, and property. The brewery brand belongs to Heineken's and Schörghuber's joint venture.","legacyDetail":[{"t":"Second-largest private forest owner (own claim).","d":"The family says it is Germany's second-largest private forest owner and runs six burial forests on 256 ha (Stuttgarter Zeitung, 2019).","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No rich-list figure for the Fürstenberg family was found.","grossAssets":{"text":"No published accounts were found; the documented asset is about 18,000 ha of forest plus castles and property.","source":{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},"controlled":{"text":"None documented beyond the family's own estates.","source":{"label":"Stuttgarter Zeitung — Wer ist die Familie Fürstenberg? (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"}},"opaque":{"verdict":"none found","text":"The family's estate companies are private; no foundation or offshore structure was documented.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Christian, Hereditary Prince of Fürstenberg, Fürstenberg, Fürstenberg burial forests, Heinrich, Prince of Fürstenberg): no matches; Stuttgarter Zeitung; Euronews.","source":{"label":"Stuttgarter Zeitung (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"}},"gapNote":"The sale of the brewery, manuscripts and paintings in 2001–04 suggests a family whose land is large but whose liquid income needed supplementing; no figure exists to test either way."},"holdingsToday":[{"name":"Fürstenberg forestry","kind":"Agriculture & forestry","sector":"Forestry","where":"Black Forest and Baar","detail":"c. 18,000 ha","basis":"documented","source":{"label":"Euronews (DE) (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},{"name":"Fürstenberg burial forests (Friedwälder)","kind":"Private company","sector":"Burial forests","where":"Baden-Württemberg","detail":"Six sites on 256 ha","basis":"documented","source":{"label":"Stuttgarter Zeitung (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"}},{"name":"Schloss Donaueschingen and Schloss Heiligenberg","kind":"Rural land","sector":"Residences, events","where":"Donaueschingen; Lake Constance","detail":"Family-owned castles","basis":"documented","source":{"label":"Stuttgarter Zeitung (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"}}],"lineage":[{"name":"Counts of Urach-Fürstenberg","relation":"founder","years":"13th c.","note":"Took the Fürstenberg name; brewing privilege 1283.","basis":"documented"},{"name":"Joachim Egon","relation":"descendant","years":"1923–2002","note":"Head of house until 2002.","basis":"documented"},{"name":"Heinrich, Prince of Fürstenberg","relation":"son","years":"b. 1950","note":"Head since 2002; sold the brewery (2004) and paintings (2003).","basis":"documented"},{"name":"Christian, Hereditary Prince","relation":"heir","years":"b. 1977","note":"In the family business since 2004.","basis":"documented"}],"today":"Heinrich, Prince of Fürstenberg, has led the house since 2002; Hereditary Prince Christian works in the family business. The Fürstenberg beer brand now belongs to Heineken's and Schörghuber's joint venture.","today_people":[{"name":"Heinrich, Prince of Fürstenberg","relation":"head of house","role":"Head of the Fürstenberg estates","sector":"Land & estates","year":2019,"basis":"documented","source":{"label":"Stuttgarter Zeitung (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"}},{"name":"Christian, Hereditary Prince of Fürstenberg","relation":"heir","role":"Manager in the family estates","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Euronews (DE) (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}}],"sources":[{"label":"Stuttgarter Zeitung — Adelsgeschlecht aus Donaueschingen: Wer ist die Familie Fürstenberg? (2019)","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/adelsgeschlecht-aus-donaueschingen-wer-ist-die-familie-fuerstenberg-78995963.html"},{"label":"Wikipedia — Fürstenberg Brewery","url":"https://en.wikipedia.org/wiki/F%C3%BCrstenberg_Brewery"},{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"},{"label":"Wikipedia — German mediatisation","url":"https://en.wikipedia.org/wiki/German_Mediatisation"}],"connections":[{"id":"g2-reichsdeputationshauptschluss-1803","type":"political","label":"mediatised 1806; most land to Baden"},{"id":"heineken-family","type":"trade","label":"brewery sold 2004 to a Heineken joint venture"},{"id":"holy-roman-empire","type":"charter","label":"imperial princes of the Swabian circle"},{"id":"thurn-und-taxis-family","type":"political","label":"fellow mediatised forest-owning house"}]},{"id":"lobkowicz-family","name":"Lobkowicz family (Princes Lobkowicz)","category":"Princely & Noble Houses","role":"Agricultural Land & Enclosure","moneySources":["Bohemian lordships (14th–15th c.)","Habsburg high office (Chancellor of Bohemia)","Marriage to Polyxena of Pernštejn (1603)","Estates, breweries and collections","Restitution after 1989"],"nation":"Czech Republic","scale":"Minor","scaleBasis":"estimated","scaleNote":"The family runs five restituted heritage sites and one of Europe's oldest private art collections, but no published valuation exists and the family calls itself 'custodians' rather than owners.","start":1410,"end":null,"lifespan":"15th c.–present (princes from 1624)","base":"Lobkowicz Palace, Prague Castle","geo":[50.091,14.405],"aliases":["House of Lobkowicz","Lobkowicz Collections","Popel z Lobkowicz"],"origins":"Bohemian nobles who rose under the Habsburgs. Zdeněk Vojtěch Popel of Lobkowicz, Chancellor of Bohemia, married Polyxena of Pernštejn, who brought the Prague palace and Roudnice into the family; he became the first Prince Lobkowicz.","role_summary":"The fortune was Bohemian land and Habsburg office: the family stayed Catholic and loyal in 1618–20 and prospered as Protestant rivals were dispossessed. Over centuries it built estates, castles and a collection (Bruegel's Haymaking, Canaletto's London views, Beethoven manuscripts). Everything was confiscated by the Nazis in 1939 and again by the communists after 1948; after 1989, under three restitution laws, the family recovered castles and collections over a 25-year process.","roleDetail":[{"t":"Habsburg loyalists.","d":"Zdeněk Vojtěch was Chancellor of Bohemia; his widow Polyxena sheltered the Catholic regents after the 1618 defenestration (commonly reported).","basis":"interpretive"},{"t":"Marriage to Polyxena (1603).","d":"Polyxena of Pernštejn brought the palace at Prague Castle to the Lobkowiczs.","basis":"documented"},{"t":"Double confiscation (1939, 1948).","d":"Collections and properties were seized by the Nazis in 1939 and by the communists after 1948.","basis":"documented"},{"t":"Restitution (1990–2015).","d":"Nelahozeves came back first; Roudnice was returned in 1992; the music archive in 1998; the Prague palace after a twelve-year process (2002).","basis":"documented"}],"legacy":"The House of Lobkowicz, led by William Lobkowicz, runs Lobkowicz Palace at Prague Castle, Nelahozeves Castle with Dvořák's birthplace, Roudnice Castle and winery, and Střekov Castle, funded by museum, events, gastronomy and fundraising. The family sold Jezeří Castle to the Czech state in 1996.","legacyDetail":[{"t":"Custodians, not owners.","d":"The family describes itself as 'not owners, but rather custodians of culture' and has funded restorations through NFT sales and auctions.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No published net-worth figure was found.","grossAssets":{"text":"No consolidated accounts found. Assets are heritage sites and the Lobkowicz Collections, whose value is not published.","source":{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"}},"controlled":{"text":"The family governs five heritage sites and the collections, run as a museum and events business.","source":{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"}},"opaque":{"verdict":"none found","text":"No foundation or offshore structure was documented in the sources checked.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Alexandra Lobkowicz, Lobkowicz, William Lobkowicz): no matches; family website; Czech press.","source":{"label":"House of Lobkowicz — William Lobkowicz","url":"https://www.lobkowicz.cz/en/about-us/william-lobkowicz"}},"gapNote":"The Lobkowicz case runs opposite to most: restituted heritage brings costs as much as income, so a valuable collection may coexist with limited spendable wealth."},"holdingsToday":[{"name":"Lobkowicz Palace","kind":"Art & collections","sector":"Museum","where":"Prague Castle","detail":"Returned 2002; houses the Lobkowicz Collections","basis":"documented","source":{"label":"Wikipedia — Lobkowicz Palace","url":"https://en.wikipedia.org/wiki/Lobkowicz_Palace"}},{"name":"Nelahozeves, Roudnice and Střekov castles","kind":"Rural land","sector":"Heritage sites","where":"Central and North Bohemia","detail":"Restituted 1990s","basis":"documented","source":{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"}},{"name":"Zámek Lobkowicz Roudnice Winery","kind":"Agriculture & forestry","sector":"Wine","where":"Roudnice nad Labem","detail":"Family winery","basis":"documented","source":{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"}}],"lineage":[{"name":"Zdeněk Vojtěch Popel of Lobkowicz","relation":"founder","years":"1568–1628","note":"Chancellor of Bohemia; first prince.","basis":"documented"},{"name":"Polyxena of Pernštejn","relation":"spouse","years":"1566–1642","note":"Brought the Prague palace and Roudnice.","basis":"documented"},{"name":"Max Lobkowicz","relation":"descendant","years":"1888–1967","note":"Went into exile; property confiscated 1939 and 1948.","basis":"interpretive"},{"name":"William Lobkowicz","relation":"descendant","years":"b. 1961","note":"Returned in 1990–91 and led the restitution.","basis":"documented"}],"today":"William Lobkowicz, founder and chairman of the House of Lobkowicz, and Alexandra Lobkowicz, president of the Lobkowicz Collections, run the family's heritage business from Prague.","today_people":[{"name":"William Lobkowicz","relation":"head of the Roudnice-Nelahozeves line","role":"Founder and Chairman, House of Lobkowicz","sector":"Culture & media","year":2026,"basis":"documented","source":{"label":"House of Lobkowicz — William Lobkowicz","url":"https://www.lobkowicz.cz/en/about-us/william-lobkowicz"}},{"name":"Alexandra Lobkowicz","relation":"spouse","role":"President of the Lobkowicz Collections","sector":"Culture & media","year":2026,"basis":"documented","source":{"label":"House of Lobkowicz — Alexandra Lobkowicz","url":"https://lobkowicz.cz/en/alexandra-lobkowicz"}}],"sources":[{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"},{"label":"Wikipedia — Lobkowicz Palace","url":"https://en.wikipedia.org/wiki/Lobkowicz_Palace"},{"label":"House of Lobkowicz — William Lobkowicz","url":"https://www.lobkowicz.cz/en/about-us/william-lobkowicz"},{"label":"History News Network — Czech noble family, restored to palace and art treasures, put all on display","url":"https://www.historynewsnetwork.org/article/37245"}],"connections":[{"id":"communist-expropriations-1945","type":"political","label":"properties confiscated after 1948; restituted after 1989"},{"id":"house-of-habsburg","type":"political","label":"Chancellors of Bohemia under the Habsburgs"},{"id":"g2-battle-of-white-mountain","type":"political","label":"Catholic loyalists on the winning side in 1620"},{"id":"schwarzenberg-family","type":"political","label":"fellow restitution claimants"}]},{"id":"g2-house-of-luxembourg","name":"House of Nassau-Weilburg (Grand Ducal family of Luxembourg)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Duchy of Nassau (to 1866)","Prussian annexation settlement (1867, reported)","Succession to Luxembourg (1890)","Land and investments","State endowment"],"nation":"Luxembourg","scale":"Significant","scaleBasis":"estimated","scaleNote":"EuroBusiness ranked the family Europe's second-richest royals in 1999 at about US$4.3bn (as reported by TIME, 2002); the Grand Ducal court calls such figures 'pure fantasy'.","start":1890,"end":null,"lifespan":"Nassau dukes to 1866; Grand Dukes of Luxembourg since 1890","base":"Grand Ducal Palace, Luxembourg","geo":[49.611,6.131],"aliases":["Nassau-Weilburg","Grand Ducal Court","Maison du Grand-Duc"],"origins":"The Walram line of the house of Nassau ruled the Duchy of Nassau until Prussia annexed it in 1866. When the Dutch Orange-Nassau line ran out of male heirs in 1890, Luxembourg passed to Adolphe, the deposed Duke of Nassau.","role_summary":"The family brought a German ducal fortune into a small grand duchy that later became one of the world's richest countries per head. Its private wealth is held in land, investments and art; its official functions are funded by a state endowment. A 2020 government-commissioned report by Jeannot Waringo found that palace costs were spread across budgets and recommended reforms.","roleDetail":[{"t":"Succession by family pact (1890).","d":"The Nassau family pact gave Luxembourg to the Walram line when the Orange line had no male heir.","basis":"documented"},{"t":"Waringo report (2020).","d":"It found the family received €11.1m from the state in 2019 plus about €4m in other budget lines, and could not establish whether private activities were state-funded.","basis":"documented"},{"t":"Estimates disputed.","d":"The Grand Duke's Estate Administration says the real net value is a 'small fraction' of reported amounts and that journalists 'confuse private family assets with historical and cultural heritage'.","basis":"documented"}],"legacy":"Private assets (investments, land, art) are undisclosed; castles, palaces and artworks used by the dynasty are described by the court as held but not owned by it.","legacyDetail":[{"t":"Grand Duke Guillaume.","d":"Henri abdicated in favour of his son Guillaume on 3 October 2025 (head of state change; finances unchanged in disclosure).","basis":"documented"}],"wealth":{"published":[{"figure":"c. US$4.3bn","usd":"US$4.3bn","who":"Grand Ducal family","publisher":"EuroBusiness (as reported by TIME)","year":1999,"rank":"2nd among European royals","url":"https://time.com/archive/6953932/secrets-of-the-counting-house-regal-riches/"},{"figure":"€4bn","usd":"c. US$4.5bn","who":"Grand Duke Henri","publisher":"Business Insider (as reported by Luxtoday)","year":2019,"rank":"","url":"https://luxtoday.lu/en/luxembourg-en/europes-richest-monarchy-luxembourg-refutes-billion-dollar-valuations-of-its-heritage"}],"publishedNote":"The court rejects these figures; it says the family is entitled to financial privacy and will not publish private assets.","grossAssets":{"text":"No filed accounts for private assets. State funding of the household is reported in the budget (€11.1m in 2019 plus about €4m elsewhere, per Waringo).","source":{"label":"Paperjam/Delano — Royals receive €17.5m in 2021 budget","url":"https://en.paperjam.lu/article/delano_royals-receive-eu175m-2021-budget-tidied"}},"controlled":{"text":"Palaces and cultural heritage used by the family, which the court says belong to the state or society.","source":{"label":"Luxtoday — Luxembourg refutes billion-dollar valuations","url":"https://luxtoday.lu/en/luxembourg-en/europes-richest-monarchy-luxembourg-refutes-billion-dollar-valuations-of-its-heritage"}},"opaque":{"verdict":"none found","text":"The family declines to publish its private assets; the 2020 Waringo review said it could not establish how private activities were financed.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Henri, Grand Duke of Luxembourg, Nassau-Weilburg): no matches; Waringo report coverage (Paperjam/Delano); Luxtoday.","source":{"label":"Paperjam/Delano (2021)","url":"https://en.paperjam.lu/article/delano_royals-receive-eu175m-2021-budget-tidied"}},"gapNote":"The multi-billion figures appear to fold heritage the court says the family does not own into private wealth; with no disclosure, neither the high estimates nor the court's 'small fraction' can be checked."},"holdingsToday":[{"name":"Private investments, land and art","kind":"Other","sector":"Undisclosed","where":"Luxembourg and abroad","detail":"Not published","basis":"interpretive","source":{"label":"Luxtoday","url":"https://luxtoday.lu/en/luxembourg-en/europes-richest-monarchy-luxembourg-refutes-billion-dollar-valuations-of-its-heritage"}}],"lineage":[{"name":"Adolphe, Grand Duke","relation":"founder","years":"1817–1905","note":"Duke of Nassau until 1866; Grand Duke from 1890.","basis":"documented"},{"name":"Charlotte","relation":"descendant","years":"1896–1985","note":"Grand Duchess 1919–64.","basis":"documented"},{"name":"Henri","relation":"descendant","years":"b. 1955","note":"Grand Duke 2000–2025.","basis":"documented"},{"name":"Guillaume V","relation":"son","years":"b. 1981","note":"Succeeded on his father's abdication, 3 October 2025.","basis":"documented"}],"today":"Grand Duke Guillaume V has reigned since his father Henri abdicated on 3 October 2025. Its household finances were reformed after the 2020 Waringo report; its private wealth remains undisclosed.","today_people":[{"name":"Henri, Grand Duke of Luxembourg","relation":"head of house (until 2025)","role":"Grand Duke of Luxembourg 2000–2025","sector":"Royalty & titles","year":2025,"basis":"documented","source":{"label":"Paperjam/Delano (2021)","url":"https://en.paperjam.lu/article/delano_royals-receive-eu175m-2021-budget-tidied"}},{"na nt","base":"Marienburg Castle (Pattensen) and Calenberg","geo":[52.209,9.8],"aliases":["Welfen","Guelph","Prinz von Hannover","Duke of Brunswick"],"origins":"The Guelph (Welf) dukes of Brunswick-Lüneburg became Electors of Hanover (1692), kings of Great Britain (1714–1837) and kings of Hanover (1814–66).","role_summary":"After Prussia annexed Hanover in 1866, a treaty of 29 September 1867 awarded deposed King George V 16 million thaler; Prussia seized it because of his continued hostility and Bismarck's opponents dubbed its secret uses the 'reptile fund'. Seizure was lifted from 1892 after a declaration by the Duke of Cumberland, and the dispute was finally settled only by 1933. The family kept estates and Marienburg Castle but has since sold art and property to pay for upkeep.","roleDetail":[{"t":"British crown (1714–1837).","d":"Hanover was ruled in personal union with Britain until 1837.","basis":"documented"},{"t":"Guelph fund (1867).","d":"16 million thaler awarded as compensation was seized by Prussia and used as a secret fund.","basis":"documented"},{"t":"Marienburg auction (2005).","d":"More than 20,000 objects sold over ten days for €44m.","basis":"documented"},{"t":"Castle for €1 (2018).","d":"Ernst August Jr offered Marienburg to Lower Saxony; his father sued to revoke the 2004 and 2007 gifts, including Calenberg and the Fürstenhaus Herrenhausen.","basis":"documented"}],"legacy":"Marienburg Castle is passing into public ownership via the Lower Saxony Klosterkammer's company, with €13.6m of federal funding pledged. The family retains the Calenberg estate and other property, subject to the father-son litigation.","legacyDetail":[{"t":"Public rescue.","d":"The state and federal government are funding the castle's €27m renovation after the transfer.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No reliable published valuation was found.","grossAssets":{"text":"None filed. Documented values: €44m auction proceeds (2005); €27m renovation estimate for Marienburg.","source":{"label":"taz — Verarmter Hochadel (2018)","url":"https://taz.de/Verarmter-Hochadel/!5558670/"}},"controlled":{"text":"None documented.","source":{"label":"LTO — Welfenprinz Ernst August will Marienburg zurück","url":"https://www.lto.de/recht/nachrichten/n/lg-hannover-16o32420-welfen-prinz-ernst-august-hannover-marienburg-niedersachsen-schenkung-erbe-klage-widerruf"}},"opaque":{"verdict":"none found","text":"The family's remaining private assets are not disclosed.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Ernst August Prinz von Hannover, Hanover): no matches; taz; LTO; Irish Times.","source":{"label":"Irish Times — German renegade royal sues son to get castle back","url":"https://www.irishtimes.com/news/world/europe/german-renegade-royal-sues-son-to-get-castle-back-1.4488737"}},"gapNote":"Here the gap runs downward: a famous name with a castle the family could not afford to keep."},"holdingsToday":[{"name":"Calenberg estate (Hausgut Calenberg)","kind":"Rural land","sector":"Estate","where":"Pattensen, Lower Saxony","detail":"Subject of the father's 2020 lawsuit","basis":"documented","source":{"label":"LTO","url":"https://www.lto.de/recht/nachrichten/n/lg-hannover-16o32420-welfen-prinz-ernst-august-hannover-marienburg-niedersachsen-schenkung-erbe-klage-widerruf"}},{"name":"Marienburg Castle (being transferred)","kind":"Rural land","sector":"Heritage","where":"Pattensen","detail":"Offered to the state for €1 (2018)","basis":"documented","source":{"label":"taz (2018)","url":"https://taz.de/Verarmter-Hochadel/!5558670/"}}],"lineage":[{"name":"George I","relation":"descendant","years":"1660–1727","note":"Elector of Hanover, King of Great Britain from 1714.","basis":"documented"},{"name":"George V of Hanover","relation":"descendant","years":"1819–1878","note":"Last king; 1867 settlement seized by Prussia.","basis":"documented"},{"name":"Ernst August (b. 1954)","relation":"head of house","years":"b. 19 k / wealth manager","description":"Private bank and asset manager founded in Vaduz in 1921 as the Bank in Liechtenstein and bought by the princely family around 1930. It is held through the Prince of Liechtenstein Foundation and chaired by Prince Max. For 2025 it reported group profit of CHF 445.6m and client assets under management of CHF 386.1bn; in 2008 data on c. 1,400 client relationships taken by an ex-employee triggered tax probes in Germany and elsewhere.","start":1921,"geo":[47.139,9.521],"sources":[{"label":"LGT — 2025 annual results","url":"https://www.lgt.com/ch-en/about-lgt/lgt-news/lgt-significantly-increases-profit-and-continues-growth-trajectory-336808"},{"label":"InvestmentNews — Royal family you've never heard of builds $300B finance empire (2023)","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"},{"label":"RTÉ — Liechtenstein tax probe (2008)","url":"https://www.rte.ie/news/2008/0227/100161-liechtenstein"}],"connections":[{"id":"house-of-liechtenstein","type":"ownership","label":"wholly owned by the princely family"},{"id":"g2-prince-of-liechtenstein-foundation","type":"ownership","label":"held via the foundation"},{"id":"liechtenstein-foundations","type":"offshore","label":"Liechtenstein trust and foundation services"},{"id":"switzerland-banking-secrecy","type":"legacy","label":"part of the Swiss-Liechtenstein private-banking cluster"}]},{"id":"g2-prince-of-liechtenstein-foundation","name":"Prince of Liechtenstein Foundation (Stiftung Fürst Liechtenstein)","type":"entity","kind":"Trust / foundation","description":"Vaduz foundation created in 1970 to hold the princely family's assets, including LGT Group and the Liechtenstein Group (forestry, farming, wine, real estate, RiceTec). Hans-Adam II chairs its board and is described as the main beneficiary; its revenue and net income are confidential. It is the claimant in Czech lawsuits over property confiscated in 1945.","start":1970,"geo":[47.141,9.522],"sources":[{"label":"Wikipedia — Prince of Liechtenstein Foundation","url":"https://en.wikipedia.org/wiki/Prince_of_Liechtenstein_Foundation"},{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"},{"label":"Radio Prague International — Foundation's property claims rejected","url":"https://english.radio.cz/node/8797582"}],"connections":[{"id":"house-of-liechtenstein","type":"trust","label":"holds the family's assets"},{"id":"lgt-group","type":"ownership","label":"owns LGT"},{"id":"g2-ricetec","type":"ownership","label":"owns RiceTec"},{"id":"communist-expropriations-1945","type":"political","label":"claimant over 1945 confiscations"}]},{"id":"g2-ricetec","name":"RiceTec Inc.","type":"entity","kind":"Private company","description":"Hybrid rice seed company headquartered in Alvin, Texas, re-formed from the Farms of Texas rice partnership in 1990 and listed by the Liechtenstein Group among its portfolio companies. It drew controversy in the 1990s over 'Texmati' and basmati-related branding and patents.","start":1990,"geo":[29.424,-95.244],"sources":[{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"},{"label":"Wikipedia — RiceTec","url":"https://en.wikipedia.org/wiki/RiceTec"}],"connections":[{"id":"g2-prince-of-liechtenstein-foundation","type":"ownership","label":"owned via the Liechtenstein Group"},{"id":"house-of-liechtenstein","type":"ownership","label":"princely family's US agri-business"}]},{"id":"congo-free-state","name":"Congo Free State (État indépendant du Congo)","type":"entity","kind":"Colony (personal possession)","description":"Territory held personally by Leopold II of Belgium from 1885 until Belgium annexed it on 15 November 1908. Rubber and ivory were extracted through forced labour enforced by the Force Publique; domain revenue rose from about 150,000 francs (1890) to over 18 million (1901), and Leopold's personal rubber profit in 1896–1905 has been estimated at about 70 million francs. Estimates of population decline range from c. 1 to 10+ million and are debated, with disease a major cause. Its profits partly endowed the Belgian Royal Trust.","start":1885,"geo":[-4.322,15.312],"sources":[{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"},{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}],"connections":[{"id":"leopold-ii-belgium","type":"ownership","label":"Leopold II's personal possession"},{"id":"g2-belgian-royal-trust","type":"legacy","label":"profits partly endowed the Royal Trust"},{"id":"house-of-saxe-coburg-gotha","type":"political","label":"Belgian Saxe-Coburg dynasty"}]},{"id":"g2-belgian-royal-trust","name":"Royal Trust (Donation royale / Koninklijke Schenking)","type":"entity","kind":"Trust / foundation","description":"Proposed by Leopold II in 1900 and accepted by law in 1903 (extended in 1908), an autonomous public institution since 1930. It manages about 7,500 ha (c. 5,000 ha forest) and 77 buildings including Laeken park, the Royal Greenhouses and castles used by the royal family, which must never be sold. Its first balance sheet (2022) valued them at about €231m.","start":1900,"geo":[50.885,4.358],"sources":[{"label":"BRF — Erste Schätzung von Wert der königlichen Schenkung von Leopold II. (7 Jan 2024, citing La Libre Belgique)","url":"https://brf.be/national/1790585/"},{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"},{"label":"VRT NWS — Immo Royal (2019)","url":"https://www.vrt.be/vrtnws/nl/2019/11/25/_immo-royal_-de-koninklijke-schenking-doorgelicht/"}],"connections":[{"id":"leopold-ii-belgium","type":"legacy","label":"endowed by Leopold II"},{"id":"congo-free-state","type":"legacy","label":"partly funded by Congo profits"},{"id":"house-of-saxe-coburg-gotha","type":"trust","label":"properties reserved for the throne's successors"}]},{"id":"g2-wittelsbacher-ausgleichsfonds","name":"Wittelsbacher Ausgleichsfonds (WAF)","type":"entity","kind":"Trust / foundation","description":"Independent public-law foundation created by Bavarian law on 9 March 1923 to settle the former royal family's property claims. It holds about 12,000 ha of forest, Berg and Grünau castles, central Munich property and the Hirschgarten, and lends about 43,000 cultural objects to state museums. The Finance Ministry valued it at €348m (2016) and €444m (2018), excluding art; distributions of about €14m a year go to the heads of the family lines, and it is exempt from audit by the Bavarian Court of Audit.","start":1923,"geo":[48.158,11.503],"sources":[{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"},{"label":"WAF — Rechtliche Grundlagen (2023)","url":"https://www.waf-bayern.de/wp-content/uploads/2025/02/2023_WAF-Rechtliche-Grundlagen.pdf"}],"connections":[{"id":"house-of-wittelsbach","type":"trust","label":"income goes to the Wittelsbach lines"},{"id":"weimar-1919-expropriations","type":"political","label":"product of the post-1918 settlements"},{"id":"german-family-foundations","type":"legacy","label":"public-law cousin of German family foundations"}]},{"id":"g2-societe-des-bains-de-mer","name":"Société des Bains de Mer et du Cercle des Étrangers à Monaco (Monte-Carlo SBM)","type":"entity","kind":"Listed company","description":"Casino and hotel company founded in 1863 under a concession from Prince Charles III, with François Blanc as its driving force. The State of Monaco is the majority shareholder (about 59.7% after 2015), with LVMH and Galaxy Entertainment each taking 5% in 2015. It reported revenue of €768m for the year to 31 March 2025.","start":1863,"geo":[43.739,7.428],"sources":[{"label":"Monte-Carlo SBM — Annual results 2024/25","url":"https://www.montecarlosbm-corporate.com/wp-content/uploads/2025/05/20250528-communique-re-sultats-annuels_uk_v2.pdf"},{"label":"Wikipedia — Monte Carlo Casino","url":"https://en.wikipedia.org/wiki/Monte_Carlo_Casino"},{"label":"Journal du Luxe — LVMH obtient 5% du capital de la SBM","url":"https://www.journalduluxe.fr/fr/business/lvmh-obtient-5-du-capital-de-la-societe-des-bains-de-mer"}],"connections":[{"id":"house-of-grimaldi-monaco","type":"charter","label":"concession granted by Charles III (1863)"}]},{"id":"g2-reichspost","name":"Imperial Post (Kaiserliche Reichspost) and Thurn-und-Taxis Post","type":"entity","kind":"Law / charter / tax","description":"Postal monopoly of the Holy Roman Empire, run by the Taxis family from the 1490s and held as a hereditary imperial fief from 1615 until the Empire's end in 1806. The family's Thurn-und-Taxis Post continued in many German states and was sold to Prussia by a treaty of 28 January 1867 for three million thaler, effective 1 July 1867.","start":1615,"geo":[50.111,8.682],"sources":[{"label":"Wikipedia — Thurn-und-Taxis Post","url":"https://en.wikipedia.org/wiki/Thurn-und-Taxis_Post"},{"label":"Britannica — Thurn and Taxis postal system","url":"https://britannica.com/topic/Thurn-and-Taxis-postal-system"},{"label":"Deutsche Biographie — Maximilian Karl von Thurn und Taxis","url":"https://www.deutsche-biographie.de/sfz82246.html"}],"connections":[{"id":"thurn-und-taxis-family","type":"charter","label":"hereditary postal monopoly"},{"id":"holy-roman-empire","type":"charter","label":"imperial fief"},{"id":"house-of-hohenzollern","type":"trade","label":"sold to Prussia 1867"}]},{"id":"holy-roman-empire","name":"Holy Roman Empire","type":"entity","kind":"State / empire","description":"The elective empire of Central Europe whose emperors (Habsburgs almost continuously from 1438) granted the fiefs, titles and monopolies on which many princely fortunes rest: Bavaria to the Wittelsbachs (1180), Brandenburg to the Hohenzollerns (1415), the postal fief to the Taxis (1615) and prince
