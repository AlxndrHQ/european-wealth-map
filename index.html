"cavendish-bentinck-portland","type":"inheritance","label":"the Portland Estate before 1879"}]},{"id":"montagu-douglas-scott-buccleuch","name":"Montagu Douglas Scott family (Dukes of Buccleuch and Queensberry)","category":"Landed Aristocracy & Gentry","role":"Agricultural Land & Enclosure","moneySources":["Scottish Border lordship","Royal (Stuart) connection","Marriage to heiress","Coal and minerals","Forestry and renewables"],"nation":"Scotland","scale":"Major","scaleBasis":"documented","scaleNote":"Bateman (1883) recorded 460,108 acres for the 5th Duke; Buccleuch still farms c. 159,000 acres across four estates, and Buccleuch Estates Ltd reported net assets of £182.9m (Oct 2024).","start":1663,"end":null,"lifespan":"Scotts of Buccleuch from the medieval Borders; dukedom 1663–present","base":"Bowhill, Selkirk (also Drumlanrig, Dumfriesshire, and Boughton, Northamptonshire)","geo":[55.548,-2.919],"aliases":["Buccleuch Estates Ltd","Buccleuch Group","MDS Group Investments","Dukes of Queensberry","Dukes of Montagu"],"origins":"The Scotts of Buccleuch were Border lairds who accumulated Teviotdale and Ettrick lands. In 1663 the heiress Anne Scott, Countess of Buccleuch, married James, Duke of Monmouth, Charles II's eldest illegitimate son, and the couple were created Duke and Duchess of Buccleuch.","role_summary":"An accumulation by inheritance: the 3rd Duke's 1767 marriage to Lady Elizabeth Montagu brought Boughton and the Montagu estates, and in 1810 he inherited the Queensberry dukedom with Drumlanrig. By 1883 the 5th Duke held 460,108 acres. Income came from farm rents, forestry, coal and minerals; in the 21st century the group has sold land (c. 25,000 acres around Langholm) and turned to commercial property, renewables and development.","roleDetail":[{"t":"1663: the Monmouth marriage.","d":"The Buccleuch heiress married Charles II's son; the dukedom survived Monmouth's execution in 1685.","basis":"documented"},{"t":"1767: the Montagu inheritance.","d":"Henry, 3rd Duke, married Elizabeth Montagu, granddaughter and heir of the 2nd Duke of Montagu, bringing Boughton House and English estates.","basis":"documented"},{"t":"1810: Queensberry.","d":"The 3rd Duke inherited the Queensberry dukedom and Drumlanrig.","basis":"documented"},{"t":"Coal to wind.","d":"In 2022 the group sold its pumped-storage hydro and wind projects at the former Glenmuckloch opencast coal mine to a developer (Buccleuch results 2022).","basis":"documented"},{"t":"Land sales and long debt.","d":"In 2021 Buccleuch issued an unsecured private placement with a blended maturity of c. 32 years at a fixed cost.","basis":"documented"}],"legacy":"Buccleuch Estates Ltd (Scotland, SC012615) is owned by MDS Group Investments Ltd, whose parent the group names as MDS Estates Ltd; it runs farming, forestry, commercial property and renewables across four estates. Boughton House is open to the public.","legacyDetail":[{"t":"Workforce and scale.","d":"494 employees across the group (2022); c. 159,000 acres actively farmed; c. 24,250 acres of woodland.","basis":"documented"}],"norman":{"claim":"none","text":"The Scotts of Buccleuch are a Scottish Border family; no descent from a 1066 companion or Domesday tenant is documented. The English Montagu inheritance came in by marriage in 1767.","source":{"label":"Wikipedia — Duke of Buccleuch","url":"https://en.wikipedia.org/wiki/Duke_of_Buccleuch"}},"wealth":{"published":[],"publishedNote":"No 2026 Sunday Times Rich List figure for the Duke of Buccleuch was found in reported coverage of the list.","grossAssets":{"text":"Buccleuch Estates Ltd: net assets £182.9m for the year to October 2024 (Endole summary of filed accounts). The wider group reported a net asset value rising from £304m to £314m in its 2022 results. Land is generally carried at historic cost or below market value in such accounts.","source":{"label":"Endole — Buccleuch Estates Ltd (SC012615)","url":"https://open.endole.co.uk/insight/company/SC012615-buccleuch-estates-ltd-the"}},"controlled":{"text":"Buccleuch actively farms c. 159,000 acres across four estates and leases land to wind-farm companies (charges in favour of Glensalloch Wind Farm Ltd and Teviot WF Ltd are registered at Companies House).","source":{"label":"Daily Record / Insider — Buccleuch reports significant 2022 profit","url":"https://www.insider.co.uk/news/buccleuch-reports-significant-2022-profit-29817377"}},"opaque":{"verdict":"documented","text":"The holding chain above MDS Group Investments Ltd and the family trusts are not described in the material opened. ICIJ's Paradise Papers (Appleby data) list 'The Buccleuch Estates Limited', at the Bowhill head-office address, as a shareholder of Kirkhope Holdings Ltd, a Cayman Islands company incorporated in 1987 (Appleby data current to 2014); the size and purpose of the holding are not stated. Being listed in ICIJ data does not imply wrongdoing.","searched":"Companies House PSC (Buccleuch Estates Ltd SC012615); ICIJ Offshore Leaks database (reconciliation API, Nov 2026; node pages for Kirkhope Holdings Ltd and The Buccleuch Estates Limited, listed at the Bowhill head-office address; no press report of the link was found); Buccleuch results releases.","source":{"label":"ICIJ Offshore Leaks — Kirkhope Holdings Ltd (Paradise Papers)","url":"https://offshoreleaks.icij.org/nodes/82012736"}},"gapNote":"With no current Rich List figure and a balance sheet of a few hundred million pounds, Buccleuch looks smaller on paper than its reach: it remains one of Britain's largest private landowners, and accounts that carry land at book value are likely to understate its market value."},"holdingsToday":[{"name":"Buccleuch estates (Bowhill, Drumlanrig, Dalkeith, Boughton)","kind":"Rural land","sector":"Farming & estates","where":"Southern Scotland and Northamptonshire","detail":"c. 159,000 acres actively farmed across four estates.","basis":"documented","source":{"label":"Insider — Buccleuch reports significant 2022 profit","url":"ht  and 12th Duke of Queensberry, heads the family; the businesses are run through Buccleuch Estates Ltd and related companies. The group has sold outlying land and moved into property and renewables.","today_people":[{"name":"Richard Scott, 10th Duke of Buccleuch","relation":"titleholder","role":"Head of the family behind the Buccleuch Group","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Richard Scott, 10th Duke of Buccleuch","url":"https://en.wikipedia.org/wiki/Richard_Scott,_10th_Duke_of_Buccleuch"}}],"sources":[{"label":"Buccleuch — Annual results to 31 October 2022","url":"https://www.buccleuch.com/buccleuch-publishes-annual-results-to-31st-october-2022/"},{"label":"Companies House — Buccleuch Estates Ltd PSC","url":"https://find-and-update.company-information.service.gov.uk/company/SC012615/persons-with-significant-control"},{"label":"Endole — Buccleuch Estates Ltd","url":"https://open.endole.co.uk/insight/company/SC012615-buccleuch-estates-ltd-the"},{"label":"ICIJ Offshore Leaks — Kirkhope Holdings Ltd","url":"https://offshoreleaks.icij.org/nodes/82012736"},{"label":"Wikipedia — Duke of Buccleuch","url":"https://en.wikipedia.org/wiki/Duke_of_Buccleuch"}],"connections":[{"id":"british-crown-estate-duchies","type":"family","label":"descended from Charles II through Monmouth"},{"id":"percy-family-northumberland","type":"family","label":"20th-century Percy–Buccleuch marriage"},{"id":"cayman-islands","type":"offshore","label":"shareholder of Kirkhope Holdings Ltd (Paradise Papers)"},{"id":"paradise-papers","type":"offshore","label":"Appleby data lists the estate company"},{"id":"who-owns-england","type":"legacy","label":"among Britain's largest private landowners"},{"id":"death-duties-inheritance-tax","type":"trust","label":"agricultural and business reliefs on farmland and forestry"}]},{"id":"percy-family-northumberland","name":"Percy family (Dukes of Northumberland)","category":"Landed Aristocracy & Gentry","role":"Conquest & Royal Grant","moneySources":["Norman grant","Marriage to heiress","Purchase (Alnwick, 1309)","Dissolution grant (Syon)","Commercial property"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"Sunday Times Rich List 2026: the Duke of Northumberland and family £544m (252nd); Bateman (1883) recorded 186,397 acres.","start":1086,"end":null,"lifespan":"1086 (William de Percy in Domesday) – present; Alnwick from 1309","base":"Alnwick Castle, Northumberland","geo":[55.416,-1.706],"aliases":["Northumberland Estates","House of Percy","Smithson Percy","Earls of Beverley"],"origins":"William de Percy, a Norman who came over after 1066, appears in Domesday as tenant-in-chief of 141 places, mostly in Yorkshire and Lincolnshire. The line passed twice through heiresses (Agnes de Percy and Jocelin of Louvain in the 12th century; Lady Elizabeth Seymour and Hugh Smithson in the 18th), and Henry de Percy bought Alnwick in 1309.","role_summary":"A Norman grant enlarged by purchase, war and office on the Scottish border, then refounded by marriage: Hugh Smithson took the Percy name and was made Duke of Northumberland in 1766. Syon, a dissolved Bridgettine abbey, has been a Percy house since 1594. Today the money is in Northumberland Estates, whose primary focus is commercial property in the North East, plus farms, forestry and Alnwick's tourism.","roleDetail":[{"t":"Domesday tenant-in-chief.","d":"Open Domesday lists William de Percy as tenant-in-chief of 141 places and lord of 111 in 1086.","basis":"documented"},{"t":"1309: Alnwick bought.","d":"Henry de Percy bought Alnwick Castle; the family became Earls of Northumberland in 1377.","basis":"documented"},{"t":"1766: the Smithson dukedom.","d":"After the male line failed in 1670, the heiress's husband Hugh Smithson took the name Percy and was created duke.","basis":"documented"},{"t":"From rents to commercial property.","d":"Northumberland Estates now describes commercial property as its primary focus, including a c. £10m purchase at Wynyard Business Park.","basis":"documented"}],"legacy":"Northumberland Estates, based at Alnwick Castle, manages the family's land and property: c. 80,000–100,000 acres in Northumberland and the Borders, commercial property, Alnwick Castle and Syon Park in west London. A plan to build flats at Syon was refused in 2021 after more than 900 objections.","legacyDetail":[{"t":"Syon development fight.","d":"Hounslow refused the estate's application in October 2021; the estate appealed, saying the income would fund Syon House's upkeep.","basis":"documented"}],"norman":{"claim":"documented","text":"William de Percy is a documented Domesday tenant-in-chief (Open Domesday). Today's dukes descend from him only through heiresses: the Louvain Percys in the 12th century and the Smithsons from 1750, so the descent is documented in the female line, not the male line.","source":{"label":"Open Domesday — William of Percy","url":"https://opendomesday.org/name/william-of-percy/"}},"wealth":{"published":[{"figure":"£544m","usd":"c. $0.72bn","who":"The Duke of Northumberland and family","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"252nd","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"grossAssets":{"text":"No consolidated public accounts for the estates were located in this research; Northumberland Estates is described as a multi-faceted business with a predominantly UK, North East-centred commercial property portfolio.","source":{"label":"Northumberland Estates — Property development","url":"https://northumberlandestates.co.uk/?p=5957"}},"controlled":{"text":"Management of c. 100,000 acres including 20,000 of farmland (press estimate), plus Alnwick Castle and Syon Park as visitor businesses.","source":{"label":"NationalWorld — Allotment wars: public inquiry over Syon Park","url":"https://www.nationalworld.com/news/uk/allotment-wars-public-inquiry-britains-richest-men-seeks-bulldoze-garden-apartments-4240526"}},"opaque":{"verdict":"none found","text":"The estates' trust and ownership structure is not set out in the sources opened; no offshore vehicle was found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Northumberland Estates, Duke of Northumberland; queries: Percy, Ralph Percy, 12th Duke of Northumberland): name matches only, none shown to be this family or its vehicles; manual check: only unrelated place-name addresses; Northumberland Estates website.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}},"gapNote":"The £544m figure values an estate whose land is largely rural; without filed group accounts it cannot be checked, and the estate's commercial property arm and Syon's development value may move it more than farm rents."},"holdingsToday":[{"name":"Northumberland Estates (land and farms)","kind":"Rural land","sector":"Farming, forestry","where":"Northumberland and Scottish Borders","detail":"c. 80,000–100,000 acres reported; 20,000 acres of farmland.","basis":"documented","source":{"label":"NationalWorld — Syon Park inquiry","url":"https://www.nationalworld.com/news/uk/allotment-wars-public-inquiry-britains-richest-men-seeks-bulldoze-garden-apartments-4240526"}},{"name":"Northumberland Estates commercial property","kind":"Urban property","sector":"Real estate","where":"North East England","detail":"Primary focus of the business; c. £10m purchase at Wynyard Business Park.","basis":"documented","source":{"label":"Northumberland Estates — Commercial property","url":"https://northumberlandestates.co.uk/?p=6119"}},{"name":"Alnwick Castle","kind":"Art & collections","sector":"Heritage & tourism","where":"Alnwick","detail":"Family seat and visitor attraction.","basis":"documented","source":{"label":"Wikipedia — Duke of Northumberland","url":"https://en.wikipedia.org/wiki/Duke_of_Northumberland"}},{"name":"Syon House and Park","kind":"Urban property","sector":"Heritage & development land","where":"Brentford, west London","detail":"Former Bridgettine abbey; flats plan refused 2021.","basis":"documented","source":{"label":"NationalWorld — Syon Park inquiry","url":"https://www.nationalworld.com/news/uk/allotment-wars-public-inquiry-britains-richest-men-seeks-bulldoze-garden-apartments-4240526"}}],"slaveSiteId":"percy-family-northumberland","lineage":[{"name":"William de Percy","relation":"founder","years":"d. 1096","note":"Domesday tenant-in-chief in Yorkshire and Lincolnshire.","basis":"documented"},{"name":"Agnes de Percy & Jocelin of Louvain","relation":"heiress / spouse","years":"12th c.","note":"Jocelin took the Percy name; the inheritance passed to their line.","basis":"documented"},{"name":"Henry de Percy","relation":"descendant","years":"fl. 1309","note":"Bought Alnwick Castle.","basis":"documented"},{"name":"Hugh Smithson Percy, 1st Duke of Northumberland","relation":"spouse of heiress","years":"1714–1786","note":"Married Lady Elizabeth Seymour; created duke 1766.","basis":"documented"},{"name":"Ralph Percy, 12th Duke of Northumberland","relation":"heir","years":"b. 1956","note":"Duke since 1995; owns Northumberland Estates.","basis":"documented"}],"today":"Ralph Percy, 12th Duke of Northumberland, owns Alnwick Castle, Syon House and Northumberland Estates.","today_people":[{"name":"Ralph Percy, 12th Duke of Northumberland","relation":"titleholder","role":"Owner of Northumberland Estates","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Ralph Percy, 12th Duke of Northumberland","url":"https://en.wikipedia.org/wiki/Ralph_Percy,_12th_Duke_of_Northumberland"}}],"sources":[{"label":"Open Domesday — William of Percy","url":"https://opendomesday.org/name/william-of-percy/"},{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"},{"label":"Northumberland Estates — Commercial property","url":"https://northumberlandestates.co.uk/?p=6119"},{"label":"NationalWorld — Allotment wars at Syon Park","url":"https://www.nationalworld.com/news/uk/allotment-wars-public-inquiry-britains-richest-men-seeks-bulldoze-garden-apartments-4240526"},{"label":"Wikipedia — Duke of Northumberland","url":"https://en.wikipedia.org/wiki/Duke_of_Northumberland"}],"connections":[{"id":"domesday-book","type":"enclosure-or-grant","label":"William de Percy tenant-in-chief in 1086"},{"id":"william-the-conqueror","type":"enclosure-or-grant","label":"Percy lands granted after the Conquest"},{"id":"dissolution-of-the-monasteries","type":"dissolution-grant","label":"Syon Abbey site, a Percy house from 1594"},{"id":"montagu-douglas-scott-buccleuch","type":"family","label":"20th-century Percy–Buccleuch marriage"},{"id":"who-owns-england","type":"legacy","label":"among England's largest aristocratic landowners"}]},{"id":"cavendish-family-devonshire","name":"Cavendish family (Dukes of Devonshire)","category":"Landed Aristocracy & Gentry","role":"Church Land & Dissolution","moneySources":["Dissolution grant","Marriage to heiress","Lead and mineral royalties","Urban ground rents (Eastbourne)","Tourism and art"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"Sunday Times Rich List 2026: the Duke of Devonshire £915m (172nd); the Devonshire Group estates cover c. 65,000 acres.","start":1540,"end":null,"lifespan":"c. 1540–present (Chatsworth from 1549)","base":"Chatsworth House, Derbyshire","geo":[53.228,-1.611],"aliases":["Devonshire Group","Trustees of the Chatsworth Settlement","Chatsworth House Trust","Bolton Abbey estate","Lismore Castle"],"origins":"Sir William Cavendish was one of Henry VIII's commissioners for the Dissolution of the Monasteries and acquired monastic property; in 1547 he married Bess of Hardwick and in 1549 bought Chatsworth. Their son became 1st Earl of Devonshire (1618) and the 4th Earl was made duke in 1694.","role_summary":"Office in the Dissolution provided the first capital; Bess of Hardwick's four marriages multiplied it. Later marriages brought Bolton Abbey (another dissolved priory), Lismore in Ireland and Eastbourne, which the 7th Duke developed as a resort on leasehold. The 10th Duke's death in 1950 brought death duties at 80% (reported at £7m), paid partly by handing Hardwick Hall to the Treasury, and the estate has since rebuilt itself on tourism, events and property.","roleDetail":[{"t":"Dissolution commissioner.","d":"Sir William Cavendish served as a commissioner in the Dissolution and acquired former monastic land before buying Chatsworth in 1549.","basis":"documented"},{"t":"Bess of Hardwick's fortune.","d":"Bess outlived four husbands and accumulated estates that founded both the Devonshire and Newcastle lines.","basis":"documented"},{"t":"Eastbourne and Bolton Abbey.","d":"Marriage inheritances added the Yorkshire Bolton Abbey estate and Eastbourne, which the dukes developed as a resort.","basis":"interpretive"},{"t":"1950 death duties.","d":"The 10th Duke died in 1950 shortly before a planned transfer took effect; duties at 80% were reported at £7m and Hardwick Hall was accepted by the Treasury in part payment, passing to the National Trust in 1959.","basis":"documented"}],"legacy":"'The Devonshire Group' is a business name for the Trustees of the Chatsworth Settlement, an unincorporated trust, not a company; it runs Chatsworth, Bolton Abbey, the Compton Estate in Eastbourne, Lismore and farms. Chatsworth House itself and much of its collection are run by the Chatsworth House Trust, a separate charity.","legacyDetail":[{"t":"Colonialism research.","d":"With the family's support, the Chatsworth House Trust is researching Chatsworth's links to transatlantic slavery and empire with the Universities of Derby and Oxford.","basis":"documented"}],"norman":{"claim":"none","text":"No Norman or Domesday descent is claimed in the sources used; the documented fortune begins with Sir William Cavendish (c. 1505–1557), a Tudor official.","source":{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}},"wealth":{"published":[{"figure":"£915m","usd":"c. $1.2bn","who":"The Duke of Devonshire","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"172nd","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"grossAssets":{"text":"No balance sheet is public: the Chatsworth Settlement is an unincorporated trust, and 'the Devonshire Group is not a legal entity' (accounts of a related charity, 2024). The charities' accounts (Chatsworth House Trust; Duke of Devonshire's Charitable Trust) are public but cover only the charitable assets.","source":{"label":"OpenCharities — related charity accounts to 31 March 2024 (Devonshire Group described)","url":"https://opencharities.uk/ew/511149/files/2024-03-31-accounts.md"}},"controlled":{"text":"The Chatsworth House Trust, a charity, runs the house and holds or manages much of the art collection, which the family governs but does not own outright; the estates total c. 65,000 acres (Devonshire Group).","source":{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}},"opaque":{"verdict":"reported","text":"The settlement's assets, including the part of the Devonshire Collection not held by the charity, are not valued publicly. No offshore vehicle was found.","searched":"Devonshire Group website; OpenCharities accounts; ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Chatsworth Settlement, Devonshire Group; queries: Cavendish, Peregrine Cavendish, 12th Duke of Devonshire, Trustees of the Chatsworth Settlement): name matches only, none shown to be this family or its vehicles; manual check: only unrelated addresses.","source":{"label":"Devonshire Group — Colonialism research","url":"https://devonshiregroup.co.uk/information/colonialism-research/"}},"gapNote":"The £915m figure attaches to the Duke personally, but the land sits in the Chatsworth Settlement and the house and much of the art in a charity; much of the family's reach, including one of Britain's great private art collections, is therefore governed rather than owned, and its market value is not published."},"holdingsToday":[{"name":"Chatsworth estate","kind":"Rural land","sector":"Farming, forestry, tourism","where":"Derbyshire","detail":"c. 35,000 acres; house run by the Chatsworth House Trust.","basis":"documented","source":{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}},{"name":"Bolton Abbey estate","kind":"Rural land","sector":"Farming, tourism, grouse moors","where":"North Yorkshire","detail":"c. 28,000–30,000 acres around the ruined priory.","basis":"documented","source":{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}},{"name":"Compton Estate, Eastbourne","kind":"Urban property","sector":"Real estate","where":"Eastbourne, East Sussex","detail":"The dukes' resort-town holdings.","basis":"documented","source":{"label":"Devonshire Group — The Devonshire Group","url":"https://devonshiregroup.co.uk/?p=6028"}},{"name":"Lismore Castle and estate","kind":"Rural land","sector":"Estates & hospitality","where":"Co. Waterford, Ireland","detail":"c. 7,700 acres; castle let as luxury accommodation.","basis":"documented","source":{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}},{"name":"Devonshire Collection (via Chatsworth House Trust)","kind":"Art & collections","sector":"Art","where":"Chatsworth","detail":"Old Master paintings, drawings, sculpture and library; charitable trust.","basis":"documented","source":{"label":"Chatsworth House Trust — Annual Review 2022","url":"https://Www.chatsworth.org/media/afubsjl4/chatsworth_house_trust_annual_review_2022.pdf"}},{"name":"Trustees of the Chatsworth Settlement","kind":"Trust","sector":"Family wealth","where":"England","detail":"Unincorporated settlement trading as the Devonshire Group.","basis":"documented","source":{"label":"OpenCharities — 2024 accounts","url":"https://opencharities.uk/ew/511149/files/2024-03-31-accounts.md"}}],"slaveSiteId":"cavendish-family-devonshire","lineage":[{"name":"Sir William Cavendish & Bess of Hardwick","relation":"founders","years":"m. 1547","note":"Dissolution commissioner; bought Chatsworth 1549.","basis":"documented"},{"name":"William Cavendish, 1st Earl of Devonshire","relation":"son","years":"1551–1626","note":"Inherited Chatsworth; invested in the East India and Somers Island companies.","basis":"documented"},{"name":"William Cavendish, 1st Duke of Devonshire","relation":"descendant","years":"1640–1707","note":"Created duke 1694; rebuilt Chatsworth.","basis":"documented"},{"name":"Edward Cavendish, 10th Duke","relation":"descendant","years":"1895–1950","note":"Death in 1950 triggered 80% duties; Hardwick ceded.","basis":"documented"},{"name":"Peregrine Cavendish, 12th Duke of Devonshire","relation":"heir","years":"b. 1944","note":"Present duke; Chatsworth Settlement beneficiary family.","basis":"documented"}],"today":"Peregrine Cavendish, 12th Duke of Devonshire, and his family live at Chatsworth. The estates trade as the Devonshire Group on behalf of the Chatsworth Settlement trustees.","today_people":[{"name":"Peregrine Cavendish, 12th Duke of Devonshire","relation":"titleholder","role":"Head of the family; Chatsworth","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Peregrine Cavendish, 12th Duke of Devonshire","url":"https://en.wikipedia.org/wiki/Peregrine_Cavendish,_12th_Duke_of_Devonshire"}}],"sources":[{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"},{"label":"OpenCharities — related charity accounts 2024 (Devonshire Group not a legal entity)","url":"https://opencharities.uk/ew/511149/files/2024-03-31-accounts.md"},{"label":"House and Heritage — How Chatsworth's treasures were cared for","url":"https://houseandheritage.org/2018/05/13/chatsworth-house/"},{"label":"National Trust Collections — Hardwick Hall (accepted in lieu)","url":"https://www.nationaltrustcollections.org.uk/object/1129096"},{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"connections":[{"id":"dissolution-of-the-monasteries","type":"dissolution-grant","label":"Sir William Cavendish, Dissolution commissioner"},{"id":"death-duties-inheritance-tax","type":"inheritance","label":"1950 duties; Hardwick Hall ceded in lieu"},{"id":"cavendish-bentinck-portland","type":"family","label":"Cavendish blood in the Portland line"},{"id":"east-india-company","type":"finance","label":"1st Earl invested (NT 2020)"},{"id":"who-owns-england","type":"legacy","label":"great aristocratic landowner"}]},{"id":"russell-family-bedford","name":"Russell family (Dukes of Bedford)","category":"Landed Aristocracy & Gentry","role":"Church Land & Dissolution","moneySources":["Dissolution grant","Marriage to heiress","Urban ground rents","Tourism (Woburn)"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"Sunday Times Rich List 2026: the Duke of Bedford £882m (181st).","start":1539,"end":null,"lifespan":"1539–present","base":"Woburn Abbey, Bedfordshire","geo":[51.987,-0.588],"aliases":["Bedford Estates","Bloomsbury estate","Woburn Abbey"],"origins":"John Russell, a Dorset-born courtier of Henry VII and Henry VIII, received Tavistock Abbey (1539), Woburn Abbey (1547) and the 'convent garden' of Westminster Abbey, Covent Garden (1552), and was made Earl of Bedford in 1550.","role_summary":"The Russells are the textbook Dissolution fortune: three monastic estates granted in 13 years. Bloomsbury came by the 1669 marriage of William, Lord Russell, to Rachel Wriothesley, whose family had acquired it at the Dissolution in 1545. Both London estates were developed on building leases (Covent Garden piazza 1630s; Bedford, Russell and Tavistock Squares c. 1775–1830); Covent Garden was sold in 1914–18 to Sir Thomas Beecham, and Bloomsbury has shrunk from 112 to c. 20 acres.","roleDetail":[{"t":"Three monastic grants.","d":"Tavistock (1539), Woburn (1547) and Covent Garden (1552) were granted to John Russell.","basis":"documented"},{"t":"Bloomsbury by marriage.","d":"Thomas Wriothesley, later Earl of Southampton, acquired Bloomsbury at the Dissolution (1545); his heiress Rachel married Lord Russell in 1669.","basis":"documented"},{"t":"Selling before the death-duty era.","d":"The 11th Duke began selling estates after 1893; the Covent Garden sale was contracted in 1914 and completed with Beecham in 1918.","basis":"documented"},{"t":"Bloomsbury shrinks.","d":"20th-century sales reduced the Bloomsbury holding from 112 acres to c. 20 (UCL Bloomsbury Project, citing the Survey of London).","basis":"documented"}],"legacy":"The Bedford Estates, managed from the Bedford Office in Montague Street, own Woburn Abbey and its park and c. 20 acres of Bloomsbury including Bedford Square and Russell Square frontages; Woburn's leisure businesses include the safari park.","legacyDetail":[{"t":"Largest private landowner in Bloomsbury.","d":"UCL's Bloomsbury Project describes the Bedford Estates as the largest private landowner in Bloomsbury.","basis":"documented"}],"norman":{"claim":"none","text":"No Norman or Domesday descent is documented; the fortune begins with John Russell (c. 1485–1555), a Tudor courtier.","source":{"label":"Wikipedia — Andrew Russell, 15th Duke of Bedford","url":"https://en.wikipedia.org/wiki/Andrew_Russell,_15th_Duke_of_Bedford"}},"wealth":{"published":[{"figure":"£882m","usd":"c. $1.2bn","who":"The Duke of Bedford","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"181st","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"grossAssets":{"text":"No consolidated public accounts for the Bedford Estates were found in this research; the London and Woburn holdings are understood to be held in family trusts.","source":{"label":"Wikipedia — Bedford Estate","url":"https://en.wikipedia.org/wiki/Bedford_Estate"}},"controlled":{"text":"Freeholds of c. 20 acres in Bloomsbury, including Georgian squares let to universities, institutions and offices, plus the Woburn estate.","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},"opaque":{"verdict":"none found","text":"Trust terms and values are not public; no offshore vehicle was found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Bedford Estates, Duke of Bedford; queries: Andrew Russell, 15th Duke of Bedford, Russell): no matches; manual check: only unrelated Bedford Street/Road addresses; Bedfordshire Archives.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}},"gapNote":"A smaller London estate than Grosvenor's or Cadogan's because the Russells sold Covent Garden and most of Bloomsbury early in the 20th century; the £882m figure cannot be checked against filed accounts."},"holdingsToday":[{"name":"Bedford Estates, Bloomsbury","kind":"Urban property","sector":"Real estate","where":"London WC1","detail":"c. 20 acres of the original 112, around Bedford Square and Russell Square.","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"name":"Woburn Abbey and estate","kind":"Rural land","sector":"Farming, tourism","where":"Bedfordshire","detail":"Former Cistercian abbey granted 1547; house, deer park and safari park.","basis":"documented","source":{"label":"Wikipedia — Andrew R gomery as a Norman grant of the Rape of Arundel.","role_summary":"A fortune built on royal favour and forfeiture, repeatedly lost and regained: the Howards were attainted several times, yet the 3rd Duke profited from the Dissolution and later marriages brought Arundel (1555) and, through Alethea Talbot (1606), the Sheffield estate, whose urban ground rents and minerals were major 19th-century income. As Catholics the dukes were excluded from most offices until 1829 but kept the hereditary office of Earl Marshal.","roleDetail":[{"t":"Arundel: a Norman grant inherited by marriage.","d":"William I granted Roger de Montgomery a fifth of Sussex (the Rape of Arundel) c. 1067; the castle passed via the d'Aubigny and Fitzalan earls to the Howards in 1555.","basis":"documented"},{"t":"Earl Marshal.","d":"The dukes hold the hereditary office of Earl Marshal and organised the 2023 coronation.","basis":"documented"},{"t":"Sheffield ground rents.","d":"The Talbot inheritance made the dukes major Sheffield landlords; much was later sold.","basis":"interpretive"}],"legacy":"The 18th Duke owns Arundel Castle and its estate; the 17th Duke created an independent charitable trust to secure the castle's future. A Schroder-family entry on the 2026 Rich List includes a relative by marriage, but that fortune is the Schroders stake, not the ducal estate.","legacyDetail":[{"t":"Castle in charitable trust.","d":"The 17th Duke placed Arundel Castle in an independent charitable trust (Wikipedia).","basis":"documented"}],"norman":{"claim":"interpretive","text":"Arundel Castle is a documented Norman foundation granted to Roger de Montgomery c. 1067, but the Howards are not his descendants in the male line; they inherited through the Fitzalan heiress in 1555, and the Fitzalans themselves arrived in England in the 12th century.","source":{"label":"Wikipedia — Arundel Castle","url":"https://en.wikipedia.org/wiki/Arundel_Castle"}},"wealth":{"published":[],"publishedNote":"No recent Rich List figure an the castle.","basis":"documented"},{"name":"John Howard, 1st Duke of Norfolk","relation":"founder","years":"c. 1425–1485","note":"Created duke 1483; killed at Bosworth.","basis":"documented"},{"name":"Thomas Howard, 4th Duke & Mary Fitzalan","relation":"spouse / heiress","years":"m. 1555","note":"Brought Arundel Castle and earldom.","basis":"documented"},{"name":"Miles Fitzalan-Howard, 17th Duke","relation":"descendant","years":"1915–2002","note":"Put the castle into a charitable trust.","basis":"documented"},{"name":"Edward Fitzalan-Howard, 18th Duke of Norfolk","relation":"heir","years":"b. 1956","note":"Earl Marshal; organised the 2023 coronation.","basis":"documented"}],"today":"Edward Fitzalan-Howard, 18th Duke of Norfolk, is Earl Marshal and lives at Arundel. The family remains England's senior Catholic ducal house.","today_people":[{"name":"Edward Fitzalan-Howard, 18th Duke of Norfolk","relation":"titleholder","role":"Earl Marshal","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"Wikipedia — Duke of Norfolk","url":"https://en.wikipedia.org/wiki/Duke_of_Norfolk"}}],"sources":[{"label":"Wikipedia — Arundel Castle","url":"https://en.wikipedia.org/wiki/Arundel_Castle"},{"label":"Wikipedia — Duke of Norfolk","url":"https://en.wikipedia.org/wiki/Duke_of_Norfolk"},{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"},{"label":"UCL LBS — John Hubert Washington Hibbert","url":"https://lbs.ucl.ac.uk/lbs/person/view/17795"}],"connections":[{"id":"william-the-conqueror","type":"enclosure-or-grant","label":"Rape of Arundel granted to Roger de Montgomery c. 1067"},{"id":"dissolution-of-the-monasteries","type":"dissolution-grant","label":"3rd Duke received monastic property"},{"id":"british-crown-estate-duchies","type":"charter","label":"hereditary Earl Marshal"},{"id":"schroder-family","type":"family","label":"relative by marriage co-listed with the Schroder family (Rich List 2026)"},{"id":"stanley-family-derby","type":"political","label":"rival northern magnates at Bosworth (1485)"}]},{"id":"stanley-family-derby","name":"Stanley family (Earls of Derby)","category":"Landed Aristocracy & Gentry","role":"Agricultural Land & Enclosure","moneySources":["Marriage to heiress","Royal grant after Bosworth","Lancashire rents","Tourism (Knowsley Safari)"],"nation":"England","scale":"Significant","scaleBasis":"estimated","scaleNote":"No recent Rich List figure; the family keeps Knowsley Hall with c. 2,500 acres of walled parkland and Knowsley Safari (founded 1971).","start":1385,"end":null,"lifespan":"1385–present","base":"Knowsley Hall, near Liverpool","geo":[53.438,-2.836],"aliases":["Earls of Derby","Knowsley Estate","Knowsley Safari"],"origins":"Sir John Stanley gained Knowsley and Lathom by marrying the heiress Isabel Lathom in 1385. Thomas Stanley's decisive switch at Bosworth in 1485 won him the earldom of Derby and forfeited Lancashire lands.","role_summary":"A marriage and a battle: the Lathom heiress brought the core Lancashire estates, and Bosworth brought the earldom and rewards from Henry VII, his stepson. For five centuries the Stanleys drew rents from south-west Lancashire as Liverpool grew around them; the 18th Earl opened Knowsley Safari in 1971 and the house now earns from events and weddings.","roleDetail":[{"t":"1385: the Lathom marriage.","d":"Isabel Lathom's inheritance brought Knowsley, then a hunting lodge on the Lathom estate.","basis":"documented"},{"t":"1485: Bosworth.","d":"Thomas Stanley, stepfather of Henry VII, was made Earl of Derby.","basis":"documented"},{"t":"1971: the safari park.","d":"The 18th Earl founded Knowsley Safari in the south-east of the park.","basis":"documented"}],"legacy":"Knowsley Hall and park remain the family's, with Knowsley Safari and the hall's events business. The 14th Earl, as Colonial Secretary, carried the 1833 Abolition Act with its £20m compensation to owners.","legacyDetail":[{"t":"Racing names.","d":"The Derby and the Oaks are named after the 12th Earl and his house.","basis":"documented"}],"norman":{"claim":"none","text":"No Domesday descent is documented in the sources used; the fortune's documented start is the 1385 Lathom marriage.","source":{"label":"Wikipedia — Knowsley Hall","url":"https://en.wikipedia.org/wiki/Knowsley_Hall"}},"wealth":{"published":[],"publishedNote":"No recent published Rich List figure for the Earl of Derby was found.","grossAssets":{"text":"No public consolidated accounts for the Knowsley estate were located.","source":{"label":"Wikipedia — Knowsley Hall","url":"https://en.wikipedia.org/wiki/Knowsley_Hall"}},"controlled":{"text":"c. 2,500 acres of walled parkland at Knowsley plus the safari park business.","source":{"label":"Wikipedia — Knowsley Hall","url":"https://en.wikipedia.org/wiki/Knowsley_Hall"}},"opaque":{"verdict":"none found","text":"No trust or offshore structure documented in sources opened. An ICIJ Panama Papers entity named 'Knowsley S.A.' has no shown connection to the family.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Knowsley, Earl of Derby; queries: Edward Stanley, 19th Earl of Derby, Knowsley Safari, Stanley): no matches; UCL LBS.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}}},"holdingsToday":[{"name":"Knowsley Hall and park","kind":"Rural land","sector":"Estates & events","where":"Merseyside","detail":"c. 2,500 acres of walled parkland; hall used for events and weddings.","basis":"documented","source":{"label":"Wikipedia — Knowsley Hall","url":"https://en.wikipedia.org/wiki/Knowsley_Hall"}},{"name":"Knowsley Safari","kind":"Private company","sector":"Leisure","where":"Prescot, Merseyside","detail":"Founded 1971 by the 18th Earl.","basis":"documented","source":{"label":"Wikipedia — Knowsley Hall","url":"https://en.wikipedia.org/wiki/Knowsley_Hall"}}],"slaveS Lancashire landowner"}]},{"id":"william-the-conqueror","name":"William I and the Norman Conquest","category":"Crown & Church","role":"Conquest & Royal Grant","moneySources":["Conquest","Forfeiture of English landholders","Royal demesne","Geld (land tax)"],"nation":"England","scale":"Dominant","scaleBasis":"estimated","scaleNote":"Historians' estimates put the king's own share of Domesday-recorded land at roughly 17–20% and the Church's at about a quarter, of a total recorded value of c. £73,000 a year.","start":1066,"end":1087,"lifespan":"c. 1028–1087 (King of England 1066–1087)","base":"Winchester (royal treasury) and London","geo":[51.063,-1.308],"aliases":["William the Conqueror","William the Bastard","Duke of Normandy"],"origins":"Duke of Normandy from 1035, William claimed the English throne after Edward the Confessor's death and defeated Harold II at Hastings on 14 October 1066. Within twenty years almost every major English landholder had been replaced.","role_summary":"The Conquest was the largest transfer of land in English history. William treated all land as held from the Crown: he kept a large royal demesne and granted the rest as fiefs to some 200 Norman barons and to churches, who sub-let to knights in return for military service. The Domesday survey of 1086 recorded who held what and what it was worth, so the Crown could tax and call on it.","roleDetail":[{"t":"1066: forfeiture.","d":"Lands of English lords killed at Hastings or in later revolts were declared forfeit and regranted to William's followers.","basis":"documented"},{"t":"Tenure from the Crown.","d":"Tenants-in-chief (roughly 1,400 people, mostly Normans, plus churches) held directly from the king; Open Domesday records them by name.","basis":"documented"},{"t":"The king's share.","d":"Estimates of the royal demesne range from about 17% to 20% of recorded land; English holders retained only a few per cent by 1086.","basis":"interpretive"},{"t":"1086: Domesday.","d":"The survey listed 13,418 places, their holders in 1066 and 1086, resources and annual value.","basis":"documented"}],"legacy":"Feudal tenure from the Crown is still the legal basis of English land law (all land is held of the Crown). Families such as the Percys, and institutions such as the Crown Estate and the Church, trace some holdings to the Conquest settlement, though most surviving great estates were made later, by Dissolution grants, marriages and urban development.","legacyDetail":[{"t":"Continuity is rarer than claimed.","d":"Of the families in this project, only a few (Percy through heiresses; Shirley at Ettington; Berkeley, of English descent) can document a line back to 1086.","basis":"interpretive"}],"norman":{"claim":"documented","text":"William I is the Conquest itself; his grants are recorded in Domesday Book (1086).","source":{"label":"The National Archives — Domesday Book (education resource)","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"}},"wealth":{"published":[],"publishedNote":"No modern valuation exists; Domesday's recorded annual values total about £73,000.","grossAssets":{"text":"Domesday Book's recorded annual values total c. £73,000; the royal demesne is commonly estimated at about a fifth of the total.","source":{"label":"domesdaybook.co.uk — Life in 1086","url":"https://mail.domesdaybook.co.uk/life.html"}},"controlled":{"text":"As overlord of all land, the king controlled reliefs, wardships, escheats and forfeitures on every fief, which is a reach far beyond his own demesne.","source":{"label":"World History Encyclopedia — Domesday Book","url":"https://www.worldhistory.org/Domesday_Book/"}},"opaque":{"verdict":"none found","text":"Not applicable to a medieval ruler.","searched":"Not applicable; ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: William I Norman Conquest): no matches","source":{"label":"Open Domesday","url":"https://opendomesday.org/place/SE6052/york/"}}},"holdingsToday":[{"name":"The Crown Estate (descendant of the royal demesne)","kind":"Other","sector":"Real estate & seabed","where":"England, Wales, Northern Ireland","detail":"Hereditary Crown lands surrendered to Parliament in 1760; net asset value £16.7bn (2026).","basis":"interpretive","source":{"label":"GOV.UK — Crown Estate annual report 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"}},{"name":"Feudal tenure in English land law","kind":"Other","sector":"Law","where":"England","detail":"All land is held of the Crown; unclaimed land passes to the Crown or the duchies as bona vacantia or escheat.","basis":"interpretive","source":{"label":"World History Encyclopedia — Domesday Book","url":"https://www.worldhistory.org/Domesday_Book/"}},{"name":"Domesday Book (The National Archives)","kind":"Other","sector":"Records","where":"Kew","detail":"The original volumes are held at The National Archives.","basis":"documented","source":{"label":"The National Archives — Domesday Book","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"}}],"lineage":[{"name":"William I","relation":"founder","years":"c. 1028–1087","note":"Conquered England and redistributed its land.","basis":"documented"},{"name":"Henry I","relation":"son","years":"r. 1100–1135","note":"Kept the royal demesne and the feudal system.","basis":"documented"},{"name":"Henry II","relation":"great-grandson","years":"r. 1154–1189","note":"Granted Berkeley to Robert Fitzharding (c. 1153–54).","basis":"documented"},{"name":"King Charles III","relation":"descendant","years":"b. 1948","note":"Descends from William I through several female lines.","id":"british-crown-estate-duchies","basis":"documented"}],"today":"No living person; William's legacy is institutional, in Crown tenure and the Domesday record.","today_people":[],"sources":[{"label":"The National Archives — Domesday Book (education resource)","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"},{"label":"World History Encyclopedia — Domesday Book","url":"https://www.worldhistory.org/Domesday_Book/"},{"label":"Open Domesday — York (Land of King William)","url":"https://opendomesday.org/place/SE6052/york/"},{"label":"Wikipedia — Battle of Hastings","url":"https://en.wikipedia.org/wiki/Battle_of_Hastings"}],"connections":[{"id":"battle-of-hastings","type":"political","label":"won the throne at Hastings, 1066"},{"id":"domesday-book","type":"charter","label":"ordered the 1085–86 survey"},{"id":"british-crown-estate-duchies","type":"inheritance","label":"royal demesne passed to later kings"},{"id":"percy-family-northumberland","type":"enclosure-or-grant","label":"William de Percy enfeoffed in Yorkshire"},{"id":"fitzalan-howard-family-norfolk","type":"enclosure-or-grant","label":"Rape of Arundel granted to Roger de Montgomery"},{"id":"shirley-family-ferrers","type":"enclosure-or-grant","label":"Ettington held under Henry de Ferrers in 1086"},{"id":"church-of-england-commissioners","type":"enclosure-or-grant","label":"Norman bishops installed; Church held c. a quarter"},{"id":"grosvenor-family-westminster","type":"family","label":"claimed companion Gilbert le Grosveneur (tradition)"}]},{"id":"shirley-family-ferrers","name":"Shirley family (Earls Ferrers; Shirleys of Ettington)","category":"Landed Aristocracy & Gentry","role":"Conquest & Royal Grant","moneySources":["Domesday sub-tenancy","Feudal manors","Marriage to heiress","Peerage (1711)"],"nation":"England","scale":"Minor","scaleBasis":"estimated","scaleNote":"No published wealth figure; the significance is continuity: a documented presence at Ettington since 1086, among the longest in England.","start":1086,"end":null,"lifespan":"1086 (Saswalo at Ettington) – present","base":"Ettington, Warwickshire (Earls Ferrers now at Ditchingham Hall, Norfolk)","geo":[52.142,-1.597],"aliases":["Earls Ferrers","Shirley baronets of Staunton Harold","Shirley of Ettington"],"origins":"In 1086 Saswalo (Sewallis) held Lower Ettington in Warwickshire as a tenant of the Norman baron Henry de Ferrers. His descendants took the surname Shirley from their Derbyshire manor of Shirley, held by c. 1129, and stayed at Ettington.","role_summary":"A modest feudal fortune held for nine centuries rather than a great one made: manors held under the Ferrers honour, enlarged by marriage (Staunton Harold, Leicestershire), a baronetcy in 1611 and the earldom of Ferrers in 1711. The senior line's wealth was much reduced in the 20th century; the Ettington branch kept its Warwickshire seat, now Ettington Park hotel.","roleDetail":[{"t":"Domesday sub-tenant.","d":"The Victoria County History records that 'Saswalo' held Lower Ettington of Henry de Ferrers at the time of the survey.","basis":"documented"},{"t":"A Ferrers dependant.","d":"The Shirleys held under the Ferrers Earls of Derby; their later earldom (1711) revived the Ferrers name through descent from that family.","basis":"documented"},{"t":"1760: the hanged earl.","d":"The 4th Earl Ferrers was hanged at Tyburn for murdering his steward, the last peer to die a felon's death.","basis":"documented"}],"legacy":"Robert Shirley, 14th Earl Ferrers, succeeded in 2012; the family seat is Ditchingham Hall, Norfolk. Ettington Park, the Shirley house at Ettington, operates as a hotel.","legacyDetail":[{"t":"Papers at the National Archives.","d":"The Shirley family archives (Ettington and Earls Ferrers) are catalogued by The National Archives, which dates them at Ettington by 1086.","basis":"documented"}],"norman":{"claim":"documented","text":"The Domesday tenant at Ettington was Saswalo, holding of Henry de Ferrers (VCH Warwickshire; PASE Domesday). Saswalo may have been English or Norman, and the male-line descent to the Shirleys is supported by medieval genealogies and The National Archives' catalogue, though some intermediate steps rest on antiquarian work (Dugdale).","source":{"label":"British History Online — VCH Warwickshire vol. 5 (1949), Ettington, pp. 77–84","url":"https://www.british-history.ac.uk/vch/warks/vol5/pp77-84"}},"wealth":{"published":[],"publishedNote":"No Rich List or other published figure.","grossAssets":{"text":"No public accounts found.","source":{"label":"Wikipedia — Earl Ferrers","url":"https://en.wikipedia.org/wiki/Earl_Ferrers"}},"controlled":{"text":"Not documented.","source":{"label":"Wikipedia — Earl Ferrers","url":"https://en.wikipedia.org/wiki/Earl_Ferrers"}},"opaque":{"verdict":"none found","text":"No trust or offshore holdings documented.","searched":"Wikipedia, National Archives catalogue; no ICIJ search hits pursued for this minor estate; ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Robert Shirley, 14th Earl Ferrers, Shirley): name matches only, none shown to be this family or its vehicles","source":{"label":"The National Archives — Shirley family, Earls Ferrers","url":"https://discovery-cdn.nationalarchives.gov.uk/details/c/F22761"}}},"holdingsToday":[{"name":"Ettington Park","kind":"Urban property","sector":"Hotel","where":"Warwickshire","detail":"The Shirley seat at Ettington, now run as a hotel; ownership details not confirmed in sources used.","basis":"interpretive","source":{"label":"Hand Picked Hotels — Ettington Park history booklet","url":"https://www.Handpickedhotels.Co.Uk/images/hotels/ettington-park/brochures/Heritage%20Brochure/HPH-EP-History-Booklet.pdf"}},{"name":"Ditchingham Hall","kind":"Rural land","sector":"Estate","where":"Norfolk","detail":"Seat of the Earls Ferrers.","basis":"documented","source":{"label":"Wikipedia — Earl Ferrers","url":"https://en.wikipedia.org/wiki/Earl_Ferrers"}}],"lineage":[{"name":"Saswalo (Sewallis)","relation":"founder","years":"fl. 1086","note":"Held Lower Ettington of Henry de Ferrers.","basis":"documented"},{"name":"Sewallis de Shirley","relation":"descendant","years":"12th c.","note":"Took the name from Shirley, Derbyshire (held by c. 1129).","basis":"documented"},{"name":"Sir George Shirley, 1st Baronet","relation":"descendant","years":"cr. 1611","note":"Baronet of Staunton Harold.","basis":"documented"},{"name":"Robert Shirley, 1st Earl Ferrers","relation":"descendant","years":"1650–1717","note":"Created earl 1711; Ettington passed to younger sons.","basis":"documented"},{"name":"Robert Shirley, 14th Earl Ferrers","relation":"heir","years":"b. 1952","note":"Succeeded 2012.","basis":"documented"}],"today":"Robert William Saswalo Shirley, 14th Earl Ferrers, whose middle name recalls the Domesday tenant, succeeded in 2012.","today_people":[{"name":"Robert Shirley, 14th Earl Ferrers","relation":"titleholder","role":"Hereditary peer","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"Wikipedia — Earl Ferrers","url":"https://en.wikipedia.org/wiki/Earl_Ferrers"}}],"sources":[{"label":"British History Online — VCH Warwickshire vol. 5 (1949), Ettington, pp. 77–84","url":"https://www.british-history.ac.uk/vch/warks/vol5/pp77-84"},{"label":"PASE Domesday — Saswalo","url":"https://pase.ac.uk/domesday/person/47668"},{"label":"The National Archives — Shirley family, Earls Ferrers","url":"https://discovery-cdn.nationalarchives.gov.uk/details/c/F22761"},{"label":"Wikipedia — Earl Ferrers","url":"https://en.wikipedia.org/wiki/Earl_Ferrers"},{"label":"Ettington Parish Council — Ettington in ages past","url":"https://ettingtonparishcouncil.gov.uk/history/ettington-in-ages-past"}],"connections":[{"id":"domesday-book","type":"enclosure-or-grant","label":"Saswalo at Ettington, 1086"},{"id":"william-the-conqueror","type":"enclosure-or-grant","label":"sub-tenant under the Conqueror's baron Henry de Ferrers"},{"id":"berkeley-family","type":"political","label":"fellow line traceable to the Domesday era"},{"id":"percy-family-northumberland","type":"political","label":"fellow Domesday-era line (Percy through heiresses)"}]},{"id":"berkeley-family","name":"Berkeley family (Berkeley Castle)","category":"Landed Aristocracy & Gentry","role":"Conquest & Royal Grant","moneySources":["Bristol trade and royal finance","Royal grant (1153–54)","Feudal barony","Rural estate and tourism"],"nation":"England","scale":"Minor","scaleBasis":"documented","scaleNote":"The estate manages c. 6,000 acres of rural land and property (Berkeley Castle website); no published wealth figure.","start":1153,"end":null,"lifespan":"c. 1153–present (with a Tudor break, 1492–1553)","base":"Berkeley Castle, Gloucestershire","geo":[51.691,-2.457],"aliases":["Barons Berkeley","Earls of Berkeley","Fitzharding","Berkeley of Spetchley"],"origins":"Robert Fitzharding, son of Harding, the king's reeve at Bristol, was a rich Bristol burgess who backed Henry of Anjou in the civil war; around 1153–54 Henry II granted him the barony of Berkeley and licence to rebuild the castle. He was very probably the grandson of Eadnoth the Staller, an English official of Edward the Confessor and Harold.","role_summary":"Merchant capital turned into land: a Bristol financier's loans to the Angevin cause bought a Norman-era barony, which the family then held for nine centuries apart from 1492–1553, when William, Marquess Berkeley, settled the estates on Henry VII. Wealth came from feudal rents, the Severn vale's farms and fisheries, and later tourism; Edward II was murdered in the castle in 1327.","roleDetail":[{"t":"c. 1153–54: royal grant.","d":"Henry II's charter allowed Robert Fitzharding to rebuild the castle at Berkeley; a Berkeley Castle charter is dated c. November 1153.","basis":"documented"},{"t":"English, not Norman, roots.","d":"Descent from Eadnoth the Staller was called 'in the highest degree probable' by the historian E. A. Freeman; the family is cited as one of very few with a patrilineal Anglo-Saxon ancestor.","basis":"interpretive"},{"t":"Tudor break and return.","d":"The castle was in royal hands from 1492 to 1553, then returned to the family.","basis":"documented"}],"legacy":"Berkeley Castle and an estate of c. 6,000 acres in Gloucestershire and at Spetchley, Worcestershire, remain with the family; the castle is open to visitors under the Berkeley Castle Charitable Trust (charity 1061062). Charles Berkeley represents the family that has held it for nine centuries.","legacyDetail":[{"t":"Mixed estate business.","d":"The estate manages farmland, rivers, forestry and residential and commercial property, with weddings and events at the castle.","basis":"documented"}],"norman":{"claim":"interpretive","text":"Not Norman: Robert Fitzharding's line is probably descended from the English Eadnoth the Staller (Freeman's view, followed by peerage writers). The grant of Berkeley (c. 1153–54) is documented; the pre-Conquest descent is probable but not proven.","source":{"label":"Wikipedia — Robert Fitzharding","url":"https://en.wikipedia.org/wiki/Robert_Fitzharding"}},"wealth":{"published":[],"publishedNote":"No Rich List or other published figure found.","grossAssets":{"text":"No public accounts found for the family estate; the charitable trust's accounts cover only the charity.","source":{"label":"Berkeley Castle — The estate","url":"https://berkeley-castle.com/estate"}},"controlled":{"text":"c. 6,000 acres of rural land and property managed by the estate, plus the castle via the Berkeley Castle Charitable Trust.","source":{"label":"Berkeley Castle — The estate","url":"https://berkeley-castle.com/estate"}},"opaque":{"verdict":"none found","text":"No trust or offshore holdings documented beyond the charity.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Berkeley Castle; queries: Berkeley, Berkeley Castle Charitable Trust, Charles Berkeley): no matches; manual check: only unrelated Berkeley Street addresses; Berkeley Castle website.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}}},"holdingsToday":[{"name":"Berkeley and Spetchley estates","kind":"Rural land","sector":"Farming, forestry, lettings","where":"Gloucestershire and Worcestershire","detail":"c. 6,000 acres of rural land and property.","basis":"documented","source":{"label":"Berkeley Castle — The estate","url":"https://berkeley-castle.com/estate"}},{"name":"Berkeley Castle Charitable Trust","kind":"Foundation","sector":"Heritage","where":"Berkeley, Gloucestershire","detail":"Registered charity 1061062; castle open to visitors.","basis":"documented","source":{"label":"Berkeley Castle — The estate","url":"https://berkeley-castle.com/estate"}}],"lineage":[{"name":"Eadnoth the Staller","relation":"probable ancestor","years":"d. 1068","note":"English royal official under Edward the Confessor and Harold.","basis":"interpretive"},{"name":"Harding of Bristol","relation":"probable son","years":"fl. early 12th c.","note":"King's reeve at Bristol.","basis":"documented"},{"name":"Robert Fitzharding","relation":"founder","years":"d. 1170","note":"Granted Berkeley by Henry II c. 1153–54.","basis":"documented"},{"name":"Capt. Robert George Wilmot Berkeley","relation":"descendant","years":"1898–1969","note":"Inherited the castle in the 20th century from the last Earl of Berkeley.","basis":"documented"},{"name":"Charles Berkeley","relation":"heir","years":"living","note":"Represents the family at Berkeley Castle (Country Life).","basis":"documented"}],"today":"Charles Berkeley's family owns and runs Berkeley Castle and its estate, the castle open to visitors through a charitable trust.","today_people":[{"name":"Charles Berkeley","relation":"family head at the castle","role":"Berkeley Castle and estate","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Country Life — Charles Berkeley on the castle that's been in his family since the 1100s","url":"https://www.countrylife.co.uk/architecture/charles-berkeley-on-the-arch-at-the-castle-thats-been-in-his-family-since-the-1100s"}}],"sources":[{"label":"Wikipedia — Robert Fitzharding","url":"https://en.wikipedia.org/wiki/Robert_Fitzharding"},{"label":"Berkeley Castle — The estate","url":"https://berkeley-castle.com/estate"},{"label":"Country Life — Charles Berkeley on the castle in his family since the 1100s","url":"https://www.countrylife.co.uk/architecture/charles-berkeley-on-the-arch-at-the-castle-thats-been-in-his-family-since-the-1100s"},{"label":"Wikipedia — Berkeley Castle","url":"https://en.wikipedia.org/wiki/Berkeley_Castle"},{"label":"Wikisource — 1911 Encyclopaedia Britannica: Berkeley (family)","url":"https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Berkeley_(family)"}],"connections":[{"id":"william-the-conqueror","type":"political","label":"English family that survived the Conquest settlement"},{"id":"british-crown-estate-duchies","type":"charter","label":"barony granted by Henry II c. 1153–54; Crown held it 1492–1553"},{"id":"shirley-family-ferrers","type":"political","label":"fellow line traceable to the 11th–12th c."},{"id":"portman-family","type":"family","label":"the Berkeley name in the Berkeley Portman line (interpretive)"}]},{"id":"cecil-family-salisbury","name":"Cecil family (Marquesses of Salisbury, Hatfield)","category":"Landed Aristocracy & Gentry","role":"Sovereign & Princely Rule","moneySources":["Royal office (Court of Wards, Treasury)","Royal exchange of estates","Marriage to heiress","Development land"],"nation":"England","scale":"Significant","scaleBasis":"estimated","scaleNote":"The Gascoyne-Cecil estates totalled 13,389 acres in Hertfordshire in 1883; the Hatfield estate is reported at c. 8,500 acres today; the Marquess is not in the 2026 Rich List top 350 per reported peer listings.","start":1558,"end":null,"lifespan":"1558 (Burghley in office) – present; Hatfield from 1607","base":"Hatfield House, Hertfordshire","geo":[51.761,-0.209],"aliases":["Gascoyne-Cecil","Earls of Salisbury","Hatfield Estate","Cranborne"],"origins":"William Cecil, Lord Burghley, was Elizabeth I's chief minister for forty years; his younger son Robert Cecil succeeded him as Secretary of State and Master of the Court of Wards and was made Earl of Salisbury in 1605. In 1607 James I took the Cecil house at Theobalds and gave Robert Hatfield in exchange.","role_summary":"A fortune made in office: the Court of Wards, which managed the estates of underage heirs of Crown tenants, and other posts produced fees, gifts and land for the Cecils. Robert Cecil built Hatfield House in 1607–12. The 2nd Marquess's 1821 marriage to the heiress Frances Mary Gascoyne added the Gascoyne estates and name. Today the family's money is the Hatfield estate, including development land on the edge of Hatfield and Welwyn.","roleDetail":[{"t":"Office as income.","d":"Burghley and Robert Cecil each held the Mastership of the Court of Wards, whose profits and patronage were a major source of Tudor-Stuart official wealth.","basis":"interpretive"},{"t":"1607: Theobalds for Hatfield.","d":"James I exchanged the royal manor of Hatfield for Theobalds; Robert Cecil built the present house.","basis":"documented"},{"t":"1821: Gascoyne heiress.","d":"The 2nd Marquess married Frances Mary Gascoyne and the family took the name Gascoyne-Cecil.","basis":"documented"}],"legacy":"Hatfield House is the home of the 7th Marquess of Salisbury and is open to the public; the estate around it is reported as the largest private estate in Hertfordshire. A council ruled in the 2020s that a 1.8-hectare area of the estate was common land after the Marquess opposed registration.","legacyDetail":[{"t":"Archive.","d":"The Gascoyne-Cecil family records (including the Cecil Papers) are catalogued by The National Archives.","basis":"documented"}],"norman":{"claim":"none","text":"No Norman or Domesday descent is documented; the Cecils were Welsh-border gentry whose fortune began in Tudor royal service.","source":{"label":"The National Archives — Gascoyne-Cecil family, Marquesses of Salisbury","url":"https://discovery.nationalarchives.gov.uk/details/c/F20902"}},"wealth":{"published":[],"publishedNote":"Peer listings of the 2026 Sunday Times Rich List say the Marquess of Salisbury is not in the top 350 (threshold £340m).","grossAssets":{"text":"No public estate accounts found. 1883: 13,389 acres in Hertfordshire (Return of Owners of Land, as summarised by The National Archives).","source":{"label":"The National Archives — Gascoyne-Cecil family, Marquesses of Salisbury","url":"https://discovery.nationalarchives.gov.uk/details/c/F20902"}},"controlled":{"text":"Hatfield estate, c. 8,500 acres by some estimates, adjoining the new towns of Hatfield and Welwyn Garden City.","source":{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"}},"opaque":{"verdict":"none found","text":"Trust arrangements are not public; no offshore vehicle found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Gascoyne-Cecil; queries: Cecil, Robert Gascoyne-Cecil, 7th Marquess of Salisbury): name matches only, none shown to be this family or its vehicles; manual check: no relevant match; National Archives catalogue.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}}},"holdingsToday":[{"name":"Hatfield estate","kind":"Rural land","sector":"Farming, property, development land","where":"Hertfordshire","detail":"c. 8,500 acres (estimate); largest private estate in the county.","basis":"interpretive","source":{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"}},{"name":"Hatfield House and collections","kind":"Art & collections","sector":"Heritage & tourism","where":"Hatfield","detail":"Jacobean house (1607–12), Cecil Papers, open to the public.","basis":"documented","source":{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"}},{"name":"Cranborne Manor estate","kind":"Rural land","sector":"Estate","where":"Dorset","detail":"Second Cecil seat; held by the heir (Viscount Cranborne).","basis":"interpretive","source":{"label":"The National Archives — Gascoyne-Cecil family","url":"https://discovery.nationalarchives.gov.uk/details/c/F20902"}}],"lineage":[{"name":"William Cecil, Lord Burghley","relation":"founder","years":"1520–1598","note":"Elizabeth I's chief minister; Master of the Wards.","basis":"documented"},{"name":"Robert Cecil, 1st Earl of Salisbury","relation":"son","years":"1563–1612","note":"Exchanged Theobalds for Hatfield (1607) and built the house.","basis":"documented"},{"name":"James Gascoyne-Cecil, 2nd Marquess & Frances Mary Gascoyne","relation":"spouse / heiress","years":"m. 1821","note":"Gascoyne estates and name.","basis":"documented"},{"name":"Robert Gascoyne-Cecil, 3rd Marquess","relation":"son","years":"1830–1903","note":"Prime Minister three times.","basis":"documented"},{"name":"Robert Gascoyne-Cecil, 7th Marquess of Salisbury","relation":"heir","years":"b. 1946","note":"Lives at Hatfield House.","basis":"documented"}],"today":"Robert Gascoyne-Cecil, 7th Marquess of Salisbury, a former Leader of the House of Lords, lives at Hatfield House.","today_people":[{"name":"Robert Gascoyne-Cecil, 7th Marquess of Salisbury","relation":"titleholder","role":"Owner of Hatfield House and estate","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"}}],"sources":[{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"},{"label":"The National Archives — Gascoyne-Cecil family, Marquesses of Salisbury","url":"https://discovery.nationalarchives.gov.uk/details/c/F20902"},{"label":"inkl — Aristocrat forced to open part of estate to public after council ruling","url":"https://inkl.com/news/aristocrat-forced-to-open-part-of-estate-to-public-after-council-ruling"},{"label":"Google Groups (peerage-news) — Sunday Times Rich List 2026: peers listed","url":"https://groups.google.com/g/peerage-news/c/ZiDPZApeTOE"}],"connections":[{"id":"british-crown-estate-duchies","type":"charter" evolution (Whitehaven News).","basis":"documented"},{"t":"1883: 68,065 acres.","d":"Westmorland 39,229, Cumberland 28,228 and smaller holdings, worth £71,333 a year.","basis":"documented"},{"t":"Death duties forced sales.","d":"After the 5th Earl (1944) and 6th Earl (1953) died, most West Cumberland lands were sold between 1955 and 1959.","basis":"documented"},{"t":"Diversification.","d":"The 7th Earl set up Lowther Construction, Lowther Forestry Group, Lowther Park Farms and a wildlife park.","basis":"documented"}],"legacy":"The 9th Earl, William Lowther, succeeded in 2021 to an estate of some 30,000 acres; the estates are split among family trusts (Lonsdale Settled Estates after 2006). Lowther Castle, a ruin, has been reopened as a visitor attraction with gardens.","legacyDetail":[{"t":"Trust structure.","d":"Farmers Weekly reported that the Lowther estate 'has a complicated ownership structure with control split between various trusts'.","basis":"documented"}],"norman":{"claim":"none","text":"No Domesday descent is documented; the documented line in the sources used begins in the 16th century. Older claims of residence at Lowther since the 12th–13th centuries were not verified.","source":{"label":"Wikipedia — Earl of Lonsdale","url":"https://en.wikipedia.org/wiki/Earl_of_Lonsdale"}},"wealth":{"published":[],"publishedNote":"No recent published Rich List figure for the Earl of Lonsdale was found.","grossAssets":{"text":"No consolidated public accounts found; the estates are held by several family trusts.","source":{"label":"Farmers Weekly — Earl's Cumbrian estate put on the market","url":"https://www.fwi.co.uk/international-agriculture/earl-s-cumbrian-estate-put-on-the-market"}},"controlled":{"text":"An estate of some 30,000 acres (2021), described in the 2000s as the largest in the North West of England.","source":{"label":"Whitehaven News — Why the Lowthers sold up in West Cumbria","url":"https://whitehavennews.co.uk/news/17122902.why-the-lowthers-sold-up-in-wes 8th-century Whig/Tory borough-mongers in the north"},{"id":"who-owns-england","type":"legacy","label":"largest estate in North West England"}]},{"id":"herbert-family-pembroke","name":"Herbert family (Earls of Pembroke, Wilton)","category":"Landed Aristocracy & Gentry","role":"Church Land & Dissolution","moneySources":["Dissolution grant","Marriage into the royal circle","Agricultural rents","Residential lettings and tourism"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"The Wilton estate covers c. 14,000 acres in fourteen farms with more than 200 residential properties.","start":1541,"end":null,"lifespan":"1541–present","base":"Wilton House, Wiltshire","geo":[51.078,-1.859],"aliases":["Earls of Pembroke and Montgomery","Wilton Estate"],"origins":"William Herbert, a Welsh soldier and courtier married to Anne Parr, sister of Queen Katherine Parr, received the dissolved nunnery of Wilton Abbey and its lands from Henry VIII after the abbey's surrender in 1539 (grant dated 1541–44 in different sources). He was created Earl of Pembroke in 1551.","role_summary":"A Dissolution fortune that never left the founding site: Wilton House stands on the abbey's ground, and the estate is still let as farms and houses. The 4th Earl rebuilt the house in the 1630s; the family sold art and land to meet 20th-century taxes but kept the core estate.","roleDetail":[{"t":"Wilton Abbey to Herbert.","d":"The abbey surrendered in 1539 and its estate was granted to William Herbert in the early 1540s.","basis":"documented"},{"t":"Earldom 1551.","d":"Herbert was made Earl of Pembroke under Edward VI; the house he built lasted about 80 years.","basis":"documented"},{"t":"Estate today.","d":"c. 14,000 acres in fourteen farms and over 200 residential properties.","basis":"documented"}],"legacy":"William Herbert, 18th Earl of Pembroke, and his family occupy part of Wilton House, which is open to the public, and run the Wilton Estate.","legacyDetail":[{"t":"House as a rylebone until 1879 and Welbeck to today; the dukedom became extinct in 1990 and the Welbeck estate (reported at c. 15,000 acres) passed via Lady Anne Cavendish-Bentinck (d. 2008) to William Parente.","start":1689,"end":null,"lifespan":"1689 (earldom) – 1990 (dukedom extinct); Welbeck estate to present","base":"Welbeck Abbey, Nottinghamshire","geo":[53.263,-1.163],"aliases":["Dukes of Portland","Earls of Portland","Welbeck Estates Company","Portland Estate","Portland Collection"],"origins":"Hans Willem Bentinck, a Dutch nobleman and William III's closest adviser, came over in 1688 and was made Earl of Portland in 1689, receiving large royal grants and buying Bulstrode. His son Henry, 1st Duke, lost heavily in the South Sea Bubble and died Governor of Jamaica in 1726.","role_summary":"Royal favour followed by a great marriage: in 1734 the 2nd Duke married Margaret Cavendish Harley, heiress of the Cavendish-Holles and Harley fortunes, bringing Welbeck and the Marylebone estate. Marylebone's ground rents made the Portlands one of the richest ducal families until 1879, when that estate passed to the 5th Duke's sister, Lady Howard de Walden; Welbeck stayed with the dukedom and then with the 7th Duke's daughter.","roleDetail":[{"t":"1689: Dutch favourite.","d":"Bentinck was created Earl of Portland and received royal grants and offices after the Glorious Revolution.","basis":"documented"},{"t":"1734: the Harley heiress.","d":"Margaret Cavendish Harley brought Welbeck and Marylebone (the 'Portland Estate').","basis":"documented"},{"t":"1879: the split.","d":"Marylebone went to Lady Howard de Walden; Welbeck to the 6th Duke.","basis":"documented"},{"t":"After the dukes.","d":"The army college lease at Welbeck ended in 2005; Lady Anne's nephew William Parente inherited in 2008 and reunited the Portland Collection at the Harley Gallery.","basis":"documented"}],"legacy":"The Welbeck estate is run by the Welbeck Estates Company for William Parente's family; it has built food, craft and arts businesses (the Harley Gallery and Portland Collection, artisan food) around the abbey. The Marylebone part of the old Portland Estate is today's Howard de Walden Estate.","legacyDetail":[{"t":"Portland Collection.","d":"Built over about four centuries, reunited and shown at the Harley Gallery (2016).","basis":"documented"}],"norman":{"claim":"none","text":"The Bentincks are a Dutch noble family who came to England in 1688; no Norman descent is claimed.","source":{"label":"University of Nottingham Manuscripts — Portland family seats","url":"https://www.nottingham.ac.uk/manuscriptsandspecialcollections/collectionsindepth/family/portland/familyseats.aspx"}},"wealth":{"published":[],"publishedNote":"No Rich List figure for the Parente family or the Welbeck estate was found.","grossAssets":{"text":"No consolidated accounts found; the Welbeck Estates Company files at Companies House but its asset values were not checked in this research.","source":{"label":"Companies House — Welbeck Estates Company (Title) Ltd, officers","url":"https://find-and-update.company-information.service.gov.uk/company/02055129/officers"}},"controlled":{"text":"The Welbeck estate (reported c. 15,000 acres, unverified) and the Portland Collection.","source":{"label":"Yorkshire Post — Collection built by Dukes to go on display at new gallery","url":"https://www.yorkshirepost.co.uk/arts-and-culture/collection-built-by-dukes-to-go-on-display-at-new-gallery-1802626"}},"opaque":{"verdict":"none found","text":"No trust or offshore structure documented.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Welbeck Estates; queries: Cavendish-Bentinck, Welbeck Estates Company, William Parente): name matches only, none shown to be this family or its vehicles; manual check: no match; Companies House officers list.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}}},"holdingsToday":[{"name":"Welbeck estate","kind":"Rural land","sector":"Farming, forestry, food businesses","where":"Nottinghamshire","detail":"Reported c. 15,000 acres; estate-grown wood fuels its biomass boiler.","basis":"interpretive","source":{"label":"Yahoo/Country Life — Great Estates: Welbeck Abbey's foodie renaissance","url":"https://www.yahoo.com/news/great-estates-welcome-welbeck-abbey-060000370.html"}},{"name":"Harley Gallery and Portland Collection","kind":"Art & collections","sector":"Art","where":"Welbeck","detail":"Reunited ducal collection on display since 2016.","basis":"documented","source":{"label":"Yorkshire Post — Collection built by Dukes","url":"https://www.yorkshirepost.co.uk/arts-and-culture/collection-built-by-dukes-to-go-on-display-at-new-gallery-1802626"}},{"name":"Welbeck Estates Company","kind":"Private company","sector":"Estate management","where":"Nottinghamshire","detail":"Estate company registered at Companies House.","basis":"documented","source":{"label":"Companies House — Welbeck Estates Company (Title) Ltd","url":"https://find-and-update.company-information.service.gov.uk/company/02055129/officers"}}],"lineage":[{"name":"Hans Willem Bentinck, 1st Earl of Portland","relation":"founder","years":"1649–1709","note":"William III's favourite; royal grants; bought Bulstrode.","basis":"documented"},{"name":"William Bentinck, 2nd Duke & Margaret Cavendish Harley","relation":"spouse / heiress","years":"m. 1734","note":"Brought Welbeck and Marylebone.","basis":"documented"},{"name":"William Cavendish-Scott-Bentinck, 5th Duke","relation":"descendant","years":"1800–1879","note":"Died unmarried; Marylebone passed to his sister.","basis":"documented"},{"name":"William Cavendish-Bentinck, 7th Duke","relation":"descendant","years":"1893–1977","note":"Last duke at Welbeck; estate to his daughter.","basis":"documented"},{"name":"Lady Anne Cavendish-Bentinck","relation":"heiress","years":"1916–2008","note":"Owned most of the estate; left it to her nephew.","basis":"documented"},{"name":"William
