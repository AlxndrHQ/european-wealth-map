source":{"label":"C. Hoare & Co. — Our history","url":"https://hoaresbank.co.uk/our-history"}},{"year":1677,"title":"Grosvenor–Davies marriage brings the manor of Ebury","text":"Sir Thomas Grosvenor marries the heiress Mary Davies; her land becomes Mayfair and Belgravia.","ids":["grosvenor-family-westminster","mayfair-belgravia"],"source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":1687,"title":"Esterházy becomes an imperial prince","text":"Paul I Esterházy received the princely title for the family's Habsburg loyalty.","ids":["esterhazy-family","house-of-habsburg"],"source":{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"}},{"year":1694,"title":"Bank of England chartered for a £1.2m war loan","text":"1,268 subscribers lent £1.2m to William III's government in return for a charter and note-issuing rights.","ids":["bank-of-england"],"source":{"label":"Bank of England Museum — Why was the Bank of England founded?","url":"https://www.bankofengland.co.uk/museum/online-collections/blog/why-was-the-bank-of-england-founded"}},{"year":1704,"title":"Jean-Martin Wendel buys the Hayange forges","text":"The purchase in Lorraine begins three centuries of Wendel steelmaking and, ultimately, Wendel SE.","ids":["wendel-family"],"source":{"label":"PEA.fr — Famille Wendel","url":"https://pea.fr/legendes/famille-wendel/"}},{"year":1717,"title":"Sloane's Chelsea passes to the Cadogans","text":"Elizabeth Sloane marries Charles Cadogan; the Chelsea estate is still the Cadogan family's.","ids":["cadogan-family","chelsea-knightsbridge"],"source":{"label":"London Society — Chelsea, Sir Hans Sloane and the slavery connection","url":"https://londonsociety.org.uk/post/chelsea-and-sir-hans-sloane-connection"}},{"year":1719,"title":"Principality of Liechtenstein created","text":"Emperor Charles VI united Vaduz and Schellenberg, bought by the family in 1699 and 1712, as the Principality of Liechtenstein.","ids":["house-of-liechtenstein","holy-roman-empire"],"source":{"label":"Wikipedia — House of Liechtenstein","url":"https://en.wikipedia.org/wiki/House_of_Liechtenstein"}},{"year":1734,"title":"Marylebone heiress marries the Duke of Portland","text":"Margaret Cavendish Harley brings Welbeck and Marylebone to the Bentincks.","ids":["cavendish-bentinck-portland","marylebone"],"source":{"label":"Wikipedia — Baron Howard de Walden","url":"https://en.wikipedia.org/wiki/Baron_Howard_de_Walden"}},{"year":1759,"title":"Arthur Guinness signs a 9,000-year lease","text":"He leases St James's Gate, Dublin, at £45 a year; by 1886 it is the world's largest brewery.","ids":["guinness-family-iveagh"],"source":{"label":"Wikipedia — Guinness Brewery","url":"https://en.wikipedia.org/wiki/Guinness_Brewery"}},{"year":1760,"title":"George III surrenders the Crown lands","text":"Hereditary Crown revenues are handed to Parliament for a Civil List, creating the Crown Estate.","ids":["british-crown-estate-duchies"],"source":{"label":"GOV.UK — The Crown Estate Integrated Annual Report 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"}},{"year":1765,"title":"East India Company granted the diwani of Bengal","text":"Under a firman of 12 August 1765 the Company took over revenue collection in Bengal, Bihar and Orissa for a 26-lakh-rupee annual tribute.","ids":["east-india-company"],"source":{"label":"Banglapedia — Diwani","url":"https://en.banglapedia.org/index.php/Diwani"}},{"year":1789,"title":"Church property nationalised in France","text":"On 2 November 1789 the National Assembly declared Church property national property; émigré and royal property followed in 1792–93.","ids":["french-revolution-confiscations","house-of-bourbon"],"source":{"label":"Wikipedia — Biens nationaux","url":"https://en.wikipedia.org/wiki/Biens_nationaux"}},{"year":1803,"title":"Reichsdeputationshauptschluss redistributes church lands","text":"112 imperial estates were abolished and about 73,000 km² of church territory passed to secular princes; Thurn und Taxis received St Emmeram in Regensburg.","ids":["g2-reichsdeputationshauptschluss-1803","thurn-und-taxis-family","house-of-wittelsbach"],"source":{"label":"Wikipedia — German mediatisation","url":"https://en.wikipedia.org/wiki/German_Mediatisation"}},{"year":1803,"title":"Barings and Hope finance the Louisiana Purchase","text":"The bankers bought $11.25m of 6% US bonds from France for FF52m, a 13.3% discount, and resold them in London and Amsterdam.","ids":["baring-family","hope-and-co"],"source":{"label":"The Baring Archive — The Louisiana Purchase","url":"https://baringarchive.org.uk/exhibition/the-louisiana-purchase/"}},{"year":1811,"title":"Friedrich Krupp founds a cast-steel works in Essen","text":"The firm becomes Germany's leading arms maker under Alfred Krupp.","ids":["krupp-family"],"source":{"label":"thyssenkrupp — The founding families","url":"https://www.thyssenkrupp.com/en/company/history/the-founding-families/"}},{"year":1814,"title":"Herries commissions Nathan Rothschild to supply Wellington with gold","text":"The brothers bought gold quietly across the Continent and delivered it to Wellington's army in southern France.","ids":["nm-rothschild"],"source":{"label":"The Rothschild Archive — Rothschild and gold","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/rothschild_and_gold"}},{"year":1836,"title":"The Schneider brothers buy Le Creusot","text":"Adolphe and Eugène Schneider build a steel, rail and arms business that becomes one of Europe's leading arms makers by 1871.","ids":["schneider-family","wendel-family"],"source":{"label":"Wikipedia — Schneider-Creusot","url":"https://en.wikipedia.org/wiki/Schneider-Creusot"}},{"year":1847,"title":"Siemens & Halske founded in Berlin","text":"Werner von Siemens starts a telegraph-construction firm; his descendants still hold about 6.9% of Siemens AG.","ids":["siemens-family"],"source":{"label":"Wikipedia — Siemens family","url":"https://en.wikipedia.org/wiki/Siemens_family"}},{"year":1856,"title":"André Oscar Wallenberg founds Stockholms Enskilda Bank","text":"The bank became the root of the Wallenberg sphere and merged into SEB in 1972.","ids":["wallenberg-family"],"source":{"label":"Wallenberg Foundations — History","url":"https://wallenberg.com/en/history"}},{"year":1863,"title":"Monaco licenses the casino to SBM","text":"Two years after France paid four million francs for Menton and Roquebrune, Charles III approved François Blanc's Société des Bains de Mer.","ids":["house-of-grimaldi-monaco","g2-societe-des-bains-de-mer"],"source":{"label":"Wikipedia — Monte Carlo Casino","url":"https://en.wikipedia.org/wiki/Monte_Carlo_Casino"}},{"year":1867,"title":"Thurn und Taxis sells its posts to Prussia","text":"A treaty of 28 January 1867 transferred the family's postal rights and property to Prussia for three million thaler.","ids":["thurn-und-taxis-family","g2-reichspost","house-of-hohenzollern"],"source":{"label":"Deutsche Biographie — Maximilian Karl von Thurn und Taxis","url":"https://www.deutsche-biographie.de/sfz82246.html"}},{"year":1875,"title":"Rothschild £4m advance buys Britain the Suez shares","text":"N M Rothschild & Sons lent the government £4m to buy the Khedive's 176,602 Suez Canal Company shares.","ids":["nm-rothschild","g3-suez-canal-shares-1875"],"source":{"label":"The Rothschild Archive — Lionel de Rothschild and the Suez Canal","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/lionel_de_rothschild_and_the_suez_canal"}},{"year":1879,"title":"Marylebone passes to the Howard de Waldens","text":"The 5th Duke of Portland dies; the Marylebone estate goes to his sister Lucy, Lady Howard de Walden.","ids":["howard-de-walden-family","cavendish-bentinck-portland"],"source":{"label":"Wikipedia — Baron Howard de Walden","url":"https://en.wikipedia.org/wiki/Baron_Howard_de_Walden"}},{"year":1885,"title":"Leopold II becomes owner of the Congo Free State","text":"The Belgian king's personal colony was run on forced labour for rubber and ivory until Belgium annexed it in 1908.","ids":["leopold-ii-belgium","congo-free-state"],"source":{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"}},{"year":1886,"title":"Guinness floated in London","text":"Edward Cecil Guinness sells about two-thirds of the brewery on the London Stock Exchange for £6m, keeping about 35%.","ids":["guinness-family-iveagh"],"source":{"label":"Wikipedia — Edward Guinness, 1st Earl of Iveagh","url":"https://en.wikipedia.org/wiki/Edward_Guinness,_1st_Earl_of_Iveagh"}},{"year":1889,"title":"Royal charter for the British South Africa Company","text":"On the basis of the 1888 Rudd Concession, Rhodes's company received powers to occupy and exploit territory north of the Limpopo.","ids":["british-south-africa-company","cecil-rhodes"],"source":{"label":"Wikipedia — British South Africa Company","url":"https://en.wikipedia.org/wiki/British_South_Africa_Company"}},{"year":1890,"title":"Baring crisis: Bank of England organises a £17m rescue","text":"Unsold Argentine bonds froze Barings' capital. The Bank split it into a good bank and a bad bank backed by a City guarantee fund.","ids":["baring-family","bank-of-england"],"source":{"label":"Bank Underground — The Barings crisis of 1890","url":"https://bankunderground.co.uk/2016/02/10/rescuing-a-sifi-halting-a-panic-the-barings-crisis-of-1890/"}},{"year":1894,"title":"Estate duty introduced","text":"Death duties on landed estates begin; by the 1940s top rates of 80% force sales and transfers in lieu.","ids":["death-duties-inheritance-tax"],"source":{"label":"Chartered Institute of Taxation — Behind the headlines on the Duke and all that money","url":"https://www.tax.org.uk/blog-behind-the-headlines-on-the-duke-and-all-that-money"}},{"year":1899,"title":"FIAT founded in Turin","text":"Giovanni Agnelli is among the founders of FIAT, the base of the Agnelli fortune and today's Exor.","ids":["agnelli-elkann-family","exor"],"source":{"label":"Forbes — John Elkann","url":"https://www.forbes.com/profile/john-elkann/"}},{"year":1900,"title":"Leopold II creates the Royal Trust","text":"Leopold's letter of 9 April 1900 gave castles, parks and land to the nation on condition they never be sold and remain available to his successors; the law accepting it followed in 1903.","ids":["g2-belgian-royal-trust","leopold-ii-belgium"],"source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}},{"year":1917,"title":"Knut and Alice Wallenberg Foundation established","text":"It was the first of 16 Wallenberg foundations, which today hold 50% of the votes in Investor AB.","ids":["g3-wallenberg-foundations","investor-ab","wallenberg-family"],"source":{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}},{"year":1919,"title":"Austria's Habsburg Law","text":"Habsburg court property and the family fund passed to the Republic of Austria.","ids":["g2-habsburg-law-1919","house-of-habsburg"],"source":{"label":"habsburger.net — A fortune loses its owners","url":"https://www.habsburger.net/en/chapter/fortune-loses-its-owners-habsburg-assets-after-1918"}},{"year":1923,"title":"Wittelsbacher Ausgleichsfonds created","text":"Bavaria settled its former royal family's claims by founding a public-law fund whose income goes to the family.","ids":["g2-wittelsbacher-ausgleichsfonds","house-of-wittelsbach","weimar-1919-expropriations"],"source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}},{"year":1926,"title":"Referendum on expropriating the princes fails","text":"On 20 June 1926 about 96% of votes cast favoured expropriation, but turnout of c. 39% was below the required majority; Prussia then settled with the Hohenzollerns.","ids":["weimar-1919-expropriations","house-of-hohenzollern"],"source":{"label":"Wikipedia — Expropriation of the Princes in the Weimar Republic","url":"https://en.wikipedia.org/wiki/Expropriation_of_the_Princes_in_the_Weimar_Republic"}},{"year":1926,"title":"German Steel Trust formed","text":"Vereinigte Stahlwerke is created; Fritz Thyssen chairs its supervisory board as representative of the biggest private shareholder (26%).","ids":["thyssen-family"],"source":{"label":"Wikipedia — German Steel Trust","url":"https://en.wikipedia.org/wiki/German_Steel_Trust"}},{"year":1945,"title":"Czechoslovakia confiscates Liechtenstein estates","text":"Under the Beneš decrees the family's Bohemian and Moravian property was confiscated; Czech courts have since rejected the foundation's claims.","ids":["communist-expropriations-1945","house-of-liechtenstein","g2-prince-of-liechtenstein-foundation"],"source":{"label":"Radio Prague International — Foundation's property claims rejected","url":"https://english.radio.cz/node/8797582"}},{"year":1947,"title":"Lex Schwarzenberg","text":"Act 143/1947 transferred the Hluboká branch's property to the Czech state, outside the later restitution laws.","ids":["schwarzenberg-family","communist-expropriations-1945"],"source":{"label":"Seznam Zprávy — Komu patří nevrácený schwarzenberský majetek (2023)","url":"https://www.seznamzpravy.cz/clanek/domaci-kauzy-prehledne-komu-patri-nevraceny-schwarzenbersky-majetek-239765"}},{"year":1948,"title":"Church Commissioners formed","text":"Queen Anne's Bounty and the Ecclesiastical Commissioners merge into the Church Commissioners for England.","ids":["church-of-england-commissioners"],"source":{"label":"Wikipedia — Church Commissioners","url":"https://en.wikipedia.org/wiki/Church_Commissioners"}},{"year":1948,"title":"Alfried Krupp convicted at Nuremberg","text":"A US military tribunal sentences him to twelve years and forfeiture of property for plunder and use of forced labour; he is released in 1951 and his property restored.","ids":["krupp-family","g4-forced-labour-foundation-2000"],"source":{"label":"Wikipedia — Krupp trial","url":"https://en.wikipedia.org/wiki/Krupp_trial"}},{"year":1950,"title":"Devonshire death duties","text":"The 10th Duke dies; duties at 80% (reported at £7m) lead to Hardwick Hall being accepted by the Treasury.","ids":["cavendish-family-devonshire","death-duties-inheritance-tax"],"source":{"label":"House and Heritage — How Chatsworth's treasures were cared for","url":"https://houseandheritage.org/2018/05/13/chatsworth-house/"}},{"year":1967,"title":"Krupp fortune passes to a foundation","text":"After Alfried Krupp's death the Alfried Krupp von Bohlen und Halbach Foundation becomes owner of the Krupp firm; it holds 20.93% of thyssenkrupp today.","ids":["krupp-family","german-family-foundations"],"source":{"label":"Krupp-Stiftung — CV of Alfried Krupp","url":"https://krupp-stiftung.de/app/uploads/2025/01/ENG_CV_Alfried-Krupp-4.pdf"}},{"year":1978,"title":"French steel nationalised; the Wendels become investors","text":"The steel crisis and state takeover, described as without indemnity, end the family's industrial era; the family regroups as an investment holding.","ids":["wendel-family"],"source":{"label":"PEA.fr — Famille Wendel","url":"https://pea.fr/legendes/famille-wendel/"}},{"year":1990,"title":"Prince Johannes von Thurn und Taxis dies","text":"His death left debts and a tax bill reported at US$40m, forcing the sale of the bank, brewery, art and forest over the following years.","ids":["thurn-und-taxis-family"],"source":{"label":"TIME — Debts and Von Taxis (1993)","url":"https://time.com/archive/6724033/debts-and-von-taxis/"}},{"year":1991,"title":"Czech restitution returns Lobkowicz and Schwarzenberg castles","text":"Restitution laws covering post-February-1948 confiscations let William Lobkowicz and Karel Schwarzenberg recover castles and collections.","ids":["lobkowicz-family","schwarzenberg-family","communist-expropriations-1945"],"source":{"label":"House of Lobkowicz — About the family","url":"https://www.lobkowicz.cz/en/family"}},{"year":1995,"title":"Barings collapses; ING buys it for £1","text":"Nick Leeson's unauthorised trading in Singapore produced £827m of losses.","ids":["baring-family","g3-barings-bank"],"source":{"label":"Britannica — Bankruptcy of Barings Bank","url":"https://www.britannica.com/event/bankruptcy-of-Barings-Bank"}},{"year":1999,"title":"Krupp and Thyssen merge","text":"The two Ruhr dynasties' companies combine as thyssenkrupp.","ids":["krupp-family","thyssen-family"],"source":{"label":"thyssenkrupp — The founding families","url":"https://www.thyssenkrupp.com/en/company/history/the-founding-families/"}},{"year":2008,"title":"LGT client data scandal","text":"Data on c. 1,400 LGT client relationships, sold to German authorities by an ex-employee, triggered tax investigations in Germany and the US and reforms in Liechtenstein.","ids":["lgt-group","house-of-liechtenstein"],"source":{"label":"RTÉ — Liechtenstein tax probe (2008)","url":"https://www.rte.ie/news/2008/0227/100161-liechtenstein"}},{"year":2010,"title":"LVMH reveals a 17% Hermès stake","text":"The family responds by pooling its shares in H51 (2011); a 2014 settlement ends the dispute.","ids":["hermes-dumas-family"],"source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}},{"year":2011,"title":"Quandt family publishes its Nazi-era history","text":"Joachim Scholtyseck's family-commissioned study finds Günther and Herbert Quandt deeply involved in forced labour.","ids":["quandt-family","g4-forced-labour-foundation-2000"],"source":{"label":"JTA — BMW family admits using slave labor","url":"https://www.jta.org/2011/09/28/global/bmw-family-admits-using-slave-labor-for-nazis"}},{"year":2014,"title":"Peugeot family loses control of PSA","text":"Dongfeng and the French state each take about 14% in a €3bn capital increase; the family falls from about 25% to 14%.","ids":["peugeot-family"],"source":{"label":"AMF filing (Feb 2014)","url":"https://echanges.dila.gouv.fr/OPENDATA/AMF/BWR/2014/02/FCBWR076276_20140219.pdf"}},{"year":2016,"title":"7th Duke of Westminster inherits through trusts","text":"Hugh Grosvenor succeeds; because the estate is held in trusts, no single 40% inheritance tax charge applies, prompting calls for reform.","ids":["grosvenor-family-westminster","death-duties-inheritance-tax"],"source":{"label":"The Week — How the new Duke of Westminster will avoid a £3bn IHT bill","url":"https://theweek.com/75465/how-the-new-duke-of-westminster-will-avoid-a-3bn-tax-bill"}},{"year":2016,"title":"Panama Papers published","text":"ICIJ releases 11.5 million Mossack Fonseca records; Spanish coverage names Thyssen-Bornemisza family members. Being listed does not imply wrongdoing.","ids":["panama-papers","thyssen-family"],"source":{"label":"ICIJ — The Panama Papers","url":"https://www.icij.org/investigations/panama-papers/"}},{"year":2017,"title":"Paradise Papers: Duchy of Lancaster funds","text":"Leaked Appleby files show the Duchy of Lancaster invested about £10m in Cayman and Bermuda funds; the Duchy says the investments were audited and legitimate.","ids":["british-crown-estate-duchies"],"source":{"label":"The Guardian — Revealed: Queen's private estate invested millions of pounds offshore (5 Nov 2017)","url":"https://www.theguardian.com/news/2017/nov/05/revealed-queen-private-estate-invested-offshore-paradise-papers"}},{"year":2019,"title":"Reimann family founds the Alfred Landecker Foundation","text":"After research showing the Benckiser owners backed the Nazis and used forced labour, JAB's parent commits €250m over ten years.","ids":["reimann-family"],"source":{"label":"Alfred Landecker Foundation","url":"https://www.alfredlandecker.org/en/article/the-story-of-the-alfred-landecker-foundation"}},{"year":2022,"title":"EU Court strikes down public beneficial-ownership access","text":"The CJEU rules on 22 November that unrestricted public access to company beneficial-ownership registers is invalid; Luxembourg and the Netherlands close public access.","ids":["g4-cjeu-2022-beneficial-ownership-ruling","luxembourg","netherlands-stichting"],"source":{"label":"CJEU — Press release 188/22","url":"https://curia.europa.eu/jcms/upload/docs/application/pdf/2022-11/cp220188en.pdf"}},{"year":2023,"title":"Concordia takes Rothschild & Co private","text":"The family holding offered €48 a share including distributions, valuing the group at about €3.7bn. A squeeze-out followed.","ids":["nm-rothschild","rothschild-and-co"],"source":{"label":"City A.M. — Rothschild family in £3.3bn bid","url":"https://www.cityam.com/?p=1969577"}},{"year":2024,"title":"Monaco offshore companies reported","text":"Le Monde, drawing on the former wealth manager's notebooks, reported offshore companies linked to the princely family; the prince's lawyer confirmed Panama (1984) and BVI (2002) companies and said they were being liquidated.","ids":["house-of-grimaldi-monaco"],"source":{"label":"AFP via Legit.ng (2024)","url":"https://www.legit.ng/business-economy/economy/1575901-monaco-royals-rocked-by-claims-offshore-assets/"}},{"year":2025,"title":"Norges Bank buys 24.99% of Grosvenor's Mayfair","text":"Grosvenor sells a quarter of its Mayfair estate partnership to Norway's sovereign fund manager for £304m, keeping control.","ids":["grosvenor-family-westminster","grosvenor-group","mayfair-belgravia"],"source":{"label":"Grosvenor Group Ltd — Financial Statements 2025","url":"https://grosvenorlive.b-cdn.net/live/grosvenor/media/performance-annual-review/2026/grosvenor_financial_statements_2025.pdf"}},{"year":2025,"title":"Rome court rules Savoy jewels belong to the state","text":"A Rome civil court rejected the Savoy heirs' claim to the crown jewels held by the Bank of Italy since 1946.","ids":["house-of-savoy"],"source":{"label":"Wanted in Rome","url":"https://www.wantedinrome.com/news/italys-former-royal-family-loses-bid-to-claim-crown-jewels.html"}},{"year":2025,"title":"Elkann siblings pay €183m in Agnelli estate tax case","text":"The payment to Italy's revenue agency is made without admission of guilt; proceedings against John Elkann continued into 2026 with no verdict found.","ids":["agnelli-elkann-family","switzerland-banking-secrecy"],"source":{"label":"ANSA — Elkann agrees to community service over inheritance","url":"https://www.ansa.it/amp/english/news/general_news/2025/09/09/elkann-agrees-to-do-community-service-over-inheritance_65c91bf9-4d8a-416e-875c-9e2916dfcf4a.html"}},{"year":2026,"title":"Schroder family sells Schroders to Nuveen","text":"The £9.9bn all-cash takeover became effective on 1 October 2026, ending 222 years of family control and 67 years of listing.","ids":["schroder-family","g3-schroders-plc"],"source":{"label":"Scottish Financial News — Nuveen completes £9.9bn Schroders takeover","url":"https://www.scottishfinancialnews.com/articles/nuveen-completes-ps99bn-schroders-takeover-on-october-1"}}],"trails":[{"id":"g1-mayfair-trail","title":"From a Cheshire manor to Mayfair to Grosvenor Group and the trusts","region":"London","summary":"A gentry family's marriage to a twelve-year-old heiress in 1677 brought pasture west of London that became Mayfair and Belgravia. Leasehold development turned it into ground rent, the rents were reinvested worldwide from 1952, and today trustees own a £4.2bn-equity property group that manages £9.5bn of assets.","steps":[{"year":1440,"title":"Seated at Eaton","text":"The Grosvenors, Cheshire gentry who claim descent from a Norman knight, settle at Eaton in the early 1440s.","ids":["grosvenor-family-westminster"],"kind":"land","basis":"documented","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":1677,"title":"Marriage to Mary Davies","text":"Sir Thomas Grosvenor marries the heiress to the manor of Ebury: meadow, marsh and pasture west of the City.","ids":["grosvenor-family-westminster","mayfair-belgravia"],"kind":"land","basis":"documented","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":1720,"title":"Mayfair laid out on building leases","text":"Development begins around Grosvenor Square; builders take long leases and the family keeps the freehold and the reversion.","ids":["mayfair-belgravia"],"kind":"money","basis":"documented","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":1825,"title":"Belgravia","text":"Robert Grosvenor, later 1st Marquess of Westminster, develops Belgravia in the 1820s.","ids":["grosvenor-family-westminster","mayfair-belgravia"],"kind":"money","basis":"documented","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":1952,"title":"Capital goes abroad","text":"Annacis Island, Vancouver, is the first major overseas investment, followed by Australia, Asia (1994) and Europe (1996).","ids":["grosvenor-group"],"kind":"structure","basis":"documented","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},{"year":2016,"title":"Succession through trusts","text":"The 6th Duke dies; the estate is held by trustees, so the 7th Duke's inheritance does not trigger a 40% charge on its full value.","ids":["grosvenor-family-westminster","death-duties-inheritance-tax"],"kind":"structure","basis":"documented","source":{"label":"Chartered Institute of Taxation — Behind the headlines on the Duke and all that money","url":"https://www.tax.org.uk/blog-behind-the-headlines-on-the-duke-and-all-that-money"}},{"year":2025,"title":"Norway buys a quarter of Mayfair","text":"Norges Bank pays £304m for 24.99% of the Mayfair partnership; Grosvenor keeps control and management.","ids":["grosvenor-group","mayfair-belgravia"],"kind":"money","basis":"documented","amount":"£304m","source":{"label":"Grosvenor Group Ltd — Financial Statements 2025","url":"https://grosvenorlive.b-cdn.net/live/grosvenor/media/performance-annual-review/2026/grosvenor_financial_statements_2025.pdf"}},{"year":2026,"title":"Today: trusts, a £9.5bn platform, a £9.7bn Rich List figure","text":"Grosvenor Group is wholly owned by the Trustees of the Grosvenor Trusts; it reports shareholders' funds of £4.16bn and £9.5bn of assets under management, while the Rich List values the family at £9.677bn.","ids":["grosvenor-group","grosvenor-family-westminster"],"kind":"today","basis":"documented","amount":"£4.16bn equity / £9.5bn AUM","source":{"label":"Grosvenor — Annual review 2025","url":"https://www.grosvenor.com/about-us/annual-review"}}]},{"id":"g1-bloomsbury-trail","title":"From monastic land to the Bedford Estates: a Dissolution fortune","region":"London and Bedfordshire","summary":"The Russells were given three monasteries in thirteen years and married a second Dissolution fortune, Bloomsbury. Leasehold squares turned both into ground rent; selling early in the death-duty era shrank the London estate, which survives as c. 20 acres beside Woburn.","steps":[{"year":1539,"title":"Tavistock Abbey","text":"Henry VIII grants the dissolved Tavistock Abbey to John Russell, courtier and later Earl of Bedford.","ids":["russell-family-bedford","dissolution-of-the-monasteries"],"kind":"land","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1545,"title":"Wriothesley takes Bloomsbury","text":"Thomas Wriothesley, later Earl of Southampton, acquires Bloomsbury at the Dissolution.","ids":["g1-bloomsbury-estate","dissolution-of-the-monasteries"],"kind":"land","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1547,"title":"Woburn and Covent Garden","text":"Woburn Abbey (1547) and Westminster Abbey's 'convent garden' (1552) follow; Covent Garden's piazza is later built on lease.","ids":["russell-family-bedford"],"kind":"land","basis":"documented","source":{"label":"Wikipedia — Andrew Russell, 15th Duke of Bedford","url":"https://en.wikipedia.org/wiki/Andrew_Russell,_15th_Duke_of_Bedford"}},{"year":1669,"title":"Bloomsbury by marriage","text":"Rachel Wriothesley marries William, Lord Russell; Bloomsbury joins the Russell estates.","ids":["russell-family-bedford","g1-bloomsbury-estate"],"kind":"land","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1775,"title":"Squares and leases","text":"Bedford Square and later Russell and Tavistock Squares are built on building leases, producing ground rents for the dukes.","ids":["g1-bloomsbury-estate"],"kind":"money","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1918,"title":"Covent Garden sold","text":"The 11th Duke, selling ahead of rising death duties, completes the Covent Garden sale to Sir Thomas Beecham.","ids":["russell-family-bedford","death-duties-inheritance-tax"],"kind":"money","basis":"documented","source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":2026,"title":"Today: c. 20 acres and Woburn","text":"The Bedford Estates keep c. 20 of Bloomsbury's original 112 acres and the Woburn estate; the Rich List puts the Duke at £882m.","ids":["russell-family-bedford","g1-bloomsbury-estate"],"kind":"today","basis":"documented","amount":"c. 20 acres; £882m (Rich List 2026)","source":{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}}]},{"id":"g1-crown-trail","title":"From the Conqueror's demesne to offshore wind: the Crown's land","region":"England","summary":"Land William I kept in 1066 became the royal demesne, was swollen by duchies, forfeitures and monastic seizures, and was handed to Parliament in 1760 as the Crown Estate. Today its seabed monopoly earns offshore-wind fees, and its profits set the monarchy's public funding.","steps":[{"year":1066,"title":"Conquest","text":"William I takes the lands of Harold and the English lords who fought against him.","ids":["william-the-conqueror","battle-of-hastings"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — Battle of Hastings","url":"https://en.wikipedia.org/wiki/Battle_of_Hastings"}},{"year":1086,"title":"Land of the King","text":"Domesday records the royal demesne, estimated at about a fifth of England's recorded land.","ids":["domesday-book","british-crown-estate-duchies"],"kind":"land","basis":"interpretive","source":{"label":"The National Archives — Domesday Book","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"}},{"year":1399,"title":"Lancaster joins the Crown","text":"Henry IV brings the Duchy of Lancaster, which is kept separate as the sovereign's private estate.","ids":["british-crown-estate-duchies"],"kind":"structure","basis":"documented","source":{"label":"Duchy of Lancaster — Annual report 2026","url":"https://www.duchyoflancaster.co.uk/news-updates/duchy-of-lancaster-annual-report-and-accounts-year-ended-31st-march-2026/"}},{"year":1536,"title":"Monastic seizures, then grants","text":"Henry VIII takes the monasteries' estates and grants or sells most of them to families such as the Russells and Herberts.","ids":["dissolution-of-the-monasteries","russell-family-bedford","herbert-family-pembroke"],"kind":"land","basis":"documented","source":{"label":"Wikipedia — Dissolution of the monasteries","url":"https://en.wikipedia.org/wiki/Dissolution_of_the_monasteries"}},{"year":1760,"title":"Surrender to Parliament","text":"George III gives the hereditary Crown revenues to the Treasury for a Civil List: the origin of the Crown Estate.","ids":["british-crown-estate-duchies"],"kind":"structure","basis":"documented","source":{"label":"GOV.UK — Crown Estate annual report 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"}},{"year":2024,"title":"Offshore wind windfall","text":"Round 4 option fees lift net revenue profit to £1.15bn in 2024/25, mostly from seabed leasing.","ids":["british-crown-estate-duchies"],"kind":"money","basis":"documented","amount":"£1.15bn","source":{"label":"Baird Maritime — Crown Estate reports profit of £1.15bn led by offshore wind","url":"https://www.bairdmaritime.com/offshore/renewables/offshore-wind/britains-crown-estate-reports-profit-of-gbp115b-led-by-offshore-wind"}},{"year":2026,"title":"Today: £16.7bn of public Crown land, £680m of private royal wealth","text":"The Crown Estate's net asset value reaches £16.7bn while its revenue profit falls to £487m; the King's personal wealth is listed at £680m.","ids":["british-crown-estate-duchies"],"kind":"today","basis":"documented","amount":"£16.7bn NAV","source":{"label":"The Independent via Newswav — Crown Estate returns to Treasury fall","url":"https://newswav.com/article/crown-estate-returns-to-treasury-fall-by-almost-500-million-amid-slump-in-p-A2606_XLm7oy"}}]},{"id":"g2-liechtenstein-trail","title":"From Bohemian confiscations to LGT's CHF 386bn","region":"Bohemia, Vienna, Vaduz","summary":"The Liechtenstein fortune began with Habsburg service and the land confiscated after 1620, became a tiny sovereign state in 1719, lost its Czech core in 1945 and was rebuilt around a small bank into one of Europe's largest private-banking groups, held through a Vaduz foundation.","steps":[{"year":1608,"title":"Princely rank for Habsburg service","text":"Karl I of Liechtenstein was raised to prince for his service to the Habsburgs.","ids":["house-of-liechtenstein","house-of-habsburg"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — House of Liechtenstein","url":"https://en.wikipedia.org/wiki/House_of_Liechtenstein"}},{"year":1620,"title":"Confiscated Bohemian estates","text":"As governor of Bohemia after the White Mountain, Karl I carried out confiscations and acquired large estates cheaply; in 1622 he received Jägerndorf and rebel property.","ids":["g2-battle-of-white-mountain","house-of-liechtenstein"],"kind":"land","basis":"documented","source":{"label":"Masaryk University (Knoz)","url":"https://digilib.phil.muni.cz/en/node/5924"}},{"year":1719,"title":"A principality bought with land money","text":"Vaduz and Schellenberg, bought in 1699 and 1712, were raised to the Principality of Liechtenstein, giving the family sovereign status.","ids":["house-of-liechtenstein","holy-roman-empire"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — House of Liechtenstein","url":"https://en.wikipedia.org/wiki/House_of_Liechtenstein"}},{"year":1930,"title":"Buying a small Vaduz bank","text":"The family bought the Bank in Liechtenstein, founded 1921, around 1930 during the Depression.","ids":["lgt-group"],"kind":"money","basis":"documented","source":{"label":"InvestmentNews (2023)","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"}},{"year":1945,"title":"The Czech core is lost","text":"Czechoslovakia confiscated the family's Bohemian and Moravian estates under the Beneš decrees; claims have failed since.","ids":["communist-expropriations-1945","house-of-liechtenstein"],"kind":"land","basis":"documented","source":{"label":"Radio Prague International","url":"https://english.radio.cz/node/8797582"}},{"year":1970,"title":"A foundation to hold everything","text":"The Prince of Liechtenstein Foundation was created in Vaduz to hold the family's assets, including the bank and the Austrian estates.","ids":["g2-prince-of-liechtenstein-foundation"],"kind":"structure","basis":"documented","source":{"label":"Wikipedia — Prince of Liechtenstein Foundation","url":"https://en.wikipedia.org/wiki/Prince_of_Liechtenstein_Foundation"}},{"year":2023,"title":"Europe's richest royal","text":"Bloomberg put Hans-Adam II at about US$9.2bn, calling it the oldest fortune on its index.","ids":["house-of-liechtenstein"],"kind":"money","basis":"documented","amount":"c. US$9.2bn","source":{"label":"InvestmentNews (Bloomberg, 2023)","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"}},{"year":2025,"title":"Today: LGT and the Liechtenstein Group","text":"LGT reported CHF 386.1bn of client assets and CHF 445.6m profit; the Liechtenstein Group runs Austrian forests and farms, wineries, Vienna property, RiceTec in Texas and farms in Uruguay.","ids":["lgt-group","g2-ricetec","g2-prince-of-liechtenstein-foundation"],"kind":"today","basis":"documented","amount":"CHF 386.1bn AUM","source":{"label":"LGT — 2025 annual results","url":"https://www.lgt.com/ch-en/about-lgt/lgt-news/lgt-significantly-increases-profit-and-continues-growth-trajectory-336808"}}]},{"id":"g2-thurn-und-taxis-trail","title":"From the imperial post to Germany's largest private forest","region":"Brussels, Frankfurt, Regensburg","summary":"A Lombard courier family turned a Habsburg contract into a hereditary monopoly, was compensated with church lands when the Empire collapsed, cashed out to Prussia in 1867 and put the money into land. After the 1990 death duties the family sold its bank, brewery and art, and is left mainly with forest and the Regensburg palace.","steps":[{"year":1490,"title":"Courier contract","text":"Franz von Taxis organised the Habsburg courier line between Innsbruck and the Netherlands.","ids":["thurn-und-taxis-family","house-of-habsburg"],"kind":"money","basis":"documented","source":{"label":"Thurn und Taxis — History of the family","url":"https://www.thurnundtaxis.com/information/the-family/history-of-the-thurn-und-taxis-family"}},{"year":1615,"title":"Hereditary monopoly","text":"The Imperial Postmaster Generalship became a hereditary fief of the family.","ids":["g2-reichspost","holy-roman-empire"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — Thurn-und-Taxis Post","url":"https://en.wikipedia.org/wiki/Thurn-und-Taxis_Post"}},{"year":1748,"title":"Move to Regensburg","text":"Alexander Ferdinand became the Emperor's principal commissioner at the Imperial Diet in Regensburg.","ids":["thurn-und-taxis-family"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — House of Thurn und Taxis","url":"https://en.wikipedia.org/wiki/House_of_Thurn_und_Taxis"}},{"year":1803,"title":"Compensated with church land","text":"The secularisations gave the family St Emmeram Abbey in Regensburg and the Principality of Buchau.","ids":["g2-reichsdeputationshauptschluss-1803","thurn-und-taxis-family"],"kind":"land","basis":"documented","source":{"label":"Wikipedia — House of Thurn und Taxis","url":"https://en.wikipedia.org/wiki/House_of_Thurn_und_Taxis"}},{"year":1867,"title":"Sale to Prussia","text":"The postal rights and property were sold to Prussia for three million thaler; the family had already bought estates in Bavaria, Tyrol and Bohemia.","ids":["g2-reichspost","house-of-hohenzollern"],"kind":"money","basis":"documented","amount":"3,000,000 thaler","source":{"label":"Deutsche Biographie","url":"https://www.deutsche-biographie.de/sfz82246.html"}},{"year":1990,"title":"Death duties","text":"Prince Johannes died; TIME reported a US$40m tax bill. The bank was sold in 1992, c. 4,000 lots auctioned in 1993 and the brewery sold to Paulaner in 1996.","ids":["thurn-und-taxis-family"],"kind":"structure","basis":"documented","amount":"US$40m tax","source":{"label":"TIME — Debts and Von Taxis (1993)","url":"https://time.com/archive/6724033/debts-and-von-taxis/"}},{"year":2026,"title":"Today: forest and a palace","text":"The family holds nearly 20,000 ha of forest, Germany's largest private forest holding, plus St Emmeram and real estate.","ids":["thurn-und-taxis-family"],"kind":"today","basis":"documented","amount":"c. 20,000 ha","source":{"label":"Euronews (DE) (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}}]},{"id":"g2-congo-royal-trust-trail","title":"From Congo rubber to the Belgian Royal Trust","region":"Congo basin, Brussels, Ardennes","summary":"Leopold II ran the Congo as his personal property, extracted rubber through forced labour, spent the profits on Belgian buildings and land, and locked them into a Royal Trust whose properties the royal family still uses.","steps":[{"year":1885,"title":"A colony owned by one man","text":"The Congo Free State was recognised as Leopold II's personal possession.","ids":["leopold-ii-belgium","congo-free-state"],"kind":"power","basis":"documented","source":{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"}},{"year":1896,"title":"Crown domain and forced rubber","text":"Leopold reserved the c. 250,000 km² Domaine de la Couronne; forced rubber collection enforced by the Force Publique raised domain revenue to over 18 million francs by 1901.","ids":["congo-free-state"],"kind":"money","basis":"documented","source":{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"}},{"year":1900,"title":"Gift to the nation","text":"Leopold's 1900 letters gave castles, parks and land to Belgium on condition they never be sold and stay available to his successors; accepted by law in 1903.","ids":["g2-belgian-royal-trust"],"kind":"structure","basis":"documented","source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}},{"year":1905,"title":"Personal profits","text":"Historians estimate Leopold's personal rubber profit in 1896–1905 at about 70 million francs.","ids":["leopold-ii-belgium"],"kind":"money","basis":"interpretive","amount":"c. 70m francs","source":{"label":"Wikipedia — Atrocities in the Congo Free State","url":"https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State"}},{"year":1908,"title":"Handover and more property","text":"Belgium annexed the Congo; a law of 18 October 1908 added further properties to the Trust.","ids":["congo-free-state","g2-belgian-royal-trust"],"kind":"land","basis":"documented","source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}},{"year":1930,"title":"Autonomous public institution","text":"A royal decree made the Royal Trust an autonomous public body.","ids":["g2-belgian-royal-trust"],"kind":"structure","basis":"documented","source":{"label":"Wikipedia — Royal Trust (Belgium)","url":"https://en.wikipedia.org/wiki/Royal_Trust_(Belgium)"}},{"year":2022,"title":"Today: first valuation","text":"The Trust's first balance sheet valued its c. 7,500 ha and 77 buildings at about €231m; castles and villas are used by members of the royal family.","ids":["g2-belgian-royal-trust","house-of-saxe-coburg-gotha"],"kind":"today","basis":"documented","amount":"c. €231m","source":{"label":"BRF — Erste Schätzung von Wert der königlichen Schenkung von Leopold II. (7 Jan 2024, citing La Libre Belgique)","url":"https://brf.be/national/1790585/"}}]},{"id":"g3-rothschild-trail","title":"From the Frankfurt Judengasse to five capitals to Suez to Concordia","region":"Frankfurt / London / Paris","summary":"A court agent's coin business became a five-house partnership that financed European states. It was later concentrated into Rothschild & Co, which the family holding Concordia took private in 2023. The family now controls €143bn of client assets while published family fortunes are a few billion at most.","steps":[{"year":1760,"title":"Coin dealer and court agent in Frankfurt","text":"Mayer Amschel Rothschild built capital as a coin dealer and agent of the Landgrave of Hesse-Kassel.","ids":["nm-rothschild","house-of-hesse-kassel"],"kind":"money","basis":"documented","source":{"label":"The National Archives — Records of N M Rothschild & Sons (catalogue description)","url":"https://discovery.nationalarchives.gov.uk/details/r/c4875216-105d-4ffa-ab5a-c65a3260bdc8"}},{"year":1814,"title":"Gold for Wellington","text":"Herries's commission let Nathan's network move bullion across a continent at war. Nathan called it 'the best business I ever did'.","ids":["nm-rothschild"],"kind":"money","basis":"documented","source":{"label":"The Rothschild Archive — Rothschild and gold","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/rothschild_and_gold"}},{"year":1815,"title":"Waterloo: legend versus record","text":"The story of a Waterloo stock-market killing is a myth. The real gains came from post-war state bond issues.","ids":["nm-rothschild"],"kind":"power","basis":"documented","source":{"label":"The Rothschild Archive — the Waterloo commission","url":"https://rothschildarchive.org/business/n_m_rothschild_and_sons_london/nathan_mayer_rothschild_and_the_waterloo_commission"}},{"year":1875,"title":"£4m for the Suez shares","text":"Lionel de Rothschild advanced the purchase price for 176,602 shares at a 2.5% commission and 5% interest.","ids":["g3-suez-canal-shares-1875","nm-rothschild"],"kind":"money","basis":"documented","amount":"£4m","source":{"label":"The Rothschild Archive — Lionel de Rothschild and the Suez Canal","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/lionel_de_rothschild_and_the_suez_canal"}},{"year":1887,"title":"Backing De Beers","text":"Natty Rothschild backed Rhodes's bid for the French Diamond Company, the step that produced De Beers Consolidated in 1888.","ids":["cecil-rhodes","nm-rothschild"],"kind":"money","basis":"documented","source":{"label":"Rothschild Archive (family) — Natty de Rothschild","url":"https://family.rothschildarchive.org/people/61-nathaniel-mayer-natty-de-rothschild-1840-1915"}},{"year":2023,"title":"Concordia takes the group private","text":"The family concert, holding 66.8% of votes, bought out minorities at a €3.7bn valuation with partners including Peugeot Invest and the Dassault family.","ids":["rothschild-and-co"],"kind":"structure","basis":"documented","amount":"€3.7bn valuation","source":{"label":"City A.M. — Rothschild family in £3.3bn bid","url":"https://www.cityam.com/?p=1969577"}},{"year":2025,"title":"Today: €143bn of client assets, wine and foundations","text":"Rothschild & Co manages €143bn of client assets. Edmond de Rothschild manages over CHF 184bn separately. Family branches own Lafite's 1,200 ha and endow the Rothschild Foundation and Yad Hanadiv.","ids":["rothschild-and-co","edmond-de-rothschild-group","nm-rothschild"],"kind":"today","basis":"documented","amount":"€143bn AUM (2025)","source":{"label":"Rothschild & Co — Annual Review 2025","url":"https://rothschildandcopublications.foleon.com/annual-review-2025/en/business-wealth-and-asset-management"}}]},{"id":"g3-fugger-trail","title":"Tyrolean silver → the 1519 election → the Fuggerei and its forests","region":"Augsburg / Tyrol / Upper Hungary","summary":"Fugger loans secured on silver and copper mines bought the Habsburgs an empire. The money ended up as land, titles and charitable foundations. The bank that bears the name has been 99% insurer-owned since 1998.","steps":[{"year":1487,"title":"Silver as collateral","text":"Loans to Archduke Sigismund were secured on Tyrolean silver and copper output.","ids":["fugger-family"],"kind":"money","basis":"documented","source":{"label":"Britannica — Fugger family","url":"https://www.britannica.com/topic/Fugger-family"}},{"year":1495,"title":"Neusohl copper","text":"With Johann Thurzo, Jakob leased and built up the Hungarian copper mines of Neusohl (Banská Bystrica).","ids":["fugger-family"],"kind":"money","basis":"documented","source":{"label":"Britannica — Fugger family","url":"https://www.britannica.com/topic/Fugger-family"}},{"year":1519,"title":"Buying the imperial crown","text":"Fugger lent 543,385 guilders of the 851,585 paid to electors and was repaid in mining rights.","ids":["g3-habsburg-election-1519","house-of-habsburg"],"kind":"power","basis":"documented","amount":"543,385 guilders","source":{"label":"Swiss National Museum blog — Jakob Fugger","url":"https://blog.nationalmuseum.ch/en/2020/03/jakob-fugger-money-and-spirit-around-1500/"}},{"year":1521,"title":"The Fuggerei endowment","text":"Jakob founded the social settlement whose rent is still €0.88 a year.","ids":["g3-fugger-foundations"],"kind":"structure","basis":"documented","source":{"label":"Library of Congress — Fuggerei at 500","url":"https://blogs.loc.gov/law/2021/08/500-year-anniversary-of-the-fuggerei-the-oldest-social-housing-complex-in-the-world/"}},{"year":1600,"title":"From bank to land","text":"Habsburg and Spanish defaults ate the firm's capital. The family converted its wealth into Swabian lordships and princely and comital titles.","ids":["fugger-family"],"kind":"land","basis":"interpretive","source":{"label":"Store norske leksikon — Fugger","url":"https://snl.no/Fugger"}},{"year":1998,"title":"The name bank goes to an insurer","text":"Nürnberger took 99% of Fürst Fugger Privatbank, leaving the family with 1%. In 2026 Bloomberg reported, citing unnamed sources, that VIG, which is buying Nürnberger, was weighing a sale (one source: c. €120m).","ids":["g3-furst-fugger-privatbank"],"kind":"structure","basis":"documented","source":{"label":"Börsen-Zeitung (Jan 2025)","url":"https://boersen-zeitung.de/english/fuerst-fugger-privatbank-sees-no-need-to-participate-in-the-consolidation-wave"}},{"year":2026,"title":"Today: foundations financed by forestry","text":"The foundations run the Fuggerei and churches on timber income from forests at Laugna, Bocksberg and Emersacker. The princely line keeps its seats.","ids":["g3-fugger-foundations","fugger-family"],"kind":"today","basis":"documented","source":{"label":"Fugger — Forest","url":"https://www.fugger.de/en/forest"}}]},{"id":"g3-wallenberg-trail","title":"From a Stockholm bank to SEK 1.26 trillion of foundation control","region":"Stockholm","summary":"A 19th-century bank's industrial loans turned into shareholdings, then into a holding company and then into foundations. The family now chairs the boards that control half the votes in Investor AB, a fortune it governs but does not own.","steps":[{"year":1856,"title":"Stockholms Enskilda Bank","text":"André Oscar Wallenberg founded the bank that financed Swedish railways and industry.","ids":["wallenberg-family"],"kind":"money","basis":"documented","source":{"label":"Wallenberg Foundations — History","url":"https://wallenberg.com/en/history"}},{"year":1916,"title":"Investor AB founded","text":"Industrial stakes accumulated by the bank were placed in a separate holding company.","ids":["investor-ab"],"kind":"structure","basis":"documented","source":{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}},{"year":1917,"title":"The first Wallenberg foundation","text":"Knut and Alice Wallenberg endowed the foundation that became Investor's largest shareholder.","ids":["g3-wallenberg-foundations"],"kind":"structure","basis":"documented","source":{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}},{"year":1972,"title":"Enskilda merges into SEB","text":"The family bank merged into Skandinaviska Enskilda Banken, which remains an Investor holding.","ids":["wallenberg-family","investor-ab"],"kind":"structure","basis":"documented","source":{"label":"Wallenberg Foundations — History","url":"https://wallenberg.com/en/history"}},{"year":1994,"title":"EQT co-founded","text":"The family moved into function normalize(raw){
  const arr = Array.isArray(raw) ? raw : (raw.records || []);
  const byId = {}, profiles = [], entities = [];
  arr.forEach(r=>{
    if(!r || !r.id || byId[r.id]){ if(r?.id) console.warn('Duplicate id', r.id); return; }
    const n = {...r};
    if(n.type === 'entity'){ n._kind='entity'; entities.push(n); }
    else {
      n._kind='profile';
      if(!CATS[n.category]) { console.warn(`${n.id}: unknown category "${n.category}"`); n.category='Landed Aristocracy & Gentry'; }
      if(!SCALE[n.scale]) n.scale='Significant';
      profiles.push(n);
    }
    n._s = Number.isFinite(+n.start) && n.start!==null ? +n.start : null;
    n._e = n.end==null ? NOW : +n.end;
    byId[n.id]=n;
  });
  const links = [], seen = new Set();
  arr.forEach(r=>(r?.connections||[]).forEach(c=>{
    const o = typeof c==='string' ? {id:c} : c;
    if(!byId[o.id] || o.id===r.id){ if(!byId[o.id]) console.warn(`${r.id}: connection to unknown id "${o.id}" skipped`); return; }
    const key=[r.id,o.id].sort().join('|');
    if(seen.has(key)) return; seen.add(key);
    links.push({source:r.id, target:o.id, type:EDGE[o.type]?o.type:'connection', label:o.label||''});
  }));
  // entities without dates borrow the earliest year of their neighbours, for the period filter & timeline
  entities.forEach(e=>{ if(e._s!=null) return;
    const ys=links.filter(l=>l.source===e.id||l.target===e.id).map(l=>byId[l.source===e.id?l.target:l.source]._s).filter(y=>y!=null);
    if(ys.length){ e._s=Math.min(...ys); e._approx=true; } });
  const events = (raw.events||[]).filter(ev=>ev && Number.isFinite(+ev.year)).map(ev=>({...ev, year:+ev.year, ids:(ev.ids||[]).filter(id=>byId[id])}))
    .sort((a,b)=>a.year-b.year);
  const evBy = new Map(); events.forEach(ev=>ev.ids.forEach(id=>{ if(!evBy.has(id)) evBy.set(id,[]); evBy.get(id).push(ev); }));
  const nbNames = id => links.filter(l=>l.source===id||l.target===id).map(l=>byId[l.source===id?l.target:l.source].name);
  profiles.forEach(p=>{ p._hay=[p.name,...(p.aliases||[]),p.category,p.role,p.nation,p.scale,p.base,p.lifespan,
    p.origins,p.role_summary,p.legacy,p.scaleNote,
    ...(p.roleDetail||[]).map(x=>x.t+' '+x.d),...(p.legacyDetail||[]).map(x=>x.t+' '+x.d),
    ...(p.lineage||[]).map(x=>[x.name,x.relation,x.note].join(' ')), p.today,
    ...(p.placesNamed||[]), ...(p.today_people||[]).map(x=>[x.name,x.role,x.sector].join(' ')),
    ...(p.moneySources||[]), ...(p.holdingsToday||[]).map(x=>[x.name,x.kind,x.sector,x.where,x.detail].join(' ')),
    p.wealth?.grossAssets?.text, p.wealth?.controlled?.text, p.wealth?.opaque?.text, p.norman?.text,
    ...nbNames(p.id)].join(' ').toLowerCase(); });
  entities.forEach(e=>{ e._hay=[e.name,e.kind,e.description,...(e.placesNamed||[]),...nbNames(e.id)].join(' ').toLowerCase(); });
  const nations=[...new Set(profiles.map(p=>p.nation).filter(Boolean))].sort();
  const trails=(raw.trails||[]).map(t=>({...t, steps:(t.steps||[]).map(st=>({...st, ids:(st.ids||[]).filter(id=>byId[id])})).sort((a,b)=>a.year-b.year)}));
  return {profiles, entities, links, byId, events, evBy, nations, trails};
}
/* Overlaps: two players overlap when they reach the same hub (an entity, or a company/bank) through real
   (non-"parallel") links within OVL_HOPS steps. Paths never pass THROUGH a law/charter/legacy record or a very large hub. */
const OVL_HOPS = 2, OVL_THROUGH_MAX = 18;
const NO_PASS = /law|charter|treaty|act|apology|legacy|database|report/i;
const hubOK = n => n._kind==='entity' || isCo(n);
function computeOverlaps(D){
  const adj=new Map(), add=(a,b,l)=>{ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({id:b,l}); };
  D.links.forEach(l=>{ if(l.type==='parallel') return; add(l.source,l.target,l); add(l.target,l.source,l); });
  const players=D.profiles.filter(p=>!isCo(p));
  const hubs=new Map();
  players.forEach(p=>{
    const seen=new Set([p.id]), q=[[p.id]];
    while(q.length){
      const path=q.shift(); if(path.length>OVL_HOPS) continue;
      const cur=path[path.length-1], cn=D.byId[cur];
      if(path.length>1 && (NO_PASS.test(cn.kind||'') || (adj.get(cur)||[]).length>OVL_THROUGH_MAX)) continue;
      (adj.get(cur)||[]).forEach(({id})=>{
        if(seen.has(id)||!hubOK(D.byId[id])) return;
        seen.add(id); const np=[...path,id]; q.push(np);
        if(!hubs.has(id)) hubs.set(id,new Map()); hubs.get(id).set(p.id,np);
      });
    }
  });
  const pairs=new Map(), key=(a,b)=>[a,b].sort().join('|');
  const deg=id=>adj.get(id)?.length||0;
  const offer=(a,b,path,hub=null)=>{
    const k=key(a,b), cur=pairs.get(k);
    if(!cur||path.length<cur.path.length||(path.length===cur.path.length&&hub&&cur.hub&&deg(hub)>deg(cur.hub))) pairs.set(k,{a,b,path,hub}); };
  D.links.forEach(l=>{ const a=D.byId[l.source], b=D.byId[l.target];
    if(l.type!=='parallel' && a._kind==='profile' && b._kind==='profile' && !isCo(a) && !isCo(b)) offer(l.source,l.target,[l.source,l.target]); });
  hubs.forEach((m,hubId)=>{
    const ents=[...m.entries()];
    for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++){
      const [a,pa]=ents[i], [b,pb]=ents[j];
      if(pa.some((x,k)=>k>0&&pb.includes(x)&&x!==pa[pa.length-1])) continue;
      offer(a,b,[...pa,...pb.slice(0,-1).reverse()],hubId);
    }
  });
  const meet=new Map();
  pairs.forEach(({a,b,path,hub})=>{ if(!hub) return; if(!meet.has(hub)) meet.set(hub,new Map());
    const i=path.indexOf(hub), m=meet.get(hub), set=(p,pp)=>{ if(!m.has(p)||pp.length<m.get(p).length) m.set(p,pp); };
    set(a,path.slice(0,i+1)); set(b,path.slice(i).reverse()); });
  [...D.entities,...D.profiles.filter(isCo)].forEach(e=>{
    const direct=(adj.get(e.id)||[]).map(x=>x.id).filter(id=>D.byId[id]._kind==='profile'&&!isCo(D.byId[id]));
    if(new Set(direct).size<2 && !meet.has(e.id)) return;
    if(!meet.has(e.id)) meet.set(e.id,new Map());
    direct.forEach(p=>meet.get(e.id).set(p,[p,e.id]));
  });
  const byProfile=new Map(D.profiles.map(p=>[p.id,[]]));
  pairs.forEach(pr=>{ byProfile.get(pr.a).push({other:pr.b,path:pr.path}); byProfile.get(pr.b).push({other:pr.a,path:[...pr.path].reverse()}); });
  byProfile.forEach(l=>l.sort((x,y)=>x.path.length-y.path.length));
  [...D.entities,...D.profiles].forEach(e=>{ e._shared=meet.get(e.id)?.size||0; });
  return {hubs:meet, pairs, byProfile};
}
/* Map regions for the Organic layout: each player joins the largest shared hub (3+) they belong to. */
function computeCommunities(D){
  const H=D.ovl.hubs, hubs=[...H.entries()].filter(([,m])=>m.size>=3).sort((a,b)=>b[1].size-a[1].size).map(([id])=>id);
  const comm=new Map();
  D.profiles.forEach(p=>{ if(H.has(p.id)&&H.get(p.id).size>=3){ comm.set(p.id,p.id); return; } const h=hubs.find(h=>H.get(h).has(p.id)); if(h) comm.set(p.id,h); });
  const members=c=>D.profiles.filter(p=>comm.get(p.id)===c).length;
  D.profiles.forEach(p=>{
    if(comm.has(p.id)&&members(comm.get(p.id))>1) return;
    const tie=(D.ovl.byProfile.get(p.id)||[]).find(o=>o.path.length===2&&comm.has(o.other)&&comm.get(o.other)!==comm.get(p.id));
    if(tie) comm.set(p.id,comm.get(tie.other));
  });
  H.forEach((m,h)=>{ if(comm.has(h)&&D.byId[h]._kind==='profile') return; const c=new Map(); m.forEach((_,p)=>{ if(comm.has(p)) c.set(comm.get(p),(c.get(comm.get(p))||0)+1); });
    if(c.size) comm.set(h,[...c.entries()].sort((x,y)=>y[1]-x[1])[0][0]); });
  const nb=new Map(), add=(a,b)=>{ if(!nb.has(a)) nb.set(a,[]); nb.get(a).push(b); };
  D.links.forEach(l=>{ if(l.type!=='parallel'){ add(l.source,l.target); add(l.target,l.source); } });
  let frontier=[...comm.keys()];
  while(frontier.length){
    const next=[];
    frontier.forEach(id=>(nb.get(id)||[]).forEach(o=>{ if(!comm.has(o)){ comm.set(o,comm.get(id)); next.push(o); } }));
    frontier=next;
  }
  const regions=[...new Set(D.profiles.map(p=>comm.get(p.id)).filter(Boolean))], idx=new Map(regions.map((c,i)=>[c,i]));
  Object.values(D.byId).forEach(n=>{ n._comm=idx.has(comm.get(n.id))?idx.get(comm.get(n.id)):-1; });
  return regions.length;
}
const commCenter = (i,w,h) => { const n=DATA.nComm||1, a=-Math.PI/2+2*Math.PI*i/n, R=Math.min(w,h)*.36;
  return i<0 ? [w/2,h/2] : [w/2+Math.cos(a)*R*1.15, h/2+Math.sin(a)*R*.9]; };
const linkBetween = (a,b) => DATA.links.find(l=>(l.source===a&&l.target===b)||(l.source===b&&l.target===a));
const viaText = path => path.length<=2 ? 'direct: '+(linkBetween(path[0],path[1])?.label||'linked')
  : 'via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ');
const catColor = n => CATS[n.category]?.color || 'var(--muted)';
const colorOf = n => n._kind==='profile' ? catColor(n) : ENTITY_COLOR;
const period = k => PERIODS.find(p=>p.k===k);
const passCat = p => state.cat==='all' || p.category===state.cat;
const passRole = p => state.role==='all' || p.role===state.role;
const passNat = p => state.nation==='all' || p.nation===state.nation;
const passEra = p => { if(state.era==='all') return true; const P=period(state.era); return p._s==null || (p._s<=P.to && p._e>=P.from); };
const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const matchQ = n => { const t=terms(); return !t.length || t.every(w=>n._hay.includes(w)); };
const narrowedNow = () => state.cat!=='all'||state.role!=='all'||state.nation!=='all'||state.era!=='all'||terms().length>0;
function filterNote(noun='families'){

}

  t.forEach(w=>{ const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); out=out.replace(re,'<mark>$1</mark>'); });
  return out;
}

  });
}
const scaleLabel = p => (p.scale||'—') + (p.scaleBasis==='estimated'?' est.':'');

const fmtN = v => v>=1e6 ? (v/1e6).toFixed(v>=1e7?1:2).replace(/\.?0+$/,'')+'M' : v>=1e3 ? Math.round(v/1e3)+'K' : String(v);

/* Visible subgraph: filtered profiles + entities reachable through entities (≤2 hops) */
function subgraph(){
  const profs = visibleProfiles();
  if(state.overlap){
    const ok=new Set(profs.map(p=>p.id)), vis=new Map(), edges=new Set();
    DATA.ovl.pairs.forEach(({a,b,path})=>{
      if(!ok.has(a)||!ok.has(b)) return;
      const home=DATA.byId[a];
      path.forEach(id=>{ if(!vis.has(id)){ const n=DATA.byId[id]; vis.set(id,{cat:n._kind==='profile'?n.category:home.category}); } });
      path.slice(1).forEach((id,i)=>edges.add([path[i],id].sort().join('|')));
    });
    return {vis, links: DATA.links.filter(l=>edges.has([l.source,l.target].sort().join('|')))};
  }
  const vis = new Map(profs.map(p=>[p.id,{cat:p.category}]));
  let frontier = profs.map(p=>p.id);
  for(let hop=0; hop<2; hop++){
    const next=[];
    frontier.forEach(id=>{
      const home=vis.get(id);
      DATA.links.forEach(l=>{
        if(l.type==='parallel') return;
        const other = l.source===id ? l.target : l.target===id ? l.source : null;
        if(!other || vis.has(other) || DATA.byId[other]._kind!=='entity') return;
        if(state.era!=='all' && !passEra(DATA.byId[other])) return;
        vis.set(other,home); next.push(other);
      });
    });
    frontier=next;
  }
  return {vis, links: DATA.links.filter(l=>vis.has(l.source)&&vis.has(l.target))};
}

/* Timeline layout: piecewise-linear years so the busy centuries get room */

    .on('tick',()=>{
      link.attr('d',d=>{
        const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
        const s0=reach(d.source,ux,uy), t0=reach(d.target,ux,uy)+(d.type==='parallel'?0:3);
        return `M${d.source.x+ux*s0},${d.source.y+uy*s0}L${d.target.x-ux*t0},${d.target.y-uy*t0}`;
      });
      elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    })
    .on('end',()=>{ G.nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y})); if(!G.userZoomed) fit(600); });

  applyLayout(false);
  if(state.openId) hot(state.openId);
}

function applyLayout(reheat){
  if(!G.sim) return;
  const {w,h}=G, sim=G.sim;
  const quad={'Crown & Church':[.5,.14],'Landed Aristocracy & Gentry':[.2,.3],'Princely & Noble Houses':[.8,.3],'Banking & Merchant Dynasties':[.5,.52],'Colonial Companies & Investors':[.18,.78],'Industrial Dynasties':[.82,.78],'Holding Structures':[.5,.88]};
  sim.force('center', state.layout==='force' ? d3.forceCenter(w/2,h/2) : null);
  if(state.layout==='cluster'){
    sim.force('x',d3.forceX(d=>w*(quad[d.home?.cat]||[.5,.5])[0]).strength(d=>d._kind==='profile'?.18:.08));
    sim.force('y',d3.forceY(d=>h*(quad[d.home?.cat]||[.5,.5])[1]).strength(d=>d._kind==='profile'?.18:.08));
  } else if(state.layout==='timeline'){
    sim.force('x',d3.forceX(d=>d._s!=null?yearX(d._s):G.w).strength(d=>d._s==null?0:d._kind==='profile'?.9:d._approx?.15:.6));
    sim.force('y',d3.forceY(d=>tlBandY(d._kind==='profile'?d.category:d.home?.cat)).strength(d=>d._kind==='profile'?.6:.1));
  } else {
    sim.force('x',d3.forceX(d=>commCenter(d._comm,w,h)[0]).strength(d=>d._comm<0?.02:.06));
    sim.force('y',d3.forceY(d=>commCenter(d._comm,w,h)[1]).strength(d=>d._comm<0?.02:.06));
  }
  sim.alpha(reheat?.9:1).restart();
  clearTimeout(G.fitT); G.fitT=setTimeout(()=>fit(500),900);
}

function fit(dur){
  if(!G.nodes.length||!G.svg) return;
  const tl=state.layout==='timeline';
  const pad=60, q=G.nodes.length>40&&!tl?.04:0, qs=a=>{ a=[...a].sort((x,y)=>x-y); return [a[Math.floor(q*(a.length-1))], a[Math.ceil((1-q)*(a.length-1))]]; };
  let [xa,xb]=qs(G.nodes.map(n=>n.x)), [ya,yb]=qs(G.nodes.map(n=>n.y));
  if(tl){ xa=Math.min(xa,yearX(1066)-200); ya=Math.min(ya,0); }
  const x0=xa-pad, x1=xb+pad, y0=ya-pad, y1=yb+pad+20;
  const L = G.w>760 ? (document.getElementById('legend').offsetWidth+24) : 0;
  const aw=G.w-L;
  if(tl){   // fit the height and open at 1066; later centuries are a pan to the right
    const k=Math.max(.8,Math.min(1.1,G.h/(y1-y0)));
    G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+10-k*x0, G.h/2-k*(y0+y1)/2).scale(k));
    return;
  }
  const k=Math.max(.25,Math.min(1.6, Math.min(aw/(x1-x0), G.h/(y1-y0))));
  G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+aw/2-k*(x0+x1)/2, G.h/2-k*(y0+y1)/2).scale(k));
}
function hot(id){
  if(!G.root) return;
  const nb=new Set([id]); G.links.forEach(l=>{ if(l.source.id===id) nb.add(l.target.id); if(l.target.id===id) nb.add(l.source.id); });
  const on=d=>d.source.id===id||d.target.id===id;
  G.root.selectAll('.node').classed('faded',d=>!nb.has(d.id)).classed('nb',d=>nb.has(d.id)).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',d=>!on(d)).classed('hot',on);
  G.root.selectAll('.elabel').classed('faded',d=>!on(d)).style('opacity',d=>on(d)?.95:null);
}
function clearHot(){
  if(!G.root) return;
  G.root.selectAll('.node').classed('faded',false).classed('nb',false).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',false).classed('hot',false);
  G.root.selectAll('.elabel').classed('faded',false).style('opacity',null);
}

  const cross=ties.filter(l=>DATA.byId[l.source].category!==DATA.byId[l.target].category);

/* Descendants and heirs in public life today, grouped by sector; each person once, with every family they connect to.
   Current heads of successor firms with no family link are kept apart so they are never read as descendants. */
const isLeaderOnly = x => { const r=x.relation||''; return /^no (documented )?family link/i.test(r) || (/^(chief executive|current head|leader of)/i.test(r) && !/descend|heir|grand|son of|daughter of/i.test(r)); };
function publicLifeHTML(ok){
  const SECT=['Land & estates','Royalty & titles','Banking & finance','Business & industry','Politics & government','Culture & media','Philanthropy'];
  const LEAD='Leaders of successor institutions (no family link)';
  const people=new Map();   // key: group|name
  DATA.profiles.filter(p=>ok.has(p.id)).forEach(p=>(p.today_people||[]).forEach(x=>{
    if(terms().length && !matchQ(p) && !terms().every(w=>(x.name+' '+x.role).toLowerCase().includes(w))) return;
    const g=isLeaderOnly(x)?LEAD:(SECT.includes(x.sector)?x.sector:'Other'), k=g+'|'+x.name.trim().toLowerCase();
    if(!people.has(k)) people.set(k,{g,x,ps:[]}); const e=people.get(k); if(!e.ps.includes(p)) e.ps.push(p);
    if(x.basis==='documented') e.x={...e.x,basis:'documented'};
  }));
  if(!people.size) return '';
  const by=new Map(); people.forEach(e=>{ (by.get(e.g)||by.set(e.g,[]).get(e.g)).push(e); });
  const fam=[...people.values()].filter(e=>e.g!==LEAD).length;
  return `<h3 class="subh">In public life today<span class="n">${fam} people</span></h3>
    <p class="lede small">The people who hold these fortunes, titles and boards today, grouped by where they hold influence. Only public figures are listed: titleholders, monarchs, office holders and directors on public registers. “Unproven” marks a disputed claim. Heads of successor firms with no family link are listed separately.</p>

      <ul class="who">${by.get(k).sort((a,b)=>a.x.name.localeCompare(b.x.name)).map(({x,ps})=>`<li><button data-open="${esc(ps[0].id)}"><span class="d" style="background:${catColor(ps[0])}"></span><span class="nm">${esc(x.name)}</span><span class="via">${esc(x.role||'')} · ${esc(ps.map(p=>p.name).join(', '))}${x.basis&&x.basis!=='documented'?' · unproven':''}</span></button></li>`).join('')}</ul></article>`).join('')}</div>`;
}

    const vis=visibleProfiles().filter(p=>!money || p.category==='Holding Structures' || p.category==='Banking & Merchant Dynasties'), ids=new Set(visibleProfiles().map(p=>p.id));
    const ents=DATA.entities.filter(e=>geoOf(e) && passEra(e) && (!money || MONEY_KIND.test(e.kind||'')) &&
      (!narrowedNow() || (terms().length && matchQ(e)) || neighbors(e.id).some(x=>ids.has(x.other.id))));
    const at=new Map();
    [...vis,...ents].forEach(n=>{ const ll=geoOf(n); if(!ll) return; const k=ll.map(v=>v.toFixed(1)).join(','); (at.get(k)||at.set(k,{ll,items:[]}).get(k)).items.push(n); });
    for (const {ll,items} of at.values()){
      const ps=items.filter(n=>n._kind==='profile'), label=(ps[0]||items[0]).base || (items[0].name);
      const cats=new Set(ps.map(p=>p.category)), c=ps.length ? (cats.size===1?catColor(ps[0]):'var(--accent)') : null;
      const s=Math.round(12+5*Math.sqrt(items.length));
      const icon=L.divIcon({className:'apin'+(ps.length?'':' ent'), iconSize:ps.length?[s,s]:[11,11], html:`<span style="--c:${c||'var(--edge-strong)'}">${ps.length&&items.length>1?items.length:''}</span>`});
      L.marker(ll,{icon, title:`${label} · ${items.length}`, riseOnHover:true}).bindPopup(placePopup(label, items),{maxWidth:330, className:'apop', autoPanPaddingTopLeft:[24,160]}).addTo(g);
    }
    const unplaced=vis.filter(p=>!geoOf(p)).length;
    st.innerHTML=money?`${ents.length} estate companies, banks, holding companies, foundations and offshore centres · ${vis.length} banking and holding dossiers · uses the filters above`
      :`${vis.length} families · ${ents.length} places${unplaced?` · <span style="color:var(--dim)">${unplaced} without a base</span>`:''} · uses the filters above`;
    key.innerHTML=`<h4>${money?'Where the money sits':'Families &amp; places'}</h4>${Object.entries(CATS).map(([k,v])=>`<div class="it"><span class="sw" style="width:9px;height:9px;border-radius:50%;background:${v.color};display:inline-block"></span>${esc(k)}</div>`).join('')}
      <div class="it"><span style="width:9px;height:9px;border:1.5px solid var(--edge-strong);display:inline-block"></span>${money?'Company, bank, trust or offshore centre':'Estate, company, institution or place'}</div><div class="it" style="color:var(--muted)">Numbers = records sharing a city</div>`;
  }
  if (fit || !ATLAS.fitted[ATLAS.layer]) {
    const b=g.getBounds(); if (b.isValid()) { ATLAS.map.fitBounds(b.pad(.08),{maxZoom:6, animate:false}); ATLAS.fitted[ATLAS.layer]=true; }
  }
}
async function renderAtlas(){
  if (!ATLAS.booting) ATLAS.booting = (async ()=>{
    await atlasLibs();
    ATLAS.map = L.map('atlasMap', {zoomControl:false, worldCopyJump:true, minZoom:2}).setView([50,8], 4);
    L.control.zoom({position:'bottomright'}).addTo(ATLAS.map);
    ATLAS.map.on('popupopen', e=>e.popup.getElement()?.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openNode(b.dataset.go)));
    new MutationObserver(()=>ATLAS.map&&atlasTiles()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>ATLAS.map&&atlasTiles());
  })().catch(e=>{ document.getElementById('atlasStatus').textContent='The map library could not load. Check your connection and reload.'; throw e; });
  await ATLAS.booting;
  ATLAS.map.invalidateSize();
  drawAtlas(false);
}
document.getElementById('atlasLayer').addEventListener('click', e=>{
  const b=e.target.closest('[data-layer]'); if(!b || b.dataset.layer===ATLAS.layer) return;
  ATLAS.layer=b.dataset.layer; ATLAS.map?.closePopup(); drawAtlas(false);
});

/* =====================================================================
   ROUTER  (#/web · #/grid · #/chronology · #/overlaps · #/map · #/p/<id>)
   ===================================================================== */
function setView(v){
  state.view=v;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  document.getElementById('map').hidden = v!=='map';
  document.getElementById('grid').hidden = v==='map'||v==='atlas';
  document.getElementById('atlas').hidden = v!=='atlas';
  document.getElementById('grid').scrollTop=0;
  refresh();
}
const VIEW_HASH = {map:'web', atlas:'map', grid:'directory', overlaps:'overlaps', chron:'chronology', money:'money', wealth:'wealth'};
const HASH_VIEW = {web:'map', map:'atlas', directory:'grid', grid:'grid', overlaps:'overlaps', chronology:'chron', timeline:'chron', money:'money', wealth:'wealth'};
const hashOf = v => VIEW_HASH[v] || v;
const viewOfHash = () => HASH_VIEW[location.hash.replace(/^#\/?/,'').split('/')[0]] || null;
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
  const id=b?decodeURIComponent(b):'';
  if(a==='p' && DATA.byId[id]){ showDrawer(id); return; }
  hideDrawer();
  const v=HASH_VIEW[a];   // sub-paths pick a layout or layer: #/web/timeline, #/map/routes
  if(v==='map' && ['force','cluster','timeline'].includes(b) && b!==state.layout){
    state.layout=b; G.pos.clear(); document.querySelectorAll('#layoutSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.layout===b));
    if(state.view==='map'){ renderMap(); return; }
  }
  if(v==='money'){ const t=b&&DATA.trails.find(x=>x.id===b); state.trail=t?t.id:null; if(state.view==='money'){ renderMoney(); document.getElementById('grid').scrollTop=0; return; } }
  if(v==='atlas' && ['players','routes'].includes(b) && b!==ATLAS.layer){ ATLAS.layer=b; if(state.view==='atlas'){ drawAtlas(false); return; } }
  if(v && v!==state.view) setView(v);
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok) DATA=normalize(await r.json());
  }catch(_){/* opened from file:// — use embedded copy */}
  if(!DATA) DATA=normalize(EMBEDDED_DATA);
  DATA.ovl=computeOverlaps(DATA);
  DATA.nComm=computeCommunities(DATA);
  renderLegend(); bindUI();
  setView(viewOfHash() || 'map');
  route();
})();
</script>
