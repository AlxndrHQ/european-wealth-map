ly status to Liechtenstein (1608/1719) and Esterházy (1687). It was dissolved on 6 August 1806 after the 1803 secularisations and Napoleon's Confederation of the Rhine.","start":962,"geo":[50.0,10.0],"sources":[{"label":"Wikipedia — German mediatisation","url":"https://en.wikipedia.org/wiki/German_Mediatisation"},{"label":"Britannica — Thurn and Taxis postal system","url":"https://britannica.com/topic/Thurn-and-Taxis-postal-system"}],"connections":[{"id":"house-of-habsburg","type":"political","label":"emperors 1438–1806"},{"id":"g2-reichsdeputationshauptschluss-1803","type":"political","label":"secularisations of 1803"},{"id":"thurn-und-taxis-family","type":"charter","label":"Imperial Post"},{"id":"house-of-liechtenstein","type":"charter","label":"principality created 1719"}]},{"id":"g2-reichsdeputationshauptschluss-1803","name":"Reichsdeputationshauptschluss (1803) and mediatisation (1806)","type":"entity","kind":"Law / charter / tax","description":"The Final Recess of 25 February 1803 abolished 112 imperial estates and transferred about 73,000 km² of church territory, with c. 2.36 million inhabitants and 12.72m guilders of annual revenue, to secular rulers as compensation for losses to France, the largest redistribution of property in German history before 1945. In 1806 more than 100 small states were mediatised into larger ones; the dispossessed princes kept their private estates and equal rank, and could claim compensation.","start":1803,"geo":[49.019,12.098],"sources":[{"label":"Wikipedia — German mediatisation","url":"https://en.wikipedia.org/wiki/German_Mediatisation"}],"connections":[{"id":"thurn-und-taxis-family","type":"dissolution-grant","label":"received St Emmeram and Buchau"},{"id":"house-of-wittelsbach","type":"dissolution-grant","label":"Bavaria absorbed church lands"},{"id":"furstenberg-family","type":"political","label":"mediatised 1806"},{"id":"holy-roman-empire","type":"political","label":"prelude to the Empire's dissolution"}]},{"id":"g2-battle-of-white-mountain","name":"Battle of White Mountain (1620) and the Bohemian confiscations","type":"entity","kind":"Battle / event","description":"Habsburg victory near Prague on 8 November 1620 over the Protestant Bohemian estates. Twenty-seven leaders were executed in 1621, and an estimated five-sixths of the Bohemian nobility went into exile, their properties confiscated and redistributed to Catholic loyalists. Karl I of Liechtenstein, as governor, carried out many confiscations and acquired large estates himself.","start":1620,"geo":[50.078,14.32],"sources":[{"label":"Wikipedia — Battle of White Mountain","url":"https://en.wikipedia.org/wiki/Battle_of_White_Mountain"},{"label":"Masaryk University (Knoz) — Karl I. von Liechtenstein und die Konfiskationen","url":"https://digilib.phil.muni.cz/en/node/5924"}],"connections":[{"id":"house-of-habsburg","type":"political","label":"Habsburg victory"},{"id":"house-of-liechtenstein","type":"enclosure-or-grant","label":"main beneficiary of confiscations"},{"id":"lobkowicz-family","type":"political","label":"Catholic loyalists"}]},{"id":"french-revolution-confiscations","name":"French Revolution confiscations (biens nationaux, 1789–1793)","type":"entity","kind":"Law / charter / tax","description":"On 2 November 1789 the National Assembly declared Church property, valued at about 3 billion livres, national property to be sold; it backed the assignat paper currency. Confiscation of émigré and suspected counter-revolutionary property began on 30 March 1792, followed by royal property after 1792–93. Many noble fortunes were broken up; some were partly compensated under the Restoration.","start":1789,"geo":[48.857,2.352],"sources":[{"label":"Wikipedia — Biens nationaux","url":"https://en.wikipedia.org/wiki/Biens_nationaux"}],"connections":[{"id":"house-of-bourbon","type":"political","label":"royal property seized"},{"id":"house-of-grimaldi-monaco","type":"political","label":"Monaco annexed 1793"},{"id":"g2-reichsdeputationshauptschluss-1803","type":"political","label":"French conquests drove the 1803 compensations"}]},{"id":"weimar-1919-expropriations","name":"Post-1918 settlements and the 1926 'expropriation of the princes' referendum","type":"entity","kind":"Law / charter / tax","description":"After the 1918 revolutions each German state negotiated with its former ruling house; Bavaria created the Wittelsbacher Ausgleichsfonds (1923) and Prussia signed a 1926 treaty with the Hohenzollerns that left ownership of many objects open. A national referendum on uncompensated expropriation on 20 June 1926 won about 96% of votes cast but failed because turnout (c. 39%) fell short of the required majority of the electorate.","start":1918,"geo":[52.52,13.405],"sources":[{"label":"Wikipedia — Expropriation of the Princes in the Weimar Republic","url":"https://en.wikipedia.org/wiki/Expropriation_of_the_Princes_in_the_Weimar_Republic"},{"label":"Humboldt-Universität — The Wittelsbacher Ausgleichsfonds 1918–1933","url":"https://www.hu-berlin.de/en/forschungsinformationssystem/projekt-details/monarchisches-erbe-in-der-neuen-republik-der-wittelsbacher-ausgleichsfonds-1918-1933"}],"connections":[{"id":"house-of-hohenzollern","type":"political","label":"1926 Prussian treaty"},{"id":"house-of-wittelsbach","type":"political","label":"1923 WAF settlement"},{"id":"g2-habsburg-law-1919","type":"political","label":"Austria chose outright expropriation instead"}]},{"id":"g2-habsburg-law-1919","name":"Habsburg Law (Austria, 3 April 1919)","type":"entity","kind":"Law / charter / tax","description":"Austrian constitutional law that banished the Habsburg-Lorraine family unless members renounced their claims, and transferred court property and the entailed family fund to the Republic. It remains in force and is confirmed by the 1955 State Treaty; repeated restitution claims have failed.","start":1919,"geo":[48.208,16.373],"sources":[{"label":"Wikipedia — Habsburg Law","url":"https://en.wikipedia.org/wiki/Habsburg_Law"},{"label":"habsburger.net — A fortune loses its owners","url":"https://www.habsburger.net/en/chapter/fortune-loses-its-owners-habsburg-assets-after-1918"}],"connections":[{"id":"house-of-habsburg","type":"political","label":"expropriated the dynasty's court and fund property"},{"id":"weimar-1919-expropriations","type":"political","label":"contrast with German negotiated settlements"}]},{"id":"communist-expropriations-1945","name":"Post-war expropriations in Central Europe (1945–1948) and restitution after 1989","type":"entity","kind":"Law / charter / tax","description":"Czechoslovakia's Beneš decrees 12/1945 and 108/1945 automatically confiscated farmland and property of Germans, Hungarians and 'traitors', hitting the Liechtenstein estates; the 1947 'Lex Schwarzenberg' took the Hluboká branch's property; after the February 1948 coup the communists nationalised the rest. Hungary took the Esterházy estates (c. 128,000 ha) in 1946–47. Czech restitution law after 1989 covered only losses after 25 February 1948, which let the Lobkowicz and Orlík Schwarzenberg lines recover castles while Liechtenstein claims failed.","start":1945,"geo":[50.075,14.437],"sources":[{"label":"Wikipedia — Beneš decrees","url":"https://en.wikipedia.org/wiki/Bene%C5%A1_decrees"},{"label":"Radio Prague International — Prince of Liechtenstein Foundation's property claims rejected","url":"https://english.radio.cz/node/8797582"},{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"}],"connections":[{"id":"house-of-liechtenstein","type":"political","label":"Czech estates confiscated 1945"},{"id":"schwarzenberg-family","type":"political","label":"Lex Schwarzenberg 1947; Orlík restitution"},{"id":"lobkowicz-family","type":"political","label":"confiscated 1948; restituted 1990s"},{"id":"esterhazy-family","type":"political","label":"Hungarian estates taken 1946–47"},{"id":"house-of-hohenzollern","type":"political","label":"Soviet-zone land reform took eastern estates"}]},{"id":"g2-esterhazy-foundations","name":"Esterházy foundations (Esterhazy Privatstiftung and others)","type":"entity","kind":"Trust / foundation","description":"Three Austrian foundations created in 1995–96 by Melinda Esterházy to hold the family's Burgenland estates (about 50,000 ha): Forchtenstein (charitable) and the Eisenstadt and Lockenhaus family foundations. Run by Stefan Ottrubay, they operate forestry and organic farming (Pannatura), wine, real estate around Lake Neusiedl, hotels and cultural venues, with turnover expected to reach about €100m in 2024.","start":1995,"geo":[47.846,16.523],"sources":[{"label":"Austria-Forum — Esterházy, magnate family","url":"https://austria-forum.org/af/AEIOU/Esterh%C3%A1zy%2C_Magnatenfamilie/Esterh%C3%A1zy%2C_Magnatenfamilie_english"},{"label":"trend — Stefan Ottrubay: Der Patron des Burgenlands (2024)","url":"https://www.trend.at/unternehmen/stefan-ottrubay-der-patron-des-burgenlands"}],"connections":[{"id":"esterhazy-family","type":"trust","label":"hold the family estates"},{"id":"liechtenstein-foundations","type":"legacy","label":"comparable private-foundation model"}]},{"id":"nm-rothschild","name":"Rothschild family (N M Rothschild & Sons; the five Frankfurt branches)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Frankfurt coin dealing and court-agent business","War finance and bullion transfers (1811–15)","Sovereign bond issuance","Infrastructure and mining finance (Suez, De Beers)","Advisory and private banking","Vineyards and real estate"],"nation":"United Kingdom","scale":"Major","scaleBasis":"documented","scaleNote":"Rothschild & Co, controlled by the family holding Concordia, reported 2025 revenue of €2,986m and €143bn of client assets under management (Rothschild & Co Annual Review 2025).","start":1760,"end":null,"lifespan":"c. 1760 (Frankfurt) – present; London house from 1809, Paris from 1817","base":"London (New Court) and Paris","geo":[51.512,-0.091],"aliases":["N M Rothschild & Sons","de Rothschild Frères","Rothschild & Co","Concordia"],"origins":"Mayer Amschel Rothschild (1744–1812) rose from coin dealer in the Frankfurt Judengasse to court agent for the Landgrave (later Elector) of Hesse-Kassel. He sent his five sons to Frankfurt, London, Paris, Vienna and Naples, creating a multinational partnership that could move money across borders faster than governments could.","role_summary":"The fortune was built by financing states. In 1814 the British commissary-in-chief J.C. Herries commissioned Nathan Mayer Rothschild to gather gold on the Continent for Wellington's army, a contract Nathan called 'the best business I ever did'; after 1815 the brothers dominated issuance of European sovereign bonds. Commissions on loans and bullion, interest, and exchange arbitrage across five houses compounded; in 1875 Lionel de Rothschild advanced £4m to the British government to buy the Khedive's Suez Canal shares, and in 1887 Natty Rothschild backed Cecil Rhodes's De Beers amalgamation.","roleDetail":[{"t":"Court agent in Frankfurt.","d":"Mayer Amschel's capital came from coin dealing and agency work for Hesse-Kassel, whose Elector was one of the richest princes of the era.","basis":"documented"},{"t":"Gold for Wellington, 1814.","d":"On receiving the commission from Herries in January 1814, Nathan had his brothers buy gold quietly in small lots across the Continent and convey it to Wellington in southern France.","basis":"documented"},{"t":"The Waterloo 'killing' is a myth.","d":"The Rothschild Archive and the Fondation Napoléon both say the evidence that Nathan made a fortune from early news of Waterloo is slender; the legend originated in hostile pamphlets.","basis":"documented"},{"t":"Suez Canal loan, 1875.","d":"N M Rothschild & Sons advanced £4m to Disraeli's government to buy 176,602 Suez Canal Company shares from the Khedive of Egypt, charging a commission of 2.5% and 5% interest.","basis":"documented"},{"t":"Mining and empire finance.","d":"In 1887 Natty Rothschild backed De Beers' bid for the French Diamond Company, a step towards the 1888 creation of De Beers Consolidated Mines; Natty was later Rhodes's executor.","basis":"documented"}],"legacy":"The English and French banking houses were merged into Rothschild & Co (Paris), which the family holding company Rothschild & Co Concordia took private in 2023, valuing the group at about €3.7bn. A separate Geneva group, Edmond de Rothschild, is run by Ariane de Rothschild. Family branches also own Bordeaux estates (Domaines Barons de Rothschild – Lafite), and charities such as the Rothschild Foundation (Waddesdon) and Yad Hanadiv in Israel.","legacyDetail":[{"t":"Concordia takes Rothschild & Co private.","d":"Concordia held 38.9% of capital, and the family concert 54.5% of capital and 66.8% of votes, before its 2023 offer at €48 a share (City A.M.); a squeeze-out at €38.60 ex-distribution followed.","basis":"documented"},{"t":"Wine and charity.","d":"Domaines Barons de Rothschild (Lafite), chaired by Saskia de Rothschild since 2018, owns about 1,200 ha of vineyards; the Rothschild Foundation, endowed by the late 4th Lord Rothschild, runs the Waddesdon estate for the National Trust.","basis":"documented"}],"wealth":{"published":[{"figure":"c. £825m","usd":"c. $1.0bn","who":"Rothschild family (UK)","publisher":"Sunday Times Rich List (as reported by Eyewitness News, Feb 2024)","year":2023,"rank":"","url":"https://www.ewn.co.za/2024/02/27/lord-jacob-rothschild-dies-at-87"},{"figure":"CHF 1.8bn","usd":"c. $2.0bn","who":"Family of Ariane de Rothschild (Edmond de Rothschild branch)","publisher":"Bilanz, 300 Reichste","year":2025,"rank":"125th","url":"https://www.bilanz.ch/people/familie-ariane-de-rothschild"}],"publishedNote":"No Forbes or Bloomberg figure covers the family as a whole. Published estimates cover single branches only. Very large internet figures for 'Rothschild wealth' come from unsourced or conspiracy sites and have been ignored.","grossAssets":{"text":"Rothschild & Co: 2025 revenue €2,986m and net income €413m (Annual Review 2025). The take-private valued the whole group at about €3.7bn in 2023. Concordia's share of that equity, net of the debt raised to fund the offer, is not published since the delisting.","source":{"label":"Rothschild & Co — Annual Review 2025","url":"https://rothschildandcopublications.foleon.com/annual-review-2025/en/"}},"controlled":{"text":"Rothschild & Co managed €143bn of client assets at end-2025 (€101bn wealth management, €42bn asset management). Edmond de Rothschild, a separate group, reported over CHF 184bn of assets under management at end-2024. These are client assets, not family wealth: they show the family's reach, not what it owns.","source":{"label":"Rothschild & Co — Annual Review 2025: Wealth and Asset Management","url":"https://rothschildandcopublications.foleon.com/annual-review-2025/en/business-wealth-and-asset-management"}},"opaque":{"verdict":"reported","text":"Holdings are layered through Rothschild & Co Concordia SAS (family concert, unlisted since 2023), Edmond de Rothschild Holding (Geneva), private wine companies and family trusts and charities. Since delisting, Concordia's balance sheet and the split between branches are not public. Courts and regulators have acted against banks bearing the name, not against family members: in May 2025 a Luxembourg court convicted Edmond de Rothschild (Europe), the Luxembourg bank of the separate Edmond de Rothschild group, of money laundering in a 1MDB-related case and confiscated €25m (a penalty agreed with prosecutors); in July 2018 FINMA found that Rothschild Bank AG (Zurich) and a trust subsidiary had seriously breached anti-money-laundering due-diligence and reporting duties in 1MDB-linked business.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Alexandre de Rothschild, Ariane de Rothschild, Edmond de Rothschild Group, Rothschild, Rothschild & Co, Saskia de Rothschild …): Rothschild Trust (Bermuda/Guernsey), Rothschild Bank AG (Hong Kong) and Banque Privée Edmond de Rothschild entities appear as Panama Papers intermediaries (client business of the banks), and the Appleby data has an officer entry 'Rothschild - Baron Edmond de' whose identity and role were not established; none is shown to be a family holding; web searches for Rothschild with Panama/Paradise/Pandora Papers (no reporting from ICIJ or a major outlet naming family members was found); FINMA and CSSF enforcement news; AMF filings for the 2023 offer.","source":{"label":"Investment Officer Luxembourg — Edmond de Rothschild convicted of money laundering (May 2025)","url":"https://www.investmentofficer.lu/index.php/en/news/edmond-de-rothschild-convicted-money-laundering"}},"gapNote":"Published figures (c. £825m for the UK family; CHF 1.8bn for Ariane de Rothschild's branch) are small next to the €143bn plus CHF 184bn of client money the two groups manage. This suggests the family's power lies in control of franchises, not in a personal fortune of the size claimed online. Concordia's private balance sheet since 2023 means the family's own equity can no longer be checked from market prices."},"holdingsToday":[{"name":"Rothschild & Co (via Rothschild & Co Concordia)","kind":"Bank / wealth manager","sector":"Advisory, wealth and asset management, merchant banking (Five Arrows)","where":"Paris / London","detail":"Unlisted since the 2023 squeeze-out. Family concert held 66.8% of votes before the offer.","basis":"documented","source":{"label":"City A.M. — Rothschild family in £3.3bn bid to take Rothschild & Co private","url":"https://www.cityam.com/?p=1969577"}},{"name":"Edmond de Rothschild Group","kind":"Bank / wealth manager","sector":"Private banking and asset management","where":"Geneva","detail":"Over CHF 184bn of AUM (end-2024). CEO Ariane de Rothschild.","basis":"documented","source":{"label":"finews.asia — Edmond de Rothschild eyes 200 billion threshold","url":"https://www.finews.asia/finance/42982-edmond-de-rothschild-annual-results-2024-ariane-de-rothschild-asia-apac"}},{"name":"Domaines Barons de Rothschild (Lafite)","kind":"Agriculture & forestry","sector":"Wine","where":"Pauillac, Bordeaux; Chile, Argentina, China","detail":"About 1,200 ha including Château Lafite Rothschild, Duhart-Milon, Rieussec and L'Evangile. Owned by this branch since 1868.","basis":"documented","source":{"label":"Wine Spectator — A changing of the guard at Lafite Rothschild","url":"https://www.winespectator.com/articles/a-changing-of-the-guard-at-lafite-rothschild"}},{"name":"The Rothschild Foundation (Waddesdon)","kind":"Foundation","sector":"Heritage and philanthropy","where":"Buckinghamshire","detail":"Independent charity holding investments, property and art; it manages Waddesdon for the National Trust.","basis":"documented","source":{"label":"Rothschild Foundation — Foundation FAQs","url":"https://rothschildfoundation.org.uk/about-us/foundation-faqs/"}}],"slaveSiteId":"nm-rothschild","lineage":[{"name":"Mayer Amschel Rothschild","relation":"founder","years":"1744–1812","note":"Frankfurt coin dealer and court agent. He sent five sons to five capitals.","basis":"documented"},{"name":"Nathan Mayer Rothschild","relation":"son","years":"1777–1836","note":"Founded the London house. He ran the 1814 gold operation and post-war bond issues.","basis":"documented"},{"name":"Lionel de Rothschild","relation":"son","years":"1808–1879","note":"Financed the 1875 Suez share purchase. He was the first practising Jewish MP.","basis":"documented"},{"name":"Nathaniel 'Natty', 1st Lord Rothschild","relation":"son","years":"1840–1915","note":"Backed De Beers in 1887 and served as executor of Rhodes's will.","basis":"documented"},{"name":"Jacob, 4th Lord Rothschild","relation":"descendant","years":"1936–2024","note":"Left N M Rothschild in 1980 to build RIT Capital. He endowed the Rothschild Foundation.","basis":"documented"},{"name":"Rothschild & Co Concordia SAS","relation":"successor firm","years":"to present","note":"Family holding that unites the English and French branches' stakes. It took Rothschild & Co private in 2023.","id":"rothschild-and-co","basis":"documented"}],"today":"Alexandre de Rothschild has been executive chairman of Rothschild & Co since 2018. Ariane de Rothschild has been CEO of the separate Edmond de Rothschild Group since 2023. Saskia de Rothschild chairs Domaines Barons de Rothschild (Lafite).","today_people":[{"name":"Alexandre de Rothschild","relation":"seventh generation","role":"Executive Chairman, Rothschild & Co","sector":"Banking & finance","year":2023,"basis":"documented","source":{"label":"City A.M. — Rothschild family in £3.3bn bid","url":"https://www.cityam.com/?p=1969577"}},{"name":"Ariane de Rothschild","relation":"widow of Benjamin de Rothschild","role":"CEO, Edmond de Rothschild Group","sector":"Banking & finance","year":2025,"basis":"documented","source":{"label":"Bilanz — Familie Ariane de Rothschild","url":"https://www.bilanz.ch/people/familie-ariane-de-rothschild"}},{"name":"Saskia de Rothschild","relation":"daughter of Eric de Rothschild","role":"Chair, Domaines Barons de Rothschild (Lafite)","sector":"Business & industry","year":2018,"basis":"documented","source":{"label":"Wine Spectator — A changing of the guard at Lafite Rothschild","url":"https://www.winespectator.com/articles/a-changing-of-the-guard-at-lafite-rothschild"}}],"sources":[{"label":"The Rothschild Archive — Rothschild and gold (Herries commission)","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/rothschild_and_gold"},{"label":"The Rothschild Archive — Nathan Mayer Rothschild and the Waterloo commission","url":"https://rothschildarchive.org/business/n_m_rothschild_and_sons_london/nathan_mayer_rothschild_and_the_waterloo_commission"},{"label":"The Rothschild Archive — Lionel de Rothschild and the Suez Canal","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/lionel_de_rothschild_and_the_suez_canal"},{"label":"Fondation Napoléon — Le coup de Bourse des Rothschild à Waterloo : une légende tenace","url":"https://www.napoleon.org/enseignants/documents/le-coup-de-bourse-des-rothschild-a-waterloo-une-legende-tenace/"},{"label":"City A.M. — Rothschild family in £3.3bn bid to take Rothschild & Co private","url":"https://www.cityam.com/?p=1969577"},{"label":"Rothschild & Co — Annual Review 2025","url":"https://rothschildandcopublications.foleon.com/annual-review-2025/en/"}],"connections":[{"id":"rothschild-and-co","type":"ownership","label":"controls via Concordia"},{"id":"edmond-de-rothschild-group","type":"family","label":"Geneva branch's separate group"},{"id":"house-of-hesse-kassel","type":"finance","label":"Mayer Amschel was court agent to the Elector"},{"id":"cecil-rhodes","type":"finance","label":"backed De Beers in 1887; Natty was Rhodes's executor"},{"id":"bank-of-england","type":"finance","label":"bullion dealings and London bond market"},{"id":"baring-family","type":"trade","label":"rival London house in sovereign lending"},{"id":"g3-suez-canal-shares-1875","type":"finance","label":"£4m advance to buy the Khedive's shares"},{"id":"switzerland-banking-secrecy","type":"offshore","label":"Swiss private-banking arms (Zurich, Geneva)"}]},{"id":"rothschild-and-co","type":"entity","name":"Rothschild & Co (and Rothschild & Co Concordia SAS)","kind":"Bank / wealth manager","description":"This Paris-headquartered group combines the former English and French Rothschild houses. Its businesses are Global Advisory, Wealth and Asset Management, and Five Arrows merchant banking. In 2025 it reported revenue of €2,986m, net income of €413m and €143bn of client assets. The family holding company Rothschild & Co Concordia took it private in 2023 with partners reported to include Peugeot Invest and the Dassault family. The offer was €48 a share including distributions, valuing the group at about €3.7bn, and a squeeze-out at €38.60 ex-distribution followed.","start":1809,"geo":[48.875,2.312],"sources":[{"label":"Rothschild & Co — Annual Review 2025","url":"https://rothschildandcopublications.foleon.com/annual-review-2025/en/"},{"label":"Rothschild & Co — Concordia offer document (2023)","url":"https://www.rothschildandco.com/siteassets/publications/concordia/2023/en_offer_document_of_the_offeror_in_the_context_of_the_simplified_tender_offer_for_the_randco_shares.pdf"},{"label":"MarketScreener — Rothschild Concordia SAS with Peugeot Invest and Dassault family (2023)","url":"https://m.marketscreener.com/quote/stock/ROTHSCHILD-CO-5306/news/Rothschild-Concordia-SAS-along-with-Peugeot-Invest-Societe-anonyme-and-Dassault-family-and-others-44833031/"}],"connections":[{"id":"nm-rothschild","type":"ownership","label":"family concert controls via Concordia"},{"id":"peugeot-family","type":"finance","label":"Peugeot Invest co-financed the 2023 take-private"},{"id":"family-office","type":"legacy","label":"Concordia is the family's holding vehicle"}]},{"id":"edmond-de-rothschild-group","type":"entity","name":"Edmond de Rothschild Group","kind":"Bank / wealth manager","description":"This Geneva-based private bank and asset manager descends from the French branch of Edmond de Rothschild (1926–1997). It is separate from Rothschild & Co. It reported over CHF 184bn of assets under management at 31 December 2024, up 12% on the year. Ariane de Rothschild has been CEO since 2023. In 2025 a Luxembourg court ordered a €25m confiscation from its Luxembourg bank in a money-laundering case tied to 1MDB funds.","start":1953,"geo":[46.204,6.15],"sources":[{"label":"finews.asia — Edmond de Rothschild eyes 200 billion threshold (2024 results)","url":"https://www.finews.asia/finance/42982-edmond-de-rothschild-annual-results-2024-ariane-de-rothschild-asia-apac"},{"label":"Investment Officer Luxembourg — Edmond de Rothschild convicted of money laundering (2025)","url":"https://www.investmentofficer.lu/index.php/en/news/edmond-de-rothschild-convicted-money-laundering"}],"connections":[{"id":"nm-rothschild","type":"family","label":"French cadet branch"},{"id":"switzerland-banking-secrecy","type":"offshore","label":"Geneva private bank"},{"id":"luxembourg","type":"offshore","label":"Luxembourg banking subsidiary"}]},{"id":"fugger-family","name":"Fugger family (Fugger von der Lilie; Princes Fugger-Babenhausen and Counts Fugger)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Fustian weaving and textile trade","Loans to the Habsburgs secured on mines","Tyrolean silver and Hungarian copper","Papal transfers and indulgence money","Land and lordships (Kirchberg, Weissenhorn, Babenhausen)","Forestry"],"nation":"Germany","scale":"Significant","scaleBasis":"estimated","scaleNote":"At peak (1520s) the firm financed most of the 1519 imperial election, 543,385 of about 851,585 guilders (Swiss National Museum). Today the family's visible assets are its foundations, its forests and seats; the 'Fugger' bank is 99% insurer-owned.","start":1367,"end":null,"lifespan":"1367 (Hans Fugger arrives in Augsburg) – present","base":"Augsburg, Bavaria","geo":[48.369,10.904],"aliases":["Fugger von der Lilie","Fürst Fugger-Babenhausen","Fugger von Glött","Fugger-Kirchberg-Weissenhorn"],"origins":"Hans Fugger, a weaver, moved to Augsburg in 1367 and traded fustian. His grandson Jakob Fugger 'the Rich' (1459–1525) turned the firm into a lender to princes. He took mining revenues as security.","role_summary":"From 1487 the Fuggers lent to Archduke Sigismund of Tyrol against shares in Tyrolean silver and copper output, then to Maximilian I. From 1495 they leased and built up the Neusohl copper mines in Hungary (Banská Bystrica) with Johann Thurzo. When Maximilian died in 1519 owing about 350,000 guilders, Jakob put up 543,385 of the roughly 851,585 guilders paid to the electors to make Charles V emperor, and was repaid in mining rights and revenue assignments.","roleDetail":[{"t":"Silver mortgages in Tyrol, 1487.","d":"The first loan to Archduke Sigismund was secured on an interest in the Schwaz silver and copper mines, which made the firm a metal trader as well as a lender.","basis":"documented"},{"t":"Hungarian copper, 1495.","d":"With the mining expert Johann Thurzo, Jakob leased the Neusohl mines and built them into the leading copper centre of the age.","basis":"documented"},{"t":"Buying an emperor, 1519.","d":"Fugger supplied about two-thirds of the election money for Charles V. The Welsers and three Italian firms supplied the rest.","basis":"documented"},{"t":"Papal business.","d":"The firm handled transfers to the Curia, including indulgence proceeds of the 1510s, which Luther attacked.","basis":"interpretive"},{"t":"Habsburg defaults hollowed the firm.","d":"Repeated Spanish crown bankruptcies in the late 16th century left the firm with unrecoverable claims. The family then converted its money into land and titles.","basis":"interpretive"}],"legacy":"The fortune survives mainly as land, seats and foundations. The Fürstlich und Gräflich Fuggersche Stiftungen still run the Fuggerei, founded in 1521, where annual rent remains one Rhenish guilder (€0.88). They are financed mainly by forestry. The Fürst Fugger Privatbank carries the name but has been 99% owned by the Nürnberger insurance group since 1998, with 1% in family hands.","legacyDetail":[{"t":"Foundations run on timber.","d":"Since the late 1800s the foundations have been financed primarily by forestry income. Forests at Laugna, Bocksberg and Emersacker have been managed for over 200 years.","basis":"documented"},{"t":"Bank in the name only.","d":"Börsen-Zeitung (Jan 2025): Nürnberger has owned 99% since 1998. Client assets exceed €7bn. In March 2026 Bloomberg Línea reported that Vienna Insurance Group, which is buying Nürnberger, was preparing a possible sale of the bank, citing unnamed sources; no decision had been made.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current Forbes, Bloomberg or Manager Magazin figure for the Fugger family was found. Popular claims that Jakob Fugger was the 'richest man in history' are retrospective estimates, not filings.","grossAssets":{"text":"No consolidated accounts are published for the family lines or the foundations. The Fürst Fugger Privatbank published key figures for 2025; in March 2026 Bloomberg, citing unnamed sources, reported that Vienna Insurance Group (which is acquiring the bank's owner, Nürnberger) was considering a sale, with one source putting the value at about €120m; no decision had been announced. This is not family property.","source":{"label":"Bloomberg Línea — Banco de dinastia que financiou papas e imperadores pode estar à venda (Mar 2026)","url":"https://www.bloomberglinea.com.br/negocios/banco-de-dinastia-que-financiou-de-papas-a-imperadores-pode-estar-a-venda-dizem-fontes/"}},"controlled":{"text":"The family heads govern the Fuggersche Stiftungen, which own the Fuggerei and foundation forests (over 31,000 cubic metres of timber sold a year, per Unternehmeredition). The Fürst Fugger Privatbank's more than €7bn of client assets are managed for clients and owned by an insurer, so they are neither family wealth nor family-controlled.","source":{"label":"Fugger — Forest (official site)","url":"https://www.fugger.de/en/forest"}},"opaque":{"verdict":"none found","text":"Family assets sit in private estates and German foundations whose balance sheets are not published. No offshore structures were found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Fugger, Fürst Fugger Privatbank, Fürstlich und Gräflich Fuggersche Stiftungen, Hubertus Fürst Fugger-Babenhausen): name matches only, none shown to be this family or its vehicles; no press reporting found; Bundesanzeiger references for the bank; press on the foundations.","source":{"label":"Börsen-Zeitung — Fürst Fugger Privatbank sees no need to join consolidation (Jan 2025)","url":"https://boersen-zeitung.de/english/fuerst-fugger-privatbank-sees-no-need-to-participate-in-the-consolidation-wave"}},"gapNote":"The name suggests a living banking fortune, but the documented reality is smaller: the bank belongs to an insurer, and what the family controls is foundation forest and housing run for charity. Any 'Fugger fortune' figure today would be a guess."},"holdingsToday":[{"name":"Fürstlich und Gräflich Fuggersche Stiftungen (Fuggerei)","kind":"Foundation","sector":"Social housing, churches, forestry","where":"Augsburg","detail":"The Fuggerei, founded 1521, houses needy Catholic Augsburg residents at €0.88 a year.","basis":"documented","source":{"label":"Library of Congress — 500-year anniversary of the Fuggerei","url":"https://blogs.loc.gov/law/2021/08/500-year-anniversary-of-the-fuggerei-the-oldest-social-housing-complex-in-the-world/"}},{"name":"Foundation forests (Laugna, Bocksberg, Emersacker)","kind":"Agriculture & forestry","sector":"Forestry","where":"Swabia, Bavaria","detail":"The main source of foundation income since the late 1800s.","basis":"documented","source":{"label":"Fugger — Forest","url":"https://www.fugger.de/en/forest"}},{"name":"Fürst Fugger Privatbank (1% family)","kind":"Bank / wealth manager","sector":"Private banking","where":"Augsburg","detail":"99% owned by Nürnberger since 1998. Client assets above €7bn.","basis":"documented","source":{"label":"Börsen-Zeitung (Jan 2025)","url":"https://boersen-zeitung.de/english/fuerst-fugger-privatbank-sees-no-need-to-participate-in-the-consolidation-wave"}},{"name":"Babenhausen castle and Wellenburg","kind":"Rural land","sector":"Estates and seats","where":"Babenhausen and Augsburg","detail":"Owned by the Prince Fugger von Babenhausen line.","basis":"documented","source":{"label":"Store norske leksikon — Fugger","url":"https://snl.no/Fugger"}}],"slaveSiteId":"fugger-family","lineage":[{"name":"Hans Fugger","relation":"founder","years":"d. 1408/9","note":"A weaver who came to Augsburg in 1367 and traded fustian.","basis":"documented"},{"name":"Jakob Fugger 'the Rich'","relation":"descendant","years":"1459–1525","note":"Built the mining-and-lending empire. He funded the 1519 election and founded the Fuggerei.","basis":"documented"},{"name":"Anton Fugger","relation":"heir","years":"1493–1560","note":"Inherited the firm and continued lending to Charles V and Spain.","basis":"documented"},{"name":"Fürstlich und Gräflich Fuggersche Stiftungen","relation":"successor firm","years":"1521–present","note":"Foundations that carry Jakob's endowments. They are run by the senior family lines.","id":"g3-fugger-foundations","basis":"documented"},{"name":"Hubertus, 8th Prince Fugger-Babenhausen","relation":"descendant","years":"b. 1946","note":"Head of the Babenhausen line. He owns the Fuggerhäuser and Wellenburg.","basis":"documented"}],"today":"The family survives in the princely Fugger-Babenhausen line and the comital Glött and Kirchberg-Weissenhorn lines. Its heads govern the foundations, which run the Fuggerei on forestry income. The bank that bears the name is insurer-owned and was reported in March 2026, citing unnamed sources, to be a possible sale candidate.","today_people":[{"name":"Hubertus Fürst Fugger-Babenhausen","relation":"head of the princely line","role":"Owner of the Fuggerhäuser and Wellenburg. Minority shareholder in Fürst Fugger Privatbank.","sector":"Royalty & titles","year":2020,"basis":"documented","source":{"label":"Store norske leksikon — Fugger","url":"https://snl.no/Fugger"}}],"sources":[{"label":"Swiss National Museum blog — Jakob Fugger: money and spirit around 1500","url":"https://blog.nationalmuseum.ch/en/2020/03/jakob-fugger-money-and-spirit-around-1500/"},{"label":"Britannica — Fugger family","url":"https://www.britannica.com/topic/Fugger-family"},{"label":"habsburger.net — 'Sponsored by Fugger': trading houses as financial backers","url":"https://www.habsburger.net/en/chapter/sponsored-fugger-trading-houses-financial-backers"},{"label":"Börsen-Zeitung — Fürst Fugger Privatbank (Jan 2025)","url":"https://boersen-zeitung.de/english/fuerst-fugger-privatbank-sees-no-need-to-participate-in-the-consolidation-wave"},{"label":"Fugger — Forest (official site)","url":"https://www.fugger.de/en/forest"}],"connections":[{"id":"house-of-habsburg","type":"finance","label":"financed Maximilian I and the 1519 election of Charles V"},{"id":"holy-roman-empire","type":"political","label":"bought the imperial election, 1519"},{"id":"welser-family","type":"trade","label":"Augsburg co-lenders in 1519"},{"id":"g3-fugger-foundations","type":"trust","label":"family heads govern the foundations"},{"id":"g3-furst-fugger-privatbank","type":"legacy","label":"name and 1% stake remain"},{"id":"g3-habsburg-election-1519","type":"finance","label":"543,385 guilders lent"},{"id":"german-family-foundations","type":"trust","label":"German foundation model"}]},{"id":"g3-fugger-foundations","type":"entity","name":"Fürstlich und Gräflich Fuggersche Stiftungen (incl. the Fuggerei)","kind":"Trust / foundation","description":"These are the family foundations behind Jakob Fugger's 1521 endowment of the Fuggerei in Augsburg, the world's oldest social-housing complex still in use. Rent there remains one Rhenish guilder (€0.88) a year, plus a daily prayer. Since the late 1800s the foundations have been financed mainly by forestry income, plus entrance fees and donations.","start":1521,"geo":[48.37,10.905],"sources":[{"label":"Library of Congress — 500-year anniversary of the Fuggerei","url":"https://blogs.loc.gov/law/2021/08/500-year-anniversary-of-the-fuggerei-the-oldest-social-housing-complex-in-the-world/"},{"label":"Fugger — Forest (official site)","url":"https://www.fugger.de/en/forest"}],"connections":[{"id":"fugger-family","type":"trust","label":"governed by the family's senior lines"},{"id":"german-family-foundations","type":"trust","label":"German foundation model"}]},{"id":"g3-furst-fugger-privatbank","type":"entity","name":"Fürst Fugger Privatbank","kind":"Bank / wealth manager","description":"This Augsburg private bank carries the Fugger name. Nürnberger Versicherung has owned 99% of it since 1998, with 1% in family ownership. Client assets passed €7bn in 2024. In March 2026 Bloomberg Línea reported that Vienna Insurance Group, which is acquiring Nürnberger, was preparing a possible sale; one source put its value at about €120m, and no decision had been made.","start":1998,"geo":[48.366,10.898],"sources":[{"label":"Börsen-Zeitung — Fürst Fugger Privatbank sees no need to join the consolidation wave (Jan 2025)","url":"https://boersen-zeitung.de/english/fuerst-fugger-privatbank-sees-no-need-to-participate-in-the-consolidation-wave"},{"label":"Bloomberg Línea — Banco de dinastia que financiou papas e imperadores pode estar à venda (Mar 2026)","url":"https://www.bloomberglinea.com.br/negocios/banco-de-dinastia-que-financiou-de-papas-a-imperadores-pode-estar-a-venda-dizem-fontes/"}],"connections":[{"id":"fugger-family","type":"legacy","label":"family keeps the name and a 1% stake"}]},{"id":"medici-family","name":"Medici family (Medici Bank; Grand Dukes of Tuscany)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Wool and cloth trade","Papal depositary banking","Bills of exchange across a branch network","Alum monopoly","Political rule of Florence and Tuscany"],"nation":"Italy","scale":"Dominant","scaleBasis":"documented","scaleNote":"In the early 15th century the Rome branch, serving the papal court, produced more than half of the Medici Bank's profits (de Roover's figures, as summarised by Wikipedia and Brewminate).","start":1397,"end":1743,"lifespan":"1397 (bank founded) – 1494 (bank collapses); line extinct 1737/1743","base":"Florence","geo":[43.775,11.256],"aliases":["Banco dei Medici","Grand Dukes of Tuscany"],"origins":"Giovanni di Bicci de' Medici separated his bank from his relative's Roman business in 1397 and moved its seat to Florence. Over long years in Rome he had built close ties to the papal Curia.","role_summary":"The Medici became depositaries of the Apostolic Chamber. Papal revenues collected across Europe flowed through their branches as bills of exchange, giving them cheap deposits and fees. Branches in Rome, Venice, Geneva/Lyon, Bruges, London and Avignon lent to merchants and princes. Cosimo and Lorenzo converted bank profits into control of Florence, and later Medici became popes and Grand Dukes.","roleDetail":[{"t":"Papal deposits as cheap capital.","d":"Holy See deposits gave the bank capital to invest elsewhere. The Rome branch produced over 50% of profits early in the century, by some counts up to 62%.","basis":"documented"},{"t":"Bills of exchange avoided usury bans.","d":"Profits were earned on exchange transactions between branches rather than on openly charged interest.","basis":"interpretive"},{"t":"Loans to princes broke the branches.","d":"Bad loans, including to rulers through the London and Bruges branches, weak management and poor coordination contributed to the collapse.","basis":"documented"},{"t":"The bank fell in 1494.","d":"Piero de' Medici's exile during the French invasion precipitated the closure of the remaining branches.","basis":"documented"}],"legacy":"No Medici banking capital survives. The lasting asset is cultural. By the Family Pact of 31 October 1737, Anna Maria Luisa de' Medici, the last of the line, left the dynasty's collections to the new Lorraine rulers on condition that nothing leave Florence. Those collections form the basis of the Uffizi and Pitti holdings.","legacyDetail":[{"t":"Collections bound to Florence.","d":"The 1737 Family Pact, confirmed in her will of 1739, took effect on her death in 1743.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"The family line is extinct (1737/1743). No modern wealth figure exists, and claims by people with the Medici surname are not documented descent from the banking line.","gapNote":"The Medici fortune is now public patrimony: the collections are owned by the Italian state, not by heirs."},"holdingsToday":[{"name":"Uffizi and Pitti collections (Family Pact, 1737)","kind":"Art & collections","sector":"Culture","where":"Florence","detail":"Medici collections bequeathed on condition they never leave Florence. Now state museums.","basis":"documented","source":{"label":"Conosci Firenze — Anna Maria Luisa and the Family Pact","url":"https://conoscifirenze.it/history/1142-anna-maria-luisa-and-the-family-pact.html"}}],"lineage":[{"name":"Giovanni di Bicci de' Medici","relation":"founder","years":"1360–1429","note":"Founded the bank in 1397 and won the papal account.","basis":"documented"},{"name":"Cosimo de' Medici","relation":"son","years":"1389–1464","note":"Expanded the branches and turned bank wealth into control of Florence.","basis":"documented"},{"name":"Lorenzo 'il Magnifico'","relation":"descendant","years":"1449–1492","note":"Presided over the bank's decline while spending on politics and patronage.","basis":"documented"},{"name":"Anna Maria Luisa de' Medici","relation":"heiress","years":"1667–1743","note":"Last of the line. She bound the collections to Florence by the 1737 Family Pact.","basis":"documented"}],"today":"The line is extinct. Its money ended up as Florence's public art collections and buildings.","today_people":[],"sources":[{"label":"Wikipedia — Medici Bank","url":"https://en.wikipedia.org/wiki/Medici_Bank"},{"label":"Brewminate — The rise and fall of the Medici Bank","url":"https://brewminate.com/medici-bank-rise-fall-florence/"},{"label":"Conosci Firenze — Anna Maria Luisa and the Family Pact","url":"https://conoscifirenze.it/history/1142-anna-maria-luisa-and-the-family-pact.html"},{"label":"Raymond de Roover — The Rise and Decline of the Medici Bank, 1397–1494 (Norton)","url":"https://www.bookshare.org/browse/book/1986150"}],"connections":[{"id":"bardi-peruzzi","type":"legacy","label":"succeeded the 14th-century Florentine super-companies"},{"id":"house-of-habsburg","type":"political","label":"Lorraine–Habsburg succession in Tuscany, 1737"},{"id":"fugger-family","type":"legacy","label":"papal banking passed to Augsburg houses in the 16th century"},{"id":"city-of-london-corporation","type":"finance","label":"Medici London branch lent to English kings and failed"}]},{"id":"bardi-peruzzi","name":"Bardi and Peruzzi companies (Florence)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Grain and wool trade","Papal and Angevin banking","Loans to Edward III secured on wool and customs"],"nation":"Italy","scale":"Dominant","scaleBasis":"documented","scaleNote":"They were the largest of the medieval 'super-companies'. The chronicler Villani put Edward III's debts at about 900,000 florins to the Bardi and 600,000 to the Peruzzi, though Hunt argues the Peruzzi never had that much capital.","start":1250,"end":1346,"lifespan":"late 13th century – 1343–46 bankruptcies (Bardi family continued)","base":"Florence","geo":[43.766,11.256],"aliases":["Compagnia dei Bardi","Peruzzi company"],"origins":"Both Florentine merchant families built international companies trading grain, wool and cloth. They also handled papal and Angevin Neapolitan finances in the early 14th century.","role_summary":"From the 1330s the Bardi and Peruzzi lent heavily to Edward III of England to fund his wars in Scotland and France. They took grants of wool and assignments of customs and taxes as repayment. Loans in 1338–39 exhausted both firms. When repayment faltered and the Florentine and Neapolitan economies turned, the Peruzzi failed in 1343 and the Bardi in 1346.","roleDetail":[{"t":"Wool for credit.","d":"Repayment came as wool export licences and customs assignments, which tied the firms to English royal policy.","basis":"documented"},{"t":"The war loans of 1338–39.","d":"Britannica: those loans 'exhausted both Peruzzi and Bardi resources'.","basis":"documented"},{"t":"Default was only part of the story.","d":"Hunt (1990, 1994) argues that Edward's default was too small to explain the collapse alone. Losses in Naples and Florence and a credit squeeze also mattered, and Edward repaid part in cash and wool.","basis":"documented"}],"legacy":"The companies were liquidated. The Bardi family survived as Florentine nobility and later invested in Iberian voyages, but no continuous fortune survives. The episode is the classic warning on sovereign lending.","legacyDetail":[{"t":"No surviving vehicle.","d":"No company, foundation or estate can be traced from the super-companies to today.","basis":"interpretive"}],"wealth":{"published":[],"publishedNote":"Defunct since the 1340s. No modern figure exists."},"holdingsToday":[{"name":"None: the companies were liquidated in 1343–46","kind":"Other","sector":"—","where":"Florence","detail":"No successor vehicle is documented.","basis":"interpretive","source":{"label":"Britannica — Peruzzi family","url":"https://www.britannica.com/topic/Peruzzi-family"}}],"lineage":[{"name":"Compagnia dei Bardi","relation":"founder","years":"c. 1250–1346","note":"The larger of the two lenders to Edward III.","basis":"documented"},{"name":"Peruzzi company","relation":"partner firm","years":"c. 1275–1343","note":"Lent with the Bardi and later alone. Bankrupt 1343.","basis":"documented"},{"name":"Medici Bank","relation":"successor firm","years":"1397–1494","note":"Florence's next banking network, built on papal business.","id":"medici-family","basis":"interpretive"}],"today":"Both companies ended in the 1340s. No modern business descends from them.","today_people":[],"sources":[{"label":"Britannica — Peruzzi family","url":"https://www.britannica.com/topic/Peruzzi-family"},{"label":"E. S. Hunt — A new look at the dealings of the Bardi and Peruzzi with Edward III (Journal of Economic History, 1990)","url":"https://resolve.cambridge.org/core/journals/journal-of-economic-history/article/new-look-at-the-dealings-of-the-bardi-and-peruzzi-with-edward-iii/2AD04842FACDAE9D0A660EDCD72EC097"},{"label":"E. S. Hunt — The Medieval Super-companies (Cambridge UP, 1994)","url":"https://www.cambridge.org/core/books/medieval-supercompanies/introduction/ED84CB6808B41CFE1D63A8C924F4A0D5"},{"label":"Wikipedia — Compagnia dei Bardi","url":"https://en.wikipedia.org/wiki/Compagnia_dei_Bardi"}],"connections":[{"id":"medici-family","type":"legacy","label":"Florentine banking leadership passed to the Medici"},{"id":"g3-edward-iii-default","type":"finance","label":"lent to Edward III for the Hundred Years' War"},{"id":"hanseatic-league","type":"trade","label":"competed for English wool and royal credit"},{"id":"magna-carta","type":"political","label":"English crown finance under parliamentary consent"}]},{"id":"welser-family","name":"Welser family (Augsburg and Nuremberg)","category":"Banking & Merchant Dynasties","role":"Trade & Chartered Monopoly","moneySources":["Long-distance spice and textile trade","Loans to Charles V","Venezuela charter (Klein-Venedig)","Slave-trade licence (1528)"],"nation":"Germany","scale":"Major","scaleBasis":"estimated","scaleNote":"They were second only to the Fuggers among Augsburg lenders, supplying part of the 1519 election money and receiving the Province of Venezuela in 1528 as security for crown debts.","start":1246,"end":null,"lifespan":"13th century – present (Augsburg line extinct 1797; Ulm barons' line and family foundation survive)","base":"Augsburg","geo":[48.368,10.898],"aliases":["Welser-Gesellschaft","Klein-Venedig","Welser von Neunhof"],"origins":"The Welsers held civic offices in Augsburg from the 13th century. Anton Welser was among the first Germans to use the Portuguese sea route to the East for the spice trade.","role_summary":"Bartholomeus V Welser lent heavily to Charles V, including for the 1519 imperial election. Under the 1528 Contract of Madrid the crown repaid him with colonial rights: the Province of Venezuela (Klein-Venedig) to explore, rule and mine. The same year a licence (asiento) let the firm ship 4,000 enslaved Africans to the Spanish Caribbean. The colony brought little profit and the charter was revoked in 1546.","roleDetail":[{"t":"Crown credit turned into a colony.","d":"Venezuela was granted in 1528 in return for debts Charles V owed from the 1519 election.","basis":"documented"},{"t":"A slaving licence.","d":"A royal document of 15 February 1528 records the contract to send and sell 4,000 enslaved Africans in the Caribbean.","basis":"documented"},{"t":"Venture collapse, 1546.","d":"Charles V revoked the charter. Bartholomeus VI and Philipp von Hutten were executed at El Tocuyo that year.","basis":"documented"}],"legacy":"The trading company did not survive the 16th–17th-century Habsburg defaults. The Welsersche Familienstiftung, founded on 1 April 1539, still exists and is administered by the Ulm baronial branch. It has owned castles in Germany.","legacyDetail":[{"t":"A 1539 family foundation.","d":"The family foundation still exists, but its assets are not published.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No published wealth figure. The family foundation does not publish accounts.","opaque":{"verdict":"none found","text":"Only the 1539 Familienstiftung is documented, and its assets are not public.","searched":"Web search for Welsersche Familienstiftung assets; ICIJ (surname, no press reporting found); ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Welser, Welsersche Familienstiftung): name matches only, none shown to be this family or its vehicles","source":{"label":"Wikipedia — Welser family","url":"https://en.wikipedia.org/wiki/Welser_family"}}},"holdingsToday":[{"name":"Welsersche Familienstiftung","kind":"Foundation","sector":"Family property","where":"Bavaria","detail":"Founded 1539 and still in existence. It has owned castles.","basis":"documented","source":{"label":"Wikipedia — Welser family","url":"https://en.wikipedia.org/wiki/Welser_family"}}],"lineage":[{"name":"Anton Welser","relation":"founder","years":"d. 1518","note":"Opened the firm's sea-route spice trade.","basis":"documented"},{"name":"Bartholomeus V Welser","relation":"descendant","years":"1484–1561","note":"Lender to Charles V. He received Venezuela in 1528 and was ennobled in 1532.","basis":"documented"},{"name":"Philippine Welser","relation":"descendant","years":"1527–1580","note":"Married Archduke Ferdinand of Austria in secret.","basis":"documented"},{"name":"Welsersche Familienstiftung","relation":"successor firm","years":"1539–present","note":"Holds remaining family property.","basis":"documented"}],"today":"The Ulm baronial branch survives and administers the 1539 family foundation. No banking or trading business survives.","today_people":[],"sources":[{"label":"Wikipedia — Welser family","url":"https://en.wikipedia.org/wiki/Welser_family"},{"label":"Wikipedia — Klein-Venedig","url":"https://en.wikipedia.org/wiki/Klein-Venedig"},{"label":"First Blacks in the Americas — Royal document, Burgos, 15 Feb 1528 (Welser asiento)","url":"https://firstblacks.org/en/?p=3460"},{"label":"Swiss National Museum blog — Jakob Fugger (1519 election financing)","url":"https://blog.nationalmuseum.ch/en/2020/03/jakob-fugger-money-and-spirit-around-1500/"}],"connections":[{"id":"fugger-family","type":"trade","label":"Augsburg co-lenders and rivals"},{"id":"house-of-habsburg","type":"finance","label":"lent to Charles V"},{"id":"g3-habsburg-election-1519","type":"finance","label":"part of the election money"},{"id":"german-family-foundations","type":"trust","label":"Familienstiftung of 1539"}]},{"id":"wallenberg-family","name":"Wallenberg family (Investor AB, SEB, Wallenberg Foundations)","category":"Banking & Merchant Dynasties","role":"Modern Finance & Holding","moneySources":["Stockholms Enskilda Bank (1856)","Industrial rescues and conversions of bank loans into equity","Investor AB holding company (1916)","Foundation ownership (1917–)","Private equity (EQT, 1994)"],"nation":"Sweden","scale":"Dominant","scaleBasis":"documented","scaleNote":"Investor AB, which the Wallenberg foundations control with 50% of the votes, reported adjusted net asset value of SEK 1,258.0bn at 30 September 2026.","start":1856,"end":null,"lifespan":"1856–present","base":"Stockholm","geo":[59.329,18.074],"aliases":["Wallenbergsfären","Wallenberg sphere","FAM / Wallenberg Investments"],"origins":"André Oscar Wallenberg (1816–1886), a naval officer and son of the Bishop of Linköping, founded Stockholms Enskilda Bank in 1856. The bank merged in 1972 into SEB.","role_summary":"The Wallenbergs made their money as bankers who became owners. Enskilda Bank lent to Swedish industry and, in crises, took equity in borrowers such as Atlas, ASEA and Ericsson. Banking law later separated banks from industrial shareholdings, so in 1916 the family founded Investor to hold them. From 1917 Knut Wallenberg began moving the family's own wealth into foundations. The result is a fortune the family controls rather than owns: the three largest foundations hold 23.3% of Investor's capital and 50% of its votes.","roleDetail":[{"t":"A bank founded in 1856.","d":"Stockholms Enskilda Bank financed railways and industry and later merged into SEB (1972).","basis":"documented"},{"t":"Loans converted to ownership.","d":"Rescues of indebted industrial clients left the bank holding shares. Investor (1916) was created to hold such stakes.","basis":"interpretive"},{"t":"Foundations from 1917.","d":"Knut and Alice Wallenberg set up their foundation in 1917. There are now 16 Wallenberg foundations, which granted SEK 3.1bn to Swedish research and education in 2025.","basis":"documented"},{"t":"Dual-class control.","d":"A shares carry more votes than B shares. That is how 23.3% of capital becomes 50% of votes at Investor.","basis":"documented"},{"t":"Private equity since 1994.","d":"The family co-founded EQT in 1994. In October 2026 Investor bought 12.5m EQT shares (SEK 3.5bn) from Wallenberg Investments, taking it to 14.98%.","basis":"documented"}],"legacy":"The money sits in Investor AB: listed stakes in ABB, Atlas Copco, AstraZeneca, SEB, Ericsson, Saab, Epiroc and others; Patricia Industries (Mölnlycke and other wholly owned companies); and 14.98% of EQT. Investor is controlled by the Knut and Alice Wallenberg Foundation and its sister foundations, whose dividends fund Swedish science. Investor paid SEK 3.7bn to the foundations in 2025.","legacyDetail":[{"t":"Control without ownership.","d":"The foundations, not the family, hold the shares. Family members chair the boards that appoint company chairs.","basis":"documented"},{"t":"Family investment arm.","d":"Wallenberg Investments sold EQT shares to Investor in 2026 in a related-party deal confirmed by an independent valuation. It is understood to be the foundations' investment company, formerly FAM.","basis":"interpretive"}],"wealth":{"published":[],"publishedNote":"No Forbes, Bloomberg Billionaires or Swedish rich-list figure for the Wallenberg family as private owners was found. Online figures (for example $19.3bn on a MarketScreener page, 2024) count the foundations' Investor stake as 'family' and are not family wealth.","grossAssets":{"text":"Investor AB adjusted NAV: SEK 1,258.0bn at 30 Sep 2026 (about $130bn). Leverage was 1.8% (2.1% at end-2025). This is Investor's equity, owned by all its shareholders, of which the foundations hold 23.3% of capital.","source":{"label":"Investor AB — Interim management statement Jan–Sep 2026 (via Inderes)","url":"https://www.inderes.se/releases/investor-interim-management-statement-january-september-2026"}},"controlled":{"text":"Through 50% of Investor's votes the foundations, whose boards family members chair, steer a portfolio worth over SEK 1.25 trillion. Through Investor's stakes they also influence board appointments at ABB, Atlas Copco, Ericsson, SEB, Saab and others, plus EQT, which manages third-party funds. This reach is far larger than any personal family wealth.","source":{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}},"opaque":{"verdict":"none found","text":"The foundations are Swedish public-benefit foundations that publish grants (SEK 3.1bn in 2025). The personal assets of individual family members are not public. No offshore structures were found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: EQT AB, Investor AB, Investor listed holdings: ABB, Atlas Copco, AstraZeneca, SEB, Ericsson, Saab, Epiroc, Nasdaq, Wärtsilä, Jacob Wallenberg, Knut and Alice Wallenberg Foundation and 15 sister foundations, Marcus Wallenberg …): name matches only, none shown to be this family or its vehicles; no press reporting found; Investor AB filings; Wallenberg Foundations site.","source":{"label":"Wallenberg Foundations — Ownership and grants","url":"https://www.wallenberg.com/en/node/15"}},"gapNote":"This is the clearest case of control exceeding ownership in Europe. The family's private fortune is unpublished and probably modest by comparison, while the foundations whose boards it chairs command 50% of the votes in a SEK 1.26 trillion company. Headline 'Wallenberg net worth' figures online appear to mistake foundation-held shares for family property."},"holdingsToday":[{"name":"Investor AB (via the Wallenberg Foundations)","kind":"Listed stake","sector":"Industrial holding company","where":"Stockholm","detail":"Foundations: 23.3% of capital, 50% of votes. Adjusted NAV SEK 1,258.0bn (Sep 2026).","basis":"documented","source":{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}},{"name":"Investor listed holdings: ABB, Atlas Copco, AstraZeneca, SEB, Ericsson, Saab, Epiroc, Nasdaq, Wärtsilä","kind":"Listed stake","sector":"Engineering, pharma, banking, defence, telecoms","where":"Sweden, Switzerland, UK, US","detail":"Listed Companies segment returned 22% in 2025.","basis":"documented","source":{"label":"Investor AB — Year-end report 2025","url":"https://news.cision.com/investor/r/year-end-report-2025,c4295997"}},{"name":"Patricia Industries (Mölnlycke and others)","kind":"Private company","sector":"Healthcare and industrial","where":"Sweden / global","detail":"Wholly owned subsidiaries. Mölnlycke plans to split into two companies (2026).","basis":"documented","source":{"label":"Investor AB — Interim management statement Jan–Sep 2026","url":"https://www.inderes.dk/en/releases/investor-interim-management-statement-january-september-2026"}},{"name":"EQT AB (14.98%)","kind":"Fund / private equity","sector":"Private equity manager","where":"Stockholm","detail":"Investor raised its stake to 14.98% in Oct 2026 by buying from Wallenberg Investments.","basis":"documented","source":{"label":"Investor AB — Investor acquires shares in EQT from Wallenberg Investments (Oct 2026)","url":"https://www.placera.se/pressmeddelanden/investor-acquires-shares-in-eqt-from-wallenberg-investments-20261016"}},{"name":"Knut and Alice Wallenberg Foundation and 15 sister foundations","kind":"Foundation","sector":"Research philanthropy","where":"Stockholm","detail":"SEK 3.1bn of grants in 2025. SEK 13.2bn over five years.","basis":"documented","source":{"label":"Wallenberg Foundations","url":"https://www.wallenberg.com/en/node/15"}}],"slaveSiteId":"wallenberg-family","lineage":[{"name":"André Oscar Wallenberg","relation":"founder","years":"1816–1886","note":"Founded Stockholms Enskilda Bank in 1856.","basis":"documented"},{"name":"Knut Agathon Wallenberg","relation":"son","years":"1853–1938","note":"Founded the Knut and Alice Wallenberg Foundation in 1917.","basis":"documented"},{"name":"Marcus Wallenberg Jr.","relation":"descendant","years":"1899–1982","note":"Built the post-war industrial sphere. He oversaw the 1972 merger into SEB.","basis":"documented"},{"name":"Jacob Wallenberg","relation":"descendant","years":"b. 1956","note":"Chair of Investor AB.","basis":"documented"}],"today":"Jacob Wallenberg chairs Investor AB (re-elected May 2026), and Marcus Wallenberg sits on its board. The Wallenberg Foundations are Investor's largest shareholder. The family's role is that of governors of foundation capital, not owners of it.","today_people":[{"name":"Jacob Wallenberg","relation":"fifth-generation descendant","role":"Chair, Investor AB","sector":"Banking & finance","year":2026,"basis":"documented","source":{"label":"Investor AB — Notice of AGM, 7 May 2026","url":"https://news.cision.com/investor/r/notice-of-investor-ab-s-annual-general-meeting-on-may-7--2026,c4327045"}},{"name":"Marcus Wallenberg","relation":"family member","role":"Board member, Investor AB","sector":"Banking & finance","year":2026,"basis":"documented","source":{"label":"Investor AB — Notice of AGM, 7 May 2026","url":"https://news.cision.com/investor/r/notice-of-investor-ab-s-annual-general-meeting-on-may-7--2026,c4327045"}}],"sources":[{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"},{"label":"Wallenberg Foundations — History","url":"https://wallenberg.com/en/history"},{"label":"Investor AB — Year-end report 2025","url":"https://news.cision.com/investor/r/year-end-report-2025,c4295997"},{"label":"Investor AB — Interim management statement Jan–Sep 2026 (Inderes)","url":"https://www.inderes.se/releases/investor-interim-management-statement-january-september-2026"},{"label":"Investor AB — Acquisition of EQT shares from Wallenberg Investments (Oct 2026)","url":"https://www.placera.se/pressmeddelanden/investor-acquires-shares-in-eqt-from-wallenberg-investments-20261016"}],"connections":[{"id":"investor-ab","type":"ownership","label":"controls 50% of votes via foundations"},{"id":"g3-wallenberg-foundations","type":"trust","label":"family chairs the foundations"},{"id":"house-of-bernadotte","type":"political","label":"Swedish establishment"},{"id":"schroder-family","type":"legacy","label":"comparison: voting control above economic stake"}]},{"id":"investor-ab","type":"entity","name":"Investor AB","kind":"Holding company","description":"Investor AB was founded by the Wallenberg family in 1916 and is listed in Stockholm. It reported adjusted net asset value of SEK 1,087.1bn at end-2025 and SEK 1,258.0bn (SEK 411 a share) at 30 September 2026. Its portfolio has three areas: listed companies (ABB, Atlas Copco, AstraZeneca, SEB, Ericsson, Saab and others), Patricia Industries (wholly owned companies such as Mölnlycke), and a 14.98% stake in EQT. The three largest Wallenberg foundations hold 23.3% of capital and 50% of votes.","start":1916,"geo":[59.333,18.071],"sources":[{"label":"Investor AB — Year-end report 2025","url":"https://news.cision.com/investor/r/year-end-report-2025,c4295997"},{"label":"Investor AB — Interim management statement Jan–Sep 2026","url":"https://www.inderes.dk/en/releases/investor-interim-management-statement-january-september-2026"},{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"}],"connections":[{"id":"wallenberg-family","type":"ownership","label":"family-founded and chaired"},{"id":"g3-wallenberg-foundations","type":"ownership","label":"foundations hold 50% of votes"}]},{"id":"g3-wallenberg-foundations","type":"entity","name":"Wallenberg Foundations (Knut and Alice Wallenberg Foundation and sister foundations)","kind":"Trust / foundation","description":"This is the collective name for 16 foundations established by Wallenberg family members, the oldest dating from 1917. The three largest hold 23.3% of Investor AB's capital and 50% of its votes. In 2025 they granted SEK 3.1bn to Swedish research and education, and SEK 13.2bn over the last five years.","start":1917,"geo":[59.332,18.065],"sources":[{"label":"Wallenberg Foundations — Ownership","url":"https://www.wallenberg.com/en/node/15"},{"label":"Knut and Alice Wallenberg Foundation — Acquisition of shares in Investor AB","url":"https://kaw.wallenberg.org/en/node/375"}],"connections":[{"id":"investor-ab","type":"ownership","label":"largest shareholder, 50% of votes"},{"id":"wallenberg-family","type":"trust","label":"family members chair the boards"},{"id":"german-family-foundations","type":"legacy","label":"comparable foundation-control model"}]},{"id":"baring-family","name":"Baring family (Baring Brothers & Co.)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Exeter wool and cloth trade","London merchant banking (1762)","Sovereign bond issuance (Louisiana 1803, French indemnity 1817)","Argentine and Latin American loans","Peerages and landed estates"],"nation":"United Kingdom","scale":"Significant","scaleBasis":"documented","scaleNote":"At peak Barings channelled about £140m of investment to Argentina in 1885–90 (Bank Underground). In 1995 £827m of trading losses destroyed the bank and ING bought it for £1.","start":1762,"end":1995,"lifespan":"1762–1995 (bank); family and peerages continue","base":"Bishopsgate, City of London","geo":[51.516,-0.081],"aliases":["Baring Brothers & Co.","Barings","Earls of Cromer and Northbrook","Barons Ashburton and Revelstoke"],"origins":"Johann Baring, a Bremen cloth merchant, settled in Exeter. His sons John and Francis founded the London house in 1762, which grew from trade finance into a lender to governments.","role_summary":"Barings earned commissions and discounts by buying government bonds and reselling them to investors. In 1803 Barings and Hope & Co bought the $11.25m of 6% US bonds that paid France for Louisiana at a 13.3% discount (FF52m for FF60m of bonds), roughly FF8m or $1.5m of discount in total. After 1815 they financed France's war indemnity. Over-exposure to Argentina forced the Bank of England's 1890 rescue. In 1995 unauthorised trading by Nick Leeson in Singapore caused £827m of losses.","roleDetail":[{"t":"Bond-buying spreads.","d":"On Louisiana the bankers bought at a discount and sold 'at or above par', keeping much of the spread (Baring Archive).","basis":"documented"},{"t":"Argentina and the 1890 crisis.","d":"Unsold Argentine bonds froze Barings' capital. The Bank of England organised a £17m guarantee fund and split the firm into a good bank and a bad bank.","basis":"documented"},{"t":"Peerages and land.","d":"Profits bought estates and five peerages (Ashburton, Northbrook, Revelstoke, Cromer, Howick). Alexander Baring became Lord Ashburton in 1835.","basis":"interpretive"},{"t":"Collapse in 1995.","d":"Leeson's hidden error account 88888 ran up £827m of losses, about twice Barings' trading capital. ING bought the group for £1.","basis":"documented"}],"legacy":"The family no longer owns a bank. ING absorbed Barings in 1995; the asset-management arm was later sold and now trades as Barings under MassMutual, an unrelated owner. The Baring Foundation (1969) became independent after the collapse, and its endowment came from the separate Manor Park Charitable Trust. The Baring Archive preserves the records.","legacyDetail":[{"t":"Foundation survived the bank.","d":"The Baring Foundation has given over £120m in grants since 1969. ING donated services and office space after 1995.","basis":"documented"},{"t":"Family wealth now private and dispersed.","d":"It is held across peerage estates and personal portfolios. No consolidated vehicle is documented.","basis":"interpretive"}],"wealth":{"published":[],"publishedNote":"No Sunday Times Rich List figure for the Baring family was found in recent editions.","controlled":{"text":"The family no longer controls client money. The Baring Foundation's endowment is governed by independent trustees.","source":{"label":"Baring Foundation — Our history","url":"https://baringfoundation.org.uk/about-us/our-history/"}},"opaque":{"verdict":"none found","text":"Private estates of the Baring peers are not public.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Baring, The Baring Foundation): name matches only, none shown to be this family or its vehicles; no press reporting found; Charity Commission (Baring Foundation 258583).","source":{"label":"Charity Commission — The Baring Foundation","url":"https://register-of-charities.charitycommission.gov.uk/en/about-the-register-of-charities/-/charity-details/258583/full-print"}},"gapNote":"The Barings show capital moving away from a family. The bank's franchise went to ING for £1, and the 'Barings' asset manager of today has no family ownership."},"holdingsToday":[{"name":"The Baring Foundation","kind":"Foundation","sector":"Philanthropy","where":"London","detail":"Independent since 1995. Over £120m in grants since 1969.","basis":"documented","source":{"label":"Baring Foundation — Our history","url":"https://baringfoundation.org.uk/about-us/our-history/"}},{"name":"The Baring Archive","kind":"Art & collections","sector":"Archives","where":"London","detail":"Business records of Barings since 1762.","basis":"documented","source":{"label":"The Baring Archive — The Louisiana Purchase","url":"https://baringarchive.org.uk/exhibition/the-louisiana-purchase/"}}],"lineage":[{"name":"Sir Francis Baring","relation":"founder","years":"1740–1810","note":"Co-founded the London house in 1762.","basis":"documented"},{"name":"Alexander Baring, 1st Baron Ashburton","relation":"son","years":"1774–1848","note":"Negotiated the Louisiana bond deal in Paris and Washington.","basis":"documented"},{"name":"Edward Baring, 1st Baron Revelstoke","relation":"descendant","years":"1828–1897","note":"Senior partner during the 1890 Argentine crisis.","basis":"documented"},{"name":"Barings plc → ING","relation":"successor firm","years":"1995","note":"Sold for £1 after Leeson's losses.","id":"g3-barings-bank","basis":"documented"}],"today":"The family's titles survive, and its name is attached to an independent foundation and an archive. It no longer owns a bank.","today_people":[],"sources":[{"label":"The Baring Archive — The
