urces":["Strip-iron rolling mill (1871)","Coal and steel (Ruhr)","Dutch bank and shipping (BHS)","Art collection","Diversified holding (TBG)"],"nation":"Germany / Netherlands / Spain","scale":"Significant","scaleBasis":"estimated","scaleNote":"No current rich-list figure; the Thyssen-Bornemisza collection was bought by the Spanish state for about $350m in 1993 (Sotheby's).","start":1871,"end":null,"lifespan":"1871–present","base":"Duisburg-Hamborn; later Lugano and Madrid","geo":[51.495,6.775],"aliases":["August Thyssen-Hütte","Vereinigte Stahlwerke","Thyssen-Bornemisza Group (TBG)","Bank voor Handel en Scheepvaart","Fritz Thyssen Stiftung"],"origins":"August Thyssen (1842–1926), born in Eschweiler, founded a strip-iron rolling mill in Styrum near Mülheim in 1871 and built the Gewerkschaft Deutscher Kaiser steel and coal complex at Hamborn.","role_summary":"August Thyssen built one of the Ruhr's largest vertically integrated coal and steel groups. His son Fritz chaired the 1926 steel trust Vereinigte Stahlwerke and was an early financial backer of Hitler before breaking with the regime in 1939, when his German assets were confiscated. His other son Heinrich moved to the Netherlands and Hungary (taking the name Thyssen-Bornemisza), keeping assets abroad through the Rotterdam Bank voor Handel en Scheepvaart, which became the base of the TBG group and one of Europe's great private art collections.","roleDetail":[{"t":"Ruhr coal and steel.","d":"August Thyssen integrated mines, blast furnaces and rolling mills at Hamborn, becoming one of Germany's leading industrialists before 1914.","basis":"documented"},{"t":"The steel trust, 1926.","d":"Fritz Thyssen became chair of the supervisory board of Vereinigte Stahlwerke, the steel trust formed in 1926, as representative of its biggest private shareholder (26%).","basis":"documented"},{"t":"Backer, then exile.","d":"Fritz Thyssen supported Hitler early and joined the Nazi party in 1931, then broke with the regime over the war in 1939; his German fortune was confiscated. The book 'I Paid Hitler' (1941) was ghost-written and historians treat it as unreliable.","basis":"documented"},{"t":"The Dutch bank.","d":"The Bank voor Handel en Scheepvaart in Rotterdam (founded by the family around 1916–18) handled the family's assets abroad; its US affiliate Union Banking Corporation was seized by the US government in 1942.","basis":"documented"},{"t":"Art into a national museum.","d":"Hans Heinrich Thyssen-Bornemisza sold 775 works to the Spanish state in 1993 for about $350m, forming the Museo Nacional Thyssen-Bornemisza in Madrid.","basis":"documented"}],"legacy":"The Thyssen steel business merged with Krupp in 1999 to form thyssenkrupp; the family holds no significant stake today. The Fritz Thyssen Stiftung (founded 1959 by Fritz's widow and daughter) funds research. The Thyssen-Bornemisza line's wealth sits in private holdings and art, including Carmen Thyssen-Bornemisza's collection on loan to Spain.","legacyDetail":[{"t":"Madrid museum and loans.","d":"The Spanish state owns the 1993 collection; Carmen Cervera's separate collection has been on loan, with long-running negotiations over its future.","basis":"documented"},{"t":"Offshore-held art purchases (ICIJ).","d":"ICIJ reported in 2013 that Carmen Thyssen-Bornemisza bought art at auction through a Cook Islands company; her lawyer said tax havens gave 'maximum flexibility' in moving art. Being listed in ICIJ data does not imply wrongdoing.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current Forbes, Bloomberg or Manager Magazin figure for the Thyssen or Thyssen-Bornemisza families was found.","grossAssets":{"text":"Not public. The family's industrial stake was diluted in the 1999 Krupp merger; the main documented values are the art sales ($350m in 1993).","source":{"label":"Sotheby's — Museo Thyssen-Bornemisza","url":"https://www.sothebys.com/museum/museo-de-arte-thyssen-bornemisza"}},"controlled":{"text":"The Fritz Thyssen Stiftung is a research foundation, not a family vehicle; the museum is state-owned. No documented control over listed companies today.","source":{"label":"thyssenkrupp — The founding families","url":"https://www.thyssenkrupp.com/en/company/history/the-founding-families/"}},"opaque":{"verdict":"reported","text":"ICIJ's 2013 Offshore Leaks reporting named Carmen Thyssen-Bornemisza and her son Borja as holding art through offshore companies, and said Hans Heinrich Thyssen-Bornemisza had used structures such as a Bermuda trust company to manage money and art; her lawyer said tax havens offered 'maximum flexibility' in moving paintings. In 2016 EFE reported that family members also appear in the Panama Papers; the family's lawyer confirmed ownership of an offshore company and said the Spanish tax authorities had full knowledge of it. Being listed in ICIJ data does not imply wrongdoing.","searched":"ICIJ Offshore Leaks database and ICIJ art investigations (Thyssen, Thyssen-Bornemisza, Cervera), Spanish press on the Panama Papers.","source":{"label":"ICIJ — Mega-rich use tax havens to buy and sell masterpieces","url":"https://www.icij.org/investigations/offshore/mega-rich-use-tax-havens-buy-and-sell-masterpieces/"}},"gapNote":"The Thyssen-Bornemisza fortune was held abroad (Netherlands, Switzerland, offshore companies) for a century, so no published figure exists; any estimate would be speculation (interpretive)."},"holdingsToday":[{"name":"Museo Nacional Thyssen-Bornemisza","kind":"Art & collections","sector":"Art","where":"Madrid","detail":"775 works sold to the Spanish state, 1993 (about $350m)","basis":"documented","source":{"label":"Sotheby's — Museo Thyssen-Bornemisza","url":"https://www.sothebys.com/museum/museo-de-arte-thyssen-bornemisza"}},{"name":"Carmen Thyssen collection","kind":"Art & collections","sector":"Art","where":"Madrid / Málaga","detail":"Private collection on loan to Spanish museums","basis":"documented","source":{"label":"The Art Newspaper —  in 1864 with family money. His grandson Freddy Heineken (1923–2002) bought back family control in the 1950s and turned the beer into a global brand.","role_summary":"The fortune was made by building Heineken lager into a global brand and buying breweries worldwide. Freddy Heineken created Heineken Holding in 1952 as a holding layer above the brewer: the family controls a majority of Heineken Holding, which owns just over half of Heineken N.V., so roughly a quarter of the economic interest secures control of the whole group.","roleDetail":[{"t":"Brewery bought, 1864.","d":"G. A. Heineken purchased the Hooiberg brewery in Amsterdam and began brewing Heineken lager.","basis":"documented"},{"t":"Freddy Heineken's pyramid.","d":"Freddy Heineken regained a majority of the family company and set up Heineken Holding in 1952; the holding's only activity is its stake in Heineken N.V.","basis":"documented"},{"t":"Global expansion.","d":"Heineken grew through acquisitions, including FEMSA's beer business in 2010, paid for partly with shares in both Heineken companies.","basis":"documented"},{"t":"Kidnapping, 1983.","d":"Freddy Heineken was kidnapped and ransomed in 1983; the case became one of the Netherlands' most notorious crimes.","basis":"documented"}],"legacy":"Charlene de Carvalho-Heineken holds 52.63% of Heineken Holding N.V. indirectly through Stichting Administratiekantoor Priores, L'Arche Holding B.V. and L'Arche Green N.V. (AFM register); Heineken Holding owns 50.005% of Heineken N.V.","legacyDetail":[{"t":"FEMSA's exit restored the family's weight.","d":"FEMSA sold down from 14.76% in 2022 to 0.91% in 2023; Heineken bought back shares in both companies.","basis":"documented"},{"t":"Family on the boards.","d":"Michel de Carvalho and the couple's children sit on Heineken boards, per Forbes.","basis":"documented"}],"wealth":{"published":[{"figure":"$17.6bn","usd":"$17.6bn","who":"Charlene de Carvalho-Heineken & family","publisher":"Forbes (real-time billionaires)","year":2026,"rank":"#156","url":"https://www.forbes.com/profile/charlene-de-carvalho-heineken/"}],"grossAssets":{"text":"Indirect holding of 151.5m Heineken Holding shares (52.63% of capital and votes), notified to the Dutch regulator AFM; Forbes describes this as a nearly 24% look-through stake in Heineken.","source":{"label":"AFM register — C.L. de Carvalho-Heineken / Heineken Holding N.V.","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=57105"}},"controlled":{"text":"Majority control of Heineken Holding, and through its 50.005% stake, control of Heineken N.V., the world's second-largest brewer (about €36bn of revenue in 2024).","source":{"label":"GlobeNewswire — Heineken shareholding structure adjusted (2007)","url":"https://www.globenewswire.com/news-release/2007/03/02/1851817/0/en/heineken-n-v-announces-shareholding-structure-adjusted.html"}},"opaque":{"verdict":"documented","text":"The holding chain includes a Dutch stichting administratiekantoor (trust office) that holds the shares and issues depositary receipts, which separates legal title and votes from economic ownership; the internal split among family members is not public. In 2007 the family's former L'Arche Holding S.A. was merged into L'Arche Green N.V.","searched":"AFM substantial-holdings register, Heineken Holding filings, ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Heineken, L'Arche; queries: Charlene de Carvalho-Heineken, Heineken, Heineken Holding N.V., Heineken N.V., L'Arche Green N.V., L'Arche Holding B.V.): name matches only; an Appleby officer entry 'L'Arche Holding S.A.' (a shareholder of a 2012 Cayman partnership, no address given) could not be tied to the family's former holding, so no link is asserted.","source":{"label":"AFM register — C.L. de Carvalho-Heineken","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=57105"}},"gapNote":"Forbes values about a quarter of Heineken; the pyramid gives the family control of 100% of the group's strategy. It is a textbook case of a two-layer holding that doubles the control reach of each euro of family equity (interpretive)."},"holdingsToday":[{"name":"Heineken Holding N.V.","kind":"Listed stake","sector":"Brewing (holding)","where":"Amsterdam","detail":"52.63% held indirectly via STAK Priores, L'Arche Holding B.V. and L'Arche Green N.V.","basis":"documented","source":{"label":"AFM register","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=57105"}},{"name":"Heineken N.V.","kind":"Listed stake","sector":"Brewing","where":"Amsterdam","detail":"50.005% owned by Heineken Holding","basis":"documented","source":{"label":"GlobeNewswire — Heineken shareholding structure (2007)","url":"https://www.globenewswire.com/news-release/2007/03/02/1851817/0/en/heineken-n-v-announces-shareholding-structure-adjusted.html"}},{"name":"L'Arche Green N.V. / L'Arche Holding B.V.","kind":"Family office","sector":"Family holding","where":"Netherlands","detail":"Family vehicles in the chain above Heineken Holding","basis":"documented","source":{"label":"AFM register","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=57105"}}],"lineage":[{"name":"Gerard Adriaan Heineken","relation":"founder","years":"1841–1893","note":"Bought the Hooiberg brewery in 1864.","basis":"documented"},{"name":"Henry Pierre Heineken","relation":"son","years":"1886–1971","note":"Ran the brewery through the early 20th century.","basis":"documented"},{"name":"Freddy Heineken","relation":"son","years":"1923–2002","note":"Regained family control and created Heineken Holding (1952).","basis":"documented"},{"name":"Charlene de Carvalho-Heineken","relation":"daughter / heiress","years":"b. 1954","note":"Inherited the controlling stake in 2002.","basis":"documented"}],"today":"Charlene de Carvalho-Heineken sits on the board of Hei ent"],"nation":"France","scale":"Major","scaleBasis":"documented","scaleNote":"Wendel-Participations SE, owned by about 1,400 family members and entities, holds 41.1% of Wendel SE, a listed investor whose fully diluted NAV was €164.2 per share at end-2025.","start":1704,"end":null,"lifespan":"1704–present (steel to 1978; investment holding since)","base":"Hayange (Moselle); Paris","geo":[49.329,6.062],"aliases":["de Wendel et Cie","Les Petits-Fils de François de Wendel","CGIP","Marine-Wendel","Wendel Investissement","Wendel-Participations SE","SLPS"],"origins":"Jean-Martin Wendel bought the forges of Hayange in Lorraine in 1704, starting nearly three centuries of family iron- and steelmaking in the Moselle valley.","role_summary":"The Wendels built one of France's largest iron and steel groups in Lorraine, supplying rails, plate and armaments; the family straddled the French–German border after the 1871 annexation of Moselle. When the steel crisis led to nationalisation in 1978, the family converted its holding into an investment company (later Wendel), which bought and sold stakes in companies such as Legrand, Bureau Veritas and Saint-Gobain.","roleDetail":[{"t":"Hayange forges, 1704.","d":"Jean-Martin Wendel acquired the Hayange ironworks; his descendants expanded across Lorraine (Hayange, Moyeuvre, Joeuf).","basis":"documented"},{"t":"Steel dynasty of eastern France.","d":"By the 19th and 20th centuries de Wendel was among France's leading steelmakers, and François de Wendel sat in parliament as a deputy for Moselle.","basis":"documented"},{"t":"Nationalisation, 1978.","d":"The steel crisis and state takeover of the industry ended the family's industrial chapter; the family regrouped its capital in an investment holding.","basis":"documented"},{"t":"Private-equity era.","d":"Wendel bought and relisted Legrand (2002), floated Bureau Veritas in 2007 while keeping a majority, and made a leveraged 2007 investment in Saint-Gobain; in December 2010 the AMF's sanctions committee fined Wendel and Jean-Bernard Lafonta, then chairman of its management board, €1.5m each for failing to inform the market of the derivative contracts used to prepare the Saint-Gobain stake; Wendel disputed the finding and appealed.","basis":"documented"}],"legacy":"The family's capital sits in Wendel-Participations SE, which holds 41.1% of Wendel SE. Wendel holds stakes in Bureau Veritas, IHS Towers, Scalian, Globeducate, ACAMS and others, and since 2024–25 owns the third-party asset managers IK Partners and Monroe Capital (Wendel Investment Managers).","legacyDetail":[{"t":"A large family pact.","d":"Wendel-Participations' statutes require approval of share transfers to keep the holding in family hands; it gathers about 1,400 family members and entities.","basis":"documented"},{"t":"Shift to asset management.","d":"Wendel's 2025 results reported about €160m of pro-forma fee-related earnings from IK Partners and Monroe Capital.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current Challenges figure for the Wendel family was found; Challenges listed 'familles Wendel' at €2.55bn (20th) in 2007.","grossAssets":{"text":"Wendel SE fully diluted NAV €164.2 per share at 31 December 2025; its shares traded at a discount of about 51% to NAV. Wendel-Participations owns 41.1% of the capital.","source":{"label":"Wendel — 2025 Full-Year Results (GlobeNewswire, Feb 2026)","url":"https://www.globenewswire.com/news-release/2026/02/26/3245204/0/en/WENDEL-2025-Full-Year-Results.html"}},"controlled":{"text":"Through Wendel SE the family steers a portfolio including the largest stake in Bureau Veritas (about €6.5bn revenue in 2025) and asset managers running third-party money; the client funds of IK and Monroe are not family wealth but extend its reach.","source":{"label":"Wendel — FY 2025 results presentation","url":"https://www.wendelgroup.com/wp-content/uploads/2026/02/fy-2025-results.pdf"}},"opaque":{"verdict":"none found","text":"Wendel-Participati e forges in 1704.","basis":"documented"},{"name":"Ignace de Wendel","relation":"grandson","years":"1741–1795","note":"Ironmaster who co-founded the Le Creusot works (1781) before emigrating in the Revolution.","basis":"documented"},{"name":"François de Wendel","relation":"descendant","years":"1874–1949","note":"Steel magnate, mayor of Hayange and deputy for Moselle.","basis":"documented"},{"name":"Ernest-Antoine Seillière","relation":"descendant","years":"b. 1937","note":"Led CGIP/Wendel and chaired its supervisory board; former head of the employers' federation MEDEF.","basis":"documented"},{"name":"Wendel-Participations SE","relation":"successor","years":"present","note":"Family holding of about 1,400 members owning 41.1% of Wendel SE.","basis":"documented"}],"today":"The family is represented on Wendel's supervisory board through Wendel-Participations, whose chair is a family member. Wendel is now mainly an investment and asset-management group.","today_people":[{"name":"Priscilla de Moustier","relation":"Wendel family member","role":"Board member of Wendel SE (family representative)","sector":"Business & industry","year":2025,"basis":"documented","source":{"label":"Zonebourse — Priscilla de Moustier","url":"https://zonebourse.com/insider/PRISCILLA-DE-MOUSTIER-A1S9RL"}}],"sources":[{"label":"Wikipedia — De Wendel family","url":"https://en.wikipedia.org/wiki/De_Wendel_family"},{"label":"PEA.fr — La famille Wendel","url":"https://pea.fr/legendes/famille-wendel/"},{"label":"Wendel — Our shareholders","url":"https://www.wendelgroup.com/en/?p=7742"},{"label":"Wendel — 2025 Full-Year Results","url":"https://www.globenewswire.com/news-release/2026/02/26/3245204/0/en/WENDEL-2025-Full-Year-Results.html"},{"label":"Université de la Sarre — La famille de Wendel (memotransfront)","url":"https://www.memotransfront.uni-saarland.de/pdf/famille_wendel.pdf"}],"connections":[{"id":"schneider-family","type":"trade","label":"Ignace de Wendel co-founded the Le Creusot works later run s and forges and built a business in steel, railways, armaments and shipbuilding.","basis":"documented"},{"t":"Arms maker to Europe.","d":"By 1871 Schneider et Cie had become one of Europe's main arms manufacturers, a rival of Krupp in guns and armour plate.","basis":"documented"},{"t":"Paternalist company town.","d":"The family built housing, schools and churches at Le Creusot, a classic 19th-century company town.","basis":"interpretive"},{"t":"Loss of family control.","d":"After Charles Schneider's death in 1960 the Empain group took control (1963) and merged in 1969 into Empain-Schneider, renamed Schneider SA (1980) and Schneider Electric (1999).","basis":"documented"}],"legacy":"No Schneider family holding of significance survives; the company's heir is Schneider Electric, a widely held listed group with no controlling family. The family's château at Le Creusot is now a museum site owned by the town.","legacyDetail":[{"t":"Name without the family.","d":"Schneider Electric dropped arms after 1945 and became an electrical-equipment group; its shares are widely held.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current rich-list figure for Schneider descendants.","grossAssets":{"text":"Not applicable: the family sold its controlling position to the Empain group in the 1960s.","source":{"label":"Wikipedia — Schneider-Creusot","url":"https://en.wikipedia.org/wiki/Schneider-Creusot"}},"controlled":{"text":"None documented today.","source":{"label":"Schneider Electric — History","url":"https://www.se.com/ww/fr/about-us/company-profile/history/schneider-electric-history/"}},"opaque":{"verdict":"none found","text":"No offshore holdings linked to the Schneider family were found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Schneider Creusot, Schneider family; queries: Schneider, Schneider Electric SE): name matches only, none shown to be this family or its vehicles.","source":{"label":"ICIJ Offshor ser","JAB Holding Company","JAB Insurance","Reckitt Benckiser"],"origins":"The chemist Ludwig Reimann joined Johann Adam Benckiser's chemical business in 1828; the Reimanns took over the Benckiser company in Ludwigshafen.","role_summary":"Benckiser made industrial chemicals and then household cleaners; its 1999 merger created Reckitt Benckiser. The family's holding, Joh. A. Benckiser (JAB), became a Luxembourg-based investment firm run by non-family managers that bought Coty, Keurig, Peet's, Krispy Kreme, Pret A Manger and Panera, and since 2025 has pivoted towards insurance. Family-commissioned research found that Albert Reimann Sr. and Jr. were staunch Nazi supporters and used forced labour; in 2019 the family set up the Alfred Landecker Foundation.","roleDetail":[{"t":"Benckiser, 1828.","d":"Ludwig Reimann's partnership with J. A. Benckiser founded the chemical firm the family later owned outright.","basis":"documented"},{"t":"Nazi-era history.","d":"The Landecker Foundation says the two Albert Reimanns were 'staunch supporters of the Nazi regime', donated to the SS and used forced labourers; 870 have been identified by name. Reports said up to 175 forced workers, a third of the workforce, by 1943.","basis":"documented"},{"t":"Acknowledgement, 2019.","d":"Family spokesman Peter Harf told Bild am Sonntag the Alberts 'should have been jailed'; the family pledged €10m and Joh. A. Benckiser committed €250m over ten years to the new Alfred Landecker Foundation.","basis":"documented"},{"t":"From consumer goods to insurance.","d":"JAB bought Prosperity Life (closed September 2025) and other insurers, saying it manages more than $50bn of assets.","basis":"documented"}],"legacy":"Four siblings (Wolfgang Reimann, Renate Reimann-Haas, Matthias Reimann-Andersen and Stefan Reimann-Andersen) own 95% of JAB Holding Company in Luxembourg, through family offices based in Vienna, per Forbes. JAB holds stakes in Keurig Dr Pepper, Coty, Krispy Kreme, Panera Brands, Pret A Manger, pe h the Dumas, Puech and Guerrand branches, still own the majority.","role_summary":"The fortune comes from turning a harness-maker into the most profitable luxury brand: saddles, then handbags (Kelly, Birkin), silk scarves and leather goods with scarce supply and high margins (net income about €4.6bn on €15.2bn of sales in 2024). After LVMH acquired about 17% in 2010, the family pooled its shares in H51 (2011), behind a société en commandite par actions in which the family company Émile Hermès SAS is the general partner and appoints the executive chairmen.","roleDetail":[{"t":"Harness workshop, 1837.","d":"Thierry Hermès made harnesses for Paris carriages; his son moved the firm to the Faubourg Saint-Honoré.","basis":"documented"},{"t":"Leather goods and silk.","d":"Under Émile-Maurice Hermès the house moved into bags and travel goods as cars replaced carriages.","basis":"documented"},{"t":"Defending against LVMH.","d":"LVMH announced a stake of about 17.1% in October 2010; the family responded with the H51 pact (2011), and a 2014 agreement led LVMH to distribute most of its shares to its own shareholders.","basis":"documented"},{"t":"Puech dispute.","d":"Heir Nicolas Puech, who stayed outside H51, was reported (Forbes, December 2025) to have sued LVMH and Bernard Arnault, alleging his shares had been sold without his knowledge; LVMH denies this.","basis":"documented"}],"legacy":"H51 SAS held 66.72% of Hermès International in March 2025; descendants collectively owned 65.1% at end-2016. Émile Hermès SAS, the general partner, controls management appointments regardless of share price.","legacyDetail":[{"t":"Lock-up.","d":"The H51 pact restricts sales outside the family; reports say it was extended in 2022.","basis":"interpretive"}],"wealth":{"published":[{"figure":"€114bn","usd":"c. $130bn","who":"Hermès heirs","publisher":"Challenges (via FashionUnited)","year":2026,"rank":"2nd in France","url":"https://fashionunited.in/news/people/bernard-arnault-reclaims-top-spot-as-frances-wealthiest-professional-according-to-challenges/2026070855220"},{"figure":"€163.4bn","usd":"c. $177bn","who":"Hermès family","publisher":"Challenges (via Journal de l'Automobile)","year":2025,"rank":"1st in France","url":"https://journalauto.com/distribution/__trashed-13/"}],"publishedNote":"Forbes lists individual heirs rather than one family figure; it removed Nicolas Puech (est. $14.8bn at end-2024) from its list in 2025.","grossAssets":{"text":"Two-thirds of Hermès International held through H51 (March 2025); the stake's value swings with the luxury share price, which explains the €49bn fall between the 2025 and 2026 Challenges lists.","source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}},"controlled":{"text":"Full control of Hermès through H51 and the general partner Émile Hermès SAS; the SCA form makes a hostile takeover practically impossible.","source":{"label":"FashionNetwork — Hermès family finalises holding to prevent takeover","url":"https://vn.fashionnetwork.com/news/Hermes-family-finalises-holding-to-prevent-takeover,221897.html"}},"opaque":{"verdict":"reported","text":"The split of H51 among roughly 100 heirs is not published. Nicolas Puech, who stayed outside H51, alleged in a 2025 lawsuit that his Hermès shares had been sold without his knowledge; LVMH denies this and the case was pending.","searched":"Hermès registration documents (via Wikipedia), ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Hermès, Puech, Dumas; queries: Axel Dumas, H51 SAS, Hermès, Hermès International SCA, Émile Hermès SAS): name matches only, none shown to be this family or its vehicles, press on the Puech lawsuit.","source":{"label":"Forbes — Hermès heir reportedly sues LVMH (Dec 2025)","url":"https://www.forbes.com/sites/zacharyfolk/2025/12/03/herms-heir-reportedly-sues-bernard-arnault-and-lvmh-alleging-16-billion-worth-of-herms-shares-sold-without-his-knowledge/"}},"gapNote":"Published family totals are market values of a thinly traded, highly valued share; they are large but volatile (€163bn to €114bn in a year), while control is locked in by the SCA and the pact regardless of price (interpretive)."},"holdingsToday":[{"name":"Hermès International SCA","kind":"Listed stake","sector":"Luxury goods","where":"Paris","detail":"66.72% held by H51 (March 2025)","basis":"documented","source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}},{"name":"Émile Hermès SAS","kind":"Private company","sector":"General partner","where":"Paris","detail":"Family-owned general partner; appoints the executive chairmen","basis":"documented","source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}},{"name":"H51 SAS","kind":"Family office","sector":"Family holding pact","where":"Paris","detail":"Created 2011; 66.72% of Hermès International (March 2025)","basis":"documented","source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}}],"lineage":[{"name":"Thierry Hermès","relation":"founder","years":"1801–1878","note":"Founded the harness workshop in 1837.","basis":"documented"},{"name":"Émile-Maurice Hermès","relation":"grandson","years":"1871–1951","note":"Moved the house into leather goods; his sons-in-law founded the Dumas and Guerrand branches.","basis":"documented"},{"name":"Jean-Louis Dumas","relation":"descendant","years":"1938–2010","note":"Chaired Hermès 1978–2006; created the Birkin.","basis":"documented"},{"name":"Axel Dumas","relation":"descendant","years":"b. 1970","note":"Executive chairman of Hermès since 2013/14.","basis":"documented"}],"today":"Axel Dumas is executive chairman of Hermès; family members fill the general partner and supervisory roles.","today_people":[{"name":"Axel Dumas","relation":"sixth-generation descendant","role":"Executive chairman, Hermès International","sector":"Business & industry","year":2026,"basis":"documented","source":{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"}}],"sources":[{"label":"Wikipedia — Hermès","url":"https://en.wikipedia.org/wiki/Herm%C3%A8s"},{"label":"FashionUnited — Challenges 2026 ranking","url":"https://fashionunited.in/news/people/bernard-arnault-reclaims-top-spot-as-frances-wealthiest-professional-according-to-challenges/2026070855220"},{"label":"Forbes — Inside Hermès: Luxury's secret empire (2014)","url":"https://www.forbes.com/sites/susanadams/2014/08/20/inside-hermes-luxury-secret-empire/"},{"label":"FashionNetwork — Hermès family finalises holding","url":"https://vn.fashionnetwork.com/news/Hermes-family-finalises-holding-to-prevent-takeover,221897.html"},{"label":"Forbes — Hermès heir reportedly sues LVMH (2025)","url":"https://www.forbes.com/sites/zacharyfolk/2025/12/03/herms-heir-reportedly-sues-bernard-arnault-and-lvmh-alleging-16-billion-worth-of-herms-shares-sold-without-his-knowledge/"}],"connections":[{"id":"michelin-family","type":"legacy","label":"both use the SCA partnership form"},{"id":"bettencourt-meyers-family","type":"trade","label":"rival French luxury fortune"},{"id":"family-office","type":"trust","label":"H51 family holding pact"},{"id":"mulliez-family","type":"legacy","label":"fellow large French family association"}]},{"id":"mulliez-family","name":"Mulliez family (Association Familiale Mulliez)","category":"Industrial Dynasties","role":"Trade & Chartered Monopoly","moneySources":["Wool spinning (Phildar, Roubaix)","Hypermarkets (Auchan, 1961)","Sports, DIY and electronics retail","Family association holding (AFM)"],"nation":"France / Belgium","scale":"Dominant","scaleBasis":"documented","scaleNote":"Challenges put Gérard Mulliez and family (Auchan, Decathlon) at €27bn in 2026; the AFM has some 800–880 family shareholders.","start":1961,"end":null,"lifespan":"1900s textiles; retail 1961–present","base":"Croix and Villeneuve-d'Ascq (Nord); some members in Belgium","geo":[50.678,3.146],"aliases":["AFM","Auchan","Decathlon","Leroy Merlin / Adeo","Kiabi","Boulanger","Phildar"],"origins":"The Mulliez family ran wool-spinning mills in Roubaix (Phildar). In 1961 Gérard Mulliez opened the first Auchan store in the Hautes-Champs district of Roubaix.","role_summary":"The fortune was built in retail: Auchan hypermarkets, then Decathlon (1976), Leroy Merlin, Kiabi, Boulanger, Flunch and others, each founded or bought by family members and financed through the family's collective holding, the Association Familiale Mulliez (AFM, 1955). The AFM pools ownership so that family members invest in each other's businesses and shares can be sold only within the family.","roleDetail":[{"t":"Textiles first.","d":"The Mulliez spinning business in Roubaix produced the Phildar knitting-wool brand.","basis":"documented"},{"t":"Auchan, 1961.","d":"Gérard Mulliez's first Auchan store grew into an international hypermarket chain.","basis":"documented"},{"t":"The AFM model.","d":"The AFM, founded in 1955 and led since 2014 by Barthélemy Guislain, groups 800+ family shareholders; a defence-ministry study describes three wholly owned holdings (Acanthe, Cimofat, Valorest) above the businesses.","basis":"documented"},{"t":"Tax probe dropped, 2024.","d":"A French investigation opened in 2012 into alleged tax fraud and breach of trust around AFM structures (searches in France, Belgium and Luxembourg were reported in 2016) ended with a dismissal order (non-lieu) reported by Bloomberg in October 2024; the AFM said allegations against managers and companies were dismissed. Civil parties were reported to have appealed; no outcome of that appeal was found.","basis":"documented"}],"legacy":"The AFM holds, through its holding companies, about 84–85% of Auchan and Adeo (Leroy Merlin), and major stakes in Decathlon, Kiabi, Boulanger and others; family members are shareholders of the AFM rather than of the individual companies.","legacyDetail":[{"t":"Collective, not individual, wealth.","d":"Because shares are pooled in the AFM, individual family members' wealth is not separately published.","basis":"documented"}],"wealth":{"published":[{"figure":"€27bn","usd":"c. $31bn","who":"Gérard Mulliez (Auchan and Decathlon) and family","publisher":"Challenges (via FashionUnited)","year":2026,"rank":"","url":"https://fashionunited.in/news/people/bernard-arnault-reclaims-top-spot-as-frances-wealthiest-professional-according-to-challenges/2026070855220"}],"publishedNote":"Forbes's 2002 dynasties list put the Mulliez family at $6.7bn shared by about 350 members.","grossAssets":{"text":"The AFM does not publish consolidated accounts; Decathlon, Auchan and Adeo publish their own results. Stakes of about 84–85% in Auchan and Adeo are reported.","source":{"label":"Wikipedia — Association Familiale Mulliez","url":"https://en.wikipedia.org/wiki/Association_Familiale_Mulliez"}},"controlled":{"text":"Control of a retail galaxy with combined annual sales of several tens of billions of euros (Decathlon, Auchan, Adeo each in the €15–30bn range).","source":{"label":"LSA — Barthélemy Guislain re-elected at the head of the AFM","url":"https://www.lsa-conso.fr/barthelemy-guislain-reelu-a-la-tete-de-l-association-familiale-mulliez-afm,455846"}},"opaque":{"verdict":"reported","text":"The AFM is an association and its holdings are unlisted; members' stakes are private. Several family members are reported to live in Belgium. The French tax probe that included searches in Belgium and Luxembourg ended in a dismissal order in 2024 (some family members had been placed under formal investigation in 2019); no court has found wrongdoing.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Mulliez, AFM, Cimofat; queries: Adeo, Auchan, Barthélemy Guislain, Decathlon, Kiabi, Boulanger, Agapes, Mulliez): name matches only, none shown to be this family or its vehicles, French and Belgian press, Bloomberg on the 2024 decision.","source":{"label":"Bloomberg Tax — Heirs to retail empire cleared in decade-long French tax probe (2024)","url":"https://news.bloombergtax.com/daily-tax-report-international/heirs-to-retail-empire-cleared-in-decade-long-french-tax-probe"}},"gapNote":"The €27bn is an outside estimate of an unlisted, pooled fortune; the AFM's collective control of several of Europe's largest retailers is better documented than any individual's wealth (interpretive)."},"holdingsToday":[{"name":"Decathlon","kind":"Private company","sector":"Sports retail","where":"Villeneuve-d'Ascq","detail":"Controlled by the AFM","basis":"documented","source":{"label":"Wikipedia — AFM","url":"https://en.wikipedia.org/wiki/Association_Familiale_Mulliez"}},{"name":"Auchan","kind":"Private company","sector":"Hypermarkets","where":"Croix","detail":"About 84% held by the AFM","basis":"documented","source":{"label":"Wikipedia — AFM","url":"https://en.wikipedia.org/wiki/Association_Familiale_Mulliez"}},{"name":"Adeo (Leroy Merlin)","kind":"Private company","sector":"DIY retail","where":"Ronchin","detail":"About 85% held by the AFM","basis":"documented","source":{"label":"Wikipedia — AFM","url":"https://en.wikipedia.org/wiki/Association_Familiale_Mulliez"}},{"name":"Kiabi, Boulanger, Agapes (Flunch)","kind":"Private company","sector":"Clothing, electronics, restaurants","where":"France","detail":"AFM subsidiaries","basis":"documented","source":{"label":"Wikipedia — AFM","url":"https://en.wikipedia.org/wiki/Association_Familiale_Mulliez"}}],"lineage":[{"name":"Louis Mulliez","relation":"founder","years":"20th c.","note":"Ran the Roubaix wool business (Phildar).","basis":"interpretive"},{"name":"Gérard Mulliez","relation":"son","years":"b. 1931","note":"Founded Auchan in 1961 and the AFM model.","basis":"documented"},{"name":"Barthélemy Guislain","relation":"family member","years":"present","note":"President of the AFM since 2014.","basis":"documented"}],"today":"The AFM is led by Barthélemy Guislain with a nine-member management council; family members hold executive role nd (Elveden)","Diageo shares"],"nation":"Ireland / United Kingdom","scale":"Significant","scaleBasis":"documented","scaleNote":"The Sunday Times Rich List put the Earl of Iveagh and the Guinness family at £856m in 2025 (168th).","start":1759,"end":null,"lifespan":"1759–present","base":"St James's Gate, Dublin; Elveden, Suffolk","geo":[53.343,-6.287],"aliases":["Arthur Guinness Son & Co.","Guinness plc","Iveagh Trustees","Iveagh Ltd","Guinness Mahon"],"origins":"Arthur Guinness signed a 9,000-year lease at £45 a year on the unused St James's Gate brewery in Dublin in 1759. The family belonged to Ireland's Protestant Ascendancy; another branch founded the Guinness Mahon bank (1836).","role_summary":"Guinness stout made the family rich; by 1886 St James's Gate was the largest brewery in the world, producing 1.2 million barrels a year. That year Edward Cecil Guinness floated about two-thirds of the company on the London Stock Exchange for £6m, keeping about 35%; his estate at death (1927) was a British record of £13.5m. The company merged with Grand Metropolitan in 1997 to form Diageo, and family wealth moved into Diageo shares, land and trusts.","roleDetail":[{"t":"The 1759 lease.","d":"Arthur Guinness leased St James's Gate for 9,000 years at £45 a year; the company later bought the site.","basis":"documented"},{"t":"World's largest brewery.","d":"By 1886 the brewery produced 1.2 million barrels a year.","basis":"documented"},{"t":"Flotation, 1886.","d":"Edward Cecil Guinness sold about 65% of the business on the London Stock Exchange for £6m and remained chairman and largest shareholder.","basis":"documented"},{"t":"Philanthropy.","d":"He founded the Guinness Trust (1890; now over 66,000 homes) and left Kenwood House to the nation (the Iveagh Bequest).","basis":"documented"},{"t":"Diageo, 1997.","d":"Guinness merged with Grand Metropolitan to form Diageo; the family no longer controls the brewer.","basis":"documented"}],"legacy":"The 4th Earl of Iveagh holds the 22,4 s-Stiftung","Siepmann-Stiftung"],"origins":"Karl and Theo Albrecht took over their mother's grocery shop in Essen after 1945 and turned it into a chain of no-frills discount stores, splitting it in 1961 into Aldi Nord (Theo) and Aldi Süd (Karl).","role_summary":"The fortune came from discount retailing: a limited range, own brands and low costs, expanded across Europe, the US and Australia. Both brothers placed their companies in family foundations (Familienstiftungen) rather than leaving shares to heirs, which keeps the companies intact but has also generated long legal fights over the foundations' governance.","roleDetail":[{"t":"Discount model.","d":"The Albrecht brothers built Aldi on a narrow range of goods and low prices from the 1950s.","basis":"documented"},{"t":"Split, 1961.","d":"The company divided into Aldi Nord and Aldi Süd, run independently ever since.","basis":"documented"},{"t":"Foundations as owners.","d":"Aldi Nord is owned 61% by the Markus-Stiftung and 19.5% each by the Lukas- and Jakobus-Stiftung; Aldi Süd mainly by the Siepmann-Stiftung.","basis":"documented"},{"t":"Family feud and the courts.","d":"After Berthold Albrecht's death the Jakobus-Stiftung's charter change (2017) was upheld; professional managers now run day-to-day decisions and family influence was curtailed.","basis":"documented"}],"legacy":"The two Aldi groups are owned by German family foundations; heirs are beneficiaries who receive distributions, not shareholders. The Lukas-Stiftung pays Theo Albrecht Jr.'s family; the Jakobus-Stiftung benefits Babette Albrecht and her children.","legacyDetail":[{"t":"Foundation structure limits disclosure.","d":"German family foundations do not publish beneficiaries or distributions; only the operating companies' figures are partly known.","basis":"documented"}],"wealth":{"published":[{"figure":"€29.8bn","usd":"c. $34bn","who":"Albrecht and Heister families (Aldi Süd)","publisher":"Manager Magazin (via Euronews)","year":2026,"rank":"5th in Germany","url":"https://de.euronews.com/2026/10/08/reichsten-deutschen-2026"},{"figure":"€17.8bn","usd":"c. $20bn","who":"Theo Albrecht Jr. and Babette Albrecht (Aldi Nord)","publisher":"Manager Magazin (via Euronews)","year":2026,"rank":"9th in Germany","url":"https://de.euronews.com/2026/10/08/reichsten-deutschen-2026"}],"publishedNote":"Rich lists attribute the foundations' value to the families, though legally the foundations, not the heirs, own the companies.","grossAssets":{"text":"Not public: the foundations and Aldi companies are unlisted and disclose little.","source":{"label":"Private Banking Magazin — Family foundations behind Aldi Nord","url":"https://www.private-banking-magazin.de/familienstiftung-aldi-nord-familie-albrecht-holding-streit-versoehnung/"}},"controlled":{"text":"Through foundation boards, family branches influence two of the world's largest grocery discounters, but courts have limited heirs' powers at Aldi Nord.","source":{"label":"beck-aktuell — BVerwG: influence of heirs on Aldi Nord remains limited","url":"https://www.beck-aktuell.de/daily/meldung/detail/bverwg-laesst-revision-nicht-zu-einfluss-der-familienerben-auf-aldi-nord-bleibt-beschraenkt"}},"opaque":{"verdict":"documented","text":"The foundations are German Familienstiftungen; their charters, beneficiaries and distributions are not published, and Aldi Süd's shareholder percentages are reported inconsistently.","searched":"Press on the Aldi foundations, court reports, ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Albrecht, Aldi; queries: Albrecht, Aldi Nord, Aldi Süd, Lukas-Stiftung and Jakobus-Stiftung): name matches only, none shown to be this family or its vehicles.","source":{"label":"beck-aktuell — BVerwG: influence of heirs on Aldi Nord remains limited","url":"https://www.beck-aktuell.de/daily/meldung/detail/bverwg-laesst-revision-nicht-zu-einfluss-der-familienerben-auf-aldi-nord-bleibt-beschraenkt"}},"gapNote":"Rich lists assign the foundations' value to heirs who are only beneficiaries; the true question is who controls the foundation boards, which is partly settled by the courts (interpretive)."},"holdingsToday":[{"name":"Aldi Süd (via Siepmann-Stiftung)","kind":"Foundation","sector":"Discount grocery","where":"Mülheim an der Ruhr","detail":"Siepmann-Stiftung is the core owner","basis":"documented","source":{"label":"Wikiwand — Aldi","url":"https://www.wikiwand.com/en/articles/ALDI"}},{"name":"Aldi Nord (via Markus-, Lukas- and Jakobus-Stiftung)","kind":"Foundation","sector":"Discount grocery","where":"Essen","detail":"61% / 19.5% / 19.5%","basis":"documented","source":{"label":"Rose & Partner — Aldi Nord holding structure","url":"https://www.rosepartner.de/blog/aldi-streit-stiftung-holding-struktur.html"}},{"name":"Lukas-Stiftung and Jakobus-Stiftung","kind":"Foundation","sector":"Family foundations","where":"Germany","detail":"Each holds 19.5% of Aldi Nord; beneficiaries are Theo Jr.'s and Berthold's families","basis":"documented","source":{"label":"Rose & Partner — Aldi Nord holding structure","url":"https://www.rosepartner.de/blog/aldi-streit-stiftung-holding-struktur.html"}}],"lineage":[{"name":"Karl Albrecht","relation":"founder","years":"1920–2014","note":"Ran Aldi Süd; placed it in the Siepmann-Stiftung.","basis":"documented"},{"name":"Theo Albrecht","relation":"founder","years":"1922–2010","note":"Ran Aldi Nord; created the Markus-Stiftung and family foundations.","basis":"documented"},{"name":"Berthold Albrecht","relation":"son of Theo","years":"1954–2012","note":"His widow Babette and children benefit from the Jakobus-Stiftung.","basis":"documented"},{"name":"Theo Albrecht Jr.","relation":"son of Theo","years":"b. 1950","note":"Beneficiary branch of the Lukas-Stiftung.","basis":"documented"},{"name":"Beate Heister","relation":"daughter of Karl","years":"b. 1951","note":"Her family benefits from the Siepmann-Stiftung.","basis":"documented"}],"today":"Professional managers run both Aldi groups; family branches act through foundation boards.","today_people":[],"sources":[{"label":"Euronews — Die reichsten Deutschen 2026","url":"https://de.euronews.com/2026/10/08/reichsten-deutschen-2026"},{"label":"Private Banking Magazin — Familienstiftungen hinter Aldi Nord","url":"https://www.private-banking-magazin.de/familienstiftung-aldi-nord-familie-albrecht-holding-streit-versoehnung/"},{"label":"Rose & Partner — Aldi Nord: Holdingstruktur","url":"https://www.rosepartner.de/blog/aldi-streit-stiftung-holding-struktur.html"},{"label":"beck-aktuell — Federal Administrative Court on Aldi Nord heirs","url":"https://www.beck-aktuell.de/daily/meldung/detail/bverwg-laesst-revision-nicht-zu-einfluss-der-familienerben-auf-aldi-nord-bleibt-beschraenkt"}],"connections":[{"id":"german-family-foundations","type":"trust","label":"Aldi owned by Familienstiftungen"},{"id":"mulliez-family","type":"trade","label":"European retail rivals"},{"id":"g4-bosch-family","type":"legacy","label":"another German foundation-owned group"},{"id":"krupp-family","type":"legacy","label":"Essen industrial city; foundation ownership model"}]},{"id":"g4-bosch-family","name":"Bosch family and the Robert Bosch Stiftung","category":"Holding Structures","role":"Industry & Manufacturing","moneySources":["Precision engineering workshop (1886)","Magneto ignition and car parts","Global supplier (Robert Bosch GmbH)","Foundation ownership (1964)"],"nation":"Germany","scale":"Major","scaleBasis":"documented","scaleNote":"Manager Magazin put the Bosch, Zundel and Madelung families at €4.1bn in 2025, although the foundation they do not own holds 94% of Robert Bosch GmbH.","start":1886,"end":null,"lifespan":"1886–present (foundation-owned since 1964)","base":"Gerlingen-Schillerhöhe, Stuttgart","geo":[48.799,9.079],"aliases":["Robert Bosch GmbH","Robert Bosch Stiftung","Robert Bosch Industrietreuhand KG (RBIK)","ERBO II GmbH"],"origins":"Robert Bosch opened a 'workshop for precision mechanics and electrical engineering' in Stuttgart in 1886; the magneto ignition for cars made the firm's fortune.","role_summary":"Bosch became the world's largest car-parts supplier and an industrial and consumer-goods group. Robert Bosch's will led in 1964 to a structure that separates money from power: the charitable Robert Bosch Stiftung holds about 94% of the capital but almost no votes, the industrial trust Robert Bosch Industrietreuhand KG holds about 93% of the votes but no shares, and founder's descendants hold about 7% of the votes and a small share of capital.","roleDetail":[{"t":"Workshop, 1886.","d":"Robert Bosch's Stuttgart workshop grew on the magneto ignition and later fuel injection.","basis":"documented"},{"t":"The founder's will.","d":"Bosch wanted his company to remain independent and its profits to serve charitable ends; in 1964 his heirs transferred most shares to the foundation.","basis":"documented"},{"t":"Money and votes separated.","d":"The foundation has 94% of capital and about 1% of votes; RBIK, a trust of former managers and others, exercises 93% of the votes.","basis":"documented"}],"legacy":"The founder's descendants hold about 5% of capital (via ERBO II GmbH and directly) and about 7% of the votes; the rest of the economic value funds the Robert Bosch Stiftung's work in health, education and global issues.","legacyDetail":[{"t":"A model for foundation ownership.","d":"The Bosch structure is often cited as the German model of a 'Doppelstiftung'-type split between a charitable owner and a control entity (interpretive).","basis":"interpretive"}],"wealth":{"published":[{"figure":"€4.1bn","usd":"c. $4.4bn","who":"Bosch, Zundel and Madelung families","publisher":"Manager Magazin (via Stuttgarter Zeitung)","year":2025,"rank":"14th in Baden-Württemberg","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/das-sind-die-reichsten-menschen-in-baden-wuerttemberg-liste-2025-79040783.html"}],"grossAssets":{"text":"Bosch shareholding: Robert Bosch Stiftung about 94%, ERBO II and Bosch family about 5%, Robert Bosch GmbH about 1% (treasury).","source":{"label":"Bosch Group — Corporate profile 2026","url":"https://www.bosch.co.jp/publications/bosch-group-corporate-profile/2026-bosch-group-corporate-profile-en-01.pdf"}},"controlled":{"text":"The family has about 7% of votes; control lies with RBIK (93% of votes), whose partners include family representatives and former managers.","source":{"label":"Bosch — Company: shareholder structure (Robert Bosch Stiftung c. 94% of capital; RBIK c. 93% of votes; family c. 5% of capital and c. 7% of votes)","url":"https://www.bosch.com/company/"}},"opaque":{"verdict":"none found","text":"The structure is published by Bosch; the foundation reports its spending. No offshore links found.","searched":"Bosch publications, ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Bosch family, ERBO; queries: Bosch Robert Bosch Stiftung, Robert Bosch GmbH, Robert Bosch Industrietreuhand KG, Robert Bosch Stiftung): name matches only, none shown to be this family or its vehicles.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}},"gapNote":"This is the reverse of a pyramid: the family's €4bn is a small slice of a group worth many times more, because the founder gave the economic value to a foundation and the votes to a trust (interpretive)."},"holdingsToday":[{"name":"Robert Bosch GmbH","kind":"Private company","sector":"Car parts, industrial technology, consumer goods","where":"Gerlingen","detail":"Family c. 5% of capital, c. 7% of votes","basis":"documented","source":{"label":"Bosch Group — Corporate profile 2026","url":"https://www.bosch.co.jp/publications/bosch-group-corporate-profile/2026-bosch-group-corporate-profile-en-01.pdf"}},{"name":"Robert Bosch Stiftung","kind":"Foundation","sector":"Philanthropy","where":"Stuttgart","detail":"94% of capital, no strategic control","basis":"documented","source":{"label":"Robert Bosch Stiftung — Profile 2019","url":"https://www.bosch-stiftung.de/sites/default/files/publications/pdf/2019-04/Profile_Robert_Bosch_Stiftung_2019.pdf"}},{"name":"Robert Bosch Industrietreuhand KG","kind":"Trust","sector":"Control entity","where":"Stuttgart","detail":"Holds about 93% of the votes but no shares","basis":"documented","source":{"label":"Bosch — Company: shareholder structure (Robert Bosch Stiftung c. 94% of capital; RBIK c. 93% of votes; family c. 5% of capital and c. 7% of votes)","url":"https://www.bosch.com/company/"}}],"lineage":[{"name":"Robert Bosch","relation":"founder","years":"1861–1942","note":"Founded the workshop (1886); his will shaped the foundation structure.","basis":"documented"},{"name":"Robert Bosch Jr.","relation":"son","years":"1928–2004","note":"Heir who agreed to the 1964 transfer to the foundation.","basis":"documented"},{"name":"Christof Bosch","relation":"grandson","years":"b. 1956","note":"Family spokesman and partner in RBIK.","basis":"interpretive"}],"today":"The founder's descendants are represented in the industrial trust RBIK and on Bosch's supervisory board.","today_people":[],"sources":[{"label":"Bosch Group — Corporate profile 2026","url":"https://www.bosch.co.jp/publications/bosch-group-corporate-profile/2026-bosch-group-corporate-profile-en-01.pdf"},{"label":"Bosch — Company: shareholder structure (Robert Bosch Stiftung c. 94% of capital; RBIK c. 93% of votes; family c. 5% of capital and c. 7% of votes)","url":"https://www.bosch.com/company/"},{"label":"Robert Bosch Stiftung — Profile 2019","url":"https://www.bosch-stiftung.de/sites/default/files/publications/pdf/2019-04/Profile_Robert_Bosch_Stiftung_2019.pdf"},{"label":"Stuttgarter Zeitung — Richest people in Baden-Württemberg 2025","url":"https://www.stuttgarter-zeitung.de/lokales/baden-wuerttemberg/das-sind-die-reichsten-menschen-in-baden-wuerttemberg-liste-2025-79040783.html"}],"connections":[{"id":"german-family-foundations","type":"trust","label":"textbook foundation-owned German group"},{"id":"krupp-family","type":"legacy","label":"both fortunes passed to foundations"},{"id":"g4-albrecht-family","type":"legacy","label":"another foundation-owned group"},{"id":"porsche-piech-family","type":"trade","label":"Stuttgart car-industry neighbours"}]},{"id":"jersey","type":"entity","name":"Jersey (Crown Dependency)","kind":"Offshore centre","description":"A self-governing Crown Dependency in the Channel Islands with no capital-gains or inheritance tax and a large trust, fund and private-wealth industry used by European families and their family offices. Jersey keeps a central register of beneficial ownership available to its authorities and to regulated firms; public access has remained limited. Using a Jersey trust or company is lawful and does not by itself indicate wrongdoing.","start":1204,"geo":[49.214,-2.131],"sources":[{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"},{"label":"Wikipedia — Economy of Jersey","url":"https://en.wikipedia.org/wiki/Economy_of_Jersey"}],"connections":[{"id":"guernsey","type":"offshore","label":"fellow Channel Islands finance centre"},{"id":"family-office","type":"offshore","label":"common domicile for family trusts and family-office vehicles"},{"id":"icij-offshore-leaks-db","type":"offshore","label":"Jersey entities appear in ICIJ leak data"}]},{"id":"guernsey","type":"entity","name":"Guernsey (Crown Dependency)","kind":"Offshore centre","description":"A Crown Dependency in the Channel Islands with a specialist funds, insurance (captive) and trust sector. Like Jersey it holds a beneficial-ownership register for authorities rather than full public access, and is assessed in the Tax Justice Network's Financial Secrecy Index. Offshore structures here are lawful; being registered there implies no wrongdoing.","start":1204,"geo":[49.455,-2.536],"sources":[{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"},{"label":"Wikipedia — Economy of Guernsey","url":"https://en.wikipedia.org/wiki/Economy_of_Guernsey"}],"connections":[{"id":"jersey","type":"offshore","label":"fellow Channel Islands centre"},{"id":"isle-of-man","type":"offshore","label":"fellow Crown Dependency"},{"id":"family-office","type":"offshore","label":"trust and fund domicile"}]},{"id":"isle-of-man","type":"entity","name":"Isle of Man (Crown Dependency)","kind":"Offshore centre","description":"A Crown Dependency in the Irish Sea with low personal tax, no inheritance tax and an insurance, trust and company-services industry. It keeps a beneficial-ownership database for its authorities; public access has remained limited. Use of Manx vehicles is lawful and is not evidence of wrongdoing.","start":1866,"geo":[54.236,-4.548],"sources":[{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"},{"label":"Wikipedia — Economy of the Isle of Man","url":"https://en.wikipedia.org/wiki/Economy_of_the_Isle_of_Man"}],"connections":[{"id":"guernsey","type":"offshore","label":"fellow Crown Dependency"},{"id":"jersey","type":"offshore","label":"fellow Crown Dependency"},{"id":"paradise-papers","type":"offshore","label":"Isle of Man structures featured in Appleby records (ICIJ)"}]},{"id":"british-virgin-islands","type":"entity","name":"British Virgin Islands","kind":"Offshore centre","description":"A British Overseas Territory that is one of the world's largest registries of offshore companies (BVI 'business companies'). Beneficial-ownership data is held in a closed system for authorities; BVI companies were the most common entity type in the Panama Papers (Mossack Fonseca) records, according to ICIJ. Holding assets through a BVI company is legal; being listed in ICIJ data does not imply wrongdoing.","start":1984,"geo":[18.428,-64.62],"sources":[{"label":"ICIJ — The Panama Papers","url":"https://www.icij.org/investigations/panama-papers/"},{"label":"Wikipedia — Economy of the British Virgin Islands","url":"https://en.wikipedia.org/wiki/Economy_of_the_British_Virgin_Islands"}],"connections":[{"id":"panama-papers","type":"offshore","label":"most common jurisdiction in Mossack Fonseca files"},{"id":"pandora-papers","type":"offshore","label":"BVI companies in the 2021 records"},{"id":"cayman-islands","type":"offshore","label":"fellow Caribbean British Overseas Territory"}]},{"id":"cayman-islands","type":"entity","name":"Cayman Islands","kind":"Offshore centre","description":"A British Overseas Territory with no corporate income, capital-gains or inheritance tax, and the leading domicile for hedge funds and many private-equity and family-office investment vehicles. It is ranked in the Tax Justice Network's Financial Secrecy Index; beneficial-ownership information is held for authorities rather than published. Fund structures there are lawful and widely used by institutions.","start":1962,"geo":[19.313,-81.255],"sources":[{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"},{"label":"Wikipedia — Economy of the Cayman Islands","url":"https://en.wikipedia.org/wiki/Economy_of_the_Cayman_Islands"}],"connections":[{"id":"british-virgin-islands","type":"offshore","label":"fellow British Overseas Territory"},{"id":"paradise-papers","type":"offshore","label":"Cayman entities in Appleby files"},{"id":"family-office","type":"offshore","label":"common fund domicile for family-office investments"}]},{"id":"luxembourg","type":"entity","name":"Luxembourg (holding and fund centre)","kind":"Offshore centre","description":"An EU member state and Europe's largest fund domicile, widely used for holding companies (SOPARFI, S.à r.l.) by families and investors, such as the Reimann family's JAB Holding Company. ICIJ's 2014 'LuxLeaks' published advance tax rulings for multinationals. Its public Register of Beneficial Ownership (2019) was closed to general public access after the EU Court of Justice ruled on 22 November 2022, in cases brought in Luxembourg, that unrestricted public access was invalid.","start":1929,"geo":[49.611,6.13],"sources":[{"label":"CJEU — Press release 188/22 (C-37/20 and C-601/20)","url":"https://curia.europa.eu/jcms/upload/docs/application/pdf/2022-11/cp220188en.pdf"},{"label":"Forbes — Renate Reimann-Haas (JAB, Luxembourg-based)","url":"https://www.forbes.com/profile/renate-reimann-haas/"}],"connections":[{"id":"reimann-family","type":"offshore","label":"JAB Holding is Luxembourg-based"},{"id":"g4-cjeu-2022-beneficial-ownership-ruling","type":"political","label":"cases referred by a Luxembourg court"},{"id":"mulliez-family","type":"offshore","label":"2013 searches in Luxembourg; French probe dropped 2024"},{"id":"netherlands-stichting","type":"offshore","label":"competing EU holding jurisdictions"}]},{"id":"switzerland-banking-secrecy","type":"entity","name":"Swiss banking secrecy","kind":"Law / charter / tax","description":"Swiss law made breaching client confidentiality a criminal offence in the Banking Act of 1934 (Article 47), and private banks in Geneva, Zurich and Lugano managed large foreign fortunes. US enforcement against UBS (2009) and the OECD's Common Reporting Standard, under which Switzerland has exchanged account data automatically since 2018, have ended secrecy towards participating tax authorities. Swiss residence and accounts are lawful; recent cases, such as the Turin inquiry into Marella Agnelli's residence, turn on whether tax residence was genuine.","start":1934,"geo":[46.204,6.143],"sources":[{"label":"Wikipedia — Banking in Switzerland","url":"https://en.wikipedia.org/wiki/Banking_in_Switzerland"},{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"}],"connections":[{"id":"agnelli-elkann-family","type":"offshore","label":"Turin tax case over Swiss residence"},{"id":"bettencourt-meyers-family","type":"offshore","label":"2010 reports of undeclared Swiss accounts"},{"id":"pictet-lombard-odier","type":"finance","label":"Geneva private banks"},{"id":"thyssen-family","type":"offshore","label":"Thyssen-Bornemisza base in Lugano"}]},{"id":"liechtenstein-foundations","type":"entity","name":"Liechtenstein foundations (Stiftung) and trusts","kind":"Law / charter / tax","description":"Liechtenstein's Persons and Companies Act (1926) created the Stiftung and Anstalt, flexible vehicles used for private wealth, often with unnamed beneficiaries. In 2008 a data disc from LGT Treuhand bought by German intelligence led to tax investigations; Deutsche Post chief Klaus Zumwinkel was raided and resigned in 2008. Since then Liechtenstein has joined OECD automatic information exchange; a foundation is lawful and holding one implies no wrongdoing.","start":1926,"geo":[47.141,9.521],"sources":[{"label":"Wikipedia — 2008 Liechtenstein tax affair","url":"https://en.wikipedia.org/wiki/2008_Liechtenstein_tax_affair"},{"label":"Tax Justice Network — Financial Secrecy Index","url":"https://fsi.taxjustice.net/"}],"connections":[{"id":"house-of-liechtenstein","type":"ownership","label":"princely family owns LGT"},{"id":"lgt-group","type":"finance","label":"LGT Treuhand data at the centre of the 2008 affair"},{"id":"german-family-foundations","type":"trust","label":"foreign alternative to German family foundations"}]},{"id":"netherlands-stichting","type":"entity","name":"Dutch stichting and N.V. control structures","kind":"Law / charter / tax","description":"Dutch law offers several control devices used by family holdings: the stichting administratiekantoor (STAK), which holds shares and issues depositary receipts, separating votes from economic rights (e.g. STAK Priores in the Heineken chain); continuity foundations holding preference shares against takeovers; and loyalty or special voting shares for long-term holders, used by Exor, Ferrari and Stellantis. Holdings above thresholds must be notified to the AFM, whose register is public; the Dutch UBO register's public access was suspended after the EU Court's November 2022 ruling.","start":1928,"geo":[52.37,4.895],"sources":[{"label":"AFM register — C.L. de Carvalho-Heineken / Heineken Holding","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=57105"},{"label":"AFM register — Giovanni Agnelli B.V. / Ferrari N.V.","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=170902"},{"label":"CJEU — Press release 188/22","url":"https://curia.europa.eu/jcms/upload/docs/application/pdf/2022-11/cp220188en.pdf"}],"connections":[{"id":"heineken-family","type":"trust","label":"STAK Priores in the Heineken holding chain"},{"id":"exor","type":"ownership","label":"Exor N.V. uses loyalty voting shares"},{"id":"agnelli-elkann-family","type":"ownership","label":"Giovanni Agnelli B.V. is Dutch"},{"id":"g4-cjeu-2022-beneficial-ownership-ruling","type":"political","label":"public UBO access suspended after the ruling"}]},{"id":"panama-papers","type":"entity","name":"Panama Papers (2016)","kind":"Leak / investigation","description":"ICIJ and partners published from 3 April 2016 more than 11.5 million records from the Panamanian law firm Mossack Fonseca, covering more than 214,000 offshore entities linked to people in over 200 countries. European coverage named, among others, members of Spain's Thyssen-Bornemisza family, whose lawyer said the Spanish tax authorities had full knowledge of the offshore company concerned (EFE, 2016). ICIJ notes that offshore companies have legitimate uses; being listed in ICIJ data does not imply wrongdoing.","start":2016,"sources":[{"label":"ICIJ — The Panama Papers","url":"https://www.icij.org/investigations/panama-papers/"},{"label":"El Economista — Thyssen-Bornemisza family included in Panama Papers","url":"https://www.eleconomista.es/legislacion/amp/7478094/ThyssenBornemisza-family-included-in-Panama-Papers"}],"connections":[{"id":"thyssen-family","type":"offshore","label":"family members named in Spanish coverage"},{"id":"british-virgin-islands","type":"offshore","label":"most frequent jurisdiction in the files"},{"id":"icij-offshore-leaks-db","type":"legacy","label":"entities searchable in the database"}]},{"id":"paradise-papers","type":"entity","name":"Paradise Papers (2017)","kind":"Leak / investigation","description":"From 5 November 2017 ICIJ published records from an offshore law firm (Appleby), a specialised trust company and 19 corporate registries in secrecy jurisdictions. European stories included investments by the Duchy of Lancaster, which manages the British sovereign's private estate, through offshore funds. ICIJ cautions that being named does not imply wrongdoing.","start":2017,"sources":[{"label":"ICIJ — Paradise Papers","url":"https://www.icij.org/investigations/paradise-papers/"}],"connections":[{"id":"british-crown-estate-duchies","type":"offshore","label":"Duchy of Lancaster offshore fund investments"},{"id":"cayman-islands","type":"offshore","label":"Cayman structures in Appleby files"},{"id":"icij-offshore-leaks-db","type":"legacy","label":"data added to the database"}]},{"id":"pandora-papers","type":"entity","name":"Pandora Papers (2021)","kind":"Leak / investigation","description":"From 3 October 2021 ICIJ and more than 600 journalists at 150 outlets published 2.94 terabytes of records from 14 offshore service providers, revealing offshore dealings of 35 current and former world leaders and over 300 public officials; European examples included Czech Prime Minister Andrej Babiš. ICIJ called it the largest leak in its history. Being listed does not imply wrongdoing.","start":2021,"sources":[{"label":"ICIJ — Pandora Papers","url":"https://www.icij.org/investigations/pandora-papers/"}],"connections":[{"id":"british-virgin-islands","type":"offshore","label":"BVI entities among the records"},{"id":"icij-offshore-leaks-db","type":"legacy","label":"data added to the database"},{"id":"family-office","type":"offshore","label":"trust companies serving wealthy families featured"}]},{"id":"icij-offshore-leaks-db","type":"entity","name":"ICIJ Offshore Leaks Database","kind":"Register / dataset","description":"ICIJ's public database of more than 810,000 offshore companies, foundations and trusts drawn from the Offshore Leaks (2013), Panama Papers, Bahamas Leaks, Paradise Papers and Pandora Papers, covering records over 80 years to 2020. We searched it for every G4 family; hits are reported in each profile. ICIJ data shows connections, not illegality: many offshore entities have legitimate uses.","start":2013,"sources":[{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"},{"label":"ICIJ — Mega-rich use tax havens to buy and sell masterpieces (2013)","url":"https://www.icij.org/investigations/offshore/mega-rich-use-tax-havens-buy-and-sell-masterpieces/"}],"connections":[{"id":"panama-papers","type":"legacy","label":"source leak"},{"id":"paradise-papers","type":"legacy","label":"source leak"},{"id":"pandora-papers","type":"legacy","label":"source leak"},{"id":"thyssen-family","type":"offshore","label":"Thyssen-Bornemisza art companies (2013)"}]},{"id":"german-family-foundations","type":"entity","name":"German family foundations (Familienstiftung, Doppelstiftung) and family partnerships","kind":"Trust / foundation","description":"German families keep companies intact by placing shares in a Familienstiftung (family foundation), whose beneficiaries are relatives (e.g. the Aldi foundations), or in a 'Doppelstiftung' that splits a charitable foundation holding the capital from a family or trust entity holding the votes (the Bosch model: the foundation owns 94% of capital, the industrial trust holds 93% of votes). Others use share pools and partnership forms (KGaA) as at Henkel and Merck. Family foundations are taxed (including a substitute inheritance tax every 30 years) but publish little about beneficiaries or distributions.","start":1964,"sources":[{"label":"Bosch — Company: shareholder structure (Robert Bosch Stiftung c. 94% of capital; RBIK c. 93% of votes; family c. 5% of capital and c. 7% of votes)","url":"https://www.bosch.com/company/"},{"label":"Rose & Partner — Fallstricke der Familienstiftung","url":"https://www.rosepartner.de/blog/fallstricke-der-familienstiftung.html"},{"label":"Krupp-Stiftung — thyssenkrupp AG","url":"https://krupp-stiftung.de/en/institutionen/thyssenkrupp-ag"}],"connections":[{"id":"g4-bosch-family","type":"trust","label":"Bosch foundation and industrial trust"},{"id":"g4-albrecht-family","type":"trust","label":"Aldi Nord and Süd foundations"},{"id":"krupp-family","type":"trust","label":"Krupp Foundation owns 20.93% of thyssenkrupp"},{"id":"henkel-family","type":"trust","label":"18 foundations in the Henkel pool"},{"id":"merck-family-darmstadt","type":"trust","label":"E. Merck KG partnership model"}]},{"id":"family-office","type":"entity","name":"Single-family office","kind":"Family office","description":"A private company that manages one family's investments, tax, governance and philanthropy, often holding the family's stakes directly (e.g. Stefan Quandt's AQTON SE, Susanne Klatten's SKion, the Reimanns' Vienna offices above JAB, Wendel-Participations, Peugeot's EPF). Family offices are generally not regulated as funds when they manage only family money, so they disclose little beyond company-register accounts; their size is rarely public.","start":1882,"sources":[{"label":"Family Office Hub — The Stefan Quandt family office AQTON SE","url":"https://familyofficehub.io/blog/the-stefan-quandt-family-office-aqton-se/"},{"label":"PAM Insight — Do family offices die or just fade away? (Guinness)","url":"https://www.paminsight.com/twn/article/whatever-happened-to-the-guinness-family-office"}],"connections":[{"id":"quandt-family","type":"ownership","label":"AQTON SE and SKion"},{"id":"reimann-family","type":"ownership","label":"Vienna family offices above JAB"},{"id":"wendel-family","type":"ownership","label":"Wendel-Participations"},{"id":"guinness-family-iveagh","type":"trust","label":"Iveagh Ltd, liquidated 2016"}]},{"id":"g4-forced-labour-foundation-2000","type":"entity","name":"Foundation 'Remembrance, Responsibility and Future' (EVZ, 2000)","kind":"Trust / foundation","description":"Established by German federal law in 2000 with capital of DM 10bn contributed jointly by the German state and German companies, to make payments to surviving former forced labourers of the Nazi era and to fund remembrance projects. Firms linked to G4 families, such as Volkswagen, BMW, Siemens and Krupp's successor, took part in the companies' initiative. Several families later commissioned their own histories (Quandt 2011, Porsche 2017, Reimann 2016–2023).","start":2000,"geo":[52.52,13.405],"sources":[{"label":"EVZ Foundation — official site","url":"https://www.stiftung-evz.de/en/"},{"label":"JTA — BMW family admits using slave labor (2011)","url":"https://www.jta.org/2011/09/28/global/bmw-family-admits-using-slave-labor-for-nazis"}],"connections":[{"id":"quandt-family","type":"legacy","label":"Quandt plants used forced labour"},{"id":"porsche-piech-family","type":"legacy","label":"Porsche KG used forced labour"},{"id":"krupp-family","type":"legacy","label":"Krupp convicted of using forced labour"},{"id":"reimann-family","type":"legacy","label":"Benckiser used forced labour"}]},{"id":"g4-cjeu-2022-beneficial-ownership-ruling","type":"entity","name":"EU Court of Justice ruling on public beneficial-ownership registers (22 Nov 2022)","kind":"Law / charter / tax","description":"In joined cases C-37/20 (Luxembourg Business Registers) and C-601/20 (Sovim), the Grand Chamber held invalid the anti-money-laundering directive's provision making company beneficial-ownership information accessible in all cases to any member of the public, as a disproportionate interference with privacy and data-protection rights. Luxembourg, the Netherlands and other states then restricted public access to their registers; access for journalists and others with a legitimate interest has since been addressed in EU AML reforms.","start":2022,"geo":[49.62,6.14],"sources":[{"label":"CJEU — Press release 188/22","url":"https://curia.europa.eu/jcms/upload/docs/application/pdf/2022-11/cp220188en.pdf"}],"connections":[{"id":"luxembourg","type":"political","label":"Luxembourg RBE closed to the general public"},{"id":"netherlands-stichting","type":"political","label":"Dutch UBO register access suspended"},{"id":"register-of-overseas-entities","type":"political","label":"UK register is outside EU law and remains public"}]}],"events":[{"year":1066,"title":"Battle of Hastings","text":"William of Normandy defeats Harold II on 14 October; the forfeiture of English lords' lands begins the largest land transfer in English history.","ids":["battle-of-hastings","william-the-conqueror"],"source":{"label":"Wikipedia — Battle of Hastings","url":"https://en.wikipedia.org/wiki/Battle_of_Hastings"}},{"year":1086,"title":"Domesday survey completed","text":"The survey records c. 1,400 tenants-in-chief; William de Percy holds 141 places and Saswalo holds Ettington under Henry de Ferrers.","ids":["domesday-book","percy-family-northumberland","shirley-family-ferrers"],"source":{"label":"Open Domesday — William of Percy","url":"https://opendomesday.org/name/william-of-percy/"}},{"year":1153,"title":"Robert Fitzharding granted Berkeley","text":"Henry of Anjou rewards the Bristol financier with the barony and castle of Berkeley, held by the family ever since apart from 1492–1553.","ids":["berkeley-family"],"source":{"label":"Wikipedia — Robert Fitzharding","url":"https://en.wikipedia.org/wiki/Robert_Fitzharding"}},{"year":1215,"title":"Magna Carta","text":"King John concedes limits on feudal reliefs, wardship and forest, protecting baronial inheritance against the Crown.","ids":["magna-carta"],"source":{"label":"Wikipedia — Magna Carta","url":"https://en.wikipedia.org/wiki/Magna_Carta"}},{"year":1343,"title":"Peruzzi company fails; Bardi follow in 1346","text":"After Edward III's war loans of 1338–39 exhausted both Florentine super-companies, the Peruzzi went bankrupt in 1343 and the Bardi in 1346. Historians now treat the royal default as one cause among several.","ids":["bardi-peruzzi","g3-edward-iii-default"],"source":{"label":"Britannica — Peruzzi family","url":"https://www.britannica.com/topic/Peruzzi-family"}},{"year":1397,"title":"Giovanni di Bicci founds the Medici Bank","text":"The bank's papal deposits made the Rome branch its main profit engine, producing more than half of profits early in the 15th century.","ids":["medici-family"],"source":{"label":"Wikipedia — Medici Bank","url":"https://en.wikipedia.org/wiki/Medici_Bank"}},{"year":1399,"title":"Duchy of Lancaster joins the Crown","text":"Henry IV's accession unites the Lancaster inheritance with the Crown; it still funds the monarch's private income.","ids":["british-crown-estate-duchies"],"source":{"label":"Duchy of Lancaster — Annual report and accounts year ended 31 March 2026","url":"https://www.duchyoflancaster.co.uk/news-updates/duchy-of-lancaster-annual-report-and-accounts-year-ended-31st-march-2026/"}},{"year":1487,"title":"First Fugger loan to Archduke Sigismund of Tyrol","text":"The loan was secured on a share of Tyrolean silver and copper output, which began the Fuggers' rise from cloth traders to mining financiers.","ids":["fugger-family"],"source":{"label":"Britannica — Fugger family","url":"https://www.britannica.com/topic/Fugger-family"}},{"year":1519,"title":"Fugger money elects Charles V emperor","text":"Jakob Fugger supplied 543,385 of the roughly 851,585 guilders paid to the electors. The Welsers and Italian firms supplied the rest.","ids":["fugger-family","welser-family","g3-habsburg-election-1519","house-of-habsburg"],"source":{"label":"Swiss National Museum blog — Jakob Fugger","url":"https://blog.nationalmuseum.ch/en/2020/03/jakob-fugger-money-and-spirit-around-1500/"}},{"year":1521,"title":"Jakob Fugger endows the Fuggerei","text":"He founded the Augsburg social-housing settlement, where rent remains one Rhenish guilder (€0.88) a year. It is still run by the family foundations.","ids":["fugger-family","g3-fugger-foundations"],"source":{"label":"Library of Congress — 500-year anniversary of the Fuggerei","url":"https://blogs.loc.gov/law/2021/08/500-year-anniversary-of-the-fuggerei-the-oldest-social-housing-complex-in-the-world/"}},{"year":1528,"title":"Welsers receive Venezuela and a 4,000-person slave licence","text":"Charles V repaid election debts with colonial rights to Venezuela (Klein-Venedig) and a contract to ship 4,000 enslaved Africans to the Caribbean.","ids":["welser-family"],"source":{"label":"Wikipedia — Klein-Venedig","url":"https://en.wikipedia.org/wiki/Klein-Venedig"}},{"year":1539,"title":"Tavistock Abbey granted to John Russell","text":"The first of three monastic grants (Tavistock 1539, Woburn 1547, Covent Garden 1552) that founded the Bedford fortune.","ids":["russell-family-bedford","dissolution-of-the-monasteries"],"source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1541,"title":"Longleat and Wilton pass to Tudor officials","text":"Sir John Thynne buys Longleat Priory and William Herbert receives the Wilton Abbey estate after its 1539 surrender.","ids":["thynne-family-bath","herbert-family-pembroke","dissolution-of-the-monasteries"],"source":{"label":"Wikipedia — Wilton House","url":"https://en.wikipedia.org/wiki/Wilton_House"}},{"year":1602,"title":"VOC chartered with 6.44m guilders of public capital","text":"The Dutch East India Company received sovereign powers in Asia. Its tradable shares created the Amsterdam stock market.","ids":["dutch-east-india-company"],"source":{"label":"Britannica — Dutch East India Company","url":"https://www.britannica.com/topic/Dutch-East-India-Company"}},{"year":1607,"title":"Robert Cecil receives Hatfield","text":"James I takes Theobalds and gives Hatfield to his chief minister, who builds Hatfield House by 1612.","ids":["cecil-family-salisbury"],"source":{"label":"Wikipedia — Hatfield House","url":"https://en.wikipedia.org/wiki/Hatfield_House"}},{"year":1615,"title":"Imperial Post becomes a hereditary Taxis fief","text":"Emperor Matthias made the office of Imperial Postmaster General hereditary in the Taxis family, securing a monopoly that lasted until 1806.","ids":["thurn-und-taxis-family","g2-reichspost","holy-roman-empire"],"source":{"label":"Wikipedia — Thurn-und-Taxis Post","url":"https://en.wikipedia.org/wiki/Thurn-und-Taxis_Post"}},{"year":1620,"title":"White Mountain and the Bohemian confiscations","text":"After the Habsburg victory of 8 November 1620, rebel estates were confiscated; Karl I of Liechtenstein, as governor, acquired large Bohemian and Moravian estates.","ids":["g2-battle-of-white-mountain","house-of-liechtenstein","house-of-habsburg"],"source":{"label":"Wikipedia — Battle of White Mountain","url":"https://en.wikipedia.org/wiki/Battle_of_White_Mountain"}},{"year":1668,"title":"Merck takes over the Angel Pharmacy","text":"Friedrich Jacob Merck acquires the Engel-Apotheke in Darmstadt, origin of today's Merck KGaA, still about 70% family-owned.","ids":["merck-family-darmstadt"],"source":{"label":"Wikipedia — Merck Group","url":"https://en.wikipedia.org/wiki/Merck_Group"}},{"year":1669,"title":"Bloomsbury comes to the Russells","text":"Rachel Wriothesley, heiress to the Dissolution-era Bloomsbury estate, marries William, Lord Russell.","ids":["russell-family-bedford","g1-bloomsbury-estate"],"source":{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}},{"year":1672,"title":"Richard Hoare becomes a freeman of the Goldsmiths: C. Hoare & Co. founded","text":"Britain's oldest surviving bank opened at the sign of the Golden Bottle in Cheapside. It is still family-owned.","ids":["hoare-family"],"
