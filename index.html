_summary":"M.M. Warburg made its money in trade finance and merchant banking for Hamburg's port economy. Brothers Paul and Felix married into Kuhn, Loeb in New York, and Paul helped design the US Federal Reserve. In 1938 the Nazis 'Aryanised' the bank and the family was forced out. Siegmund Warburg, who had emigrated, founded S.G. Warburg in London in 1946, and it became a leading City investment bank. In 1995 it was sold to Swiss Bank Corporation, now part of UBS. Eric Warburg co-founded Warburg Pincus in New York.","roleDetail":[{"t":"Forced out in 1938.","d":"Fritz Warburg was arrested in 1938. The bank was 'Aryanised' under new managers but kept its name.","basis":"documented"},{"t":"The London diaspora bank.","d":"S.G. Warburg (1946) was sold to Swiss Bank Corporation in 1995 and is now part of UBS.","basis":"documented"},{"t":"Cum-ex tax affair.","d":"The bank's tax liability from cum-ex share trades (2007–11) was repaid in full in 2020, mainly from the owners' private assets. The owners then took loans totalling almost €280m with interest. A criminal trial of co-owner Christian Olearius was discontinued in June 2024 on health grounds, and he has denied wrongdoing.","basis":"documented"}],"legacy":"M.M. Warburg & CO remains a Hamburg private bank. The Warburg family (Max Warburg) and Christian Olearius each own 40% of the group. A 2024 search for a new investor was paused in 2025. S.G. Warburg lives on only inside UBS, and Warburg Pincus is an independent private-equity partnership.","legacyDetail":[{"t":"Ownership under pressure.","d":"BaFin required repayment by March 2025 of loans linked to the owners' cum-ex tax debts. The bank reported partial repayment and partial extension (Börsen-Zeitung).","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current rich-list figure for the Warburg family was found.","grossAssets":{"text":"M.M. Warburg's group accounts are filed in Germany's Bundesanzeiger. The family's 40% stake has no published value.","source":{"label":"Börsen-Zeitung — Sale process paused at Warburg Bank (Apr 2025)","url":"https://boersen-zeitung.de/english/no-investor-warburg-bank"}},"controlled":{"text":"The family co-controls a mid-sized private bank. The Warburg-named firms in London (UBS) and New York (Warburg Pincus) are not family-controlled.","source":{"label":"Wikipedia — M. M. Warburg & Co.","url":"https://en.wikipedia.org/wiki/M._M._Warburg_%26_Co."}},"opaque":{"verdict":"none found","text":"Family holding arrangements for the 40% stake are private.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: M.M. Warburg & CO, Max M. Warburg, Warburg): name matches only, none shown to be this family or its vehicles; no press reporting found; Börsen-Zeitung and Bloomberg on the 2024–25 sale process.","source":{"label":"BNN Bloomberg — M.M. Warburg said to explore sale after role in tax scandal (Apr 2024)","url":"https://bnnbloomberg.ca/mm-warburg-said-to-explore-sale-after-role-in-tax-scandal-1.2066424"}},"gapNote":"The Warburg name is far larger than the Warburg fortune. Most firms bearing it are owned by others, and the family's own stake carries debt linked to tax repayments."},"holdingsToday":[{"name":"M.M. Warburg & CO (40% family)","kind":"Bank / wealth manager","sector":"Private banking","where":"Hamburg","detail":"Co-owned with Christian Olearius (40%). About 620 staff.","basis":"documented","source":{"label":"Börsen-Zeitung (Apr 2025)","url":"https://boersen-zeitung.de/english/no-investor-warburg-bank"}}],"lineage":[{"name":"Moses Marcus and Gerson Warburg","relation":"founder","years":"1798","note":"Founded the Hamburg house.","basis":"documented"},{"name":"Max M. Warburg","relation":"descendant","years":"1867–1946","note":"Head of the bank until the Nazi-era expropriation.","basis":"documented"},{"name":"Siegmund Warburg","relation":"cousin","years":"1902–1982","note":"Founded S.G. Warburg in London in 1946.","basis":"documented"},{"name":"Eric M. Warburg","relation":"son of Max","years":"1900–1990","note":"Restored the family's role in Hamburg and co-founded Warburg Pincus.","basis":"documented"},{"name":"Max Warburg (Jr.)","relation":"descendant","years":"fl. 2025","note":"Co-owner (40%). Chaired the supervisory board from 2023.","basis":"documented"}],"today":"Max Warburg co-owns M.M. Warburg & CO with Christian Olearius, each holding 40%. The bank has spent 2024–25 seeking a solution to loans tied to cum-ex tax repayments.","today_people":[{"name":"Max M. Warburg","relation":"co-owner","role":"Co-owner (40%), M.M. Warburg & CO group","sector":"Banking & finance","year":2025,"basis":"documented","source":{"label":"Börsen-Zeitung — Sale process paused (Apr 2025)","url":"https://boersen-zeitung.de/english/no-investor-warburg-bank"}}],"sources":[{"label":"Wikipedia — M. M. Warburg & Co.","url":"https://en.wikipedia.org/wiki/M._M._Warburg_%26_Co."},{"label":"Börsen-Zeitung — No investor for Warburg Bank: sale process paused (Apr 2025)","url":"https://boersen-zeitung.de/english/no-investor-warburg-bank"},{"label":"BNN Bloomberg — M.M. Warburg said to explore sale (2024)","url":"https://bnnbloomberg.ca/mm-warburg-said-to-explore-sale-after-role-in-tax-scandal-1.2066424"},{"label":"Börsen-Zeitung — Cum-ex trial against Olearius fuels ownership question","url":"https://boersen-zeitung.de/english/cum-ex-trial-against-olearius-fuels-ownership-question"}],"connections":[{"id":"hanseatic-league","type":"legacy","label":"Hamburg Hanseatic merchant tradition"},{"id":"schroder-family","type":"trade","label":"Hamburg–London merchant-banking peers"},{"id":"oppenheim-family","type":"trade","label":"German Jewish private banks Aryanised in 1938"},{"id":"nm-rothschild","type":"trade","label":"peer Jewish banking dynasties"},{"id":"switzerland-banking-secrecy","type":"legacy","label":"S.G. Warburg sold to Swiss Bank Corporation (UBS) 1995"}]},{"id":"oppenheim-family","name":"Oppenheim family (Sal. Oppenheim jr. & Cie.)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Court banking in Bonn (1789)","Rhineland railway and industrial finance","Private banking and asset management","Industrial stakes (Arcandor)"],"nation":"Germany","scale":"Minor","scaleBasis":"documented","scaleNote":"Europe's largest independent private bank before 2009. Deutsche Bank bought it for about €1bn after losses tied to the Arcandor insolvency, ending family ownership.","start":1789,"end":2010,"lifespan":"1789–2010 (family bank)","base":"Cologne","geo":[50.938,6.958],"aliases":["Sal. Oppenheim jr. & Cie.","Sal. Oppenheim"],"origins":"Salomon Oppenheim Jr. founded the bank in Bonn in 1789 and moved it to Cologne in 1798.","role_summary":"The Oppenheims financed Rhineland railways, insurers and industry in the 19th century, then built a large private-banking and asset-management franchise. In the 2000s the partners took large stakes in the retailer Arcandor (KarstadtQuelle) and lent heavily to its shareholder Madeleine Schickedanz. Arcandor's 2009 insolvency led to the bank's first post-war loss, and Deutsche Bank agreed to buy it for about €1bn.","roleDetail":[{"t":"Railway and insurance finance.","d":"The firm was a leading Cologne financier of Rhineland industrialisation.","basis":"interpretive"},{"t":"Arcandor exposure.","d":"The bank lent €380m to Madeleine Schickedanz so she could raise her Arcandor stake. That stake and the lending caused heavy losses when Arcandor failed.","basis":"documented"},{"t":"Court findings, 2015.","d":"The Cologne Regional Court convicted four former partners of breach of trust (Untreue) in 2015. Christopher von Oppenheim and Matthias Graf von Krockow, who had confessed, received suspended sentences of up to two years, as did a third partner; the former risk chief received an unsuspended term. The Federal Court of Justice dismissed all appeals in March 2018, making the judgments final.","basis":"documented"}],"legacy":"Deutsche Bank absorbed the bank, so no Oppenheim-owned bank survives. Family wealth today is private and undocumented.","legacyDetail":[{"t":"Brand absorbed.","d":"Deutsche Bank kept the asset and wealth business and sold BHF and other parts.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current figure. The family's bank equity was largely lost in 2009–10."},"holdingsToday":[{"name":"None documented (bank sold to Deutsche Bank, 2010)","kind":"Other","sector":"—","where":"Cologne","detail":"No continuing family vehicle found.","basis":"interpretive","source":{"label":"Bloomberg — Deutsche Bank to buy Sal. Oppenheim for €1bn (Oct 2009)","url":"https://www.bloomberg.com/news/articles/2009-10-28/deutsche-bank-agrees-to-buy-sal-oppenheim-for-1-billion-euros"}}],"lineage":[{"name":"Salomon Oppenheim Jr.","relation":"founder","years":"1772–1828","note":"Founded the bank in 1789.","basis":"documented"},{"name":"Pferdmenges & Co. (1938–47)","relation":"successor firm","years":"1938–1947","note":"Name the bank was forced to take under Nazi rule. Restored to the family afterwards.","basis":"documented"},{"name":"Deutsche Bank","relation":"successor firm","years":"2010","note":"Bought the group for about €1bn.","basis":"documented"}],"today":"The family no longer owns a bank.","today_people":[],"sources":[{"label":"Bloomberg — Deutsche Bank agrees to buy Sal. Oppenheim for €1bn (2009)","url":"https://www.bloomberg.com/news/articles/2009-10-28/deutsche-bank-agrees-to-buy-sal-oppenheim-for-1-billion-euros"},{"label":"WealthBriefing — Former Sal Oppenheim senior bankers convicted of criminal breaches of trust","url":"https://www.wealthbriefing.com/html/article.php/former-sal-oppenheim-senior-bankers-convicted-of-criminal-breaches-of-trust-"},{"label":"Immobilien Zeitung (dpa) — Ex-chiefs of Sal. Oppenheim sentenced","url":"https://www.iz.de/translatednews/news/-ex-chiefs-of-sal.-oppenheim-sentenced-to-prison-terms-1000526047"},{"label":"Wikipedia — Sal. Oppenheim","url":"https://en.wikipedia.org/wiki/Sal._Oppenheim"}],"connections":[{"id":"warburg-family","type":"trade","label":"peer German Jewish private bank, Aryanised 1938"},{"id":"luxembourg","type":"offshore","label":"group holding company based in Luxembourg"},{"id":"nm-rothschild","type":"trade","label":"19th-century Rhineland and Frankfurt banking network"},{"id":"krupp-family","type":"finance","label":"Rhineland industrial finance"}]},{"id":"lazard-david-weill","name":"Lazard and the David-Weill family","category":"Banking & Merchant Dynasties","role":"Modern Finance & Holding","moneySources":["Dry-goods trade (New Orleans 1848)","Gold-rush banking and bullion (San Francisco)","Advisory partnership (Paris, London, New York)","2005 IPO buy-out","Eurazeo investment company"],"nation":"France","scale":"Significant","scaleBasis":"documented","scaleNote":"Lazard Inc reported 2025 revenue of $3.10bn and $254bn of assets under management. The David-Weill family sold its controlling interest around the 2005 IPO for about $1.6bn.","start":1848,"end":null,"lifespan":"1848–present (family control to 2005)","base":"Paris (121 boulevard Haussmann) and New York","geo":[48.875,2.312],"aliases":["Lazard Frères","Lazard Ltd","Lazard, Inc.","Eurazeo"],"origins":"Three brothers, Alexandre, Lazare and Simon Lazard, opened a dry-goods store in New Orleans in 1848 and moved into banking in gold-rush San Francisco. Their cousin Alexandre Weill joined the firm, and the David-Weill line became its controlling partners.","role_summary":"Lazard turned gold-rush bullion dealing into a three-house partnership in Paris (from 1854), London (1870) and New York, earning fees on advice and finance. Under André Meyer and Felix Rohatyn it led the modern mergers business. Michel David-Weill inherited the largest stake in 1975. In 2005 he and his allies, including Eurazeo, were bought out for about $1.6bn in cash as Bruce Wasserstein took Lazard public.","roleDetail":[{"t":"Gold and exchange.","d":"San Francisco bullion and exchange business funded the move into European banking.","basis":"interpretive"},{"t":"Partnership capitalism.","d":"The David-Weills held the largest partnership stakes in Paris and New York for four generations.","basis":"documented"},{"t":"Cashing out in 2005.","d":"Institutional Investor reported that Lazard and Wasserstein bought out David-Weill and his associates for about $1.6bn. The New York Sun put the David-Weill and allied block at about 36%.","basis":"documented"}],"legacy":"Lazard is now a NYSE-listed Delaware company (Lazard, Inc. since 2024) with no family control. David-Weill money went into Eurazeo, the Paris investment company that Michel chaired and in which founding families kept a block through a holding vehicle.","legacyDetail":[{"t":"Eurazeo.","d":"Michel David-Weill chaired Eurazeo after leaving Lazard. A company history notes the founding families kept about 21.6% through a holding vehicle.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current family figure was found. Michel David-Weill died in 2022.","controlled":{"text":"Lazard manages $254bn (2025), but the family no longer controls it. The family's influence today runs through its Eurazeo shareholding, whose size was not verified for 2025.","source":{"label":"Lazard — Reports December 2025 AUM (StreetInsider)","url":"https://www.streetinsider.com/Business+Wire/Lazard+Reports+December+2025+Assets+Under+Management/25840276.html"}},"opaque":{"verdict":"none found","text":"The family's post-2005 capital is held privately and through its Eurazeo shareholding. Private vehicles are not public.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Eurazeo, Lazard David-Weill): no matches; no press reporting found; Eurazeo company history.","source":{"label":"Reference for Business — Eurazeo company history","url":"https://www.referenceforbusiness.com/history2/29/Eurazeo.html"}}},"holdingsToday":[{"name":"Eurazeo (family block via holding)","kind":"Fund / private equity","sector":"Investment company","where":"Paris","detail":"Founding families kept about 21.6% after the 2000s restructuring, according to a company history. The current stake was not verified.","basis":"interpretive","source":{"label":"Reference for Business — Eurazeo company history","url":"https://www.referenceforbusiness.com/history2/29/Eurazeo.html"}}],"lineage":[{"name":"Alexandre, Lazare and Simon Lazard","relation":"founder","years":"1848","note":"Founded the firm in New Orleans.","basis":"documented"},{"name":"David David-Weill","relation":"descendant of cousin Alexandre Weill","years":"1871–1952","note":"Partner from 1900.","basis":"documented"},{"name":"Pierre David-Weill","relation":"son","years":"1900–1975","note":"Partner from 1927, then chairman.","basis":"documented"},{"name":"Michel David-Weill","relation":"son","years":"1932–2022","note":"Chairman 1977–2005. Sold out at the 2005 IPO.","basis":"documented"},{"name":"Lazard, Inc.","relation":"successor firm","years":"2005–present","note":"Listed and no longer family-controlled.","basis":"documented"}],"today":"Lazard is run by professional management (CEO and chairman Peter Orszag). The David-Weill family's capital is outside Lazard, notably in Eurazeo.","today_people":[],"sources":[{"label":"Wikipedia — Lazard","url":"https://en.wikipedia.org/wiki/Lazard"},{"label":"Wikipedia — Michel David-Weill","url":"https://en.wikipedia.org/wiki/Michel_David-Weill"},{"label":"Institutional Investor — Lazard: how the David-Weill era ended","url":"https://www.institutionalinvestor.com/article/2btghh5h0b07py2nh454w/home/lazard-how-the-david-weill-era-ended"},{"label":"New York Sun — Lazard expects to raise up to $822.4m in IPO","url":"https://nysun.com/article/business-lazard-limited-expects-to-raise-up-to-8224"}],"connections":[{"id":"nm-rothschild","type":"trade","label":"Paris haute-banque rival"},{"id":"hottinguer-mallet","type":"trade","label":"Paris private-bank peers"},{"id":"g3-schroders-plc","type":"legacy","label":"comparison: family exits from City/Paris franchises"},{"id":"family-office","type":"legacy","label":"family capital moved to investment vehicles"}]},{"id":"pictet-lombard-odier","name":"Pictet and Lombard Odier (Geneva partner banks)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Geneva Protestant merchant banking (1796, 1805)","Private banking for European elites","Swiss banking secrecy era","Asset management and custody"],"nation":"Switzerland","scale":"Major","scaleBasis":"documented","scaleNote":"Pictet held CHF 757bn of assets under management or custody at end-2025. Lombard Odier reported CHF 349bn of client assets (CHF 367bn at mid-2026).","start":1796,"end":null,"lifespan":"1796 (Lombard Odier) / 1805 (Pictet) – present","base":"Geneva","geo":[46.198,6.137],"aliases":["Banque Pictet & Cie","Pictet Group","Lombard Odier & Co","Compagnie Lombard Odier SCmA"],"origins":"Lombard Odier traces itself to Henri Hentsch's firm of 11 January 1796, joined by Jean-Gédéon Lombard in 1798. The Lombard, Odier, Darier and Hentsch families were Huguenot or Genevan settlers. Pictet descends from De Candolle, Mallet & Cie, founded in Geneva on 23 July 1805.","role_summary":"Both houses earn fees on client assets: management and custody fees, brokerage and, later, institutional asset management. For two centuries their managing partners carried unlimited personal liability, and that personal guarantee was itself the selling point. Swiss banking secrecy drew foreign wealth into the business. When US enforcement ended the model, Pictet paid $122.9m under a 2023 deferred-prosecution agreement over 1,637 undeclared US accounts, and Lombard Odier paid $99.8m in 2015 under the DOJ Swiss Bank Program.","roleDetail":[{"t":"Partners on unlimited liability.","d":"Until 1 January 2014 both firms were partnerships whose partners were personally liable without limit. Both then converted to corporate partnership forms.","basis":"documented"},{"t":"Fee income on client assets.","d":"Pictet's 2025 operating income was CHF 3.21bn and profit CHF 667m. Lombard Odier's net profit was CHF 200m on operating income of CHF 1,394m.","basis":"documented"},{"t":"End of secrecy.","d":"Banque Pictet admitted conspiring with US taxpayers to evade about $50.6m in US taxes in 2008–14 and paid $122,959,391 under its December 2023 DPA. Lombard Odier paid $99.8m under a 2015 non-prosecution agreement in the DOJ Swiss Bank Program.","basis":"documented"},{"t":"Karimova case, 2026.","d":"On 27 July 2026 the Swiss Federal Criminal Court fined the bank Lombard Odier CHF 3m for lacking adequate organisational measures to prevent money laundering of funds linked to Gulnara Karimova; a former client manager received a suspended sentence for aggravated money laundering. The judgment is not final: the bank said it would appeal. No partner-family member was charged.","basis":"documented"}],"legacy":"Ownership remains with a small group of managing partners: seven at Pictet, led by senior partner Marc Pictet, and six at Lombard Odier, led by Hubert Keller. Partners hold the equity and pass it on in batches every five to ten years. They are not all members of founding families.","legacyDetail":[{"t":"Partnership succession.","d":"Pictet's ownership passes among owner-managers every five to ten years. The senior partner chairs the partners' meetings.","basis":"documented"}],"wealth":{"published":[{"figure":"CHF 5–6bn","usd":"c. $5–6bn","who":"Pictet family","publisher":"Bilanz (as reported by finews.ch)","year":2016,"rank":"1st among banker families","url":"https://www.finews.ch/news/banken/25379-reichstenliste-der-banker-familien-halten-das-vermoegen-zusammen"},{"figure":"CHF 2.5–3bn","usd":"c. $2.5–3bn","who":"Lombard Odier partner families","publisher":"Bilanz (as reported by finews.ch)","year":2016,"rank":"","url":"https://www.finews.ch/news/banken/25379-reichstenliste-der-banker-familien-halten-das-vermoegen-zusammen"}],"publishedNote":"finews later reported that the Lombard Odier families, once valued at CHF 3–3.5bn, had dropped off the Bilanz list. No 2025 Pictet figure was retrieved.","grossAssets":{"text":"Pictet 2025: consolidated profit CHF 667m, total capital ratio 21.6%. Lombard Odier 2025: net profit CHF 200m, CET1 33%. Partner equity is not separately valued.","source":{"label":"Pictet — Release of full-year results for 2025","url":"https://www.pictet.com/corporate-news/release-full-year-2025-figures"}},"controlled":{"text":"Pictet: CHF 757bn of assets under management or custody (end-2025). Lombard Odier: CHF 349bn of client assets (end-2025), of which CHF 223bn was AUM. This is client money, more than 100 times the published family figures. Partners decide how it is managed but do not own it.","source":{"label":"Lombard Odier — Full-year results 2025","url":"https://www.lombardodier.com/insights/2026/february/lombard-odier-reports-full-year.html"}},"opaque":{"verdict":"none found","text":"The partners' personal wealth is private, and no offshore vehicle of the partner families was found. Separately, the US DOJ documented that the banks' historic business included undeclared accounts for US clients: Pictet held 1,637 such accounts, per its 2023 DPA. The DOJ used the word 'hide' in the Pictet case: 'Swiss private bank Banque Pictet admits to conspiring with U.S. taxpayers to hide assets and income in offshore accounts' (IRS-CI headline).","searched":"US DOJ / IRS-CI releases; Lombard Odier Swiss Bank Program NPA (2015); Swiss Federal Criminal Court reporting (2026); ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Hubert Keller, Lombard Odier Group, Marc Pictet, Pictet Group, Pictet Lombard Odier): Lombard Odier Darier Hentsch bank and trust entities appear as intermediaries in the Panama Papers (the bank's client business, not the partners' own vehicles); otherwise name matches only.","source":{"label":"IRS-CI — Banque Pictet admits to conspiring with US taxpayers (Dec 2023)","url":"https://www.irs.gov/compliance/criminal-investigation/swiss-private-bank-banque-pictet-admits-to-conspiring-with-us-taxpayers-to-hide-assets-and-income-in-offshore-accounts"}},"gapNote":"Here the gap is between a few billion francs of partner wealth (Bilanz 2016) and over a trillion francs of client assets the partners direct. Online claims that these families are 'worth' their AUM confuse custody with ownership."},"holdingsToday":[{"name":"Pictet Group (partner-owned SCA)","kind":"Bank / wealth manager","sector":"Wealth, asset management, custody","where":"Geneva","detail":"CHF 757bn AUM/custody (2025). Seven managing partners.","basis":"documented","source":{"label":"Pictet — Full-year 2025 results","url":"https://www.pictet.com/corporate-news/release-full-year-2025-figures"}},{"name":"Lombard Odier Group (Compagnie Lombard Odier SCmA)","kind":"Bank / wealth manager","sector":"Wealth and asset management","where":"Geneva","detail":"CHF 349bn client assets (2025). Six managing partners.","basis":"documented","source":{"label":"Lombard Odier — Full-year 2025 results","url":"https://www.lombardodier.com/insights/2026/february/lombard-odier-reports-full-year.html"}}],"lineage":[{"name":"Henri Hentsch and Jean-Gédéon Lombard","relation":"founder","years":"1796–1798","note":"Founded what became Lombard Odier.","basis":"documented"},{"name":"Jacob-Michel-François de Candolle and Jacques-Henry Mallet","relation":"founder","years":"1805","note":"Founded what became Pictet.","basis":"documented"},{"name":"Marc Pictet","relation":"descendant","years":"fl. 2026","note":"Senior Managing Partner, Pictet.","basis":"documented"},{"name":"Hubert Keller","relation":"successor partner","years":"fl. 2026","note":"Senior Managing Partner, Lombard Odier.","basis":"documented"}],"today":"Marc Pictet is senior managing partner of Pictet, and Hubert Keller of Lombard Odier. Both banks remain partner-owned, with founding-family names alongside co-opted partners.","today_people":[{"name":"Marc Pictet","relation":"family member","role":"Senior Managing Partner, Pictet Group","sector":"Banking & finance","year":2026,"basis":"documented","source":{"label":"Pictet — Full-year 2025 results","url":"https://www.pictet.com/corporate-news/release-full-year-2025-figures"}},{"name":"Hubert Keller","relation":"partner","role":"Senior Managing Partner, Lombard Odier","sector":"Banking & finance","year":2026,"basis":"documented","source":{"label":"Lombard Odier — Full-year 2025 results","url":"https://www.lombardodier.com/insights/2026/february/lombard-odier-reports-full-year.html"}}],"sources":[{"label":"Pictet — Release of full-year results for 2025","url":"https://www.pictet.com/corporate-news/release-full-year-2025-figures"},{"label":"Lombard Odier — Full-year results 2025","url":"https://www.lombardodier.com/insights/2026/february/lombard-odier-reports-full-year.html"},{"label":"IRS-CI / DOJ — Banque Pictet deferred prosecution agreement (Dec 2023)","url":"https://www.irs.gov/compliance/criminal-investigation/swiss-private-bank-banque-pictet-admits-to-conspiring-with-us-taxpayers-to-hide-assets-and-income-in-offshore-accounts"},{"label":"Times of Central Asia — Swiss court fines Lombard Odier in Karimova case (2026)","url":"https://timesca.com/swiss-court-fines-lombard-odier-3-7-million-in-karimova-money-laundering-case/"},{"label":"finews.ch — Bilanz banker families rich list (2016)","url":"https://www.finews.ch/news/banken/25379-reichstenliste-der-banker-familien-halten-das-vermoegen-zusammen"},{"label":"Wikipedia — Lombard Odier","url":"https://en.wikipedia.org/wiki/Lombard_Odier"}],"connections":[{"id":"switzerland-banking-secrecy","type":"offshore","label":"Geneva private banking under Swiss secrecy (DOJ resolutions 2015, 2023)"},{"id":"hottinguer-mallet","type":"family","label":"Mallet family co-founded Pictet's predecessor (1805); Genevan Protestant banking network"},{"id":"edmond-de-rothschild-group","type":"trade","label":"Geneva private-bank peer"},{"id":"liechtenstein-foundations","type":"offshore","label":"client structuring alongside Swiss accounts"},{"id":"icij-offshore-leaks-db","type":"offshore","label":"searched as intermediaries"}]},{"id":"hottinguer-mallet","name":"Hottinguer and Mallet (French Protestant haute banque)","category":"Banking & Merchant Dynasties","role":"Banking & Sovereign Lending","moneySources":["Genevan and Zurich Protestant banking networks","Paris merchant banking (Mallet 1713; Hottinguer 1786)","Banque de France regency (1800–1936)","Railway and utility finance (Compagnie Générale des Eaux)"],"nation":"France","scale":"Minor","scaleBasis":"documented","scaleNote":"These were once regents of the Banque de France: the Hottinguers held a seat for 133 years. Today the families' banking presence is a small boutique (Banque Hottinguer), and the Mallet bank is absorbed into ABN AMRO's Neuflize OBC.","start":1713,"end":null,"lifespan":"1713 (Mallet) / 1786 (Hottinguer) – present","base":"Paris","geo":[48.872,2.334],"aliases":["Banque Mallet","Hottinguer & Cie","Banque Hottinguer","Neuflize Schlumberger Mallet","Neuflize OBC"],"origins":"Isaac Mallet, a Genevan Protestant, set up a Paris house in 1713 and re-established it in 1721 after the collapse of John Law's System. Jean-Conrad Hottinguer, from Zurich, opened a Paris bank in 1786 and was made a regent of the Banque de France in 1803 and a baron by Napoleon in 1810.","role_summary":"These Protestant houses formed the core of the Paris haute banque. They financed the state, trade and, in the 19th century, railways and utilities. Their seats on the Banque de France's council gave them a voice in monetary policy until the 1936 reform. Jean-Henri Hottinguer financed railways in France, Europe and Russia and helped found Compagnie Générale des Eaux, now Veolia.","roleDetail":[{"t":"Central-bank insiders.","d":"The Hottinguers sat on the Banque de France council for 133 years. Rodolphe Hottinguer held his regency for 52 years.","basis":"documented"},{"t":"The XYZ Affair, 1797.","d":"Jean-Conrad Hottinguer is identified by historians as one of the French agents ('X') who approached US envoys on Talleyrand's behalf in the XYZ Affair. The detail could not be re-checked against the Founders Online page within our research budget.","basis":"interpretive"},{"t":"Utility and railway finance.","d":"The firm financed railways and helped found Compagnie Générale des Eaux.","basis":"documented"}],"legacy":"The Hottinguer Paris bank was sold to Crédit Suisse in 1994. In 1989 family members founded Financière HR, which became Banque Hottinguer, a boutique, in 2012. Mallet merged in 1966 into Neuflize, Schlumberger, Mallet. ABN acquired a majority in 1980, and it is now Neuflize OBC, part of ABN AMRO.","legacyDetail":[{"t":"Absorbed by bank groups.","d":"The Mallet name disappeared in 2004. Neuflize OBC is a branch of ABN AMRO Bank N.V.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No current rich-list figure for either family was found.","opaque":{"verdict":"none found","text":"Private family holdings are not public.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Banque Hottinguer, Hottinguer Mallet, Neuflize OBC  — no family ownership): no matches; no press reporting found.","source":{"label":"Famille Hottinguer — Family history","url":"https://famillehottinguer.com/en/familyhistory.html"}}},"holdingsToday":[{"name":"Banque Hottinguer","kind":"Bank / wealth manager","sector":"Boutique advisory and private banking","where":"Paris","detail":"Successor to Financière HR (1989). Renamed Banque Hottinguer in 2012.","basis":"documented","source":{"label":"Famille Hottinguer — Family history","url":"https://famillehottinguer.com/en/familyhistory.html"}},{"name":"Neuflize OBC (ABN AMRO) — no family ownership","kind":"Bank / wealth manager","sector":"Private banking","where":"Paris","detail":"Institutional successor of Banque Mallet.","basis":"documented","source":{"label":"Musée protestant — The Mallet Bank","url":"https://museeprotestant.org/en/notice/the-mallet-bank/"}}],"lineage":[{"name":"Isaac Mallet","relation":"founder","years":"1684–1779","note":"Founded the Paris house in 1713.","basis":"documented"},{"name":"Jean-Conrad Hottinguer","relation":"founder","years":"1764–1841","note":"Founded the Paris bank in 1786. Regent of the Banque de France from 1803.","basis":"documented"},{"name":"Rodolphe Hottinguer","relation":"descendant","years":"1835–1920","note":"Head from 1866. President of Compagnie Générale des Eaux and of the Imperial Ottoman Bank.","basis":"documented"},{"name":"Neuflize, Schlumberger, Mallet","relation":"successor firm","years":"1966","note":"Merger that absorbed Banque Mallet.","basis":"documented"}],"today":"A family-run boutique, Banque Hottinguer, carries the name in Paris. Mallet's banking line survives only inside ABN AMRO.","today_people":[],"sources":[{"label":"Famille Hottinguer — Family history","url":"https://famillehottinguer.com/en/familyhistory.html"},{"label":"Musée protestant — The Mallet Bank","url":"https://museeprotestant.org/en/notice/the-mallet-bank/"},{"label":"Founders Online (US National Archives) — Thomas Jefferson Papers (XYZ / Hottinguer)","url":"https://founders.archives.gov/documents/Jefferson/03-10-02-0138-0001"},{"label":"Wikipedia — Algemene Bank Nederland (NSM majority, 1980)","url":"https://en.wikipedia.org/wiki/Algemene_Bank_Nederland"}],"connections":[{"id":"pictet-lombard-odier","type":"family","label":"Genevan Protestant banking network; Mallet co-founded Pictet's predecessor"},{"id":"nm-rothschild","type":"trade","label":"Paris haute-banque peers"},{"id":"lazard-david-weill","type":"trade","label":"Paris banking peers"},{"id":"french-revolution-confiscations","type":"political","label":"survived the Revolution and the Directory (XYZ Affair)"},{"id":"south-sea-company","type":"legacy","label":"Mallet rebuilt after the 1720 collapse of Law's System, the French parallel to the South Sea Bubble"}]},{"id":"east-india-company","name":"East India Company (English, later British)","category":"Colonial Companies & Investors","role":"Colonial Extraction","moneySources":["Royal monopoly charter on Asian trade (1600)","Textile, tea and opium trade","Bengal land revenue (diwani, 1765)","Private fortunes of servants ('nabobs')","Dividend guaranteed on Indian revenues (1833–1874)"],"nation":"United Kingdom","scale":"Dominant","scaleBasis":"documented","scaleNote":"From 1765 the Company collected the land revenue of Bengal, Bihar and Orissa for a fixed tribute of 26 lakh rupees a year to the Mughal emperor (Banglapedia).","start":1600,"end":1874,"lifespan":"1600–1874","base":"East India House, Leadenhall Street, London","geo":[51.513,-0.082],"aliases":["Honourable East India Company","John Company","EIC"],"origins":"London merchants obtained a royal charter on 31 December 1600 granting a monopoly of English trade east of the Cape of Good Hope. Shareholders funded voyages for pepper, then Indian cloth.","role_summary":"The Company began as a chartered trader and became a territorial power. After Plassey (1757), a firman of 12 August 1765 gave it the diwani, the right to collect revenue, of Bengal, Bihar and Orissa. Bengal's taxes then paid for the goods it exported, replacing bullion shipped from Britain, and for its army. Servants who made private fortunes returned as 'nabobs' and bought estates and parliamentary seats. After it lost its trading functions in 1833, shareholders received a fixed 10.5% dividend charged on Indian revenues until 1874, when the stock was redeemed at £200 per £100.","roleDetail":[{"t":"Taxes replaced trade capital.","d":"Before 1765 the Company paid for Indian goods with silver and gold from Britain. Afterwards Bengal's revenue financed the 'investment' in exports.","basis":"documented"},{"t":"Nabobs bought seats.","d":"Returned servants used fortunes to buy estates and seats in Parliament. Their numbers rose from about 12 MPs in 1761 to nearly 30 by 1780.","basis":"documented"},{"t":"Too big to fail.","d":"Parliament lent to the Company in its 1772–73 crisis in exchange for regulatory control (Regulating Act 1773).","basis":"documented"},{"t":"A guaranteed dividend paid by Indian taxpayers.","d":"Under the 1833 Act the Company's stock paid £10 10s a year. The 1873 Redemption Act paid it off on 30 April 1874 at £200 per £100 of stock, a cost charged to India.","basis":"documented"}],"legacy":"The Company was dissolved in 1874 after the Crown took over its government in 1858. Its capital dispersed into the stock-holders' redemption money, nabob estates in Britain, and London banks and agency houses. No continuing corporate successor exists; a modern retailer bought the trade name.","legacyDetail":[{"t":"Redemption cash.","d":"Holders received £200 per £100 of stock in 1874. The Viceroy estimated the redemption would save India £450,000 a year (Hansard, 1873).","basis":"documented"},{"t":"Nabob estates.","d":"Clive and others converted Indian fortunes into English land and political influence.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"Defunct since 1874. No modern figure exists.","gapNote":"The Company's profits were in part a transfer of Indian tax revenue to British shareholders and servants. Their present-day descendants' wealth cannot be traced as a single fortune."},"holdingsToday":[{"name":"None: dissolved 1874","kind":"Other","sector":"—","where":"London","detail":"Stock redeemed. Records are held at the British Library (India Office Records).","basis":"documented","source":{"label":"Wikipedia — East India Stock Dividend Redemption Act 1873","url":"https://en.wikipedia.org/wiki/East_India_Stock_Dividend_Redemption_Act_1873"}}],"lineage":[{"name":"Royal charter of Elizabeth I","relation":"founder","years":"1600","note":"Monopoly of English trade to the East.","basis":"documented"},{"name":"Robert Clive","relation":"servant","years":"1725–1774","note":"Won Plassey and secured the 1765 diwani. Returned as a nabob.","basis":"documented"},{"name":"Crown rule (Government of India Act)","relation":"successor","years":"1858","note":"The Crown took over the Company's territories.","basis":"documented"},{"name":"Stock redemption","relation":"end","years":"1874","note":"Paid off at £200 per £100.","basis":"documented"}],"today":"The Company no longer exists. Its legacy lies in the British state's former Indian empire and the private fortunes it created.","today_people":[],"sources":[{"label":"Banglapedia — Diwani","url":"https://en.banglapedia.org/index.php/Diwani"},{"label":"Wikipedia — Nabob","url":"https://en.wikipedia.org/wiki/Nabob"},{"label":"Hansard (HL) — East India Stock Dividend Redemption, 29 April 1873","url":"https://api.parliament.uk/historic-hansard/lords/1873/apr/29/east-india-stock-dividend-redemption"},{"label":"New York Review of Books — The British pillage of India (review of Dalrymple, The Anarchy)","url":"https://nybooks.com/articles/2020/06/11/british-pillage-of-india/"},{"label":"Wikipedia — East India Stock Dividend Redemption Act 1873","url":"https://en.wikipedia.org/wiki/East_India_Stock_Dividend_Redemption_Act_1873"}],"connections":[{"id":"dutch-east-india-company","type":"trade","label":"rival Asian chartered company"},{"id":"bank-of-england","type":"finance","label":"Company loans to the state; City capital market"},{"id":"city-of-london-corporation","type":"political","label":"headquartered in the City"},{"id":"south-sea-company","type":"legacy","label":"one of the three great 18th-century 'monied companies'"},{"id":"baring-family","type":"finance","label":"Francis Baring was an EIC director and chairman"},{"id":"cavendish-bentinck-portland","type":"political","label":"parliamentary politics of Company reform"}]},{"id":"dutch-east-india-company","name":"Dutch East India Company (VOC)","category":"Colonial Companies & Investors","role":"Trade & Chartered Monopoly","moneySources":["States-General monopoly charter (1602)","Spice monopoly (nutmeg, cloves, pepper)","Forced cultivation and plantation colonies","Intra-Asian trade","Slave labour and slave trade in Asia"],"nation":"Netherlands","scale":"Dominant","scaleBasis":"documented","scaleNote":"It was founded with about 6.44 million guilders of public share capital in 1602 and paid dividends averaging about 18% of capital a year for almost 200 years.","start":1602,"end":1799,"lifespan":"1602–1799","base":"Oost-Indisch Huis, Amsterdam; Batavia (Jakarta)","geo":[52.371,4.9],"aliases":["Vereenigde Oostindische Compagnie","VOC","Heeren XVII"],"origins":"The States-General merged rival Dutch voyage companies into one chartered company on 20 March 1602. Its capital was raised from public share subscriptions in six chambers.","role_summary":"The VOC's charter empowered it to build forts, maintain armies and make treaties in Asia. It used force to monopolise the spice trade, notably the conquest of the Banda Islands for nutmeg, and ran Batavia as a colonial capital. Profits came from monopoly prices in Europe, intra-Asian trade and tribute from subject territories, paying shareholders high dividends. It was the first company with permanent, tradable share capital, which created the Amsterdam stock market.","roleDetail":[{"t":"Sovereign powers by charter.","d":"It could build forts, raise armies and conclude treaties.","basis":"documented"},{"t":"Monopoly dividends.","d":"Dividends averaged about 18% of capital a year over nearly two centuries.","basis":"documented"},{"t":"Collapse and nationalisation.","d":"The Dutch government revoked the charter and in 1799 took over its debts and possessions.","basis":"documented"}],"legacy":"The Batavian Republic absorbed the Company's territories and debts in 1799, laying the basis of the Dutch East Indies colonial state. Shareholder and director profits flowed into Amsterdam regent families, canal houses and the Dutch capital market that later fed Hope & Co's foreign lending.","legacyDetail":[{"t":"Profits fed Amsterdam finance.","d":"Accumulated Dutch savings financed 18th-century sovereign lending through houses such as Hope & Co.","basis":"interpretive"}],"wealth":{"published":[],"publishedNote":"Defunct since 1799."},"holdingsToday":[{"name":"None: dissolved 1799","kind":"Other","sector":"—","where":"Amsterdam","detail":"Debts and possessions passed to the Dutch state.","basis":"documented","source":{"label":"Britannica — Dutch East India Company","url":"https://www.britannica.com/topic/Dutch-East-India-Company"}}],"lineage":[{"name":"States-General charter","relation":"founder","years":"1602","note":"Merged the voyage companies under one charter.","basis":"documented"},{"name":"Heeren XVII","relation":"governing board","years":"1602–1799","note":"The seventeen directors drawn from the six chambers.","basis":"documented"},{"name":"Batavian Republic","relation":"successor","years":"1799","note":"Took over the Company's debts and possessions.","basis":"documented"}],"today":"No successor company exists. Its archives are held in the Netherlands and Indonesia.","today_people":[],"sources":[{"label":"Britannica — Dutch East India Company","url":"https://www.britannica.com/topic/Dutch-East-India-Company"},{"label":"Wikipedia — Dutch East India Company","url":"https://en.wikipedia.org/wiki/Dutch_East_India_Company"},{"label":"World History Encyclopedia — Dutch East India Company timeline","url":"https://www.worldhistory.org/timeline/Dutch_East_India_Company"}],"connections":[{"id":"east-india-company","type":"trade","label":"rival in Asia"},{"id":"dutch-west-india-company","type":"legacy","label":"Atlantic sister company (1621)"},{"id":"hope-and-co","type":"legacy","label":"Amsterdam capital later lent abroad"},{"id":"house-of-orange","type":"political","label":"Dutch Republic stadholders"}]},{"id":"british-south-africa-company","name":"British South Africa Company (BSAC)","category":"Colonial Companies & Investors","role":"Colonial Extraction","moneySources":["Rudd Concession mineral rights (1888)","Royal charter (1889)","Land alienation and company rule in Rhodesia","Northern Rhodesian copper royalties","Merger into Charter Consolidated (1965)"],"nation":"United Kingdom","scale":"Major","scaleBasis":"documented","scaleNote":"It governed Southern and Northern Rhodesia under charter until 1923–24 and kept Northern Rhodesian mineral rights until 1964, when it surrendered them for £4m (£2m each from the British and Zambian governments, per Hansard).","start":1889,"end":1965,"lifespan":"1889–1965","base":"London; Salisbury (Harare)","geo":[51.513,-0.086],"aliases":["BSAC","BSA Company","Chartered Company"],"origins":"Cecil Rhodes's agents obtained the Rudd Concession from the Ndebele king Lobengula in 1888. On that basis the British government granted the company a royal charter in October 1889.","role_summary":"The charter let a private company occupy, administer and exploit territory north of the Limpopo, which became Rhodesia. Its value came from mineral rights and land: settlers and mining companies paid it royalties. After copper was found in Northern Rhodesia, royalties on the Copperbelt became the company's main income. On Zambian independence in 1964 the company gave up these rights in return for £4m.","roleDetail":[{"t":"A concession turned into a state.","d":"The 1888 Rudd Concession, whose fairness historians dispute, underpinned the 1889 charter.","basis":"documented"},{"t":"Copper royalties.","d":"Northern Rhodesian mineral rights were vested in Zambia's President from 24 October 1964.","basis":"documented"},{"t":"Merged away.","d":"In 1965 BSAC merged with two other companies to form Charter Consolidated, in which Anglo American was reported to hold about a third.","basis":"interpretive"}],"legacy":"BSAC's assets passed into Charter Consolidated (1965), a mining-finance company linked to the Anglo American–De Beers group. No BSAC-branded vehicle survives.","legacyDetail":[{"t":"Compensation of £4m in 1964.","d":"Paid ex gratia and free of Zambian tax.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"Defunct since 1965."},"holdingsToday":[{"name":"None: merged into Charter Consolidated (1965)","kind":"Other","sector":"Mining finance","where":"London","detail":"No surviving BSAC entity.","basis":"documented","source":{"label":"Wikipedia — British South Africa Company","url":"https://en.wikipedia.org/wiki/British_South_Africa_Company"}}],"lineage":[{"name":"Rudd Concession","relation":"origin","years":"1888","note":"Mineral rights claimed from Lobengula.","basis":"documented"},{"name":"Cecil Rhodes","relation":"founder","years":"1853–1902","note":"Promoter and managing director.","id":"cecil-rhodes","basis":"documented"},{"name":"Charter Consolidated","relation":"successor firm","years":"1965","note":"Formed by merging BSAC with two other companies.","basis":"documented"}],"today":"No BSAC entity survives. Its rights passed to the governments of Zimbabwe and Zambia and its residual assets to Charter Consolidated.","today_people":[],"sources":[{"label":"Wikipedia — British South Africa Company","url":"https://en.wikipedia.org/wiki/British_South_Africa_Company"},{"label":"Hansard — British South Africa Company (written answers), 24 November 1964","url":"https://api.parliament.uk/historic-hansard/written-answers/1964/nov/24/british-south-africa-company"},{"label":"Zimbabwe Field Guide — Were Lobengula and the amaNdebele tricked by the Rudd Concession?","url":"https://zimfieldguide.com/bulawayo/were-lobengula-and-amandebele-tricked-rudd-concession"},{"label":"Zimbabwe Field Guide — The British South Africa Company","url":"https://zimfieldguide.com/harare/british-south-africa-company"}],"connections":[{"id":"cecil-rhodes","type":"ownership","label":"founded and directed by Rhodes"},{"id":"nm-rothschild","type":"finance","label":"Rothschild backing for Rhodes's enterprises"},{"id":"congo-free-state","type":"political","label":"parallel chartered and personal colonial regimes in Africa"},{"id":"east-india-company","type":"legacy","label":"chartered-company model revived"}]},{"id":"cecil-rhodes","name":"Cecil Rhodes (De Beers, BSAC, Rhodes Trust)","category":"Colonial Companies & Investors","role":"Mining & Mineral Royalties","moneySources":["Kimberley diamond claims","De Beers amalgamation (1888) with Rothschild backing","Witwatersrand gold (Consolidated Gold Fields)","BSAC charter and land","Bequest to the Rhodes Trust (1902)"],"nation":"United Kingdom","scale":"Major","scaleBasis":"documented","scaleNote":"The Rhodes Trust, endowed under his will, reported total net assets of £548m at 30 June 2025, with invested assets of £422m.","start":1871,"end":1902,"lifespan":"1871 (Kimberley) – 1902 (death); Trust 1902–present","base":"Kimberley; Groote Schuur, Cape Town; Rhodes House, Oxford","geo":[-28.738,24.763],"aliases":["C. J. Rhodes","De Beers Consolidated Mines","Rhodes Trust"],"origins":"Rhodes, a vicar's son from Bishop's Stortford, went to Natal in 1870 and moved to the Kimberley diamond diggings in 1871. He bought up claims with partners.","role_summary":"Rhodes's fortune came from consolidating diamond claims into a monopoly. In 1887 he secured Natty Rothschild's backing, reported as a £1m loan, to buy the French Diamond Company and outbid Barney Barnato. De Beers Consolidated Mines was incorporated on 13 March 1888. Diamond profits financed the BSAC, chartered in 1889, which gave him territorial and mineral control over what became Rhodesia. His will made Natty Rothschild an executor and left most of his estate to the Rhodes Trust, which funds Oxford's Rhodes Scholarships.","roleDetail":[{"t":"Monopoly through amalgamation.","d":"Kimberley claims were merged into De Beers Consolidated (1888), which controlled the diamond supply.","basis":"documented"},{"t":"City finance.","d":"The Rothschild Archive records that in 1887 Rhodes secured Nathaniel Rothschild's backing for De Beers' bid for the French Diamond Company.","basis":"documented"},{"t":"Diamonds funded a chartered company.","d":"The BSAC (1889) extended Rhodes's mining interests into colonial rule.","basis":"documented"},{"t":"Bequest.","d":"The will left the residue to trustees including Rosebery, Grey, Milner, Beit and Rothschild. It established 60 colonial scholarships of £300 a year, and others.","basis":"documented"}],"legacy":"The money that is still traceable is in the Rhodes Trust at Oxford, with £548m of net assets in 2025. De Beers later passed into the Anglo American group.","legacyDetail":[{"t":"Rhodes Trust.","d":"Invested assets of £422m and total net assets of £548m at 30 June 2025.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"Estimates of Rhodes's estate at death in 1902 found online (£4m–£7.9m) come from low-quality sites and are not used.","grossAssets":{"text":"Rhodes Trust: total net assets £548m, invested assets £422m (30 June 2025).","source":{"label":"Rhodes Trust — Annual Review 2025: Finance and investment report","url":"https://www.rhodeshouse.ox.ac.uk/2025annualreview/finance-and-investment-report/"}},"controlled":{"text":"The Trust's assets are governed by its trustees under charity law, not by any family.","source":{"label":"Charity Commission — Rhodes Trust Public Purposes Fund (232492)","url":"https://register-of-charities.charitycommission.gov.uk/en/charity-search/-/charity-details/232492/full-print"}}},"holdingsToday":[{"name":"The Rhodes Trust","kind":"Foundation","sector":"Education (Rhodes Scholarships)","where":"Oxford","detail":"£548m net assets (June 2025).","basis":"documented","source":{"label":"Rhodes Trust — Finance and investment report 2025","url":"https://www.rhodeshouse.ox.ac.uk/2025annualreview/finance-and-investment-report/"}}],"lineage":[{"name":"Cecil John Rhodes","relation":"founder","years":"1853–1902","note":"Built De Beers and the BSAC.","basis":"documented"},{"name":"Nathaniel, 1st Lord Rothschild","relation":"financier and executor","years":"1840–1915","note":"Backed De Beers in 1887 and executed Rhodes's will.","id":"nm-rothschild","basis":"documented"},{"name":"Rhodes Trust","relation":"successor","years":"1902–present","note":"Endowed with most of the estate.","basis":"documented"}],"today":"Rhodes's name survives in the Rhodes Scholarships, administered by the Rhodes Trust at Oxford.","today_people":[],"sources":[{"label":"Rothschild Archive (family) — Nathaniel Mayer 'Natty' de Rothschild","url":"https://family.rothschildarchive.org/people/61-nathaniel-mayer-natty-de-rothschild-1840-1915"},{"label":"Saïd Business School, Oxford — Cecil Rhodes and the Rhodes Trust","url":"https://www.sbs.ox.ac.uk/about-us/support-us/impact-and-recognition/cecil-rhodes-and-rhodes-trust"},{"label":"Rhodes Trust — Annual Review 2025: Finance and investment report","url":"https://www.rhodeshouse.ox.ac.uk/2025annualreview/finance-and-investment-report/"},{"label":"Encyclopedia.com — De Beers Consolidated Mines company history","url":"https://www.encyclopedia.com/social-sciences-and-law/economics-business-and-labor/businesses-and-occupations/de-beers"},{"label":"EBSCO Research Starters — Rhodes amalgamates Kimberley diamondfields","url":"https://ebsco.com/research-starters/history/rhodes-amalgamates-kimberley-diamondfields"}],"connections":[{"id":"british-south-africa-company","type":"ownership","label":"founded the BSAC"},{"id":"nm-rothschild","type":"finance","label":"Rothschild backing for De Beers, 1887; executor"},{"id":"east-india-company","type":"legacy","label":"revived the chartered-company model"},{"id":"congo-free-state","type":"political","label":"Scramble for Africa contemporaries"}]},{"id":"hanseatic-league","type":"entity","name":"Hanseatic League (incl. the London Steelyard)","kind":"Trade network","description":"The Hanseatic League was a league of North German and Baltic merchant towns led by Lübeck that dominated northern European trade from the 13th to the 16th century. Its London Kontor, the Steelyard beside the Thames, was formally established in 1320 and exported English wool and later cloth. Lübeck, Bremen and Hamburg sold the Steelyard site to the South Eastern Railway in 1852, and Cannon Street station now stands on it.","start":1241,"geo":[51.51,-0.091],"sources":[{"label":"Wikipedia — Hanseatic League","url":"https://en.wikipedia.org/wiki/Hanseatic_League"},{"label":"Britannica — Merchants of the Steelyard","url":"https://www.britannica.com/print/article/564762"}],"connections":[{"id":"warburg-family","type":"legacy","label":"Hamburg merchant tradition"},{"id":"bardi-peruzzi","type":"trade","label":"rival creditors of English kings"},{"id":"city-of-london-corporation","type":"charter","label":"privileges in the City of London"}]},{"id":"dutch-west-india-company","type":"entity","name":"Dutch West India Company (WIC / GWC)","kind":"Chartered company","description":"The States-General chartered the Dutch West India Company on 3 June 1621 with a monopoly that included the Dutch Atlantic slave trade, Brazil, the Caribbean and North America. Its aim was economic warfare against Spain and Portugal. A reorganised company chartered in 1675 relied heavily on the slave trade and shipped about 187,000 enslaved Africans between 1674 and 1739. The state took it over in 1791.","start":1621,"geo":[52.374,4.896],"sources":[{"label":"Britannica — Dutch West India Company","url":"https://www.britannica.com/print/article/174648"},{"label":"Wikipedia — Dutch West India Company","url":"https://en.wikipedia.org/wiki/Dutch_West_India_Company"}],"connections":[{"id":"dutch-east-india-company","type":"legacy","label":"Atlantic counterpart of the VOC"},{"id":"house-of-orange","type":"political","label":"Dutch Republic"},{"id":"welser-family","type":"legacy","label":"earlier German slave-trade licence (1528)"}]},{"id":"bank-of-england","type":"entity","name":"Bank of England","kind":"Bank / wealth manager","description":"The Bank of England was chartered on 27 July 1694 when 1,268 subscribers lent £1.2m to William III's government for the war against France. In return the Bank gained a charter and note-issuing rights. It was a private joint-stock company until it was nationalised in 1946. In 1890 it organised a £17m guarantee fund to rescue Barings, an early lender-of-last-resort operation.","start":1694,"geo":[51.514,-0.089],"sources":[{"label":"Bank of England Museum — Why was the Bank of England founded?","url":"https://www.bankofengland.co.uk/museum/online-collections/blog/why-was-the-bank-of-england-founded"},{"label":"Bank Underground — The Barings crisis of 1890","url":"https://bankunderground.co.uk/2016/02/10/rescuing-a-sifi-halting-a-panic-the-barings-crisis-of-1890/"}],"connections":[{"id":"baring-family","type":"finance","label":"1890 rescue"},{"id":"nm-rothschild","type":"finance","label":"bullion and loan operations"},{"id":"south-sea-company","type":"finance","label":"rival for the national debt, 1720"},{"id":"city-of-london-corporation","type":"political","label":"sits in the City of London"}]},{"id":"south-sea-company","type":"entity","name":"South Sea Company (and the 1720 Bubble)","kind":"Chartered company","description":"The South Sea Company was founded in 1711 to trade, mainly in enslaved Africans, with Spanish America. It took over government debt in exchange for its shares and received the asiento slave-trading contract in 1713 under the Treaty of Utrecht. Its 1720 scheme to absorb the national debt inflated a share bubble that collapsed from September 1720 and ruined many investors. Parliament passed the Bubble Act the same year.","start":1711,"geo":[51.514,-0.084],"sources":[{"label":"Britannica — South Sea Bubble","url":"https://www.britannica.com/print/article/556389"},{"label":"Royal Museums Greenwich — South Sea Bubble","url":"https://www.rmg.co.uk/stories/topics/south-sea-bubble"}],"connections":[{"id":"bank-of-england","type":"finance","label":"competed to hold the national debt"},{"id":"hoare-family","type":"finance","label":"City bankers of the bubble era"},{"id":"east-india-company","type":"legacy","label":"fellow 'monied company'"}]},{"id":"city-of-london-corporation","type":"entity","name":"City of London Corporation (and City's Estate / City's Cash)","kind":"Estate company","description":"The City of London Corporation is the municipal authority of the Square Mile, governed by the Court of Common Council, the Court of Aldermen and the Livery through Common Hall. Its private endowment, City's Cash (renamed City's Estate in 2023–24), dates from the 15th century and was built from property, bequests and statutory transfers. Its value has been reported at about £2.3bn (net assets, 2016) to about £2.7–2.8bn in later council papers.","start":1067,"geo":[51.516,-0.092],"sources":[{"label":"Wikipedia — City's Cash","url":"https://en.wikipedia.org/wiki/City%27s_Cash"},{"label":"London Society — Great Estates: the City of London","url":"https://www.londonsociety.org.uk/post/report-great-estates-the-city-of-london"}],"connections":[{"id":"william-the-conqueror","type":"charter","label":"William's charter to the City (c. 1067)"},{"id":"bank-of-england","type":"political","label":"the City's central bank"},{"id":"hanseatic-league","type":"charter","label":"Steelyard privileges"}]},{"id":"g3-habsburg-election-1519","type":"entity","name":"Imperial election of Charles V (1519)","kind":"Battle / event","description":"When Maximilian I died in 1519 owing Jakob Fugger about 350,000 guilders, Charles of Habsburg won the electors' votes with payments of about 851,585 guilders. Fugger supplied 543,385, about two-thirds. The Welsers and three Italian firms supplied the rest. Repayment came as mining rights and revenue assignments, and for the Welsers the Venezuela charter of 1528.","start":1519,"geo":[50.11,8.682],"sources":[{"label":"Swiss National Museum blog — Jakob Fugger: money and spirit around 1500","url":"https://blog.nationalmuseum.ch/en/2020/03/jakob-fugger-money-and-spirit-around-1500/"},{"label":"habsburger.net — 'Sponsored by Fugger'","url":"https://www.habsburger.net/en/chapter/sponsored-fugger-trading-houses-financial-backers"}],"connections":[{"id":"fugger-family","type":"finance","label":"543,385 guilders"},{"id":"welser-family","type":"finance","label":"co-lenders"},{"id":"house-of-habsburg","type":"political","label":"Charles V elected"},{"id":"holy-roman-empire","type":"political","label":"imperial election"}]},{"id":"g3-suez-canal-shares-1875","type":"entity","name":"Suez Canal share purchase (1875)","kind":"Battle / event","description":"In November 1875 N M Rothschild & Sons advanced £4m to Disraeli's government to buy the Khedive of Egypt's 176,602 shares, out of 400,000, in the Suez Canal Company. Lionel de Rothschild's terms were a 2.5% commission plus 5% interest. Parliament later voted the money to repay the loan.","start":1875,"geo":[30.585,32.265],"sources":[{"label":"The Rothschild Archive — Lionel de Rothschild and the Suez Canal","url":"https://www.rothschildarchive.org/business/n_m_rothschild_and_sons_london/lionel_de_rothschild_and_the_suez_canal"},{"label":"Hansard — Suez Canal (Shares) Bill, third reading, 6 March 1876","url":"https://api.parliament.uk/historic-hansard/commons/1876/mar/06/bill-89-third-reading"}],"connections":[{"id":"nm-rothschild","type":"finance","label":"£4m advance"},{"id":"bank-of-england","type":"finance","label":"London money market"}]},{"id":"g3-edward-iii-default","type":"entity","name":"Edward III's war loans and the Florentine bank failures (1338–1346)","kind":"Battle / event","description":"Edward III borrowed heavily from the Bardi and Peruzzi to fund the opening of the Hundred Years' War, repaying in wool grants and customs assignments. The 1338–39 loans exhausted both firms. Villani's figures for the debts were 900,000 florins to the Bardi and 600,000 to the Peruzzi. The Peruzzi failed in 1343 and the Bardi in 1346, though Hunt argues the default was only one cause.","start":1338,"geo":[43.769,11.256],"sources":[{"label":"Britannica — Peruzzi family","url":"https://www.britannica.com/topic/Peruzzi-family"},{"label":"E. S. Hunt — Journal of Economic History (1990)","url":"https://resolve.cambridge.org/core/journals/journal-of-economic-history/article/new-look-at-the-dealings-of-the-bardi-and-peruzzi-with-edward-iii/2AD04842FACDAE9D0A660EDCD72EC097"}],"connections":[{"id":"bardi-peruzzi","type":"finance","label":"lenders"},{"id":"magna-carta","type":"political","label":"English royal finance"}]},{"id":"agnelli-elkann-family","name":"Agnelli–Elkann family (Fiat, Exor)","category":"Industrial Dynasties","role":"Industry & Manufacturing","moneySources":["Fiat car manufacturing (1899)","Industrial conglomerate (IFI/IFIL)","Holding-company chain","Ferrari spin-off (2016)","Investment holding (Exor)"],"nation":"Italy","scale":"Dominant","scaleBasis":"documented","scaleNote":"Exor, the family's listed holding, reported a net asset value of €33.2bn and gross assets of €37.1bn at 31 December 2025, and is the largest shareholder of Ferrari, Stellantis, Philips and CNH.","start":1899,"end":null,"lifespan":"1899–present","base":"Turin, Italy (Exor registered in Amsterdam)","geo":[45.07,7.687],"aliases":["Agnelli family","Elkann family","Fiat","IFI","IFIL","Exor N.V.","Giovanni Agnelli B.V.","Dicembre"],"origins":"Giovanni Agnelli (1866–1945), a cavalry officer from a Piedmontese landowning family, was among the founding investors of Fabbrica Italiana Automobili Torino (FIAT) in Turin in 1899 and soon became its dominant shareholder. His grandson Gianni Agnelli (1921–2003) chaired Fiat from 1966 to 1996.","role_summary":"The fortune was made by building Fiat into Italy's dominant carmaker and industrial group in the 20th century, then holding it through a chain of family holding companies (IFI, IFIL, now Exor). From 2009 the Fiat group was split and recombined: Chrysler (2014), the Ferrari spin-off (2016), CNH and Iveco, and the 2021 Fiat Chrysler–PSA merger that created Stellantis. Exor, controlled by the family partnership Giovanni Agnelli B.V., keeps the largest stakes in each.","roleDetail":[{"t":"Founding of FIAT, 1899.","d":"Giovanni Agnelli joined the group of Turin investors that founded FIAT in 1899 and took control of the company in its first decades.","basis":"documented"},{"t":"Gianni Agnelli era (1966–1996).","d":"Under Gianni Agnelli Fiat became Italy's largest private industrial group, with interests across cars, trucks, newspapers (La Stampa) and Juventus football club.","basis":"documented"},{"t":"Restructuring after 2004.","d":"After the deaths of Gianni (2003) and Umberto Agnelli (2004), John Elkann, Gianni's grandson, took over the family's leadership; Sergio Marchionne's Fiat merged with Chrysler, then spun off Ferrari (2016) and the industrial arm CNH.","basis":"documented"},{"t":"Exor moves to the Netherlands.","d":"Exor merged its Italian parent into a Dutch N.V. in 2016 and is listed in Amsterdam; the Netherlands allows loyalty (special voting) shares that give long-term holders extra votes.","basis":"documented"},{"t":"From carmaker to investment holding.","d":"Exor sold about 4% of Ferrari in 2025 for about €3bn and keeps about 20% of Ferrari's economic rights and 30% of its votes, while building Lingotto, an investment-management arm.","basis":"documented"}],"legacy":"The family's money sits in a chain: family members hold shares in Giovanni Agnelli B.V. (Netherlands), which holds about 55% of Exor N.V.; Exor in turn holds the largest stakes in Ferrari, Stellantis, Philips, CNH, Juventus and The Economist Group, and owns the asset manager Lingotto.","legacyDetail":[{"t":"Giovanni Agnelli B.V. at the top.","d":"Its 2025 accounts show a stable 54.9% stake in Exor and net equity of about €1.24bn after debt was almost eliminated; the Dicembre partnership (John Elkann's branch) holds about 41% of it and the Maria Sole Agnelli branch about 11% (Calcio e Finanza).","basis":"documented"},{"t":"Exor's net asset value.","d":"At end-2025 Exor reported NAV of €33.2bn: companies €29.2bn, Lingotto €4.2bn, other holdings €2.3bn and cash €1.4bn.","basis":"documented"}],"wealth":{"published":[{"figure":"$2.4bn","usd":"$2.4bn","who":"John Elkann","publisher":"Forbes (real-time billionaires)","year":2026,"rank":"#1682","url":"https://www.forbes.com/profile/john-elkann/"}],"publishedNote":"Forbes lists John Elkann alone; it does not publish a figure for the wider Agnelli family, whose members share Giovanni Agnelli B.V.","grossAssets":{"text":"Exor N.V.: gross asset value €37.1bn and NAV €33.2bn at 31 December 2025 (Exor FY2025 results). Giovanni Agnelli B.V. owns 54.9% of Exor; its own net equity was about €1.24bn at book value in 2025 (it carries Exor at cost, not market value).","source":{"label":"Calcio e Finanza — Giovanni Agnelli BV 2025 accounts","url":"https://www.calcioefinanza.it/?p=229330"}},"controlled":{"text":"Through Exor the family is the largest shareholder of Ferrari (the AFM register shows Giovanni Agnelli B.V., indirectly with Piero Ferrari's pact shares, at 29.36% of capital and 44.05% of votes, March 2025), Stellantis (revenue €153.5bn in 2025), Philips and CNH. These groups have combined revenues far above €200bn; the family's economic share in each is a fraction of that.","source":{"label":"AFM substantial holdings register — Giovanni Agnelli B.V. / Ferrari N.V.","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=170902"}},"opaque":{"verdict":"reported","text":"Shares in Giovanni Agnelli B.V. are held through family partnerships (e.g. Dicembre); the split among individual heirs is only partly public. Turin prosecutors alleged that Marella Caracciolo Agnelli's Swiss tax residence was fictitious; in 2025 John, Lapo and Ginevra Elkann paid €183m to Italy's revenue agency without admitting guilt, and in 2026 the proceedings against John Elkann continued, with no verdict found. No court has found wrongdoing.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Agnelli, Elkann, Exor, Dicembre; queries: Agnelli–Elkann, Exor N.V., Ferrari N.V., John Elkann, Juventus FC and The Economist Group, Lingotto Investment Management …): name matches only, none shown to be this family or its vehicles, AFM substantial-holdings register, Exor results, Italian and Reuters coverage of the inheritance case.","source":{"label":"Il Post — Elkann case heads to trial (Dec 2025)","url":"https://www.ilpost.it/2025/12/15/john-elkann-processo-eredita-agnelli/"}},"gapNote":"Forbes's $2.4bn for John Elkann measures one person's look-through stake; the family chain controls Exor's €33bn NAV, and through it the votes in companies with market values many times larger. Control reach, not net worth, is the striking number here (interpretive)."},"holdingsToday":[{"name":"Exor N.V.","kind":"Listed stake","sector":"Investment holding","where":"Amsterdam","detail":"54.9% held by Giovanni Agnelli B.V.; NAV €33.2bn (end-2025)","basis":"documented","source":{"label":"Exor — NAV per share outperforms MSCI World (2025)","url":"https://exor.com/press-releases/2025-09-17/exor-nav-share-outperforms-msci-world-index"}},{"name":"Ferrari N.V.","kind":"Listed stake","sector":"Luxury cars","where":"Maranello","detail":"c. 20% of economic rights and c. 30% of votes held by Exor after the 2025 sale of c. 4%","basis":"documented","source":{"label":"BNN Bloomberg — Exor offers 4% Ferrari stake (Feb 2025)","url":"https://bnnbloomberg.ca/business/company-news/2025/02/26/ferrari-holder-exor-offers-four-per-cent-stake-in-luxury-carmaker"}},{"name":"Stellantis N.V.","kind":"Listed stake","sector":"Cars","where":"Amsterdam / Turin / Paris","detail":"Exor is the largest shareholder (about 15% of capital, more of the votes via loyalty shares)","basis":"documented","source":{"label":"Il Sole 24 Ore — Exor 2025 numbers","url":"https://en.ilsole24ore.com/art/exor-slips-in-amsterdam-numbers-2025-but-analysts-watch-but-AINipG8B"}},{"name":"Philips and CNH","kind":"Listed stake","sector":"Health technology; farm and construction machinery","where":"Amsterdam / London","detail":"Exor is the largest shareholder of both; Philips became Exor's second-largest asset in 2025","basis":"documented","source":{"label":"Il Sole 24 Ore — Exor 2025 numbers","url":"https://en.ilsole24ore.com/art/exor-slips-in-amsterdam-numbers-2025-but-analysts-watch-but-AINipG8B"}},{"name":"Lingotto Investment Management","kind":"Fund / private equity","sector":"Asset management","where":"London / Turin","detail":"Valued at about €4.2bn in Exor's NAV (end-2025)","basis":"documented","source":{"label":"Exor — Half-Year 2025 Report","url":"https://exor.com/system/files/2025/document-documents/Exor%20Half-Year%202025%20Report.pdf"}},{"name":"Juventus FC and The Economist Group","kind":"Private company","sector":"Football; media","where":"Turin / London","detail":"Exor is the controlling shareholder of Juventus and the largest shareholder of The Economist Group","basis":"documented","source":{"label":"Wikipedia — Exor (company)","url":"https://en.wikipedia.org/wiki/Exor_(company)"}}],"lineage":[{"name":"Giovanni Agnelli","relation":"founder","years":"1866–1945","note":"Co-founded FIAT in 1899 and built the family's controlling stake.","basis":"documented"},{"name":"Edoardo Agnelli","relation":"son","years":"1892–1935","note":"Heir apparent who died in a seaplane accident; the shares passed toward his children.","basis":"documented"},{"name":"Gianni Agnelli","relation":"grandson","years":"1921–2003","note":"Chaired Fiat 1966–1996 and led the family holdings IFI/IFIL.","basis":"documented"},{"name":"Margherita Agnelli and Alain Elkann","relation":"daughter and son-in-law","years":"b. 1955","note":"Margherita settled her inheritance claims in 2004; she later contested her mother Marella's estate in court.","basis":"documented"},{"name":"John Elkann","relation":"grandson / heir","years":"b. 1976","note":"Designated heir by Gianni Agnelli; chair and CEO of Exor, chair of Stellantis and Ferrari.","basis":"documented"}],"today":"John Elkann leads Exor and chairs Stellantis and Ferrari; the family's Giovanni Agnelli B.V. is the controlling shareholder of Exor. An inheritance dispute with his mother Margherita Agnelli and a tax case over his grandmother's estate were ongoing in 2026.","today_people":[{"name":"John Elkann","relation":"grandson of Gianni Agnelli","role":"Chair and CEO of Exor; chair of Stellantis and Ferrari","sector":"Business & industry","year":2026,"basis":"documented","source":{"label":"Forbes — John Elkann","url":"https://www.forbes.com/profile/john-elkann/"}}],"sources":[{"label":"Forbes — John Elkann profile","url":"https://www.forbes.com/profile/john-elkann/"},{"label":"Calcio e Finanza — Giovanni Agnelli BV 2025 accounts","url":"https://www.calcioefinanza.it/?p=229330"},{"label":"AFM register — Giovanni Agnelli B.V. holding in Ferrari N.V.","url":"https://www.afm.nl/en/sector/registers/meldingenregisters/substantiele-deelnemingen/details?id=170902"},{"label":"Il Sole 24 Ore — Exor 2025 results","url":"https://en.ilsole24ore.com/art/exor-slips-in-amsterdam-numbers-2025-but-analysts-watch-but-AINipG8B"},{"label":"ANSA — Elkann agrees to community service over inheritance (Sept 2025)","url":"https://www.ansa.it/amp/english/news/general_news/2025/09/09/elkann-agrees-to-do-community-service-over-inheritance_65c91bf9-4d8a-416e-875c-9e2916dfcf4a.html"},{"label":"Il Post — Elkann case likely to go to trial (Dec 2025)","url":"https://www.ilpost.it/2025/12/15/john-elkann-processo-eredita-agnelli/"}],"connections":[{"id":"exor","type":"ownership","label":"controls Exor via Giovanni Agnelli B.V. (54.9%)"},{"id":"peugeot-family","type":"finance","label":"co-largest shareholders of Stellantis since 2021"},{"id":"netherlands-stichting","type":"offshore","label":"Exor and Ferrari use Dutch loyalty-share structures"},{"id":"house-of-savoy","type":"political","label":"Fiat rose in the Kingdom of Italy under the Savoy monarchy"},{"id":"switzerland-banking-secrecy","type":"offshore","label":"Marella Agnelli's Swiss residence at issue in Turin tax case"},{"id":"family-office","type":"trust","label":"family partnerships (Dicembre) above the holding chain"}]},{"id":"exor","type":"entity","name":"Exor N.V.","kind":"Holding company","description":"The Agnelli family's listed investment holding, registered in Amsterdam since 2016 and controlled by Giovanni Agnelli B.V. (54.9%). At end-2025 it reported a gross asset value of €37.1bn and NAV of €33.2bn; it is the largest shareholder of Ferrari, Stellantis, Philips and CNH and owns Lingotto, Juventus and a stake in The Economist Group.","start":1927,"geo":[52.36,4.885],"sources":[{"label":"Exor — NAV per share press release (Sept 2025)","url":"https://exor.com/press-releases/2025-09-17/exor-nav-share-outperforms-msci-world-index"},{"label":"Il Sole 24 Ore — Exor 2025 numbers","url":"https://en.ilsole24ore.com/art/exor-slips-in-amsterdam-numbers-2025-but-analysts-watch-but-AINipG8B"},{"label":"Wikipedia — Exor (company)","url":"https://en.wikipedia.org/wiki/Exor_(company)"}],"connections":[{"id":"agnelli-elkann-family","type":"ownership","label":"controlled by Giovanni Agnelli B.V."},{"id":"peugeot-family","type":"finance","label":"fellow anchor shareholder of Stellantis"},{"id":"netherlands-stichting","type":"offshore","label":"Dutch N.V. with loyalty voting shares"}]},{"id":"quandt-family","name":"Quandt family (BMW, Altana)","category":"Industrial Dynasties","role":"Industry & Manufacturing","moneySources":["Textiles (Pritzwalk)","Batteries and arms (AFA, DWM)","BMW rescue (1959)","Chemicals and pharma (Altana)","Family offices"],"nation":"Germany","scale":"Dominant","scaleBasis":"documented","scaleNote":"Forbes put Stefan Quandt at $23.1bn and Susanne Klatten at $24bn in November 2026; together they held about half of BMW's ordinary shares at end-2025.","start":1883,"end":null,"lifespan":"1883–present (BMW from 1959)","base":"Bad Homburg and Munich, Germany","geo":[50.229,8.618],"aliases":["Johanna Quandt heirs","AQTON SE","SKion GmbH","Harald Quandt Holding","Altana AG"],"origins":"The Quandts were textile manufacturers in Pritzwalk, Brandenburg. Günther Quandt (1881–1954) used the uniform business to buy into industry after 1918: the battery maker AFA (later Varta) and, in the 1920s–30s, the arms and munitions maker Deutsche Waffen- und Munitionsfabriken.","role_summary":"Günther Quandt built a conglomerate of batteries, arms and metals that supplied the German war economy; the family-commissioned 2011 study found his firms used tens of thousands of forced labourers. After 1945 the family kept much of its industrial holdings. In 1959 his son Herbert Quandt bought into and rescued a struggling BMW, building the stake that his widow Johanna and children Stefan Quandt and Susanne Klatten still hold.","roleDetail":[{"t":"Textiles to batteries and arms.","d":"Günther Quandt expanded from the family textile business into AFA batteries and arms manufacturer DWM, becoming one of Germany's leading industrialists by the 1930s.","basis":"documented"},{"t":"Wartime forced labour.","d":"The study commissioned by the family from historian Joachim Scholtyseck (2011) concluded that Günther and Herbert Quandt were deeply involved in forced labour; press reports put the number of forced labourers in Quandt plants at about 50,000.","basis":"documented"},{"t":"Acknowledgement in 2011.","d":"After the 2007 TV documentary 'Das Schweigen der Quandts', the family commissioned the study and stated that the years 1933–1945 'have not been sufficiently accounted for'. BMW itself was not implicated.","basis":"documented"},{"t":"The 1959 BMW rescue.","d":"Herbert Quandt resisted a takeover of BMW by Daimler-Benz in 1959 and raised his stake, eventually to nearly half the company; it is the core of the family fortune today.","basis":"documented"},{"t":"Altana and diversification.","d":"Susanne Klatten is sole owner of Altana (specialty chemicals) and holds stakes in Nordex and other firms; Stefan Quandt's AQTON SE and Delton hold Entrust, Solarwatt, Heel and Logwin.","basis":"documented"}],"legacy":"BMW's ordinary shares are the core: at end-December 2025 BMW reported Stefan Quandt at 27.7% and Susanne Klatten at 22.5% of ordinary shares (25.3% and 20.5% by mid-2026 after a share-base change). Each sibling runs a single-family office: AQTON SE (Quandt) and SKion GmbH (Klatten).","legacyDetail":[{"t":"Two family offices.","d":"AQTON SE (Stefan Quandt) holds Entrust, Solarwatt and Scope; SKion GmbH (Susanne Klatten) holds Altana, Nordex and SKion Water; her BMW shares are held separately.","basis":"documented"},{"t":"Harald Quandt branch.","d":"The heirs of Günther's other son Harald Quandt run a separate investment house, Harald Quandt Holding, in Bad Homburg.","basis":"documented"}],"wealth":{"published":[{"figure":"$23.1bn","usd":"$23.1bn","who":"Stefan Quandt","publisher":"Forbes (real-time billionaires)","year":2026,"rank":"#112","url":"https://www.forbes.com/profile/stefan-quandt/"},{"figure":"$24bn","usd":"$24bn","who":"Susanne Klatten","publisher":"Forbes (real-time billionaires)","year":2026,"rank":"#104","url":"https://www.forbes.com/profile/susanne-klatten/"},{"figure":"€33.3bn","usd":"c. $38bn","who":"Susanne Klatten and Stefan Quandt","publisher":"Manager Magazin (via Euronews)","year":2026,"rank":"4th in Germany","url":"https://de.euronews.com/2026/10/08/reichsten-deutschen-2026"}],"publishedNote":"Manager Magazin ranked Klatten and Quandt fourth in its 2026 list (down €2.8bn on 2025). Forbes lists the siblings individually.","grossAssets":{"text":"BMW is listed; Forbes puts Stefan Quandt's stake at nearly 24% and Susanne Klatten's at about 19% of the company, and on ordinary (voting) shares alone the siblings hold close to half (reported splits vary between data providers). Altana is privately held and reports sales above $2.5bn (Forbes).","source":{"label":"Forbes — Susanne Klatten","url":"https://www.forbes.com/profile/susanne-klatten/"}},"controlled":{"text":"With roughly half of BMW's voting ordinary shares and seats on its supervisory board (Stefan Quandt is deputy chair), the siblings have decisive influence over a carmaker with more than €140bn of annual revenue.","source":{"label":"Forbes — Stefan Quandt","url":"https://www.forbes.com/profile/stefan-quandt/"}},"opaque":{"verdict":"none found","text":"The holdings are mostly in German entities with public filings (BMW voting notifications; AQTON, SKion and Altana accounts). No offshore structure was found in ICIJ data.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Quandt, Klatten, AQTON, SKion, Altana; queries: AQTON SE, Altana AG, BMW AG, Quandt, SKion GmbH, Stefan Quandt …): name matches only, none shown to be this family or its vehicles, BMW voting-rights notifications.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}},"gapNote":"The Forbes figures track the market value of their BMW stakes and are fairly well grounded; the gap is in control: two people hold about half of BMW's votes, influence that far exceeds their combined c. $47bn (interpretive)."},"holdingsToday":[{"name":"BMW AG","kind":"Listed stake","sector":"Cars","where":"Munich","detail":"Together close to half of the ordinary (voting) shares; reported splits vary (e.g. c. 26–28% and c. 21–22.5%)","basis":"documented","source":{"label":"BMW Group — Key Aspects of Corporate Governance (2026)","url":"https://www.bmwgroup.com/content/dam/grpw/websites/bmwgroup_com/company/downloads/en/2026/Key_Aspects_of_Corporate_Governance.pdf"}},{"name":"Altana AG","kind":"Private company","sector":"Specialty chemicals","where":"Wesel","detail":"100% owned by Susanne Klatten","basis"
