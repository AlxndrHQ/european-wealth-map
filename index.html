<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Old Money — Europe's Great Fortunes, 1066 to Today</title>
<meta name="description" content="An interactive, sourced map of how Europe's largest family fortunes were made, from the Norman Conquest of 1066 to today: the land grants, banks, colonial companies and industries behind them, where the money sits now, and how published net worth compares with what each family controls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* ============ TOKENS — paper (light) / ink (dark) ============ */
:root{
  --bg:#FAFAF7; --bg2:#F3F2EC; --text:#1F1D18; --text2:#1f1d18d9; --muted:#6B6960; --dim:#9C998E;
  --line:#E8E6DF; --line2:#D8D5CB; --accent:#8A5A2B; --accent-soft:#8a5a2b1a;
  --edge:#C4C1B6; --edge-strong:#8F8C82;
  --c-eu:#2a78d6; --c-co:#eb6834; --c-af:#1baf7a; --c-cr:#eda100; --c-am:#6250d6; --c-en:#e87ba4; --c-ar:#008300; --c-xx:#e34948;
  --doc:#3C7A5E; --pattern:#8A5A2B; --scrim:#1f1d1826; --bar:#8A5A2B;
  --serif:'Iowan Old Style','Apple Garamond',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#8A8A92; --dim:#5E5E66;
    --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
    --edge:#36363D; --edge-strong:#5E5E66;
    --c-eu:#3987e5; --c-co:#d95926; --c-af:#199e70; --c-cr:#c98500; --c-am:#9085e9; --c-en:#d55181; --c-ar:#008300; --c-xx:#e66767;
    --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099; --bar:#C9A875;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#8A8A92; --dim:#5E5E66;
  --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
  --edge:#36363D; --edge-strong:#5E5E66;
  --c-eu:#3987e5; --c-co:#d95926; --c-af:#199e70; --c-cr:#c98500; --c-am:#9085e9; --c-en:#d55181; --c-ar:#008300; --c-xx:#e66767;
  --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099; --bar:#C9A875;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
::selection{background:#c9a87533}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.lbl{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;flex:none}

/* ============ HEADER ============ */
header.top{border-bottom:1px solid var(--line);background:var(--bg);padding:16px 24px 0;flex:none;z-index:5}
.row1{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font:400 22px/1.15 var(--serif);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;margin-top:4px;font:500 10px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.search{flex:1;min-width:200px;max-width:420px;position:relative;margin-left:auto}
.search input{width:100%;background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 10px 7px 30px;color:var(--text);font:13px var(--sans);outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--edge-strong)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:0 5px}
.tabs{display:flex;gap:14px}
.tabs button,.theme{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button:hover,.theme:hover{color:var(--text)}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.row2{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 26px;padding:12px 0 11px}
.fgroup{display:flex;align-items:baseline;gap:12px}
.seg,.chips{display:inline-flex;flex-wrap:wrap;gap:3px 13px}
.seg button,.chip{background:none;border:0;border-bottom:1px solid transparent;padding:1px 0;font:400 12.5px var(--sans);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s}
.seg button:hover,.chip:hover{color:var(--text)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.seg .n,.chip .n{font:500 9.5px var(--mono);color:var(--dim)}
select.nsel{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:2px;font:12.5px var(--sans);padding:2px 6px;max-width:220px}

/* ============ STAGE ============ */
main{flex:1;min-height:0;position:relative}
#map,#grid,#atlas{position:absolute;inset:0}
#map{background:var(--bg)}
#map svg{display:block;width:100%;height:100%;cursor:grab}
#map svg:active{cursor:grabbing}
#grid{overflow:auto;padding:40px 24px 64px}
[hidden]{display:none!important}

/* graph */
.link{fill:none;stroke:var(--edge);stroke-width:.9;transition:opacity .18s}
.link.dashed{stroke-dasharray:5 4}
.link.dotted{stroke-dasharray:1 3.5;stroke-linecap:round}
.link.t-trade{stroke:var(--edge-strong)}
.link.hot{stroke:var(--accent);stroke-width:1.3;opacity:1}
.arrow{fill:var(--edge-strong)}
.elabel{font:500 8.5px var(--mono);letter-spacing:.06em;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;opacity:0;pointer-events:none;transition:opacity .2s}
svg.zoomed .elabel{opacity:.85}
.node{cursor:pointer;transition:opacity .18s}
.node text{pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.profile text{font:400 12.5px var(--serif);fill:var(--text)}
.node.profile .ring{fill:var(--bg);stroke:var(--c);stroke-width:1.2}
.node.profile .core{fill:var(--c)}
.node.profile .ring2{fill:none;stroke:var(--c);stroke-width:.8}
.node.profile.co .ring{stroke-width:2.2}
.node.profile.est .ring{stroke-dasharray:3 2.5}
.node.entity .box{fill:var(--bg);stroke:var(--edge-strong);stroke-width:1}
.node.entity text{font:500 8.5px var(--mono);letter-spacing:.08em;fill:var(--muted)}
.node.hub .box{stroke:var(--accent)}
.node.hub text{fill:var(--text);stroke:none}
.node .minor{opacity:0;transition:opacity .2s}
svg.zoomed .node .minor,.node:hover .minor,.node.nb .minor,.node.sel .minor{opacity:1}
.node:hover .ring,.node:hover .box{stroke-width:1.8}
.node.sel .ring,.node.sel .box{stroke:var(--accent);stroke-width:2.4}
.faded{opacity:.1!important}
.axis line{stroke:var(--line2)}
.axis line.era{stroke:var(--edge-strong);stroke-dasharray:2 4}
.axis text{font:500 10px var(--mono);letter-spacing:.1em;fill:var(--muted)}
.axis text.era{font:400 15px var(--serif);letter-spacing:0;fill:var(--text2)}
.axis text.band{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}

/* overlays */
.overlay{position:absolute;background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:12px}
.legend{left:20px;bottom:20px;max-width:260px}
.legend h4,.ctrls h4{margin:0 0 6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend .it{display:flex;align-items:center;gap:9px;color:var(--text2);line-height:1.85;font-size:11.5px}
.legend .sw{width:7px;height:7px;border-radius:50%;flex:none}
.legend .sq{width:7px;height:7px;border:1px solid var(--edge-strong);flex:none}
.legend .hb{width:16px;height:8px;border:1px solid var(--accent);flex:none}
.legend .ln{width:22px;height:0;border-top:1px solid var(--edge-strong);flex:none}
.legend .extra{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .sizes{display:flex;gap:10px;align-items:flex-end;color:var(--muted);font:500 8.5px var(--mono);margin-bottom:10px}
.legend .sz{display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .sz i{display:block;border:1px solid var(--muted);border-radius:50%}
.ctrls{right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}
.ctrls .btns{display:flex;gap:16px}
.ibtn{background:none;border:0;padding:2px 0;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ibtn:hover{color:var(--text)}
.ibtn.ovl[aria-pressed="true"]{color:var(--accent)}
.hint{left:50%;top:14px;transform:translateX(-50%);border:0;background:none;padding:0;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;pointer-events:none;font-family:var(--serif)}

/* ============ GRID ============ */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 22px;flex-wrap:wrap}
.gridhead h2{margin:0;font:400 32px/1.15 var(--serif);letter-spacing:-.015em}
.gridhead .meta{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 18px 16px;cursor:pointer;outline:none;transition:background .15s}
.card:hover,.card:focus-visible{background:var(--bg2)}
.ctop{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.ctop .d{width:6px;height:6px;border-radius:50%;background:var(--c)}
.ctop .era{margin-left:auto;color:var(--dim)}
.card h3{margin:10px 0 2px;font:400 21px/1.2 var(--serif);letter-spacing:-.01em}
.life{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{min-width:0}
.kpi label,.bt label{display:block;font:500 9px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.kpi b{font-size:12.5px;font-weight:500;display:block;line-height:1.35}
.kpi b.mono{font-family:var(--mono);color:var(--accent)}
.bt{margin:0;font-size:13px;color:var(--text2)}
.badges{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.badge{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.badge::before{content:"› ";color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:1px;padding:0 1px}
.foot{max-width:1120px;margin:28px auto 0;font-size:11.5px;color:var(--dim)}
.subh{max-width:1120px;margin:44px auto 14px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center}
.subh::after{content:"";flex:1;height:1px;background:var(--line)}
.subh .n{color:var(--dim)}
.subh.sech{margin-top:36px}
.subh.sech:first-of-type{margin-top:8px}
.subh .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fnote{max-width:1120px;margin:-6px auto 22px;font:500 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fnote button,.clearf{background:none;border:0;border-bottom:1px solid var(--accent);padding:0;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.clearf{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;align-self:center}
.empty-sec{max-width:1120px;margin:0 auto;font:italic 400 14.5px var(--serif);color:var(--dim)}
.lede{max-width:1120px;margin:0 auto 26px;color:var(--text2);font:400 16.5px/1.6 var(--serif)}
.lede.small{font-size:15px;margin-bottom:14px}

/* overlaps */
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.hub{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;min-width:0}
.hub .hh{display:flex;align-items:flex-start;gap:10px}
.hub .hh button{background:none;border:0;padding:0;text-align:left;font:400 19px/1.2 var(--serif);color:var(--text)}
.hub .hh button:hover{color:var(--accent)}
.hub .kind{display:block;font:500 9px/1.6 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.hub .cnt{margin-left:auto;flex:none;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:1px 6px}
.who{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.who button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0;min-width:0}
.who button:hover .nm{color:var(--accent)}
.who .d{width:6px;height:6px;border-radius:50%;flex:none;align-self:center}
.who .nm{font:400 14.5px var(--serif);flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .via{flex:1 1 0}
.who .via{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.who li.out{padding:8px 0 2px;font-size:11.5px;line-height:1.7;color:var(--dim)}
.who li.out button{display:inline;width:auto;border:0;padding:0;background:none;color:var(--muted);font:inherit}
.ties{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tie{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}
.tie button{background:none;border:0;padding:0;font:400 14.5px var(--serif);color:var(--text)}
.tie button:hover{color:var(--accent)}
.tie .rel{color:var(--muted);font-size:12px}

/* ============ CHRONOLOGY ============ */
.chron{max-width:1120px;margin:0 auto}
.ev{display:grid;grid-template-columns:86px 1fr;gap:4px 22px;border-bottom:1px solid var(--line);padding:16px 0}
.ev .yr{font:500 15px var(--mono);color:var(--accent);padding-top:2px}
.ev h4{margin:0;font:400 19px/1.25 var(--serif);letter-spacing:-.005em}
.ev p{margin:4px 0 0;color:var(--text2);font-size:13.5px}
.ev .ppl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.ev .ppl button{background:none;border:0;padding:0;font:400 13px var(--serif);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.ev .ppl button:hover{color:var(--accent)}
.ev .ppl .d{width:6px;height:6px;border-radius:50%}
.ev .src{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;display:inline-block;text-decoration:none}
.trails{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.trail{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;cursor:pointer;text-align:left;background:none;border-top:0;border-left:0;color:inherit;font:inherit}
.trail:hover,.trail[aria-pressed="true"]{background:var(--bg2)}
.trail .rg{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.trail h4{margin:6px 0 4px;font:400 19px/1.25 var(--serif)}
.trail p{margin:0;font-size:12.5px;color:var(--text2)}
.trail .span{display:block;margin-top:8px;font:500 10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.flow{max-width:1120px;margin:30px auto 0;position:relative;padding-left:118px}
.flow::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--c-co))}
.step{position:relative;padding:0 0 26px}
.step .yr{position:absolute;left:-118px;width:84px;text-align:right;font:500 15px var(--mono);color:var(--accent);top:1px}
.step::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.step.k-money::before{background:var(--accent)}
.step.k-law::before,.step.k-structure::before{border-radius:2px}
.step.k-land::before{background:var(--c-eu)}
.step.k-today::before{background:var(--c-am)}
.step .kd{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.step h4{margin:2px 0 4px;font:400 20px/1.25 var(--serif)}
.step p{margin:0;color:var(--text2);font-size:14px;max-width:760px}
.step .amt{display:inline-block;margin-top:6px;font:500 11px var(--mono);color:var(--text);border:1px solid var(--line2);border-radius:2px;padding:1px 7px}
.step .ppl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.step .ppl button{background:none;border:0;padding:0;font:400 13.5px var(--serif);color:var(--text);display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid var(--line2)}
.step .ppl button:hover{color:var(--accent);border-color:var(--accent)}
.step .ppl .d{width:6px;height:6px;border-radius:50%}
.step .src{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;margin-top:6px;display:inline-block}
.step .basis{float:none;margin:0 0 0 8px;vertical-align:middle}
.step.end h4::after{content:" · today";font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-co)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 40px;max-width:1120px;margin:0 auto 10px}
.hero{display:flex;gap:40px;flex-wrap:wrap;max-width:1120px;margin:0 auto 26px}
.hero div{min-width:0}
.hero b{display:block;font:400 40px/1.05 var(--serif);letter-spacing:-.02em}
.hero span{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bars h5{margin:0 0 8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:150px 1fr 76px;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--text2);border-radius:2px}
.bar:hover{background:var(--bg2)}
.bar i{display:block;height:8px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar em{font:500 11px var(--mono);font-style:normal;color:var(--text);text-align:right}
details.tbl{max-width:1120px;margin:6px auto 0;font-size:12px;color:var(--muted)}
details.tbl summary{cursor:pointer;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
details.tbl table{border-collapse:collapse;margin-top:8px}
details.tbl td,details.tbl th{border-bottom:1px solid var(--line);padding:4px 14px 4px 0;text-align:left;font-weight:400}
details.tbl td.r{text-align:right;font-family:var(--mono)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
aside#drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(620px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside#drawer.open{transform:none}
.dhead{padding:24px 32px 20px;border-bottom:1px solid var(--line);position:relative}
.dclose{position:absolute;right:22px;top:18px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:15px;display:grid;place-items:center}
.dclose:hover{color:var(--text)}
.eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.eyebrow span:first-child{color:var(--text)}
.eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.eyebrow span+span::before{content:"";display:inline-block;width:24px;height:1px;background:var(--line2);vertical-align:middle;margin-right:12px}
.dhead h2{margin:12px 40px 6px 0;font:400 38px/1.08 var(--serif);letter-spacing:-.02em}
.dbody{flex:1;overflow:auto;padding:24px 32px 52px}
.dbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.dbadge{font:400 13px/1.35 var(--sans);color:var(--text)}
.dbadge label{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.dbody .kpis{grid-template-columns:repeat(3,1fr);margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:0 0 16px;padding:1px 0 1px 12px;border-left:1px solid var(--accent)}
blockquote.callout{margin:0 0 14px;padding:0;border:0;font:400 17px/1.55 var(--serif);color:var(--text)}
.sec{margin-top:32px}
.sec h3{display:flex;align-items:center;gap:12px;margin:0 0 12px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h3 .num{color:var(--accent)}
.sec p{margin:0;color:var(--text2)}
ol.steps,ul.bul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.steps li,ul.bul li{padding:10px 0 10px 18px;border-bottom:1px solid var(--line);color:var(--text2);font-size:13.5px;position:relative}
ol.steps li::before,ul.bul li::before{content:"›";position:absolute;left:3px;top:9px;color:var(--accent);font-family:var(--mono)}
ol.steps li b,ul.bul li b{color:var(--text);font-weight:600}
.basis{float:right;margin:3px 0 4px 10px;font:500 8.5px var(--mono);letter-spacing:.12em;padding:0 5px;border-radius:2px;text-transform:uppercase;cursor:help;border:1px solid currentColor}
.basis.documented{color:var(--doc)}
.basis.interpretive{color:var(--pattern)}
.net{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.net button{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.net button:hover .nm{color:var(--accent)}
.net .d{width:6px;height:6px;border-radius:50%;flex:none}
.net .nm{font:400 15px var(--serif)}
.net .rel{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.net .ar{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.lin{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line2)}
.lin li{position:relative;padding:8px 0 10px 8px;font-size:13.5px;color:var(--text2)}
.lin li::before{content:"";position:absolute;left:-18.5px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1px solid var(--edge-strong)}
.lin li.self::before{background:var(--accent);border-color:var(--accent)}
.lin .rl{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lin .nm{font:400 15.5px var(--serif);color:var(--text)}
.lin button.nm{background:none;border:0;padding:0;border-bottom:1px solid var(--accent);cursor:pointer}
.lin button.nm:hover{color:var(--accent)}
.lin .yr{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.today{margin-top:14px;padding:12px 14px;background:var(--bg2);border-radius:2px;font-size:13.5px;color:var(--text2)}
.ow{margin:0 0 18px;border:1px solid var(--line2);border-radius:2px;padding:14px 16px}
.ow h4{margin:0 0 8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.ow .v{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:1px 6px}
.ow .v.documented{color:var(--c-xx)} .ow .v.indirect{color:var(--pattern)} .ow .v.none{color:var(--doc)}
.ow dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0;font-size:13px}
.ow dt{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.ow dd{margin:0;color:var(--text2)}
table.owt{width:100%;max-width:1120px;margin:0 auto;border-collapse:collapse;font-size:13px}
table.owt th{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line2);padding:8px 10px 8px 0}
table.owt td{border-bottom:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top;color:var(--text2)}
table.owt td button{background:none;border:0;padding:0;font:400 15px var(--serif);color:var(--text);text-align:left}
table.owt td button:hover{color:var(--accent)}
.owwrap{max-width:1120px;margin:0 auto;overflow-x:auto}
.named{margin-top:10px;font-size:12px;color:var(--muted)}
.named span{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.tp{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.tp li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tp .nm{font:400 15px var(--serif);color:var(--text)}
.tp .sec2{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:right;white-space:nowrap}
.tp .rl2{grid-column:1/-1;font-size:12.5px;color:var(--text2)}
.tp .rel2{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.tp a{font:500 9.5px var(--mono);letter-spacing:.06em;text-decoration:none}
.today b{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.dev{border-top:1px solid var(--line)}
.dev div{display:grid;grid-template-columns:56px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px;color:var(--text2)}
.dev b{font:500 12px var(--mono);color:var(--accent);font-weight:500}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.disc{margin-top:30px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

/* ============ ATLAS ============ */
#atlasMap{position:absolute;inset:0;background:var(--bg);z-index:0}
.atlas-bar{left:20px;top:16px;max-width:calc(100% - 40px);z-index:500;display:flex;flex-direction:column;gap:9px;padding:11px 14px}
.atlas-bar .seg button{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.atlas-status{margin:0;font:500 9.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);max-width:520px}
.atlas-key{left:20px;bottom:24px;z-index:500;max-width:330px;font-size:11.5px;color:var(--text2)}
.atlas-key h4{margin:0 0 6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.atlas-key .it{display:flex;align-items:center;gap:9px;line-height:1.8}
.atlas-key .ln{width:24px;height:0;border-top:2px solid;flex:none}
.apin{background:none;border:0}
.apin span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;box-sizing:border-box;font:600 9.5px var(--mono);color:#fff;transition:transform .15s;background:var(--c);border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--c)}
.apin.ent span{border-radius:1px;background:var(--bg);border:1.5px solid var(--edge-strong);box-shadow:none}
.apin:hover span{transform:scale(1.25)}
.apop .leaflet-popup-content-wrapper{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:2px;box-shadow:0 10px 30px -12px #0005}
.apop .leaflet-popup-tip{background:var(--bg);border:1px solid var(--line2);box-shadow:none}
.apop .leaflet-popup-content{margin:16px 18px 14px;font:13px/1.5 var(--sans);min-width:220px}
.apop a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pop-k{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pop h4{margin:8px 0 4px;font:400 21px/1.15 var(--serif);letter-spacing:-.01em}
.pop p{margin:0;color:var(--text2)}
.pop .who{max-height:240px;overflow:auto}
.pop .who .nm{font-size:14px}
.leaflet-container{font:13px var(--sans);background:var(--bg)}
.leaflet-control-zoom a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--line)!important;border-radius:2px!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:none!important;border-radius:2px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg) 85%,transparent)!important;color:var(--dim)!important;font:9.5px var(--sans)}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-tooltip.rtip{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:2px;box-shadow:none;font:12px var(--sans)}

/* ============ RESPONSIVE ============ */
@media (max-width:760px){
  header.top{padding:12px 16px 0}
  .row1{gap:10px 16px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .search kbd{display:none}
  .brand small{display:none}
  .tabs{gap:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .row2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .row2::-webkit-scrollbar{display:none}
  .seg,.chips{flex-wrap:nowrap}
  #grid{padding:22px 16px 44px}
  .legend .extra{display:none}
  .legend{left:10px;top:10px;bottom:auto;padding:8px 10px}
  .legend h4{display:none}
  .ctrls{right:10px;left:10px;bottom:10px;flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:8px 10px}
  .ctrls h4{display:none}
  .hint{display:none}
  .dhead,.dbody{padding-left:16px;padding-right:16px}
  .dbadges{grid-template-columns:1fr}
  .dbody .kpis{grid-template-columns:1fr 1fr}
  .dhead h2{font-size:29px}
  .gridhead h2{font-size:26px}
  .ev{grid-template-columns:1fr}
  .flow{padding-left:26px}.flow::before{left:6px}.step .yr{position:static;display:block;text-align:left;width:auto}.step::before{left:-25px}
  .bar{grid-template-columns:110px 1fr 64px}
  .atlas-bar{left:10px;right:10px;top:10px;max-width:none}
  .atlas-key{left:10px;right:58px;bottom:16px;max-width:none}
  .hero b{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ============ WEALTH LAYERS ============ */
.wl{margin:0 0 22px;border:1px solid var(--line2);border-radius:2px}
.wl h4{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between}
.wl .lay{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.wl .lay:last-child{border-bottom:0}
.wl .lay .ix{font:500 11px var(--mono);color:var(--accent);padding-top:1px}
.wl .lay b{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.wl .lay p{margin:0;font-size:13px;color:var(--text2)}
.wl .lay .fig{font:400 19px/1.3 var(--serif);color:var(--text)}
.wl .lay .src{font-size:11.5px}
.wl .gap{background:var(--bg2)}
.vd{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:1px 6px;white-space:nowrap}
.vd.documented{color:var(--c-xx)} .vd.reported{color:var(--pattern)} .vd.none{color:var(--doc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font:500 9.5px var(--mono);letter-spacing:.06em;color:var(--text2);border:1px solid var(--line2);border-radius:2px;padding:1px 7px}
.tags span::before{content:"› ";color:var(--accent)}
ul.hold{list-style:none;margin:0;padding:0}
ul.hold li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.hold .nm{font:400 15px var(--serif);color:var(--text)}
ul.hold .k{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:right;white-space:nowrap}
ul.hold .dt{grid-column:1/-1;font-size:12.5px;color:var(--text2)}
ul.hold .dt a{font-size:11.5px}
.sister{display:block;margin:0 0 18px;padding:10px 14px;border-left:2px solid var(--c-xx);background:var(--bg2);font-size:12.5px;color:var(--text2)}
.wtwrap{max-width:1120px;margin:0 auto;overflow-x:auto}
table.wt{width:100%;min-width:980px;border-collapse:collapse;font-size:12.5px}
table.wt th{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line2);padding:8px 12px 8px 0;vertical-align:bottom;position:sticky;top:0;background:var(--bg)}
table.wt td{border-bottom:1px solid var(--line);padding:10px 12px 10px 0;vertical-align:top;color:var(--text2)}
table.wt td button{background:none;border:0;padding:0;font:400 15px var(--serif);color:var(--text);text-align:left}
table.wt td button:hover{color:var(--accent)}
table.wt .fig{font:400 16px var(--serif);color:var(--text);white-space:nowrap}
table.wt .pub{display:block;font:500 9.5px var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:2px}
table.wt .none{color:var(--dim);font-style:italic}
.wkey{max-width:1120px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line2)}
.wkey div{padding:12px 16px 12px 0;border-right:1px solid var(--line);margin-right:16px}
.wkey div:last-child{border-right:0}
.wkey b{display:block;font:500 11px var(--mono);color:var(--accent)}
.wkey h5{margin:2px 0 4px;font:400 16px var(--serif);color:var(--text)}
.wkey p{margin:0;font-size:12px;color:var(--muted)}
@media (max-width:760px){ .wkey{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="brand"><h1>Old Money</h1><small>Europe’s Great Fortunes · Estates · Banks · Trusts · 1066–Today</small></div>
      <label class="search" aria-label="Search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search families, estates, banks, trusts, holdings…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <nav class="tabs" role="group" aria-label="View">
        <button data-view="map" aria-pressed="true" title="Network graph of families, estates, banks, companies and vehicles">Web</button>
        <button data-view="grid" aria-pressed="false">Directory</button>
        <button data-view="chron" aria-pressed="false" title="Dated events from 1066 to today">Chronology</button>
        <button data-view="money" aria-pressed="false" title="Follow one fortune step by step, from its origin to today's holding vehicle">Money Trail</button>
        <button data-view="wealth" aria-pressed="false" title="Published net worth compared with what each family controls">Claimed vs Controlled</button>
        <button data-view="overlaps" aria-pressed="false">Overlaps</button>
        <button data-view="atlas" aria-pressed="false" title="Geographic map of family seats, estates, banks and offshore centres">Map</button>
      </nav>
      <button class="theme" id="themeBtn" type="button">☾ Dark</button>
    </div>
    <div class="row2">
      <div class="fgroup"><span class="lbl">Period</span><div class="seg" id="eraSeg" role="group" aria-label="Period"></div></div>
      <div class="fgroup"><span class="lbl">Group</span><div class="chips" id="catChips"></div></div>
      <div class="fgroup"><span class="lbl">Made from</span><select class="nsel" id="roleSel" aria-label="Main source of the fortune"></select></div>

  <main>
    <section id="map" aria-label="Mind map">
      <div class="overlay hint">Drag · Scroll to zoom · Click for dossier</div>

        <div class="btns">
          <button class="ibtn" id="fitBtn">Fit view</button>
          <button class="ibtn" id="shakeBtn">Re‑run layout</button>
        </div>
        <button class="ibtn ovl" id="ovlBtn" aria-pressed="false" title="Show only families that share a company, bank, estate or vehicle with another family, and the paths that connect them">Overlaps only</button>
      </div>
      <div class="empty" id="mapEmpty" hidden>No families match these filters.</div>
    </section>
    <section id="grid" aria-label="Directory" hidden></section>
    <section id="atlas" aria-label="Map" hidden>
      <div id="atlasMap"></div>
      <div class="overlay atlas-bar">
        <div class="seg" id="atlasLayer" role="group" aria-label="Map layer">

</div>

const EMBEDDED_DATA = /*DATA-START*/{"records":[{"id":"grosvenor-family-westminster","name":"Grosvenor family (Dukes of Westminster)","category":"Landed Aristocracy & Gentry","role":"Urban Ground Rents","moneySources":["Cheshire gentry estate","Marriage to heiress","Urban ground rents","International property","Food & agtech"],"nation":"United Kingdom","scale":"Dominant","scaleBasis":"documented","scaleNote":"Sunday Times Rich List 2026 puts the Duke of Westminster and family at £9.677bn (18th, richest hereditary peer); Grosvenor Group's 2025 accounts show £9.5bn of property assets under management.","start":1677,"end":null,"lifespan":"Eaton, Cheshire from the 1440s; Mayfair from 1677; present","base":"Mayfair, London (Eaton Hall, Cheshire)","geo":[51.512,-0.151],"aliases":["Grosvenor Group","Grosvenor Estate","Earls Grosvenor","Marquesses of Westminster","Grosvenor Trusts"],"origins":"A Cheshire gentry family seated at Eaton since the early 1440s, which claims descent from a Norman knight, Gilbert le Grosveneur. The decisive step came in 1677, when Sir Thomas Grosvenor, 3rd Baronet, married the twelve-year-old Mary Davies, heiress to the manor of Ebury: meadow, marsh and pasture west of the City of London that became Mayfair, Belgravia and Pimlico.","role_summary":"The fortune is a marriage turned into ground rent. From 1720 the Grosvenors laid out Mayfair around Grosvenor Square and from the 1820s Belgravia, granting long building leases and keeping the freehold, so rents and lease premiums came back to the family for three centuries. From 1952 the capital was spread abroad (Vancouver, Australia, Asia, continental Europe) and since 2012 into food and agricultural technology, all run by Grosvenor Group for family trusts.","roleDetail":[{"t":"Norman ancestry is family tradition.","d":"Grosvenor's own history says the line goes back to Gilbert le Grosveneur, who came over with William the Conqueror; no Domesday entry or peerage authority found in this research confirms the link.","basis":"interpretive"},{"t":"1677: the Davies marriage.","d":"Sir Thomas Grosvenor married Mary Davies, heiress to the manor of Ebury, bringing the land that became Mayfair and Belgravia (Grosvenor history).","basis":"documented"},{"t":"1720s: Mayfair laid out on leasehold.","d":"Development began in 1720; Mayfair's street grid largely survives. The family kept the freehold and let plots on long building leases.","basis":"documented"},{"t":"1820s: Belgravia.","d":"Robert Grosvenor, later 1st Marquess of Westminster (1831), developed Belgravia south-west of Mayfair.","basis":"documented"},{"t":"1952 onward: capital moves abroad.","d":"First major overseas investment at Annacis Island, Vancouver (1952), followed by Australia in the 1960s, Asia Pacific in 1994 and continental Europe in 1996; Liverpool ONE opened in 2008.","basis":"documented"}],"legacy":"Grosvenor Group Limited, a UK company 'wholly owned by Trustees of the Grosvenor Trusts who hold the shares for the benefit of current and future generations of the Grosvenor family headed by the Duke of Westminster' (2025 accounts), runs c. 300 acres of Mayfair and Belgravia, property in the Americas, Asia and Europe, and a food and agtech arm. The Eaton estate and other rural estates sit alongside it.","legacyDetail":[{"t":"Norway bought into Mayfair.","d":"In January 2025 the group sold 24.99% of its Mayfair estate partnership to Norges Bank Investment Management for £304m gross, keeping control and management of the 175 properties (2025 accounts).","basis":"documented"},{"t":"Trust ownership.","d":"The shareholders are the Trustees of the Grosvenor Trusts; non-executive directors represent them on the board (2025 accounts).","basis":"documented"}],"norman":{"claim":"interpretive","text":"The family's claimed descent from Gilbert le Grosveneur, a companion of William I, rests on family tradition stated in Grosvenor's own history. This research found no Domesday or Complete Peerage confirmation; the documented line begins with the Cheshire Grosvenors of the 14th–15th centuries.","source":{"label":"Grosvenor — Our history","url":"https://www.grosvenor.com/about-us/our-history"}},"wealth":{"published":[{"figure":"£9.677bn","usd":"c. $12.9bn","who":"The Duke of Westminster and the Grosvenor family","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"18th (14th in 2025, £9.884bn)","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"grossAssets":{"text":"Grosvenor Group Ltd, year to 31 Dec 2025: group share of property assets £6.2bn (2024: £6.6bn); consolidated net assets £4.60bn, of which shareholders' funds £4.16bn and non-controlling interests £441m (mostly Norges Bank's 24.99% of the Mayfair partnership); borrowings c. £1.0bn and deferred tax £579m stand against the property. The annual review's headline 'net assets £6.0bn' for the urban property business is a different management measure, not the consolidated balance-sheet figure.","source":{"label":"Grosvenor Group Ltd — Financial Statements 2025","url":"https://grosvenorlive.b-cdn.net/live/grosvenor/media/performance-annual-review/2026/grosvenor_financial_statements_2025.pdf"}},"controlled":{"text":"Assets under management £9.5bn at end-2025 (2024: £10.5bn), of which c. £2.75bn belongs to third-party partners in joint ventures (UK £1.65bn, Americas £0.9bn); the group also manages the whole Mayfair partnership though it owns 75.01%. The management agreement for Liverpool ONE was transferred away in 2025.","source":{"label":"Grosvenor — Annual review 2025 (headline figures)","url":"https://www.grosvenor.com/about-us/annual-review"}},"opaque":{"verdict":"documented","text":"The trusts that own the group do not publish accounts, beneficiaries' shares or distributions. The group's own subsidiary list includes Grosvenor Belgravia Investment Limited in the Isle of Man, a Luxembourg fund-management company and minority joint-venture companies in the British Virgin Islands (Asia portfolio). ICIJ's Paradise Papers (Appleby data, current to 2014) list Grosvenor Fund Management Japan Limited, incorporated in Bermuda in 2002, registered at The Grosvenor Office, 70 Grosvenor Street. Being listed in ICIJ data does not imply wrongdoing. Rural estates such as Eaton are outside the group accounts.","searched":"Grosvenor Group 2025 financial statements (subsidiary list, related parties); ICIJ Offshore Leaks database (reconciliation API, Nov 2026, for Grosvenor names; plus the node page for Grosvenor Fund Management Japan Ltd, whose ICIJ entry gives The Grosvenor Office, 70 Grosvenor Street as an address and Grosvenor group companies as shareholders); press on the 2016 succession and inheritance tax.","source":{"label":"ICIJ Offshore Leaks — Grosvenor Fund Management Japan Limited (Paradise Papers)","url":"https://offshoreleaks.icij.org/nodes/82005777"}},"gapNote":"The Rich List's £9.7bn is more than double the shareholders' funds in Grosvenor Group's accounts (£4.2bn), so it presumably also counts the rural estates, art and other trust assets outside the group, and perhaps values property before debt and deferred tax; on the other side, the business directs £9.5bn of property including partners' money. Neither figure is a personal fortune: the assets are held by trustees, which is also why the 2016 succession did not trigger a single 40% inheritance tax charge."},"holdingsToday":[{"name":"Grosvenor Property UK (Mayfair & Belgravia)","kind":"Urban property","sector":"Real estate","where":"London","detail":"c. 300 acres; UK property assets £3.6bn group share plus £1.65bn third-party; 98% occupancy end-2025; Norges Bank owns 24.99% of the Mayfair partnership.","basis":"documented","source":{"label":"Grosvenor Group — Financial Statements 2025","url":"https://grosvenorlive.b-cdn.net/live/grosvenor/media/performance-annual-review/2026/grosvenor_financial_statements_2025.pdf"}},{"name":"Grosvenor Property Americ ompanion of William I (tradition)"},{"id":"death-duties-inheritance-tax","type":"trust","label":"2016 succession through trusts, not a single 40% IHT charge"},{"id":"isle-of-man","type":"offshore","label":"Grosvenor Belgravia Investment Ltd registered in Douglas (2025 accounts)"},{"id":"paradise-papers","type":"offshore","label":"Bermuda fund-management company in Appleby data"},{"id":"who-owns-england","type":"legacy","label":"London great estate in the landownership debate"},{"id":"cadogan-family","type":"political","label":"neighbouring London great estate"}]},{"id":"cadogan-family","name":"Cadogan family (Earls Cadogan)","category":"Landed Aristocracy & Gentry","role":"Urban Ground Rents","moneySources":["Colonial (Jamaican plantation) income","Marriage to heiress","Urban ground rents","Retail and hotel property"],"nation":"United Kingdom","scale":"Major","scaleBasis":"documented","scaleNote":"Sunday Times Rich List 2026: Earl Cadogan and family £6.418bn (29th); the Chelsea portfolio was valued at £5.7bn at end-2024.","start":1712,"end":null,"lifespan":"1712 (Sloane buys Chelsea manor) / 1717 (Cadogan marriage) – present","base":"Chelsea, London","geo":[51.495,-0.159],"aliases":["Cadogan Estates","Cadogan Group","Cadogan Settled Estates","Viscounts Chelsea"],"origins":"Sir Hans Sloane, physician in Jamaica in 1687–89, married the widow of a Jamaican planter in 1695 and drew income from her sugar estates; in 1712 he bought the manor of Chelsea. In 1717 his daughter Elizabeth married Charles Cadogan, later 2nd Baron Cadogan, and the Sloane half of the Chelsea estate passed to the Cadogans.","role_summary":"Cadogan is a single-district ground-rent fortune. The 1st Earl leased fields north of Chelsea to Henry Holland in the 1770s to build Hans Town (Sloane Street, Hans Place), and later earls rebuilt Cadogan Square and Sloane Street in red brick in the 1870s–90s on leases that reverted to the family. The estate still owns c. 93 acres of Chelsea and Knightsbridge freeholds, now worth about £5.7bn, and invests the income in retail, restaurants and, since 2025, regional property.","roleDetail":[{"t":"Plantation money behind the purchase.","d":"Historians cited by the London Society link Sloane's wife's Jamaican sugar income, worked by enslaved people, to his collecting and the 1712 Chelsea purchase.","basis":"interpretive"},{"t":"1717: the Sloane–Cadogan marriage.","d":"Elizabeth Sloane's share of Chelsea passed to the Cadogans; the family still holds it.","basis":"documented"},{"t":"1774: a Grenada mortgage.","d":"Per UCL LBS, Charles Sloane Cadogan, later 1st Earl, lent £20,500 on a 320-acre Grenada estate and its enslaved people.","basis":"documented"},{"t":"Long leases, reversions, retail.","d":"The estate's value now lies in Sloane Street, King's Road and Duke of York Square retail and residential lettings; the portfolio rose to £5.7bn in 2024.","basis":"documented"}],"legacy":"The Chelsea estate is run by Cadogan Group Limited, owned through a chain of UK holding companies ending in Cadogan Settled Estates Shareholding Company Limited, which until 2025 named family trustees as persons with significant control. The family's wealth is the estate, held in settled trusts.","legacyDetail":[{"t":"A 2025 restructure of the top of the chain.","d":"In May 2025 two new companies, Cyfrwy Limited and Trychrug Ltd, became the registered controllers of Cadogan Settled Estates Holdings and the Shareholding Company, replacing four individual trustees.","basis":"documented"}],"wealth":{"published":[{"figure":"£6.418bn","usd":"c. $8.5bn","who":"Earl Cadogan and family","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"29th (30th in 2025)","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"grossAssets":{"text":"Cadogan's portfolio was valued at £5.7bn at end-2024, with operating profit up 16.6% and total income up 11.8% (to c. £241m). CoStar reported further rises in profit and portfolio value for 2025 and £121m invested in regional assets; the 2025 net-asset figure was not found in a source this research could open.","source":{"label":"PrimeResi — Cadogan portfolio value hits £5.7bn (10 June 2025)","url":"https://primeresi.com/cadogan-portfolio-value-hits-5-7bn-as-chelsea-blooms/"}},"controlled":{"text":"No significant third-party capital found: Cadogan is a single-owner estate. Its reach is local: it is the dominant freeholder of Chelsea and Knightsbridge and shapes the area through leasing and planning.","source":{"label":"CoStar — Cadogan posts rising profits and portfolio value (June 2026)","url":"https://www.costar.com/article/1405010543/cadogan-posts-rising-profits-and-portfolio-value-as-chelsea-and-knightsbridge-estate-blooms"}},"opaque":{"verdict":"documented","text":"Companies House shows Cadogan Group Ltd → Cadogan Group Holdings Ltd → Cadogan Settled Estates Ltd → Cadogan Settled Estates Holdings Ltd, whose registered controllers since May 2025 are Cyfrwy Ltd and Trychrug Ltd. Trychrug Ltd is itself registered as controlled by Cadogan Settled Estates Shareholding Co Ltd, which in turn names Cyfrwy and Trychrug as its controllers: a circular chain in which no individual is now named. Until 31 March / 7 May 2025 four individuals were registered at the Shareholding Company with 'ownership of shares – 75% or more with control over the trustees of a trust'. The settlement's terms, beneficiaries and distributions are not public. All entities found are UK-registered.","searched":"Companies House PSC chain (02997357, 12329637, 03008401, 12329677, 16380097, 00368338); ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Cadogan Estates, Cadogan Group; queries: Cadogan, Cadogan Hotels Group Ltd, Cadogan settled estates trusts, Edward Cadogan, 9th Earl Cadogan): no matches; manual check: only Chelsea street addresses of unrelated parties.","source":{"label":"Companies House — Cadogan Settled Estates Shareholding Company Ltd, PSC register","url":"https://find-and-update.company-information.service.gov.uk/company/00368338/persons-with-significant-control"}},"gapNote":"The Rich List figure (£6.4bn) is above the last published portfolio value (£5.7bn at end-2024), so it presumably reflects later revaluation and other family assets; it is a valuation of trust-held property, and the 2025 change of the registered controllers to corporate vehicles makes it harder, not easier, to see who benefits."},"holdingsToday":[{"name":"Cadogan Estate, Chelsea and Knightsbridge","kind":"Urban property","sector":"Real estate","where":"London SW1/SW3","detail":"c. 93 acres: Sloane Street, King's Road, Duke of York Square, Cadogan Square; portfolio £5.7bn (2024).","basis":"documented","source":{"label":"PrimeResi — Cadogan portfolio value hits £5.7bn","url":"https://primeresi.com/cadogan-portfolio-value-hits-5-7bn-as-chelsea-blooms/"}},{"name":"Regional property investments","kind":"Urban property","sector":"Real estate","where":"UK outside London","detail":"£121m invested in regional assets in 2025 (CoStar).","basis":"documented","source":{"label":"CoStar — Cadogan 2025 results","url":"https://www.costar.com/article/1405010543/cadogan-posts-rising-profits-and-portfolio-value-as-chelsea-and-knightsbridge-estate-blooms"}},{"name":"Cadogan Hotels Group Ltd","kind":"Private company","sector":"Hotels","where":"London","detail":"Hotel subsidiary incorporated in 2019 alongside Cadogan Group Holdings.","basis":"documented","source":{"label":"Companies House — company search: Cadogan Group","url":"https://find-and-update.company-information.service.gov.uk/search/companies?q=cadogan+group+limited"}},{"name":"Cadogan settled estates trusts","kind":"Trust","sector":"Family wealth","where":"England","detail":"Ultimate owners via Cadogan Settled Estates Shareholding Co Ltd; trustees registered as PSCs until 2025.","basis":"documented","source":{"label":"Companies House — PSC register 00368338","url":"https://find-and-update.company-information.service.gov.uk/company/00368338/persons-with-significant-control"}}],"slaveSiteId":"cadogan-family","lineage":[{"name":"Sir Hans Sloane","relation":"founder","years":"1660–1753","note":"Bought the manor of Chelsea in 1712; income from his wife's Jamaican plantations.","basis":"documented"},{"name":"Charles Cadogan, 2nd Baron Cadogan & Elizabeth Sloane","relation":"spouse / heiress","years":"m. 1717","note":"Elizabeth's inheritance brought half the Chelsea estate to the Cadogans.","basis":"documented"},{"name":"Charles Sloane Cadogan, 1st Earl Cadogan","relation":"grandson of Sloane","years":"1728–1807","note":"Leased land for Hans Town; Grenada mortgagee in 1774 (LBS).","basis":"documented"},{"name":"Charles Cadogan, 8th Earl Cadogan","relation":"descendant","years":"1937–2023","note":"Chaired the estate for decades; registered PSC for the trusts in 2016.","basis":"documented"},{"name":"Edward Cadogan, 9th Earl Cadogan","relation":"heir","years":"b. 1966","note":"Succeeded in 2023.","basis":"documented"}],"today":"Edward Cadogan, 9th Earl Cadogan, succeeded his father in 2023. Cadogan Group manages the estate on behalf of the family settlement, whose registered controllers changed from individual trustees to two corporate vehicles in 2025.","today_people":[{"name":"Edward Cadogan, 9th Earl Cadogan","relation":"titleholder","role":"Head of the family whose settlement owns the Cadogan Estate","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Earl Cadogan","url":"https://en.wikipedia.org/wiki/Earl_Cadogan"}}],"sources":[{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"},{"label":"PrimeResi — Cadogan portfolio value hits £5.7bn","url":"https://primeresi.com/cadogan-portfolio-value-hits-5-7bn-as-chelsea-blooms/"},{"label":"Companies House — Cadogan Group Ltd PSC ,"Scott-Ellis family","Czernin family"],"origins":"John Holles, Duke of Newcastle, bought the manor of Marylebone in 1708. It passed by marriage to the Harleys (Earls of Oxford) and in 1734 to the Bentinck Dukes of Portland, who developed it as the Portland Estate. When the 5th Duke of Portland died in 1879 it went to his sister Lucy, widow of the 6th Baron Howard de Walden, and so to the Ellis (later Scott-Ellis) family.","role_summary":"An estate bought in 1708 and moved by three heiress marriages, then let on building leases: Harley Street, Wimpole Street, Cavendish Square and Portland Place were laid out in the 18th century, and the estate turned Harley Street into London's private medical district in the 20th. Rental income reached £179.4m in the year to March 2026.","roleDetail":[{"t":"1708 purchase, three marriages.","d":"Holles bought Marylebone; it passed through Henrietta Cavendish Holles (m. Edward Harley) and their daughter Margaret (m. 2nd Duke of Portland, 1734).","basis":"documented"},{"t":"1879: to Howard de Walden.","d":"The Portland Estate's Marylebone part went to Lucy, Lady Howard de Walden, on her brother's death.","basis":"documented"},{"t":"Ellis line's Jamaican awards.","d":"Per UCL LBS, Lord Seaford, father of the 6th Baron, was awarded c. £18,100 compensation for five Jamaican estates in the 1830s.","basis":"documented"},{"t":"Medical Marylebone.","d":"The estate built Harley Street into a private medical cluster and keeps the freeholds; rental income rose 9.3% to £179.4m in 2025/26.","basis":"documented"}],"legacy":"Howard de Walden Estates Ltd owns c. 92 acres of Marylebone and is owned by the descendants of the four daughters of the 9th Baron (d. 1999). Peter Czernin, 11th Baron, succeeded in 2024.","legacyDetail":[{"t":"Balance sheet, year to 31 March 2026.","d":"Investment properties £4.52bn, net assets £3.09bn, net debt £596.8m, pre-tax profit £335.8m including a £231.2m revaluation gain.","basis":"documented"}],"wealth":{"published": nt-control"}},"gapNote":"The Rich List's £1.9bn cannot be checked against any public balance sheet, because the estate's property is held by trustees and only small management companies file accounts; the figure is an outside valuation of c. 110 acres of central London."},"holdingsToday":[{"name":"Portman Estate, Marylebone","kind":"Urban property","sector":"Real estate","where":"London W1","detail":"c. 110 acres between Oxford Street and Marylebone Road: Portman Square, Bryanston Square, Montagu Square.","basis":"documented","source":{"label":"Portman Estate — Archives","url":"https://portmanestate.co.uk/archives/"}},{"name":"Portman Settled Estates Ltd","kind":"Private company","sector":"Estate management","where":"London","detail":"Management company owned by Seymour Street Nominees Ltd; c. 87 employees.","basis":"documented","source":{"label":"Companies House — PSC register 01055334","url":"https://find-and-update.company-information.service.gov.uk/company/01055334/persons-with-significant-control"}},{"name":"Portman family trusts","kind":"Trust","sector":"Family wealth","where":"England","detail":"Hold the estate freeholds for the family.","basis":"documented","source":{"label":"Wikipedia — Christopher Portman, 10th Viscount Portman","url":"https://en.wikipedia.org/wiki/Christopher_Portman,_10th_Viscount_Portman"}}],"slaveSiteId":"portman-family","lineage":[{"name":"Sir William Portman","relation":"founder","years":"d. 1557","note":"Lord Chief Justice; acquired the Marylebone fields c. 1532–54.","basis":"documented"},{"name":"Henry William Portman","relation":"descendant","years":"d. 1796","note":"Began building on the estate in the 1760s.","basis":"documented"},{"name":"Edward Berkeley Portman, 1st Viscount Portman","relation":"descendant","years":"1799–1888","note":"Created Viscount Portman in 1873.","basis":"documented"},{"name":"Christopher Portman, 10th Viscount Portman","relation":"heir","years":"b. 1958","note":"Head of the family; estate in trust.","basis":"documented"}],"today":"Christopher Portman, 10th Viscount Portman, heads the family whose trusts own the Portman Estate. The estate published a 500-year history of the family in 2022.","today_people":[{"name":"Christopher Portman, 10th Viscount Portman","relation":"titleholder","role":"Head of the family owning the Portman Estate","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Christopher Portman, 10th Viscount Portman","url":"https://en.wikipedia.org/wiki/Christopher_Portman,_10th_Viscount_Portman"}}],"sources":[{"label":"Portman Estate — Archives: a 500-year history","url":"https://portmanestate.co.uk/archives/"},{"label":"BusinessCloud — 2026 Sunday Times Rich List table","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"},{"label":"Companies House — Portman Settled Estates Ltd PSC","url":"https://find-and-update.company-information.service.gov.uk/company/01055334/persons-with-significant-control"},{"label":"Endole — Portman Settled Estates Limited","url":"https://open.endole.co.uk/insight/company/01055334-portman-settled-estates-limited"},{"label":"Wikipedia — Christopher Portman, 10th Viscount Portman","url":"https://en.wikipedia.org/wiki/Christopher_Portman,_10th_Viscount_Portman"}],"connections":[{"id":"marylebone","type":"ownership","label":"owns c. 110 acres of Marylebone"},{"id":"howard-de-walden-family","type":"political","label":"neighbouring Marylebone estate"},{"id":"berkeley-family","type":"family","label":"Berkeley name carried by the Berkeley Portman line (interpretive)"},{"id":"grosvenor-family-westminster","type":"political","label":"fellow London great estate"},{"id":"who-owns-england","type":"legacy","label":"London great estate in the landownership debate"}]},{"id":"british-crown-estate-duchies","name":"The Crown: Crown Estate, Duchy of Lancaster and Duchy of Cornwall (House of Windsor)","category":"Crown & Church","role":"Conquest & Royal Grant","moneySources":["Norman conquest (royal demesne)","Forfeitures and escheats","Dissolution of the monasteries","Seabed and offshore wind leasing","Urban property"],"nation":"United Kingdom","scale":"Dominant","scaleBasis":"documented","scaleNote":"The Crown Estate's net asset value grew to £16.7bn in 2025/26 (as reported by The Independent); the King is listed personally at £680m (Rich List 2026, 230th).","start":1066,"end":null,"lifespan":"1066–present (Duchy of Cornwall 1337; Duchy of Lancaster 1399; Crown Estate surrendered to Parliament 1760)","base":"London (St James's and Regent Street)","geo":[51.501,-0.142],"aliases":["The Crown Estate","Duchy of Lancaster","Duchy of Cornwall","Sovereign Grant","House of Windsor"],"origins":"After 1066 William I kept a large share of England as royal demesne, recorded as 'Land of the King' in Domesday (1086). Later kings added forfeited baronies, the Lancaster inheritance (1399) and monastic land seized in 1536–41, though much of it was granted or sold to courtiers.","role_summary":"Three separate pots. The Crown Estate is the hereditary Crown land George III surrendered to Parliament in 1760 for a Civil List; its profits go to the Treasury and set the Sovereign Grant. The Duchy of Lancaster (since 1399) is the monarch's private income and the Duchy of Cornwall (since 1337) the heir's. In the 2020s the Crown Estate's monopoly over leasing the seabed for offshore wind became its biggest earner.","roleDetail":[{"t":"Conquest demesne.","d":"Domesday lists the king as the largest landholder; historians commonly put the royal share at about a fifth of recorded land value.","basis":"interpretive"},{"t":"1337 and 1399: the two duchies.","d":"Edward III created the Duchy of Cornwall for his heir; the Duchy of Lancaster merged with the Crown when Henry IV took the throne in 1399.","basis":"documented"},{"t":"1760: the surrender.","d":"George III gave the hereditary Crown lands' revenue to the Treasury in return for a Civil List, creating what became the Crown Estate.","basis":"documented"},{"t":"Offshore wind windfall.","d":"Round 4 option fees lifted net revenue profit to £1.15bn in 2024/25; it fell back to c. £0.5bn (revenue account profit £487m) in 2025/26 as projects moved into construction.","basis":"documented"}],"legacy":"The Crown Estate (England, Wales and Northern Ireland) is a statutory body that pays its profits to the Treasury. The Duchy of Lancaster funds the King's private income and the Duchy of Cornwall the Prince of Wales's. The King's personal fortune (Rich List: £680m) is separate from all three.","legacyDetail":[{"t":"Sovereign Grant link.","d":"The monarchy's core funding is calculated from Crown Estate profits; it was set at £132.1m for 2025/26.","basis":"documented"},{"t":"Duchy of Lancaster offshore funds (Paradise Papers).","d":"In 2017 the Paradise Papers showed the Duchy of Lancaster had invested about £10m in funds in the Cayman Islands and Bermuda, including Dover Street VI Cayman Fund LP; the Duchy said its investments were audited and legitimate.","basis":"documented"}],"norman":{"claim":"documented","text":"The royal demesne recorded in Domesday as 'Land of King William' is the documented root of Crown landholding; the present royal family descends from William I through several female lines.","source":{"label":"The National Archives — Domesday Book (education resource)","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"}},"wealth":{"published":[{"figure":"£680m","usd":"c. $0.9bn","who":"The King (personal wealth)","publisher":"Sunday Times Rich List (as reported by BusinessCloud)","year":2026,"rank":"230th","url":"https://businesscloud.co.uk/news/revolut-xtx-founders-rise-up-2026-sunday-times-rich-list/"}],"publishedNote":"The Rich List excludes the Crown Estate and the duchies from the King's personal figure.","grossAssets":{"text":"Crown Estate: net asset value £16.7bn at 31 March 2026 (from £15.0bn), revenue account profit £487m (2024/25: £1.1bn). The two duchies publish separate accounts; their 2025/26 net-asset figures were not confirmed in this check.","source":{"label":"The Independent via Newswav — Crown Estate returns to Treasury fall (26 June 2026)","url":"https://newswav.com/article/crown-estate-returns-to-treasury-fall-by-almost-500-million-amid-slump-in-p-A2606_XLm7oy"}},"controlled":{"text":"The Crown Estate manages the seabed around England, Wales and Northern Ireland and leases it for offshore wind, cables and aggregates, which gives it reach far beyond its balance sheet; it is not royal private wealth.","source":{"label":"GOV.UK — The Crown Estate Integrated Annual Report and Accounts 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"}},"opaque":{"verdict":"documented","text":"The King's private assets (Sandringham, Balmoral, investments and inheritances) are not published, and royal wills are sealed. ICIJ's Paradise Papers (Appleby) list The Duchy of Lancaster as investor in Dover Street VI Cayman Fund LP and Jubilee Absolute Return Fund Ltd (Bermuda, later Guernsey). Being listed in ICIJ data does not imply wrongdoing.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026, and node pages: 'The Duchy of Lancaster' is listed as investor in Dover Street VI Cayman Fund LP and Jubilee Absolute Return Fund Ltd; reported by ICIJ partners incl. the Guardian, Nov 2017); Crown Estate and Duchy reports; Rich List 2026.","source":{"label":"ICIJ Offshore Leaks — Dover Street VI Cayman Fund LP","url":"https://offshoreleaks.icij.org/nodes/84000000"}},"gapNote":"The King's £680m personal figure is small next to the £16.7bn Crown Estate and the two duchies, which he does not own personally, but whose income he or the Prince of Wales benefits from or which fixes royal funding; the private fortune itself is shielded from disclosure by sealed wills and an exemption from inheritance tax on sovereign-to-sovereign bequests."},"holdingsToday":[{"name":"The Crown Estate","kind":"Other","sector":"Real estate & seabed","where":"England, Wales, Northern Ireland","detail":"Regent Street, St James's, rural estates, seabed; net asset value £16.7bn (2026).","basis":"documented","source":{"label":"GOV.UK — Crown Estate annual report 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"}},{"name":"Offshore wind seabed leases","kind":"Energy & minerals","sector":"Renewable energy","where":"North Sea, Irish Sea, Celtic Sea","detail":"Round 4 option fees produced c. £1.07bn of 2024/25 revenue; future 2% revenue share once windfarms generate.","basis":"documented","source":{"label":"Baird Maritime — Crown Estate reports profit of £1.15bn led by offshore wind","url":"https://www.bairdmaritime.com/offshore/renewables/offshore-wind/britains-crown-estate-reports-profit-of-gbp115b-led-by-offshore-wind"}},{"name":"Duchy of Lancaster","kind":"Trust","sector":"Property & investments","where":"England","detail":"Net assets £687.3m (March 2026); funds the King's private income.","basis":"documented","source":{"label":"Duchy of Lancaster — Annual report year ended 31 March 2026","url":"https://www.duchyoflancaster.co.uk/news-updates/duchy-of-lancaster-annual-report-and-accounts-year-ended-31st-march-2026/"}},{"name":"Duchy of Cornwall","kind":"Rural land","sector":"Property & farming","where":"South-west England and elsewhere","detail":"c. 130,000 acres; net assets c. £1.2bn; funds the Prince of Wales.","basis":"documented","source":{"label":"GOV.UK — The Crown Estate annual report 2024 to 2025","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2024-to-2025"}}],"slaveSiteId":"british-crown-estate-duchies","lineage":[{"name":"William I","relation":"founder","years":"r. 1066–1087","note":"Took royal demesne after the Conquest; ordered Domesday.","id":"william-the-conqueror","basis":"documented"},{"name":"Edward III","relation":"descendant","years":"r. 1327–1377","note":"Created the Duchy of Cornwall (1337).","basis":"documented"},{"name":"Henry IV","relation":"successor","years":"r. 1399–1413","note":"Brought the Duchy of Lancaster to the Crown.","basis":"documented"},{"name":"Henry VIII","relation":"successor","years":"r. 1509–1547","note":"Seized monastic land 1536–41, most of it later granted or sold.","id":"dissolution-of-the-monasteries","basis":"documented"},{"name":"George III","relation":"successor","years":"r. 1760–1820","note":"Surrendered hereditary Crown revenues to Parliament in 1760.","basis":"documented"},{"name":"King Charles III","relation":"monarch","years":"b. 1948","note":"Receives the Duchy of Lancaster income; his son holds the Duchy of Cornwall.","basis":"documented"}],"today":"King Charles III receives the Duchy of Lancaster's surplus and the Sovereign Grant; William, Prince of Wales, receives the Duchy of Cornwall's. The Crown Estate is run by commissioners at arm's length and pays its profit to the Treasury.","today_people":[{"name":"King Charles III","relation":"monarch","role":"Sovereign; Duke of Lancaster","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"CBS News — King Charles supports research into monarchy's slavery links","url":"https://www.cbsnews.com/news/king-charles-slavery-investigation-monarchy/"}},{"name":"William, Prince of Wales","relation":"heir","role":"Duke of Cornwall","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"CBS News — King Charles supports research into monarchy's slavery links","url":"https://www.cbsnews.com/news/king-charles-slavery-investigation-monarchy/"}}],"sources":[{"label":"GOV.UK — The Crown Estate Integrated Annual Report and Accounts 2025 to 2026","url":"https://www.gov.uk/government/publications/the-crown-estate-annual-report-and-accounts-2025-to-2026--2"},{"label":"The Independent via Newswav — Crown Estate returns to Tr t)","category":"Crown & Church","role":"Church Land & Dissolution","moneySources":["Medieval Church endowments and tithes","Queen Anne's Bounty (1704)","South Sea annuities","Urban and rural land","Global equities and private markets"],"nation":"England","scale":"Dominant","scaleBasis":"documented","scaleNote":"The investment fund was valued at £11.6bn at end-2025 (8.0% return), making it one of the largest endowments in the UK.","start":1704,"end":null,"lifespan":"1704 (Queen Anne's Bounty) / 1836 (Ecclesiastical Commissioners) / 1948 (Church Commissioners) – present","base":"Church House, Westminster, London","geo":[51.499,-0.129],"aliases":["Church Commissioners","Queen Anne's Bounty","Ecclesiastical Commissioners","Hyde Park Estate"],"origins":"The Church held about a quarter of England's recorded land in 1086 and lost the monastic part at the Dissolution of 1536–41; the bishops' and cathedral estates survived. Queen Anne's Bounty (1704) used first-fruits and tenths to support poor clergy, and the Ecclesiastical Commissioners (1836) took over surplus bishops' and cathedral estates; the two were merged in 1948 as the Church Commissioners.","role_summary":"A medieval landed endowment turned into a modern investment fund. Queen Anne's Bounty invested its spare cash almost exclusively in South Sea Company annuities from 1723 to 1777 (the Church's own research), while the Ecclesiastical Commissioners managed estates including what became the Hyde Park Estate in Paddington. Since the 1990s the fund has moved into equities, private equity and timberland while keeping rural and strategic land.","roleDetail":[{"t":"Church land at Domesday.","d":"Commonly estimated at about a quarter of recorded land in 1086; this is a historians' estimate.","basis":"interpretive"},{"t":"Queen Anne's Bounty and the South Sea Company.","d":"The Church's 2022–23 research found the Bounty held £440,962 of South Sea annuities by 1777; critics argue the annuities were government debt rather than slave-trade profits.","basis":"documented"},{"t":"1948 merger.","d":"Queen Anne's Bounty was subsumed into the Commissioners' endowment in 1948 (2025 annual report).","basis":"documented"},{"t":"Diversified endowment.","d":"At end-2025: public equities 29.5%, private equity 10.8%, rural land 5.1%, residential 4.2% (incl. Hyde Park Estate), timberland 3.0%, strategic land 2.8%.","basis":"documented"}],"legacy":"The Church Commissioners for England, a statutory charity, hold an £11.6bn fund that pays for bishops, cathedrals, clergy pensions and parish grants, with a record £1.5–1.6bn approved for 2026–28. A £100m in-perpetuity fund for healing, repair and justice responds to the Queen Anne's Bounty findings.","legacyDetail":[{"t":"Distributions.","d":"Charitable expenditure was £282.4m in 2025, plus clergy pension cash of £121.8m; the report warns distributions must fall after 2028.","basis":"documented"}],"norman":{"claim":"documented","text":"The bishoprics and cathedral chapters whose estates passed to the Ecclesiastical Commissioners in the 19th century were major Domesday landholders, many under Norman bishops installed after 1066.","source":{"label":"World History Encyclopedia — Domesday Book","url":"https://www.worldhistory.org/Domesday_Book/"}},"wealth":{"published":[],"publishedNote":"Not on the Rich List (an institution, not a family).","grossAssets":{"text":"Investment fund £11.6bn at end-2025 (2024: £11.1bn), net of bond liabilities; total net assets £10,228.6m (2024: £9,893.6m). Return 8.0% in 2025.","source":{"label":"Church Commissioners for England — Annual Report 2025","url":"https://reports.ticker.app/5493003JNKYFJ5I03G97/2026-05-26/NI-000145426_mistral.md"}},"controlled":{"text":"The Commissioners do not manage third-party money, but their allocations to private equity, venture capital and timberland funds give them influence as a large limited partner; Shrubsole estimated the Church of England owns c. 0.5% of England.","source":{"label":"lovemoney — Who owns England's land (2019)","url":"https://www.lovemoney.com/news/amp/84194/who-owns-englands-land-ownership-biggest-owners"}},"opaque":{"verdict":"none found","text":"The fund publishes annual accounts and asset allocation; individual fund holdings and acreage are not all itemised. No offshore vehicle in ICIJ data was found under the Commissioners' name.","searched":"Church Commissioners annual report 2025; ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Church Commissioners for England; queries: Church Commissioners for England, Global equities and private markets): no matches; manual check: only unrelated street addresses.","source":{"label":"Thinking Anglicans — Church Commissioners annual report 2025","url":"https://www.thinkinganglicans.org.uk/church-commissioners-annual-report-2025/"}}},"holdingsToday":[{"name":"Global equities and private markets","kind":"Fund / private equity","sector":"Investments","where":"Global","detail":"Public equities 29.5%, private equity 10.8%, venture capital 5.3%, absolute return 9.5% of the fund (2025).","basis":"documented","source":{"label":"Church Commissioners — Annual Report 2025","url":"https://reports.ticker.app/5493003JNKYFJ5I03G97/2026-05-26/NI-000145426_mistral.md"}},{"name":"Rural and strategic land","kind":"Rural land","sector":"Agriculture & development land","where":"England","detail":"Rural 5.1% and strategic land 2.8% of the fund (2025).","basis":"documented","source":{"label":"Church Commissioners — Annual Report 2025","url":"https://reports.ticker.app/5493003JNKYFJ5I03G97/2026-05-26/NI-000145426_mistral.md"}},{"name":"Hyde Park Estate and residential property","kind":"Urban property","sector":"Real estate","where":"Paddington, London","detail":"Residential is 4.2% of the fund; the Hyde Park Estate is among the top residential holdings.","basis":"documented","source":{"label":"Church Commissioners — Annual Report 2025","url":"https://reports.ticker.app/5493003JNKYFJ5I0
