lvoir)","category":"Landed Aristocracy & Gentry","role":"Agricultural Land & Enclosure","moneySources":["Marriage to heiress (de Ros)","Dissolution grant","Marriage to heiress (Vernon, Haddon)","Agricultural rents","Events and tourism"],"nation":"England","scale":"Significant","scaleBasis":"documented","scaleNote":"Last published Rich List figure: Duke of Rutland c. £125m (Sunday Times Rich List 2013); no later figure found.","start":1460,"end":null,"lifespan":"c. 1460–present","base":"Belvoir Castle, Leicestershire","geo":[52.894,-0.782],"aliases":["Dukes of Rutland","Earls of Rutland","Belvoir Estate","Haddon Hall"],"origins":"A Northumberland gentry family, the Manners gained Belvoir through Sir Robert Manners's marriage to Eleanor de Ros, heiress of the barons de Ros, in the 15th century. Thomas Manners was made Earl of Rutland in 1525 and acquired former monastic lands after the Dissolution.","role_summary":"Two heiress marriages and a Dissolution grant: Belvoir via the de Ros heiress, monastic estates under Henry VIII, and Haddon Hall in Derbyshire via John Manners's 1563 marriage to Dorothy Vernon. Queen Anne made the 9th Earl duke in 1703. The family lived on farm rents from the Vale of Belvoir and Derbyshire; today Belvoir earns from events, weddings and visitors as well.","roleDetail":[{"t":"The de Ros inheritance.","d":"Belvoir, a Norman castle site, came through Eleanor de Ros.","basis":"documented"},{"t":"Monastic lands.","d":"The 1st Earl gained former monastic lands after the Dissolution.","basis":"documented"},{"t":"Haddon by marriage.","d":"John Manners married the Vernon heiress Dorothy in 1563.","basis":"documented"}],"legacy":"Belvoir Castle remains the seat of the 11th Duke; Haddon Hall belongs to his brother Lord Edward Manners.","legacyDetail":[{"t":"Split between brothers.","d":"Belvoir (the duke) and Haddon (Lord Edward Manners) are held separately.","basis":"documented"}],"norman":{"claim":"interpretive","text":"Belvoir Castle was founded after 1066 by a Norman baron, and the Manners inherited it through the de Ros heiress; this research did not verify an unbroken documented descent from the Domesday holder, so the Norman link is through the property and female lines only.","source":{"label":"Wikipedia — Duke of Rutland","url":"https://en.wikipedia.org/wiki/Duke_of_Rutland"}},"wealth":{"published":[{"figure":"c. £125m","usd":"c. $0.19bn","who":"Duke of Rutland","publisher":"Sunday Times Rich List","year":2013,"rank":"n/a","url":"https://en.wikipedia.org/wiki/Duke_of_Rutland"}],"publishedNote":"No published figure since 2013 found.","grossAssets":{"text":"No public estate accounts found.","source":{"label":"Wikipedia — Duke of Rutland","url":"https://en.wikipedia.org/wiki/Duke_of_Rutland"}},"controlled":{"text":"Belvoir estate and castle; Haddon Hall held separately by Lord Edward Manners.","source":{"label":"Wikipedia — David Manners, 11th Duke of Rutland","url":"https://en.wikipedia.org/wiki/David_Manners,_11th_Duke_of_Rutland"}},"opaque":{"verdict":"none found","text":"No trust or offshore holdings documented.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Belvoir, Manners, Rutland; queries: David Manners, 11th Duke of Rutland, Manners): name matches only, none shown to be this family or its vehicles; manual check: no relevant match.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshoreleaks.icij.org/"}}},"holdingsToday":[{"name":"Belvoir Castle and estate","kind":"Rural land","sector":"Farming, events, tourism","where":"Leicestershire","detail":"Ducal seat and estate.","basis":"documented","source":{"label":"Wikipedia — Duke of Rutland","url":"https://en.wikipedia.org/wiki/Duke_of_Rutland"}},{"name":"Haddon Hall","kind":"Rural land","sector":"Heritage","where":"Derbyshire","detail":"Held by Lord Edward Manners.","basis":"documented","source":{"label":"Wikipedia — David Manners, 11th Duke of Rutland","url":"https://en.wikipedia.org/wiki/David_Manners,_11th_Duke_of_Rutland"}}],"slaveSiteId":"manners-family-rutland","lineage":[{"name":"Sir Robert Manners & Eleanor de Ros","relation":"spouse / heiress","years":"15th c.","note":"Brought Belvoir.","basis":"documented"},{"name":"Thomas Manners, 1st Earl of Rutland","relation":"descendant","years":"c. 1492–1543","note":"Earl 1525; monastic lands.","basis":"documented"},{"name":"John Manners & Dorothy Vernon","relation":"spouse / heiress","years":"m. 1563","note":"Brought Haddon Hall.","basis":"documented"},{"name":"John Manners, 1st Duke of Rutland","relation":"descendant","years":"1638–1711","note":"Created duke 1703.","basis":"documented"},{"name":"David Manners, 11th Duke of Rutland","relation":"heir","years":"b. 1959","note":"Present duke at Belvoir.","basis":"documented"}],"today":"David Manners, 11th Duke of Rutland, holds Belvoir Castle; his brother Lord Edward Manners owns Haddon Hall.","today_people":[{"name":"David Manners, 11th Duke of Rutland","relation":"titleholder","role":"Owner of Belvoir Castle","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — David Manners, 11th Duke of Rutland","url":"https://en.wikipedia.org/wiki/David_Manners,_11th_Duke_of_Rutland"}}],"sources":[{"label":"Wikipedia — Duke of Rutland","url":"https://en.wikipedia.org/wiki/Duke_of_Rutland"},{"label":"Wikipedia — David Manners, 11th Duke of Rutland","url":"https://en.wikipedia.org/wiki/David_Manners,_11th_Duke_of_Rutland"},{"label":"Wikipedia — List of officials and shareholders in the Royal African Company, 1672","url":"https://en.wikipedia.org/wiki/List_of_officials_and_shareholders_in_the_Royal_African_Company,_1672"}],"connections":[{"id":"dissolution-of-the-monasteries","type":"dissolution-grant","label":"1st Earl gained monastic lands"},{"id":"cavendish-family-devonshire","type":"political","label":"neighbouring Derbyshire estates (Haddon / Chatsworth)"},{"id":"william-the-conqueror","type":"enclosure-or-grant","label": : the Vanderbilt dowry.","d":"Consuelo Vanderbilt's American railway money restored the palace.","basis":"documented"},{"t":"Developer-landowner.","d":"Blenheim Estate Homes, working with Pye Homes (bought by the estate in 2018), built Park View and has permission for 180 homes at Hill Rise (2023); more than 1,000 homes are planned around Woodstock.","basis":"documented"}],"legacy":"Blenheim Palace, a UNESCO World Heritage Site and Winston Churchill's birthplace, is run by charitable foundations with the family; the estate develops and keeps ownership of housing on its land.","legacyDetail":[{"t":"Keeping the affordable homes.","d":"As landowner and housebuilder, Blenheim retains ownership of the affordable properties it builds.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No recent published Rich List figure for the Duke of Marlborough was found.","grossAssets":{"text":"No consolidated public accounts were reviewed in this research.","source":{"label":"Country Life — Will 1,000 new homes make or break Woodstock?","url":"https://www.countrylife.co.uk/property/will-1000-new-homes-ruin-woodstock-174447"}},"controlled":{"text":"c. 12,000 acres, the palace (via charitable foundations) and a housebuilding pipeline of 1,000+ homes.","source":{"label":"UK Property Forums — Blenheim Estate Homes plans 500 units at Woodstock","url":"https://ukpropertyforums.com/blenheim-estate-homes-plans-500-units-at-woodstock/"}},"opaque":{"verdict":"none found","text":"Charitable and family structures were not reviewed in detail; no offshore holdings found.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; earlier manual search: Blenheim; queries: Blenheim Estate Homes, Blenheim Palace, James Spencer-Churchill, 12th Duke of Marlborough, Pye Homes, Spencer-Churchill): name matches only, none shown to be this family or its vehicles; manual check: not matched to the estate.","source":{"label":"ICIJ Offshore Leaks Database","url":"https://offshorele aleNote":"In 1883 the 3rd Duke held 1,358,545 acres, the largest acreage in Britain; Titian sales to the national galleries raised c. £95m in 2009–12.","start":1785,"end":null,"lifespan":"1785 (Sutherland marriage) / 1803 (Bridgewater inheritance) – present","base":"Mertoun, Scottish Borders (historic seats Dunrobin and Trentham)","geo":[55.586,-2.592],"aliases":["Dukes of Sutherland","Earls of Ellesmere","Bridgewater Collection","Stafford House"],"origins":"George Granville Leveson-Gower, heir to Staffordshire estates, married Elizabeth, Countess of Sutherland, owner of most of Sutherland, in 1785, and in 1803 inherited the canal and coal fortune of his uncle, the 3rd Duke of Bridgewater, whose Worsley mines and canal had begun the canal age.","role_summary":"Industrial money and a vast Highland inheritance combined: Bridgewater's coal-and-canal income financed the 'improvement' of Sutherland, in which tenants were cleared from the glens for sheep farming (the Highland Clearances). Created duke in 1833, the family held 1.36 million acres by 1883. Since 1963 the dukedom has been with the Egerton line, whose main asset is the Bridgewater art collection; two Titians were sold to the national galleries in 2009 and 2012.","roleDetail":[{"t":"Bridgewater coal and canal.","d":"Inherited in 1803 from the 3rd Duke of Bridgewater.","basis":"documented"},{"t":"The Clearances.","d":"The 1st Duke and the Countess carried out the Highland Clearances on the Sutherland estates.","basis":"documented"},{"t":"1883: 1,358,545 acres.","d":"Bateman's figure for the 3rd Duke.","basis":"documented"},{"t":"Art into cash.","d":"Titian's Diana and Actaeon (2009) and Diana and Callisto (2012) were sold to the National Galleries of Scotland and the National Gallery.","basis":"documented"}],"legacy":"The 7th Duke, Francis Egerton, holds the Mertoun estate and the Bridgewater collection, much of it on loan to the National Galleries of Scotland; Dunrobin and the Sutherland estates went with the e nd many English lords, and the revolts that followed, allowed William to declare their lands forfeit and regrant almost all of England to Norman followers and churches within twenty years.","start":1066,"geo":[50.912,0.487],"sources":[{"label":"Wikipedia — Battle of Hastings","url":"https://en.wikipedia.org/wiki/Battle_of_Hastings"},{"label":"The National Archives — Domesday Book (education resource)","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"}],"connections":[{"id":"william-the-conqueror","type":"political","label":"William's victory"},{"id":"domesday-book","type":"legacy","label":"conquest recorded in the 1086 survey"}]},{"id":"domesday-book","name":"Domesday Book (1086)","type":"entity","kind":"Register / dataset","description":"William I's survey of England, completed in 1086, recorded the holders of land in 1066 and 1086, its resources and its annual value (c. £73,000 in total). Open Domesday lets users search the c. 1,400 tenants-in-chief; estimates put the king's share at about a fifth and the Church's at about a quarter of the recorded land.","start":1086,"geo":[51.481,-0.28],"sources":[{"label":"The National Archives — Domesday Book (education resource)","url":"https://cdn.nationalarchives.gov.uk/documents/education/domesday.pdf"},{"label":"Open Domesday — William of Percy","url":"https://opendomesday.org/name/william-of-percy/"},{"label":"World History Encyclopedia — Domesday Book","url":"https://www.worldhistory.org/Domesday_Book/"}],"connections":[{"id":"william-the-conqueror","type":"charter","label":"commissioned at Christmas 1085"},{"id":"percy-family-northumberland","type":"enclosure-or-grant","label":"William de Percy: 141 places as tenant-in-chief"},{"id":"shirley-family-ferrers","type":"enclosure-or-grant","label":"Saswalo at Ettington"},{"id":"church-of-england-commissioners","type":"enclosure-or-grant","label":"Church held about a quarter"}]},{"id":"magna-carta","name":"Magna Carta (1215)","type":"entity","kind":"Law / charter / tax","description":"The charter King John granted his barons at Runnymede in 1215 limited the Crown's feudal exactions on landed families: fixed reliefs on inheritance, protections for heirs in wardship and for widows' dower, and limits on royal forest. It is an early legal guarantee of aristocratic property against the Crown.","start":1215,"geo":[51.444,-0.565],"sources":[{"label":"Wikipedia — Magna Carta","url":"https://en.wikipedia.org/wiki/Magna_Carta"}],"connections":[{"id":"british-crown-estate-duchies","type":"political","label":"limited royal claims on baronial estates"},{"id":"william-the-conqueror","type":"legacy","label":"curbed the feudal system the Conquest created"}]},{"id":"dissolution-of-the-monasteries","name":"Dissolution of the Monasteries (1536–1541)","type":"entity","kind":"Law / charter / tax","description":"Henry VIII closed some 800 religious houses between 1536 and 1541 and took their estates for the Crown, then granted or sold most of them to courtiers and officials. Families in this project that gained monastic land include the Russells (Tavistock 1539, Woburn 1547, Covent Garden 1552), the Wriothesleys (Bloomsbury 1545), the Herberts (Wilton), the Thynnes (Longleat, 1541) and the Cavendishes.","start":1536,"sources":[{"label":"Wikipedia — Dissolution of the monasteries","url":"https://en.wikipedia.org/wiki/Dissolution_of_the_monasteries"},{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"}],"connections":[{"id":"russell-family-bedford","type":"dissolution-grant","label":"Tavistock, Woburn, Covent Garden"},{"id":"herbert-family-pembroke","type":"dissolution-grant","label":"Wilton Abbey"},{"id":"thynne-family-bath","type":"dissolution-grant","label":"Longleat Priory"},{"id":"cavendish-family-devonshire","type":"dissolution-grant","label":"Sir William Cavendish, commissioner"},{"id":"g1-bloomsbury-estate","type":"dissolution-grant","label":"Wriothesley acquired Bloomsbury, 1545"}]},{"id":"enclosure-acts","name":"Enclosure (Inclosure) Acts (1604–1914)","type":"entity","kind":"Law / charter / tax","description":"Parliament passed 5,265 enclosure Acts between 1604 and 1914, most of them (3,828) in 1750–1819, converting open fields and commons into private holdings, usually allotted in proportion to existing ownership; secondary sources put the total area at c. 6.8 million acres. Large landowners, who sat in Parliament, were the main beneficiaries.","start":1604,"sources":[{"label":"UK Parliament — Enclosing the land (Living Heritage)","url":"https://www.parliament.uk/about/living-heritage/transformingsociety/towncountry/landscape/overview/"},{"label":"Wikipedia — Inclosure Acts","url":"https://en.wikipedia.org/wiki/Inclosure_act"}],"connections":[{"id":"spencer-family-althorp","type":"enclosure-or-grant","label":"grazing fortune of enclosed pasture"},{"id":"leveson-gower-family-sutherland","type":"enclosure-or-grant","label":"Highland Clearances, a Scottish parallel"},{"id":"who-owns-england","type":"legacy","label":"concentration of ownership today"}]},{"id":"death-duties-inheritance-tax","name":"Death duties to inheritance tax (1894 estate duty → IHT; heritage, agricultural and business reliefs)","type":"entity","kind":"Law / charter / tax","description":"Estate duty, introduced in 1894, rose to 80% at the top by the 1940s and forced sales such as the Lowthers' West Cumberland estate (1955–59) and Hardwick Hall's transfer to the Treasury after the 10th Duke of Devonshire's death in 1950. Great estates responded by moving land into trusts, which pay periodic charges of up to 6% every ten years instead of 40% at death, and by relying on agricultural and business property relief; from 6 April 2026, 100% relief is capped at £2.5m of combined agricultural and business property per person and per trust, with 50% relief above.","start":1894,"sources":[{"label":"GOV.UK — Agricultural property relief and business property relief changes","url":"https://www.gov.uk/government/publications/changes-to-agricultural-property-relief-and-business-property-relief/agricultural-property-relief-and-business-property-relief-changes"},{"label":"Chartered Institute of Taxation — Behind the headlines on the Duke and all that money","url":"https://www.tax.org.uk/blog-behind-the-headlines-on-the-duke-and-all-that-money"},{"label":"Whitehaven News — Why the Lowthers sold up in West Cumbria","url":"https://whitehavennews.co.uk/news/17122902.why-the-lowthers-sold-up-in-west-cumbria"}],"connections":[{"id":"grosvenor-family-westminster","type":"trust","label":"2016 succession via trusts"},{"id":"cavendish-family-devonshire","type":"inheritance","label":"1950 duties; Hardwick ceded"},{"id":"lowther-family-lonsdale","type":"inheritance","label":"1944/1953 duties forced sales"},{"id":"russell-family-bedford","type":"inheritance","label":"estate sales from the 1890s"}]},{"id":"register-of-overseas-entities","name":"Register of Overseas Entities (2022)","type":"entity","kind":"Register / dataset","description":"Created by the Economic Crime (Transparency and Enforcement) Act 2022 and opened on 1 August 2022, the register requires non-UK entities that own UK land to name their registrable beneficial owners at Companies House. Trust information became available to applicants from 31 August 2025. It does not cover UK companies or UK trusts, which is how most great estates hold their land.","start":2022,"sources":[{"label":"GOV.UK — Register of Overseas Entities: guidance on registration and verification","url":"https://www.gov.uk/government/publications/register-of-overseas-entities-guidance-on-registration-and-verification"},{"label":"Forsters — Economic Crime Act 2022: Register of Overseas Entities","url":"https://www.forsters.co.uk/news-and-views/economic-crime-transparency-and-enforcement-act-2022-register-of-overseas-entities"}],"connections":[{"id":"uk-land-registry-ccod-ocod","type":"legacy","label":"links overseas owners in OCOD to beneficial owners"},{"id":"who-owns-england","type":"legacy","label":"campaigners used it to trace offshore owners"}]},{"id":"uk-land-registry-ccod-ocod","name":"HM Land Registry corporate ownership datasets (CCOD and OCOD)","type":"entity","kind":"Register / dataset","description":"HM Land Registry publishes two free datasets of land titles in England and Wales owned by companies: UK companies (CCOD) and overseas companies (OCOD). They list title numbers, addresses and tenure but not beneficial owners, so they must be matched with Companies House and the Register of Overseas Entities; individuals' and trusts' land is not included.","start":2017,"sources":[{"label":"HM Land Registry — UK companies that own property in England and Wales (CCOD)","url":"https://use-land-property-data.service.gov.uk/datasets/ccod"},{"label":"HM Land Registry — Overseas companies that own property (OCOD)","url":"https://use-land-property-data.service.gov.uk/datasets/ocod"}],"connections":[{"id":"register-of-overseas-entities","type":"legacy","label":"beneficial-owner data for OCOD titles"},{"id":"who-owns-england","type":"legacy","label":"Shrubsole's maps use these datasets"}]},{"id":"who-owns-england","name":"Who Owns England? (Guy Shrubsole, 2019)","type":"entity","kind":"Leak / investigation","description":"Campaigner Guy Shrubsole's book and website, built on Land Registry data, FOI requests and estate maps, estimated in 2019 that about half of England is owned by under 1% of the population. His breakdown: aristocracy and gentry c. 30%, corporations c. 18%, 'new money' c. 17%, public sector c. 8.5%, homeowners c. 5%, conservation charities c. 2%, the Crown c. 1.4% and the Church of England c. 0.5%, with c. 17% unregistered.","start":2019,"sources":[{"label":"lovemoney — Who owns England's land (2019)","url":"https://www.lovemoney.com/news/amp/84194/who-owns-englands-land-ownership-biggest-owners"},{"label":"The Land Is Ours — 'Who Owns England' confirms half of England owned by less than 1%","url":"https://tlio.org.uk/new-book-who-owns-england/"},{"label":"Who Owns England — The 50 companies that own over a million acres","url":"https://whoownsengland.org/2016/12/12/the-50-companies-that-own-over-a-million-acres-of-england-wales/"}],"connections":[{"id":"british-crown-estate-duchies","type":"legacy","label":"Crown c. 1.4% of England"},{"id":"church-of-england-commissioners","type":"legacy","label":"Church c. 0.5% of England"},{"id":"montagu-douglas-scott-buccleuch","type":"legacy","label":"Boughton among the great estates"},{"id":"uk-land-registry-ccod-ocod","type":"legacy","label":"data source"}]},{"id":"g1-bloomsbury-estate","name":"Bloomsbury estate (Bedford Estates)","type":"entity","kind":"Estate / district","description":"Thomas Wriothesley, later Earl of Southampton, acquired Bloomsbury at the Dissolution in 1545; it passed to the Russells by Rachel Wriothesley's 1669 marriage and was developed with Bedford, Russell and Tavistock Squares. Twentieth-century sales cut it from 112 acres to about 20, still the largest private holding in Bloomsbury.","start":1545,"geo":[51.52,-0.128],"sources":[{"label":"UCL Bloomsbury Project — Estates in Bloomsbury","url":"https://www.ucl.ac.uk/bloomsbury-project/streets/bedford_square.htm"},{"label":"Wikipedia — Bedford Estate","url":"https://en.wikipedia.org/wiki/Bedford_Estate"}],"connections":[{"id":"russell-family-bedford","type":"marriage-settlement","label":"came by the 1669 Wriothesley marriage"},{"id":"dissolution-of-the-monasteries","type":"dissolution-grant","label":"acquired by Wriothesley in 1545"}]},{"id":"g1-chatsworth-settlement","name":"Trustees of the Chatsworth Settlement (trading as the Devonshire Group)","type":"entity","kind":"Trust / foundation","description":"The unincorporated family settlement that owns the Devonshire estates (Chatsworth, Bolton Abbey, Compton Estate in Eastbourne, Lismore) and trades as 'the Devonshire Group', which is 'not a legal entity'. As a private trust it files no public balance sheet; the Chatsworth House Trust, a separate charity, runs the house.","start":1946,"geo":[53.228,-1.611],"sources":[{"label":"OpenCharities — related charity accounts 2024","url":"https://opencharities.uk/ew/511149/files/2024-03-31-accounts.md"},{"label":"Devonshire Group — What we do","url":"https://devonshiregroup.co.uk/what-we-do/"}],"connections":[{"id":"cavendish-family-devonshire","type":"trust","label":"holds the Devonshire estates for the family"},{"id":"death-duties-inheritance-tax","type":"trust","label":"settled estates and death duties"}]},{"id":"g1-buccleuch-estates","name":"Buccleuch Estates Ltd (SC012615)","type":"entity","kind":"Estate company","description":"The Scottish company that runs the Duke of Buccleuch's farming, forestry, property and renewables businesses across four estates (c. 159,000 acres farmed). Its registered controller is MDS Group Investments Ltd; it reported net assets of £182.9m for the year to October 2024. ICIJ's Paradise Papers list it as a shareholder of Kirkhope Holdings Ltd (Cayman Islands, 1987); being listed in ICIJ data does not imply wrongdoing.","start":1920,"geo":[55.548,-2.919],"sources":[{"label":"Companies House — Buccleuch Estates Ltd PSC","url":"https://find-and-update.company-information.service.gov.uk/company/SC012615/persons-with-significant-control"},{"label":"ICIJ Offshore Leaks — Kirkhope Holdings Ltd","url":"https://offshoreleaks.icij.org/nodes/82012736"}],"connections":[{"id":"montagu-douglas-scott-buccleuch","type":"ownership","label":"Buccleuch family company"},{"id":"cayman-islands","type":"offshore","label":"shareholder of a Cayman company (Paradise Papers)"}]},{"id":"house-of-liechtenstein","name":"House of Liechtenstein (Princes of Liechtenstein)","category":"Princely & Noble Houses","role":"Modern Finance & Holding","moneySources":["Habsburg court office","Bohemian confiscations after 1620","Serf-worked Moravian and Bohemian estates","Private banking (LGT, from c. 1930)","Agriculture and forestry (Austria, US, Uruguay)"],"nation":"Liechtenstein","scale":"Dominant","scaleBasis":"documented","scaleNote":"The family wholly owns LGT, which reported CHF 386.1bn of client assets under management at end-2025, and the Bloomberg Billionaires Index put Hans-Adam II at about US$9.2bn in September 2023.","start":1608,"end":null,"lifespan":"1608 princely rank; 1719 principality; bank from c. 1930; present","base":"Vaduz, Liechtenstein (and Vienna)","geo":[47.141,9.522],"aliases":["Fürstenhaus Liechtenstein","Prince of Liechtenstein Foundation","Stiftung Fürst Liechtenstein","LGT Group","Liechtenstein Group"],"origins":"An Austrian noble family that rose in Habsburg service; Karl I was raised to prince in 1608. In 1699 and 1712 it bought the lordships of Schellenberg and Vaduz, which became the Principality of Liechtenstein in 1719. For three centuries most of its wealth lay in vast estates in Moravia, Bohemia, Silesia and Lower Austria.","role_summary":"Karl I, as Habsburg governor of Bohemia after the Battle of the White Mountain (1620), oversaw the confiscation of rebel Protestant estates and acquired large ones himself at low cost, plus the Silesian duchy of Jägerndorf (1622). Those estates, worked under serf labour until 1848, were the core of the fortune until Czechoslovakia confiscated them in 1945. The family then rebuilt its wealth around a small Vaduz bank it had bought around 1930, which Hans-Adam II turned into LGT, now one of Europe's largest family-owned private banks.","roleDetail":[{"t":"Princely rank for Habsburg service (1608).","d":"Karl I of Liechtenstein, a convert to Catholicism and an adviser to the Habsburgs, was made a prince in 1608.","basis":"documented"},{"t":"Winner of the post-1620 confiscations.","d":"As governor and viceroy of Bohemia after the White Mountain, Karl I personally carried out many confiscations, letting the family acquire large Bohemian and Moravian estates cheaply; in 1622 he received Jägerndorf and confiscated 'rebel property'. Historians debate how far he acted on Ferdinand II's orders or on his own initiative.","basis":"documented"},{"t":"A tiny sovereign state bought with land money (1699–1719).","d":"The purchase of Schellenberg and Vaduz gave the family a seat in the Imperial Diet; Emperor Charles VI united them as the Principality of Liechtenstein in 1719.","basis":"documented"},{"t":"Loss of the Czech estates (1945).","d":"Under the Beneš decrees Czechoslovakia confiscated the family's property, on the ground that Franz Joseph II had declared German nationality; restitution claims in Czech courts and at the ICJ and ECHR have failed or remain unresolved.","basis":"documented"},{"t":"From bank to group (c. 1930–today).","d":"The family bought the Bank in Liechtenstein, founded 1921, around 1930. Hans-Adam II, prince since 1989, built it into LGT; the 1970 Prince of Liechtenstein Foundation holds LGT and an agriculture, forestry and real-estate group.","basis":"documented"}],"legacy":"The money now sits in two arms held through the Prince of Liechtenstein Foundation (Vaduz, 1970): LGT Group, the private bank, and the Liechtenstein Group, which runs forestry in Styria (Forst Kalwang), Austria's largest owner-operated arable farm (Wilfersdorf), the princely wineries, Vienna real estate, RiceTec (US hybrid rice seed), avocado and Uruguayan farming operations. The princely art collections are shown at the two Liechtenstein palaces in Vienna.","legacyDetail":[{"t":"LGT is the engine.","d":"LGT reported group profit of CHF 445.6m and client assets of CHF 386.1bn for 2025; the family has controlled it for more than 90 years.","basis":"documented"},{"t":"A diversified real-asset group.","d":"The Liechtenstein Group lists nine portfolio companies across forestry, agriculture, wine, real estate and agri-technology in Austria, Liechtenstein, the US, Spain or Portugal (avocados) and Uruguay.","basis":"documented"}],"norman":{"claim":"none","text":"No Norman or 1066 connection. The family is first documented in Lower Austria in the 12th century.","source":{"label":"Wikipedia — House of Liechtenstein","url":"https://en.wikipedia.org/wiki/House_of_Liechtenstein"}},"wealth":{"published":[{"figure":"c. US$9.2bn","usd":"US$9.2bn","who":"Hans-Adam II, Prince of Liechtenstein","publisher":"Bloomberg Billionaires Index (as reported by InvestmentNews)","year":2023,"rank":"215th in the world","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"},{"figure":"c. US$4.4bn","usd":"US$4.4bn","who":"Hans-Adam II","publisher":"Bloomberg Billionaires Index (as reported by finews.ch)","year":2017,"rank":"444th","url":"https://www.finews.ch/news/banken/29367-lgt-prinz-hans-adam-milliardaer-index"},{"figure":"c. US$4.6bn","usd":"US$4.6bn","who":"Princely family","publisher":"TIME (unattributed estimate)","year":2002,"rank":"","url":"https://time.com/archive/6953932/secrets-of-the-counting-house-regal-riches/"}],"publishedNote":"Bloomberg calls this the oldest fortune on its index and says the prince is LGT's sole beneficiary. The figures rose with LGT's growth, not with any disclosure by the family.","grossAssets":{"text":"LGT Group publishes consolidated results: group profit CHF 445.6m and client AUM CHF 386.1bn for 2025. The Prince of Liechtenstein Foundation and the Liechtenstein Group publish no balance sheet; revenue and net income of the foundation are described as confidential.","source":{"label":"LGT — 2025 annual results","url":"https://www.lgt.com/ch-en/about-lgt/lgt-news/lgt-significantly-increases-profit-and-continues-growth-trajectory-336808"}},"controlled":{"text":"LGT managed CHF 386.1bn of client assets at end-2025. This is not family wealth, but it is the family's reach: the bank is wholly owned via the princely foundation and chaired by Prince Max. The foundation also governs the Liechtenstein Group's farms, forests and real estate in Austria, the US, Spain/Portugal and Uruguay, and the princely collections.","source":{"label":"LGT — Our owner: the Princely House of Liechtenstein","url":"https://www.lgt.com/hk-en/about-lgt/our-owner"}},"opaque":{"verdict":"documented","text":"The family's assets are held through the Prince of Liechtenstein Foundation, a Vaduz foundation whose statutes, beneficiaries and accounts are not public; Hans-Adam II chairs its board and is described as its main beneficiary. The value of the forestry, farming, real-estate and art holdings is not disclosed. Separately, LGT's own client business was exposed in 2008 when an ex-employee, Heinrich Kieber, sold data on c. 1,400 client relationships (c. 600 German) to German authorities, leading to tax probes of clients such as Klaus Zumwinkel. That concerned LGT's clients, not the family's own assets.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Hans-Adam II, Hereditary Prince Alois, LGT Group, Liechtenstein, Prince Max von und zu Liechtenstein, Prince of Liechtenstein Foundation …): name matches only, none shown to be this family or its vehicles; Wikipedia and press on the foundation; LGT annual reports; press on the 2008 LGT data affair (RTÉ, Irish Times).","source":{"label":"RTÉ — Liechtenstein tax probe (27 Feb 2008)","url":"https://www.rte.ie/news/2008/0227/100161-liechtenstein"}},"gapNote":"The Bloomberg figure is essentially a valuation of LGT plus estimated other assets; it may understate the family's economic reach, since the bank controls about CHF 386bn of other people's money and the foundation's land, art and agri-business are not separately valued. It may also overstate what any one person could liquidate, because the assets are held in a foundation, not personally."},"holdingsToday":[{"name":"LGT Group","kind":"Bank / wealth manager","sector":"Private banking and asset management","where":"Vaduz, Zurich, Asia","detail":"CHF 386.1bn client AUM, CHF 445.6m group profit (2025)","basis":"documented","source":{"label":"LGT — 2025 annual results","url":"https://www.lgt.com/ch-en/about-lgt/lgt-news/lgt-significantly-increases-profit-and-continues-growth-trajectory-336808"}},{"name":"Prince of Liechtenstein Foundation","kind":"Foundation","sector":"Holding vehicle","where":"Vaduz","detail":"Founded 1970; holds LGT and the Liechtenstein Group; chaired by Hans-Adam II","basis":"documented","source":{"label":"Wikipedia — Prince of Liechtenstein Foundation","url":"https://en.wikipedia.org/wiki/Prince_of_Liechtenstein_Foundation"}},{"name":"Forst Kalwang and Wilfersdorf Estate & Forestry","kind":"Agriculture & forestry","sector":"Softwood forestry; arable farming","where":"Styria and Lower Austria","detail":"Wilfersdorf described as Austria's largest owner-operated conventional arable farm","basis":"documented","source":{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"}},{"name":"RiceTec","kind":"Private company","sector":"Hybrid rice seed / agri-technology","where":"Alvin, Texas, USA","detail":"Listed as a Liechtenstein Group portfolio company","basis":"documented","source":{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"}},{"name":"Hofkellerei des Fürsten von Liechtenstein","kind":"Agriculture & forestry","sector":"Wine","where":"Vaduz and Wilfersdorf","detail":"Princely wineries in Liechtenstein and Austria","basis":"documented","source":{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"}},{"name":"Parelmo and Valle del Guadiana","kind":"Agriculture & forestry","sector":"Cattle, wool, grain; avocados","where":"Uruguay; Iberian peninsula","detail":"Pasture-fed cattle and merino wool (Uruguay); described as one of Europe's largest avocado producers","basis":"documented","source":{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"}},{"name":"Liechtenstein Group Real Estate and Palais Liechtenstein","kind":"Urban property","sector":"Real estate; events","where":"Vienna","detail":"City Palace and Garden Palace; leasing portfolio","basis":"documented","source":{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"}},{"name":"Princely Collections (LIECHTENSTEIN. The Princely Collections)","kind":"Art & collections","sector":"Old masters","where":"Vienna and Vaduz","detail":"Works by Rubens, Van Dyck and Murillo among others","basis":"documented","source":{"label":"InvestmentNews — Royal family you've never heard of builds $300B finance empire (2023)","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"}}],"slaveSiteId":"house-of-liechtenstein","lineage":[{"name":"Karl I of Liechtenstein","relation":"founder","years":"1569–1627","note":"First prince (1608); Habsburg governor of Bohemia who acquired confiscated estates after 1620.","basis":"documented"},{"name":"Anton Florian","relation":"descendant","years":"1656–1721","note":"Prince when Vaduz and Schellenberg were raised to the Principality of Liechtenstein (1719).","basis":"documented"},{"name":"Franz Joseph II","relation":"descendant","years":"1906–1989","note":"First prince to live in Vaduz; lost the Czech estates in 1945 and sold art to keep the house afloat.","basis":"documented"},{"name":"Hans-Adam II","relation":"son","years":"b. 1945","note":"Prince since 1989; rebuilt the bank into LGT and chairs the princely foundation.","basis":"documented"},{"name":"Hereditary Prince Alois","relation":"heir","years":"b. 1968","note":"Regent since 2004.","basis":"documented"},{"name":"LGT Group","relation":"successor firm","years":"1921–present","note":"Bought by the family c. 1930; held via the 1970 foundation.","id":"lgt-group","basis":"documented"}],"today":"Hans-Adam II is sovereign, Hereditary Prince Alois has been regent since 2004, and Prince Max von und zu Liechtenstein chairs LGT. The wealth sits in LGT and the Liechtenstein Group, both held via the Prince of Liechtenstein Foundation, plus the princely collections. The foundation is still contesting the 1945 Czech confiscations in court.","today_people":[{"name":"Hans-Adam II","relation":"head of the princely house","role":"Reigning Prince of Liechtenstein; chairs the foundation's board","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"finews.ch — Der reichste Royal Europas – dank einer Bank (2017)","url":"https://www.finews.ch/news/banken/29367-lgt-prinz-hans-adam-milliardaer-index"}},{"name":"Prince Max von und zu Liechtenstein","relation":"son of Hans-Adam II","role":"Chairman, LGT","sector":"Banking & finance","year":2025,"basis":"documented","source":{"label":"LGT — Financial results 2024 presentation","url":"https://lgtwm-us.com/resource/blob/256642/ece22ad9bd4afea0d60ac43f362e52f1/lgt-financial-results-2024-presentation-en-data.pdf"}},{"name":"Hereditary Prince Alois","relation":"heir","role":"Regent of Liechtenstein","sector":"Politics & government","year":2026,"basis":"documented","source":{"label":"Wikipedia — House of Liechtenstein","url":"https://en.wikipedia.org/wiki/House_of_Liechtenstein"}}],"sources":[{"label":"LGT — 2025 annual results","url":"https://www.lgt.com/ch-en/about-lgt/lgt-news/lgt-significantly-increases-profit-and-continues-growth-trajectory-336808"},{"label":"InvestmentNews (Bloomberg) — Royal family you've never heard of builds $300B finance empire (2023)","url":"https://www.investmentnews.com/royal-family-youve-never-heard-of-builds-300b-finance-empire-244023"},{"label":"Liechtenstein Group — Our companies","url":"https://lgroup.com/en/our-companies/"},{"label":"Masaryk University (Knoz) — Die Rolle Karls I. von Liechtenstein bei den Konfiskationen nach der Schlacht am Weißen Berg","url":"https://digilib.phil.muni.cz/en/node/5924"},{"label":"Radio Prague International — Prince of Liechtenstein Foundation's property claims rejected","url":"https://english.radio.cz/node/8797582"},{"label":"Wikipedia — Prince of Liechtenstein Foundation","url":"https://en.wikipedia.org/wiki/Prince_of_Liechtenstein_Foundation"}],"connections":[{"id":"lgt-group","type":"ownership","label":"owns LGT via the princely foundation"},{"id":"g2-prince-of-liechtenstein-foundation","type":"trust","label":"family assets held in the 1970 foundation"},{"id":"house-of-habsburg","type":"charter","label":"princely rank 1608 for Habsburg service"},{"id":"g2-battle-of-white-mountain","type":"enclosure-or-grant","label":"acquired confiscated Bohemian estates after 1620"},{"id":"holy-roman-empire","type":"charter","label":"principality created 1719 by Charles VI"},{"id":"communist-expropriations-1945","type":"political","label":"Czech estates confiscated 1945 (Beneš decrees)"},{"id":"liechtenstein-foundations","type":"offshore","label":"wealth structured through a Liechtenstein Stiftung"},{"id":"g2-ricetec","type":"ownership","label":"owns US hybrid-rice company"},{"id":"schwarzenberg-family","type":"family","label":"fellow Bohemian magnates; both lost Czech land 1945–48"}]},{"id":"thurn-und-taxis-family","name":"Thurn und Taxis family (Princes of Thurn and Taxis)","category":"Princely & Noble Houses","role":"Trade & Chartered Monopoly","moneySources":["Habsburg courier contracts (1490s)","Hereditary Imperial postal monopoly (1615)","Mediatisation compensation (1803)","Sale of postal rights to Prussia (1867)","Land, forestry, brewing and banking"],"nation":"Germany","scale":"Major","scaleBasis":"documented","scaleNote":"The family remains Germany's largest private forest owner with nearly 20,000 ha (Euronews, 2026); Forbes valued Albert at about US$1.6bn in 2014.","start":1490,"end":null,"lifespan":"c. 1490–present (Regensburg from 1748)","base":"St Emmeram Palace, Regensburg","geo":[49.016,12.094],"aliases":["Tasso","de Tassis","Fürst von Thurn und Taxis","Kaiserliche Reichspost"],"origins":"A courier family from Cornello near Bergamo. Franz von Taxis ran the Habsburg courier service between Innsbruck and Brussels from the 1490s, and the family opened the post to paying public customers in the early 1500s. In 1615 Emperor Matthias made the office of Imperial Postmaster General a hereditary fief.","role_summary":"The fortune was a licence: an imperial monopoly on letter and parcel post across the Holy Roman Empire, run as a family business from c. 1600 to 1806 and, as the Thurn-und-Taxis Post, until 1867. When Napoleon and the 1803 secularisations stripped the family of postal territories, it was compensated with former church lands, including the abbey of St Emmeram in Regensburg and the new Principality of Buchau. In 1867 it sold its postal rights and property to Prussia for three million thaler and recycled the money and rents into estates in Bavaria, Württemberg, Bohemia and Prussian Poland.","roleDetail":[{"t":"Habsburg couriers (1490s).","d":"Franz von Taxis organised the courier link from Innsbruck to the Burgundian Netherlands, and Charles V named Johann Baptista von Taxis Postmaster General in 1517.","basis":"documented"},{"t":"Hereditary monopoly (1615).","d":"The office of Imperial Postmaster General became a hereditary fief; the family became imperial princes in 1695 and moved to Regensburg in 1748 as the Emperor's principal commissioner at the Imperial Diet.","basis":"documented"},{"t":"Compensated with church land (1803).","d":"In the secularisations of 1803 the family received the abbey of St Emmeram (which became its residence) and lands forming the Principality of Buchau. It was mediatised in 1806 but kept its private estates.","basis":"documented"},{"t":"Cash-out to Prussia (1867).","d":"A treaty of 28 January 1867 transferred the postal rights and property to Prussia for three million thaler, effective 1 July 1867; the family's estates in Bavaria, Württemberg, Prussia and Austria were by area larger than several small German states.","basis":"documented"},{"t":"The 1990 crisis.","d":"Prince Johannes died in 1990 leaving debts and inheritance tax; TIME (1993) reported a US$40m tax bill. The family sold its bank (1992), held Sotheby's sales at Regensburg (1993), sold the brewery to Paulaner (1996) and sold forest.","basis":"documented"}],"legacy":"The fortune is now land and buildings: nearly 20,000 ha of forest, St Emmeram Palace and its collections, and real estate, run as the Fürst Thurn und Taxis group. The postal business, bank and brewery have all been sold; the brewery brand is licensed to Paulaner.","legacyDetail":[{"t":"Largest private forest owner in Germany.","d":"Euronews (2026) gives 'knapp 20,000 hectares'; taz (2007) reported about 30,000 ha before later sales.","basis":"documented"},{"t":"Assets sold to settle the 1990 estate.","d":"Bank sold to Schmidtbank in 1992; brewery sold to Paulaner in 1996; c. 4,000 lots auctioned by Sotheby's at Regensburg in October 1993.","basis":"documented"}],"wealth":{"published":[{"figure":"US$1.6bn","usd":"US$1.6bn","who":"Albert, 12th Prince of Thurn and Taxis","publisher":"Forbes (as reported by The Local)","year":2014,"rank":"","url":"https://www.thelocal.de/20140311/forbes-billionaire-list-reveals-germanys-richest-people"},{"figure":"US$2bn","usd":"US$2bn","who":"Albert von Thurn und Taxis","publisher":"Forbes (as reported by taz)","year":2007,"rank":"488th","url":"https://taz.de/Der-Benjamin-unter-den-Milliardaeren/!281169/"},{"figure":"up to US$3bn","usd":"US$3bn","who":"Thurn und Taxis family","publisher":"Tampa Bay Times (press estimates)","year":1991,"rank":"","url":"https://www.tampabay.com/archive/1991/09/16/he-s-7-and-he-s-already-a-billionaire/"}],"publishedNote":"No reliable published figure after 2014 was found. Online 'net worth' sites giving US$2.5–3.5bn cite no source and were not used.","grossAssets":{"text":"The family's operating companies are private; no consolidated accounts were found. Published facts are physical: nearly 20,000 ha of forest (Euronews 2026), St Emmeram Palace, real estate and collections.","source":{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},"controlled":{"text":"Beyond its own estates the family controls no third-party funds. The St Emmeram museum, library and archive are a cultural asset it governs; part of the treasury was transferred to the Bavarian state in the 1990s settlement (reported).","source":{"label":"Wikipedia — House of Thurn und Taxis","url":"https://en.wikipedia.org/wiki/House_of_Thurn_und_Taxis"}},"opaque":{"verdict":"none found","text":"The family's holdings are run through German private companies and the princely administration; their internal values are not published. No foundation or offshore structure was documented.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Albert, 12th Prince of Thurn and Taxis, Gloria, Princess of Thurn and Taxis, Thurn und Taxis): no matches; German press on the post-1990 restructuring; Forbes lists as reported.","source":{"label":"TIME — Debts and Von Taxis (18 Oct 1993)","url":"https://time.com/archive/6724033/debts-and-von-taxis/"}},"gapNote":"Published billion-dollar figures date from 1991–2014 and appear to value forest and property at market prices; since the 1990s the family has sold its bank, brewery, art and land, so older figures may overstate today's wealth. Forest and palace values are not disclosed."},"holdingsToday":[{"name":"Fürst Thurn und Taxis forestry","kind":"Agriculture & forestry","sector":"Forestry","where":"Bavaria and other German states","detail":"Nearly 20,000 ha, the largest private forest holding in Germany","basis":"documented","source":{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"}},{"name":"St Emmeram Palace","kind":"Urban property","sector":"Residence, museum, events","where":"Regensburg","detail":"Former Benedictine abbey received in 1803; family seat","basis":"documented","source":{"label":"Thurn und Taxis — History of the family","url":"https://www.thurnundtaxis.com/information/the-family/history-of-the-thurn-und-taxis-family"}},{"name":"Thurn und Taxis brand licence (beer)","kind":"Other","sector":"Brewing brand","where":"Bavaria","detail":"Brewery sold to Paulaner in 1996; beer still brewed under the name","basis":"documented","source":{"label":"Wikipedia — House of Thurn und Taxis","url":"https://en.wikipedia.org/wiki/House_of_Thurn_und_Taxis"}},{"name":"Princely collections and court library","kind":"Art & collections","sector":"Art, archives","where":"Regensburg","detail":"Remaining collections after the 1993 sales","basis":"interpretive","source":{"label":"Thurn und Taxis — History of the family","url":"https://www.thurnundtaxis.com/information/the-family/history-of-the-thurn-und-taxis-family"}}],"slaveSiteId":"thurn-und-taxis-family","lineage":[{"name":"Franz von Taxis","relation":"founder","years":"1459–1517","note":"Organised the Habsburg courier service from Innsbruck to Brussels.","basis":"documented"},{"name":"Lamoral von Taxis","relation":"descendant","years":"1557–1624","note":"Received the Imperial Postmaster Generalship as a hereditary fief in 1615.","basis":"documented"},{"name":"Alexander Ferdinand","relation":"descendant","years":"1704–1773","note":"Moved the family to Regensburg in 1748 as principal commissioner at the Imperial Diet.","basis":"documented"},{"name":"Maximilian Karl","relation":"descendant","years":"1802–1871","note":"Bought estates in Bavaria, Tyrol and Bohemia and sold the posts to Prussia in 1867.","basis":"documented"},{"name":"Johannes, 11th Prince","relation":"descendant","years":"1926–1990","note":"Left a fortune estimated at up to US$3bn with heavy debts and tax.","basis":"documented"},{"name":"Albert, 12th Prince","relation":"son","years":"b. 1983","note":"Head of the house since 1990.","basis":"documented"}],"today":"Albert, 12th Prince of Thurn and Taxis, has headed the house since 1990 and runs its forestry and property businesses. His mother, Princess Gloria, led the restructuring of the 1990s. The family's name lives on in the beer brand and the Regensburg palace.","today_people":[{"name":"Albert, 12th Prince of Thurn and Taxis","relation":"head of the house","role":"Owner of the family forestry and estates","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"Wikipedia — Albert, 12th Prince of Thurn and Taxis","url":"https://en.wikipedia.org/wiki/Albert,_12th_Prince_of_Thurn_and_Taxis"}},{"name":"Gloria, Princess of Thurn and Taxis","relation":"widow of Johannes; mother of Albert","role":"Led the 1990s restructuring and the 1993 Sotheby's sales","sector":"Land & estates","year":2026,"basis":"documented","source":{"label":"TIME — Debts and Von Taxis (1993)","url":"https://time.com/archive/6724033/debts-and-von-taxis/"}}],"sources":[{"label":"Thurn und Taxis — History of the Thurn und Taxis family","url":"https://www.thurnundtaxis.com/information/the-family/history-of-the-thurn-und-taxis-family"},{"label":"Deutsche Biographie — Taxis, Maximilian Karl Fürst von","url":"https://www.deutsche-biographie.de/sfz82246.html"},{"label":"Wikipedia — Thurn-und-Taxis Post","url":"https://en.wikipedia.org/wiki/Thurn-und-Taxis_Post"},{"label":"TIME — Debts and Von Taxis (1993)","url":"https://time.com/archive/6724033/debts-and-von-taxis/"},{"label":"Euronews (DE) — Kirche, Adel, Grundeigentümer in Deutschland (2026)","url":"https://de.euronews.com/2026/04/20/kirche-adel-grundeigentumer-in-deutschland"},{"label":"Britannica — Thurn and Taxis postal system","url":"https://britannica.com/topic/Thurn-and-Taxis-postal-system"}],"connections":[{"id":"g2-reichspost","type":"ownership","label":"ran the Imperial Post as a family business"},{"id":"house-of-habsburg","type":"charter","label":"postmasters to the Habsburgs from the 1490s"},{"id":"holy-roman-empire","type":"charter","label":"hereditary Imperial Postmaster General 1615"},{"id":"g2-reichsdeputationshauptschluss-1803","type":"dissolution-grant","label":"compensated with St Emmeram and Buchau 1803"},{"id":"house-of-hohenzollern","type":"trade","label":"sold postal rights to Prussia 1867 for 3m thaler"},{"id":"house-of-wittelsbach","type":"political","label":"Regensburg passed to Bavaria; Bavarian state took art in 1990s settlement"},{"id":"death-duties-inheritance-tax","type":"political","label":"1990 death duties forced asset sales (German tax, related concept)"}]},{"id":"house-of-wittelsbach","name":"House of Wittelsbach (Dukes, Electors and Kings of Bavaria)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Imperial grant of Bavaria (1180)","Electoral rule and Palatinate","Secularisation gains (1803)","Royal Civil List and crown estates","1923 settlement fund (WAF)"],"nation":"Germany","scale":"Significant","scaleBasis":"documented","scaleNote":"The Wittelsbacher Ausgleichsfonds was valued at €444m in 2018 by the Bavarian Finance Ministry, excluding art, and pays family line heads about €14m a year.","start":1180,"end":null,"lifespan":"1180–1918 rulers of Bavaria; present","base":"Nymphenburg Palace, Munich","geo":[48.158,11.503],"aliases":["Herzog von Bayern","Wittelsbacher Ausgleichsfonds (WAF)"],"origins":"Counts of Scheyern-Wittelsbach who were granted the duchy of Bavaria by Emperor Frederick Barbarossa in 1180 after Henry the Lion was deposed. They ruled Bavaria, and for long periods the Palatinate, until 1918, becoming Electors (1623) and Kings of Bavaria (1806).","role_summary":"The fortune was the property of a ruling dynasty: crown lands, palaces, forests and collections accumulated over seven centuries, enlarged when Bavaria absorbed secularised church lands and imperial cities in 1803 and became a kingdom under Napoleon in 1806. After the 1918 revolution the Free State and the family negotiated a settlement: in 1923 a public-law foundation, the Wittelsbacher Ausgleichsfonds (WAF), received forests, castles and Munich property, whose income goes to the family, while the state kept most palaces and the art.","roleDetail":[{"t":"Bavaria by imperial grant (1180).","d":"Otto of Wittelsbach received the duchy from Frederick Barbarossa; the dynasty ruled it for 738 years.","basis":"documented"},{"t":"Secularisation winner (1803–06).","d":"Bavaria absorbed bishoprics, abbeys and free cities, including Regensburg in 1810, and became a kingdom in 1806.","basis":"interpretive"},{"t":"Settlement, not expropriation (1923).","d":"After failed negotiations, the 1923 law created the WAF as an independent public-law foundation; if the entitled family lines die out its assets fall to the Bavarian state.","basis":"documented"},{"t":"Art stays in public museums.","d":"About 43,000 cultural objects owned by the WAF are on loan to Bavarian state museums.","basis":"documented"}],"legacy":"The family's main wealth vehicle is the WAF: about 12,000 ha of forest, Berg and Grünau castles, central Munich real estate and the Hirschgarten beer garden, plus art lent to state museums. Distributions of about €14m a year go to the heads of the family lines, and the family also holds private assets.","legacyDetail":[{"t":"A public-law fund for one family.","d":"The Bavarian Finance Ministry valued the WAF at €348m (2016) and €444m (2018), excluding art.","basis":"documented"},{"t":"Audit exemption criticised.","d":"Press reports note the fund is exempt from audit by the Bavarian Supreme Court of Audit; the state says distributions are not state payments.","basis":"documented"}],"wealth":{"published":[],"publishedNote":"No rich-list figure for the Wittelsbach family was found. The only official numbers are the WAF valuations given by the Bavarian Finance Ministry.","grossAssets":{"text":"WAF: €348m (2016) and €444m (2018) per the Bavarian Finance Ministry, excluding art (reported by dpa/Süddeutsche Zeitung research, 2023). No later published balance sheet was found.","source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds: Bayerns Monarchen alimentiert (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}},"controlled":{"text":"The WAF's c. 43,000 cultural objects are lent to Bavarian museums; their value is not included in the fund's valuation. The family's line heads sit on the fund's governance alongside state representatives.","source":{"label":"WAF — Rechtliche Grundlagen (2023)","url":"https://www.waf-bayern.de/wp-content/uploads/2025/02/2023_WAF-Rechtliche-Grundlagen.pdf"}},"opaque":{"verdict":"reported","text":"The WAF is a public-law foundation, not a private trust, but its accounts are not published in detail and it is exempt from the Bavarian Court of Audit. The family's own private assets outside the fund are not disclosed.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Franz, Duke of Bavaria, Wittelsbach, Wittelsbacher Ausgleichsfonds): no matches; Bavarian Landtag written questions on the WAF; WAF legal-basis document.","source":{"label":"Abendzeitung München — Bis in alle Ewigkeit? Millionenprivileg für die Wittelsbacher in der Kritik","url":"https://www.abendzeitung-muenchen.de/muenchen/bis-in-alle-ewigkeit-millionenprivileg-fuer-die-wittelsbacher-in-der-kritik-art-884095"}},"gapNote":"The €444m valuation excludes the c. 43,000 art objects, so the fund's real asset base is probably larger than published. But the family does not own the fund outright: it receives the income, and the capital would revert to Bavaria."},"holdingsToday":[{"name":"Wittelsbacher Ausgleichsfonds (WAF)","kind":"Foundation","sector":"Forestry, real estate, art","where":"Bavaria","detail":"€444m (2018, excluding art); c. €14m a year to family line heads","basis":"documented","source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}},{"name":"WAF forests","kind":"Agriculture & forestry","sector":"Forestry","where":"Bavaria","detail":"c. 12,000 ha","basis":"documented","source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}},{"name":"Munich real estate and Hirschgarten","kind":"Urban property","sector":"Real estate","where":"Munich","detail":"Central Munich property and the Hirschgarten beer garden","basis":"documented","source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}},{"name":"Berg and Grünau castles","kind":"Rural land","sector":"Residences","where":"Lake Starnberg; Neuburg an der Donau","detail":"Castles held by the WAF","basis":"documented","source":{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"}}],"slaveSiteId":"house-of-wittelsbach","lineage":[{"name":"Otto I of Bavaria","relation":"founder","years":"c. 1117–1183","note":"Granted the duchy of Bavaria in 1180.","basis":"documented"},{"name":"Maximilian I Joseph","relation":"descendant","years":"1756–1825","note":"First King of Bavaria (1806), gaining secularised lands.","basis":"documented"},{"name":"Ludwig III","relation":"last king","years":"1845–1921","note":"Monarchy ended in November 1918.","basis":"documented"},{"name":"Wittelsbacher Ausgleichsfonds","relation":"settlement","years":"1923–present","note":"Created to settle the family's property claims.","id":"g2-wittelsbacher-ausgleichsfonds","basis":"documented"},{"name":"Franz, Duke of Bavaria","relation":"head of house","years":"b. 1933","note":"Head since 1996 and the WAF's main beneficiary.","basis":"documented"}],"today":"Franz, Duke of Bavaria, heads the house and is the largest beneficiary of the WAF; he is known as an art patron. The family's money is mostly the fund's income plus undisclosed private assets.","today_people":[{"name":"Franz, Duke of Bavaria","relation":"head of the House of Wittelsbach","role":"Head of house; principal WAF beneficiary","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"Wikipedia — Franz, Duke of Bavaria","url":"https://en.wikipedia.org/wiki/Franz_von_Bayern"}}],"sources":[{"label":"WEB.DE (dpa) — 100 Jahre Ausgleichsfonds: Bayerns Monarchen alimentiert (2023)","url":"https://web.de/magazine/wirtschaft/100-jahre-ausgleichsfonds-bayerns-monarchen-alimentiert-37895666"},{"label":"WAF — Rechtliche Grundlagen (2023)","url":"https://www.waf-bayern.de/wp-content/uploads/2025/02/2023_WAF-Rechtliche-Grundlagen.pdf"},{"label":"Humboldt-Universität — Monarchical heritage in the Weimar Republic: the Wittelsbacher Ausgleichsfonds 1918–1933","url":"https://www.hu-berlin.de/en/forschungsinformationssystem/projekt-details/monarchisches-erbe-in-der-neuen-republik-der-wittelsbacher-ausgleichsfonds-1918-1933"},{"label":"Abendzeitung München — Millionenprivileg für die Wittelsbacher in der Kritik","url":"https://www.abendzeitung-muenchen.de/muenchen/bis-in-alle-ewigkeit-millionenprivileg-fuer-die-wittelsbacher-in-der-kritik-art-884095"},{"label":"Wikipedia — Franz, Duke of Bavaria","url":"https://en.wikipedia.org/wiki/Franz_von_Bayern"}],"connections":[{"id":"g2-wittelsbacher-ausgleichsfonds","type":"trust","label":"beneficiaries of the 1923 settlement fund"},{"id":"holy-roman-empire","type":"charter","label":"granted Bavaria by Barbarossa 1180; Electors from 1623"},{"id":"g2-reichsdeputationshauptschluss-1803","type":"dissolution-grant","label":"Bavaria absorbed secularised church lands 1803"},{"id":"weimar-1919-expropriations","type":"political","label":"1918 revolution; property settled by 1923 law"},{"id":"german-family-foundations","type":"legacy","label":"public-law fund comparable to family foundations"},{"id":"thurn-und-taxis-family","type":"political","label":"Regensburg's princely house passed under Bavarian rule"}]},{"id":"house-of-grimaldi-monaco","name":"House of Grimaldi (Princes of Monaco)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Genoese seizure of the Rock (1297)","Sovereign revenues","French indemnity for Menton and Roquebrune (1861)","Casino concession (SBM, 1863)","Property and investments"],"nation":"Monaco","scale":"Significant","scaleBasis":"estimated","scaleNote":"Forbes put Albert II at about US$1bn in 2011; no authoritative later estimate was found.","start":1297,"end":null,"lifespan":"1297–present (sovereign since 1612)","base":"Prince's Palace, Monaco","geo":[43.731,7.42],"aliases":["Goyon de Matignon-Grimaldi","Princes of Monaco"],"origins":"A Genoese patrician family; François Grimaldi seized the Rock of Monaco in 1297. The line continued through the female line in 1731 when Jacques Goyon de Matignon took the name and arms.","role_summary":"Monaco's rulers lived on the rents of a tiny state until 1861, when France paid four million francs for Menton and Roquebrune, about four-fifths of the territory. Charles III then licensed the gaming concession to François Blanc's Société des Bains de Mer (1863), whose casino revenues paid for the principality and let it abolish direct taxes. The prince's own fortune grew alongside a state funded by gaming, banking and property.","roleDetail":[{"t":"Seizure and sovereignty (1297–1612).","d":"François Grimaldi took the fortress in 1297; Honoré II was the first to use the title Prince (1612).","basis":"documented"},{"t":"Selling territory (1861).","d":"By the Franco-Monegasque treaty of 2 February 1861 the prince gave up claims to Menton and Roquebrune for an indemnity of four million francs.","basis":"documented"},{"t":"Casino concession (1863).","d":"Charles III approved François Blanc's Société des Bains de Mer et du Cercle des Étrangers in 1863; the concession made the casino the principality's main revenue source.","basis":"documented"},{"t":"Offshore companies (1984, 2002).","d":"Albert II's lawyer told AFP in 2024 that 'offshore companies were indeed created in Panama in 1984 in the time of Rainier III' and in the British Virgin Islands in 2002, and that 'all this is being liquidated'.","basis":"documented"}],"legacy":"The SBM, which runs the casinos and grand hotels, is majority-owned by the State of Monaco, not by the prince personally, with LVMH and Galaxy Entertainment each having taken 5% in 2015. The prince's private wealth sits in property in Monaco and France, art and investments managed by the Administrator of the Prince's Assets.","legacyDetail":[{"t":"State, not family, owns the casino.","d":"The Monegasque state held about 59.7% of SBM after the 2015 LVMH and Galaxy deals; SBM reported revenue of €768m for 2024/25.","basis":"documented"},{"t":"Private wealth office.","d":"Claude Palmero ran the prince's private finances from 2001 until his dismissal in 2023; Salim Zeghdar was named Administrator of the Prince's Assets by sovereign ordinance.","basis":"documented"}],"wealth":{"published":[{"figure":"c. US$1bn","usd":"US$1bn","who":"Albert II, Prince of Monaco","publisher":"Forbes (as reported by the Sunday Times, South Africa)","year":2011,"rank":"","url":"https://www.timeslive.co.za/amp/sunday-times/lifestyle/2011-06-26-all-that-lovely-lolly/"}],"publishedNote":"No authoritative estimate after 2011 was found. TIME (2002) wrote that the family owned about a quarter of Monaco's land and 69% of SBM; SBM's own disclosures attribute the majority stake to the State of Monaco, so that claim conflates state and family.","grossAssets":{"text":"SBM (listed, Paris): revenue €768m for the year to 31 March 2025. This is a state-controlled company, not the family's asset. No accounts for the prince's private holdings are public.","source":{"label":"Monte-Carlo SBM — Annual results 2024/25 press release","url":"https://www.montecarlosbm-corporate.com/wp-content/uploads/2025/05/20250528-communique-re-sultats-annuels_uk_v2.pdf"}},"controlled":{"text":"As sovereign, the prince heads a state that is SBM's majority shareholder and whose government he appoints; this is political control over state assets, not private ownership. The Prince Albert II Foundation (environment) is governed by him.","source":{"label":"Journal du Luxe — LVMH obtient 5% du capital de la Société des Bains de Mer","url":"https://www.journalduluxe.fr/fr/business/lvmh-obtient-5-du-capital-de-la-societe-des-bains-de-mer"}},"opaque":{"verdict":"reported","text":"Le Monde (January 2024), drawing on notebooks kept by former wealth manager Claude Palmero, reported offshore companies linked to the family; the prince's lawyer confirmed Panama companies created in 1984 and BVI companies set up in 2002, struck off after fees went unpaid, and said they were being liquidated. Their contents and values are not public. The palace accuses Palmero of breach of trust; Palmero's lawyer says he 'never did anything without the knowledge of those employing him'. Being listed in leaked or offshore data does not imply wrongdoing.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Albert II, Prince of Monaco, Grimaldi, Société des Bains de Mer): no matches; Le Monde reporting via AFP (Jan 2024); Monaco Life on the Palmero dismissal.","source":{"label":"AFP via Legit.ng — Monaco royals rocked by new claims over offshore assets (29 Jan 2024)","url":"https://www.legit.ng/business-economy/economy/1575901-monaco-royals-rocked-by-claims-offshore-assets/"}},"gapNote":"The c. US$1bn estimate is old and covers only the prince's private wealth; the family's economic reach is larger because it heads a state that controls SBM and much of Monaco's land, while the offshore structures reported in 2024 suggest parts of the private fortune have not been visible."},"holdingsToday":[{"name":"Société des Bains de Mer (state stake)","kind":"Listed stake","sector":"Casinos, hotels","where":"Monaco","detail":"State of Monaco c. 59.7%; revenue €768m (2024/25); not a family holding","basis":"documented","source":{"label":"Monte-Carlo SBM — Annual results 2024/25","url":"https://www.montecarlosbm-corporate.com/wp-content/uploads/2025/05/20250528-communique-re-sultats-annuels_uk_v2.pdf"}},{"name":"Private property in Monaco and France","kind":"Urban property","sector":"Real estate","where":"Monaco; Château de Marchais (France)","detail":"Values not disclosed","basis":"interpretive","source":{"label":"Gouvernement Princier — Matignon (lordship of)","url":"https://www.gouv.mc/en/government-institutions/history-and-heritage/places/matignon-lordship-of"}},{"name":"Panama and BVI companies (being liquidated)","kind":"Other","sector":"Holding companies","where":"Panama; British Virgin Islands","detail":"Created 1984 and 2002, per the prince's lawyer (AFP, 2024)","basis":"documented","source":{"label":"AFP via Legit.ng (2024)","url":"https://www.legit.ng/business-economy/economy/1575901-monaco-royals-rocked-by-claims-offshore-assets/"}}],"slaveSiteId":"house-of-grimaldi-monaco","lineage":[{"name":"François Grimaldi","relation":"founder","years":"d. 1309","note":"Seized the Rock of Monaco in 1297.","basis":"documented"},{"name":"Jacques I (Goyon de Matignon)","relation":"heir by marriage","years":"1689–1751","note":"Continued the house after the male line ended (1731).","basis":"documented"},{"name":"Charles III","relation":"descendant","years":"1818–1889","note":"Took the 1861 indemnity and licensed the casino (1863).","basis":"documented"},{"name":"Rainier III","relation":"descendant","years":"1923–2005","note":"Fought Onassis for SBM control; Panama companies created in 1984 in his time.","basis":"documented"},{"name":"Albert II","relation":"son","years":"b. 1958","note":"Sovereign Prince since 2005.","basis":"documented"}],"today":"Albert II has been Sovereign Prince since 2005. His private wealth is managed by an Administrator of the Prince's Assets appointed by ordinance; the casino group is majority state-owned. The family has been in a legal dispute with its former wealth manager since 2023.","today_people":[{"name":"Albert II, Prince of Monaco","relation":"head of the House of Grimaldi","role":"Sovereign Prince of Monaco","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"Monaco Life — Claude Palmero, in charge of Prince Albert's assets, steps down","url":"https://monacolife.net/claude-palmero-in-charge-of-prince-alberts-assets-steps-down/"}}],"sources":[{"label":"Wikipedia — Monte Carlo Casino","url":"https://en.wikipedia.org/wiki/Monte_Carlo_Casino"},{"label":"Wikipedia — Franco-Monégasque Treaties","url":"https://en.wikipedia.com/wiki/Franco-Monegasque_Treaty"},{"label":"Monte-Carlo SBM — Annual results 2024/25","url":"https://www.montecarlosbm-corporate.com/wp-content/uploads/2025/05/20250528-communique-re-sultats-annuels_uk_v2.pdf"},{"label":"AFP via Legit.ng — Monaco royals rocked by new claims over offshore assets (2024)","url":"https://www.legit.ng/business-economy/economy/1575901-monaco-royals-rocked-by-claims-offshore-assets/"},{"label":"TimesLIVE — All that lovely lolly (2011)","url":"https://www.timeslive.co.za/amp/sunday-times/lifestyle/2011-06-26-all-that-lovely-lolly/"}],"connections":[{"id":"g2-societe-des-bains-de-mer","type":"charter","label":"Charles III licensed the casino concession 1863"},{"id":"house-of-bourbon","type":"political","label":"French protectorate; 1861 treaty with Napoleon III's France"},{"id":"british-virgin-islands","type":"offshore","label":"BVI companies set up 2002, per the prince's lawyer"},{"id":"french-revolution-confiscations","type":"political","label":"Monaco annexed and princely property seized 1793"}]},{"id":"house-of-orange","name":"House of Orange-Nassau (Dutch royal family)","category":"Princely & Noble Houses","role":"Sovereign & Princely Rule","moneySources":["Nassau and Orange inheritances (1544)","Stadtholder office","Colonial trade era (NHM, 1824)","Royal Dutch Shell shares (reported)","Investments and state allowances"],"nation":"Netherlands","scale":"Significant","scaleBasis":"estimated","scaleNote":"Quote magazine estimated the family's fortune at about €950m in 2017; Forbes cut its estimate from US$2.5bn (2002) to US$250m (2003) after Prince Bernhard sent details of holdings.","start":1544,"end":null,"lifespan":"1544 (Orange inheritance)–present; kings since 1815","base":"The Hague","geo":[52.08,4.307],"aliases":["Oranje-Nassau","Dutch royal house"],"origins":"German counts of Nassau who inherited the Principality of Orange and large Netherlandish estates in 1544 (William the Silent). They led the Dutch Revolt and held the stadtholderate; William I became king in 1815.","role_summary":"After 1815 King William I was one of Europe's richest monarchs and steered colonial trade: he founded the Nederlandsche Handel-Maatschappij (1824) to run trade with the East Indies, the era of spice, coffee and tea trading that Newsweek identifies as the root of the modern fortune. In the 20th century the family's investments were long reported to include a large holding in Royal Dutch Shell; TIME wrote it was once thought to own as much as a quarter. Since 1972 the king, his predecessor and heir have been exempt from inheritance and gift tax.","roleDetail":[{"t":"Dynastic inheritance (1544).","d":"William of Nassau inherited Orange and the Breda and other estates; the family's power rested on these lands and the stadtholderate.","basis":"documented"},{"t":"Colonial-era trading society (1824).","d":"William I created the NHM by royal decree to revive East Indies trade; its successors merged into ABN (1964) and later ABN AMRO.","basis":"documented"},{"t":"Shell holding (reported).","d":"TIME (2002) said the family was 'once thought' to own up to a quarter of Royal Dutch/Shell; Newsweek reported Bernhard's 2003 letter to Forbes detailed holdings in Shell and ABN AMRO. The family never published the stake.","basis":"interpretive"},{"t":"Tax exemption.","d":"The king, his predecessor and his heir are exempt from gift and inheritance tax, so assets such as the De Horsten estate passed tax-free from Beatrix to Willem-Alexander.","basis":"documented"}],"legacy":"The private fortune is invested in an undisclosed portfolio, the De Horsten estate and other property, and family members' business interests. Functional royal assets (art, jewels, the Golden Coach) sit in seven foundations, mostly chaired by the king, and pass to the successor tax-free; the palaces are state property.","legacyDetail":[{"t":"Seven foundations.","d":"NOS reports the king's 'functional' assets are held in seven stichtingen, in most cases directed by the king.","basis":"documented"},{"t":"Fragmentation.","d":"Juliana's four children and their descendants share the private capital, which NOS says is increasingly fragmented.","basis":"documented"}],"wealth":{"published":[{"figure":"€950m","usd":"c. US$1.1bn","who":"Orange family","publisher":"Quote (as reported by NOS)","year":2017,"rank":"","url":"https://nos.nl/artikel/2205561-inkijkje-in-vermogen-oranjes-het-kapitaal-raakt-steeds-meer-versnipperd"},{"figure":"US$250m","usd":"US$250m","who":"Queen Beatrix and family","publisher":"Forbes (as reported by Newsweek)","year":2003,"rank":"","url":"https://www.newsweek.com/fall-royal-fortune-138375"},{"figure":"US$2.5bn","usd":"US$2.5bn","who":"Queen Beatrix and family","publisher":"Forbes (as reported by Newsweek)","year":2002,"rank":"","url":"https://www.newsweek.com/fall-royal-fortune-138375"}],"publishedNote":"Quote called estimating the Oranjes' wealth 'one of the hardest jobs'. A republican campaigner's US$17–23bn figure (including art) is not a published estimate and is not used.","grossAssets":{"text":"No accounts are filed for the family's private wealth. Royal allowances are published in the state budget, but they are not wealth.","source":{"label":"NOS — De koning en de Belastingdienst: hoe zit het?","url":"https://nos.nl/artikel/2042303-de-koning-en-de-belastingdienst-hoe-zit-het"}},"controlled":{"text":"The king directs most of the seven foundations holding royal art, jewels and regalia, which the government says are no longer owned by family members. The palaces are state property placed at the family's disposal.","source":{"label":"NOS — Inkijkje in vermogen Oranjes (2017)","url":"https://nos.nl/artikel/2205561-inkijkje-in-vermogen-oranjes-het-kapitaal-raakt-steeds-meer-versnipperd"}},"opaque":{"verdict":"none found","text":"The private portfolio's value and composition are not disclosed. The constitutional exemption means no inheritance-tax filing is made when the crown passes, so estate values are never revealed. Forbes's estimate swung tenfold on a single private letter.","searched":"ICIJ Offshore Leaks database (reconciliation API, Nov 2026; queries: Orange-Nassau, Private investment portfolio, Royal foundations, Willem-Alexander): name matches only, none shown to be this family or its vehicles; NOS, Parlement.com on royal tax exemptions; Forbes as reported.","source":{"label":"Parlement.com — Koninklijke belastingvrijdom","url":"https://www.parlement.com/id/vjyafpq4t3om/koninklijke_belastingvrijdom"}},"gapNote":"Because the crown passes free of inheritance tax and the family files nothing, every published figure rests on outsiders' guesses or the family's own selective disclosure (as in 2003); the true number could be well above or below the €950m estimate."},"holdingsToday":[{"name":"Private investment portfolio (incl. reported Shell shares)","kind":"Listed stake","sector":"Energy, banking and others","where":"Netherlands","detail":"Composition undisclosed; Shell and ABN AMRO named in 2003 letter (Newsweek)","basis":"interpretive","source":{"label":"Newsweek — The fall of a royal fortune","url":"https://www.newsweek.com/fall-royal-fortune-138375"}},{"name":"De Horsten estate","kind":"Rural land","sector":"Estate","where":"Wassenaar","detail":"Transferred by Beatrix to Willem-Alexander tax-free","basis":"documented","source":{"label":"NOS — Beatrix schenkt landgoed De Horsten aan Willem-Alexander","url":"https://nos.nl/artikel/2205018-beatrix-schenkt-landgoed-de-horsten-aan-willem-alexander"}},{"name":"Royal foundations (seven stichtingen)","kind":"Foundation","sector":"Art, jewels, regalia","where":"The Hague","detail":"Functional assets held in foundations mostly directed by the king","basis":"documented","source":{"label":"NOS — Inkijkje in vermogen Oranjes (2017)","url":"https://nos.nl/artikel/2205561-inkijkje-in-vermogen-oranjes-het-kapitaal-raakt-steeds-meer-versnipperd"}}],"slaveSiteId":"house-of-orange","lineage":[{"name":"William the Silent","relation":"founder","years":"1533–1584","note":"Inherited Orange in 1544 and led the Dutch Revolt.","basis":"documented"},{"name":"William I of the Netherlands","relation":"descendant","years":"1772–1843","note":"First king; founded the NHM in 1824.","basis":"documented"},{"name":"Wilhelmina","relation":"descendant","years":"1880–1962","note":"Queen 1890–1948; the family's investments, including Shell, were reported to grow in her reign.","basis":"interpretive"},{"name":"Beatrix","relation":"descendant","years":"b. 1938","note":"Queen 1980–2013; gave De Horsten to her son tax-free.","basis":"documented"},{"name":"Willem-Alexander","relation":"son","years":"b. 1967","note":"King since 2013.","basis":"documented"}],"today":"King Willem-Alexander reigns; he, Queen Máxima and Princess Amalia are exempt from gift and inheritance tax. Parliament has repeatedly debated ending the royal tax exemptions.","today_people":[{"name":"Willem-Alexander","relation":"head of the house","role":"King of the Netherlands","sector":"Royalty & titles","year":2026,"basis":"documented","source":{"label":"NOS — Inkijkje in vermogen Oranjes (2017)","url":"https://nos.nl/artikel/2205561-inkijkje-in-vermogen-oranjes-het-kapitaal-raakt-steeds-meer-versnipperd"}}],"sources":[{"label":"NOS — Inkijkje in vermogen Oranjes: het kapitaal raakt steeds meer versnipperd (2017)","url":"https://nos.nl/artikel/2205561-inkijkje-in-vermogen-oranjes-het-kapitaal-raakt-steeds-meer-versnipperd"},{"label":"Newsweek — The fall of a royal fortune","url":"https://www.newsweek.com/fall-royal-fortune-138375"},{"label":"TIME — Secrets of the counting house: regal riches (2002)","url":"https://time.com/archive/6953932/secrets-of-the-counting-house-regal-riches/"},{"label":"Parlement.com — Koninklijke belastingvrijdom","url":"https://www.parlement.com/id/vjyafpq4t3om/koninklijke_belastingvrijdom"},{"label":"Wikipedia — Netherlands Trading Society","url":"https://en.wikipedia.org/wiki/Netherlands_Trading_Society"}],"connections":[{"id":"dutch-east-india-company","type":"political","label":"stadtholders presided over the VOC era"},{"id":"dutch-west-india-company","type":"political","label":"stadtholders were WIC governors-general (honorary)"},{"id":"netherlands-stichting","type":"trust","label":"royal art and regalia held in seven stichtingen"},{"id":"house-of-hohenzollern","type":"family","label":"Wilhelm II's exile at Doorn after 1918"},{"id":"house-of-saxe-coburg-gotha","type":"political","label":"Belgian secession 1830 cost William I the south"},{"id":"g2-house-of-luxembourg","type":"family","label":"Nassau cousins; Luxembourg passed to the Weilburg line 1890"}]},{"id":"leopold-ii-belgium","name":"Leopold II, King of the Belgians","category":"Colonial Companies & Investors","role":"Colonial Extraction","moneySources":["Civil List and inheritance","Congo Free State, personal rule (1885–1908)","Rubber and ivory forced-labour regime","Domaine de la Couronne","Royal Trust endowment (1900)"],"nation":"Belgium","scale":"Major","scaleBasis":"documented","scaleNote":"Leopold's personal profit from Congo rubber in 1896–1905 has been estimated at about 70 million Belgian francs (
